<title>Kennisbank Huishouden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,800;1,400&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --papier:#f3f7f7;--vlak:#ffffff;--vlak2:#e8f0f0;--inkt:#0f2a30;--grijs:#4b6166;--lijn:#d2dfe0;
  --teal:#0e7490;--teal-zacht:#d6eef2;--goud:#a8670f;--goud-zacht:#f6ead4;
  --goed:#15803d;--matig:#a16207;--zwak:#b91c1c;
  --nacht:#050a0f;--nacht2:#0c1822;--draad:#f5f5f2;
  --display:"Unbounded","Atkinson Hyperlegible Next",system-ui,sans-serif;
  --tekst:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--papier:#081117;--vlak:#0f1c24;--vlak2:#15262f;--inkt:#e6f0f1;--grijs:#98adb2;--lijn:#233841;
  --teal:#5dd0e3;--teal-zacht:#123542;--goud:#f0c25a;--goud-zacht:#3a2d12;--goed:#4ade80;--matig:#fbbf24;--zwak:#f87171}}
:root[data-theme="dark"]{
  color-scheme:dark;--papier:#081117;--vlak:#0f1c24;--vlak2:#15262f;--inkt:#e6f0f1;--grijs:#98adb2;--lijn:#233841;
  --teal:#5dd0e3;--teal-zacht:#123542;--goud:#f0c25a;--goud-zacht:#3a2d12;--goed:#4ade80;--matig:#fbbf24;--zwak:#f87171}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--papier);color:var(--inkt);font:17px/1.6 var(--tekst);-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-underline-offset:3px}
a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0}
h2{font:700 clamp(22px,4vw,28px)/1.15 var(--display);letter-spacing:-.01em}
h3{font-size:18px;font-weight:800}
p{margin:0}
.klein{font-size:14px;color:var(--grijs)}
.mono{font-family:var(--mono);font-size:.9em}

/* Held: de sessiewereld uit de app */
.held{background:radial-gradient(90% 80% at 70% 30%,#0e2230 0%,var(--nacht) 70%);color:#eef6f7;padding-inline:16px}
.held-in{max-width:1120px;margin:0 auto;padding-block:40px 36px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center}
.held-oog{font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8fd8e6}
.held h1{font:700 clamp(34px,6.4vw,62px)/1.02 var(--display);letter-spacing:-.025em;margin:14px 0 14px}
.held h1 span{color:#f0c25a}
.held-zin{font-size:19px;max-width:34ch;color:#cfe3e6}
.held-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font:14px var(--mono);color:#9fb9bf}
.held-meta b{color:#eef6f7;font-weight:600}
.held-beeld{position:relative;display:flex;flex-direction:column;align-items:center;gap:0}
.tess{width:min(100%,300px);max-width:100%;aspect-ratio:1;display:block}
@media (max-width:900px){.tess{width:min(64vw,240px)}}
.borduur{position:relative;width:min(100%,340px);margin-top:-26px;background:#050505;color:#fff;border:4px solid var(--draad);border-radius:22px;padding:18px 20px 16px;
  outline:2.5px dashed rgba(245,245,242,.9);outline-offset:-12px;box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 36px rgba(93,208,227,.14)}
.borduur .kop{display:flex;justify-content:space-between;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.borduur .titel{font-size:24px;font-weight:800;margin:10px 0 2px;line-height:1.15}
.borduur .min{opacity:.85}
.borduur .min b{font-size:20px}
.borduur .tip{font-size:14px;color:rgba(255,255,255,.75);margin-top:8px}
.borduur .knop{margin-top:14px;display:grid;place-items:center;width:100%;min-height:48px;border-radius:14px;border:0;background:#fff;color:#050505;font:800 16px var(--tekst)}
.borduur .onder{margin-top:8px;font-size:12px;opacity:.5;text-align:center}

/* Opbouw */
.pagina{max-width:1120px;margin:0 auto;padding-inline:16px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:40px;padding-block:36px 64px}
.inhoud{min-width:0;display:flex;flex-direction:column;gap:56px}
nav.index{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:2px;font-size:14px}
nav.index span{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--grijs);margin-bottom:8px}
nav.index a{color:var(--grijs);text-decoration:none;padding:5px 10px;border-radius:8px;border-left:2px solid transparent}
nav.index a:hover{color:var(--inkt);background:var(--vlak2)}
nav.index a.aan{color:var(--inkt);border-left-color:var(--goud);background:var(--vlak)}
section{display:flex;flex-direction:column;gap:16px}
.sectiekop{display:flex;flex-direction:column;gap:6px}
.sectiekop .klein{max-width:62ch}
.lees{max-width:66ch}
.vlak{background:var(--vlak);border:1px solid var(--lijn);border-radius:var(--r);padding:18px}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:12px}
ul.strak,ol.strak{margin:0;padding-left:20px}
ul.strak li,ol.strak li{margin:4px 0}

/* Uitgangspunten */
.principes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--lijn);border:1px solid var(--lijn);border-radius:var(--r);overflow:hidden}
.principe{background:var(--vlak);padding:16px 18px}
.principe b{display:block;margin-bottom:2px}
.principe p{font-size:15px;color:var(--grijs)}

/* Planner */
.planner{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:16px;align-items:start}
.bediening{display:flex;flex-direction:column;gap:14px}
.veld{display:flex;flex-direction:column;gap:6px}
.veld>span,.veld>label{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--grijs)}
select{font:inherit;font-size:16px;color:var(--inkt);background:var(--vlak);border:1px solid var(--lijn);border-radius:10px;min-height:46px;padding:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:600 15px var(--tekst);min-height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--lijn);background:var(--vlak);color:var(--inkt);cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--inkt);color:var(--papier);border-color:var(--inkt)}
.params{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;padding:12px 14px;border-radius:12px;background:var(--vlak2)}
.params dt{color:var(--grijs)}
.params dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.plan{background:var(--nacht);color:#eef6f7;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.plan-kop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:14px var(--mono);color:#9fb9bf}
.plan-kop b{color:#fff}
.kaartjes{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.kaartje{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;background:#050505;border:2px solid var(--draad);border-radius:12px;padding:10px 14px;outline:1.5px dashed rgba(245,245,242,.55);outline-offset:-7px}
.kaartje .t{font-weight:700}
.kaartje .r{grid-column:1;font-size:13px;color:#9fb9bf}
.kaartje .m{grid-row:1 / span 2;grid-column:2;align-self:center;font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.kaartje.pauze{background:transparent;border-style:dashed;border-color:#5b7178;outline:0;color:#b9ccd1}
.noot{font-size:14px;color:#f0c25a}
.buiten{font-size:14px;color:#9fb9bf}

/* Tabel */
.tabelwrap{overflow-x:auto;border:1px solid var(--lijn);border-radius:var(--r);background:var(--vlak)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:15px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--lijn);vertical-align:top}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grijs);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.gekozen{background:var(--goud-zacht)}

/* Tabs voor tips */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:600 15px var(--tekst);min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--lijn);background:var(--vlak);color:var(--inkt);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:var(--papier)}
.tiplijst{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tiplijst div{background:var(--vlak);border:1px solid var(--lijn);border-radius:12px;padding:14px}
.tiplijst b{display:block;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grijs);margin-bottom:4px}

/* Stappen */
.stappen{list-style:none;margin:0;padding:0;counter-reset:stap;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stappen li{counter-increment:stap;background:var(--vlak);border:1px solid var(--lijn);border-radius:12px;padding:14px 16px 14px 52px;position:relative}
.stappen li::before{content:counter(stap);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--inkt);color:var(--papier)}
.stappen b{display:block}
.stappen p{font-size:15px;color:var(--grijs)}

/* Vragen */
.vragen{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:v}
.vraag{counter-increment:v;background:var(--vlak);border:1px solid var(--lijn);border-radius:12px;padding:14px 16px}
.vraag p::before{content:counter(v) ". ";font-family:var(--mono);color:var(--grijs)}
.schaal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}
.schaal button{min-height:42px;border-radius:9px;border:1px solid var(--lijn);background:var(--vlak2);color:var(--inkt);font:600 13px var(--tekst);cursor:pointer;padding:0 2px}
.schaal button[aria-checked="true"]{background:var(--teal);border-color:var(--teal);color:var(--papier)}
.uitkomst{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--inkt);color:var(--papier);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.uitkomst b{font-size:17px}
.uitkomst .klein{color:inherit;opacity:.75}
.letop{border-left:4px solid var(--goud);background:var(--goud-zacht);padding:12px 16px;border-radius:0 12px 12px 0;font-size:15px}

/* Onderbouwing */
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{font:600 14px var(--tekst);min-height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--lijn);background:var(--vlak);color:var(--inkt);cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--inkt);color:var(--papier);border-color:var(--inkt)}
.bewijs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bewijs article{background:var(--vlak);border:1px solid var(--lijn);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.bewijs .kop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bewijs .kop b{font-family:var(--mono)}
.sterkte{font:600 12px var(--mono);padding:3px 9px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.s-sterk{color:var(--goed)}.s-redelijk{color:var(--teal)}.s-matig{color:var(--matig)}.s-zwak{color:var(--zwak)}.s-praktijk,.s-principe{color:var(--grijs)}
.bewijs .keuze{font-size:15px;background:var(--vlak2);border-radius:9px;padding:9px 11px}
.bewijs .onder{font-size:13px;color:var(--grijs)}

/* Mechanieken, eisen */
.mech{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mech div{background:var(--vlak);border:1px solid var(--lijn);border-radius:12px;padding:16px}
.mech ol{margin:8px 0 0;padding-left:20px;font-size:15px}
.mech li{margin:5px 0}
details.eis{background:var(--vlak);border:1px solid var(--lijn);border-radius:12px}
details.eis+details.eis{margin-top:8px}
details.eis summary{cursor:pointer;padding:14px 16px;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.eis summary::-webkit-details-marker{display:none}
details.eis summary::after{content:"+";font-family:var(--mono);color:var(--grijs)}
details.eis[open] summary::after{content:"−"}
details.eis ul{margin:0;padding:0 18px 14px 36px;font-size:15px}
details.eis li{margin:5px 0}
.tests{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:15px}
.tests li::before{content:"✔ ";color:var(--goed);font-weight:800}
.tests.open li::before{content:"○ ";color:var(--grijs)}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.extras div{background:var(--vlak);border:1px solid var(--lijn);border-radius:12px;padding:14px}
.extras b{display:block}
.extras p{font-size:14px;color:var(--grijs)}

/* Voor de app */
.app{background:var(--vlak);border:1px solid var(--lijn);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.sleutels{display:flex;flex-wrap:wrap;gap:6px}
.sleutels code{font:14px var(--mono);background:var(--vlak2);padding:3px 8px;border-radius:6px}
pre{margin:0;max-height:320px;overflow:auto;background:var(--nacht);color:#cfe3e6;border-radius:12px;padding:14px;font:13px/1.5 var(--mono)}
.actie{align-self:flex-start;font:700 15px var(--tekst);min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--teal);color:var(--papier);cursor:pointer}
.begrippen{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
.begrippen dt{font-weight:800}
.begrippen dd{margin:0;color:var(--grijs)}
.bronnen{margin:0;padding-left:26px;font-size:15px}
.bronnen li{margin:6px 0}
.fout{padding:40px 16px;max-width:640px;margin:0 auto}
footer{max-width:1120px;margin:0 auto;padding:0 16px 40px;font-size:14px;color:var(--grijs)}

@media (max-width:900px){
  .pagina{grid-template-columns:1fr;gap:0}
  nav.index{display:none}
  .held-in{grid-template-columns:1fr;padding-block:28px}
  .planner,.bewijs,.mech,.stappen,.tests,.twee{grid-template-columns:1fr}
}
@media (max-width:560px){.principes{grid-template-columns:1fr}body{font-size:16px}}
</style>

<header class="held">
  <div class="held-in">
    <div>
      <div class="held-oog">FutureMe · functioneel ontwerp</div>
      <h1>Kennisbank <span>Huishouden</span></h1>
      <p class="held-zin" id="held-zin">Eén klus tegelijk, in de tijd die je hebt.</p>
      <div class="held-meta" id="held-meta"></div>
    </div>
    <div class="held-beeld" aria-hidden="true">
      <canvas class="tess" id="tess"></canvas>
      <div class="borduur" id="borduur">
        <div class="kop"><span>Klus 1 van 3</span><span>Keuken</span></div>
        <div class="titel">Vuilnis wegbrengen</div>
        <div class="min"><b>3</b> min</div>
        <div class="tip">Alleen deze. Niet aan het geheel denken.</div>
        <div class="knop">Start</div>
        <div class="onder">Klaar? Veeg naar rechts →</div>
      </div>
    </div>
  </div>
</header>

<div class="pagina">
  <nav class="index" aria-label="Inhoud" id="index"><span>Inhoud</span></nav>
  <main class="inhoud" id="inhoud"><p class="klein">De kennisbank wordt geladen…</p></main>
</div>
<footer id="voet"></footer>

<script>
"use strict";
/* Alles op deze pagina komt uit huishouden.json: dezelfde kennisbank die de
   FutureMe-app bij het bouwen inleest (als FM_KENNIS). */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { richting: "adhd", lijst: "week", min: 30, energie: null, antwoorden: [], filter: "alle", tipRichting: "adhd" };
let K = null;

fetch("huishouden.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(k => { K = k; bouw(); })
  .catch(() => { $("#inhoud").innerHTML = `<div class="fout vlak"><h3>De kennisbank kon niet laden</h3><p class="klein">Deze pagina leest huishouden.json uit dezelfde map. Open de pagina via een webserver (niet als los bestand), of controleer of het bestand ernaast staat.</p></div>`; });

const SECTIES = [["wat", "Wat het is"], ["principes", "Uitgangspunten"], ["planner", "Probeer de planner"], ["sessie", "Zo verloopt een sessie"], ["aanpak", "Aanpak per richting"], ["vragen", "De tien vragen"], ["onderbouwing", "Onderbouwing"], ["mechanieken", "Mechanieken"], ["eisen", "Functionele eisen"], ["data", "Datamodel"], ["tests", "Getest"], ["extras", "Extra's"], ["app", "Voor de app"], ["begrippen", "Begrippen"], ["bronnen", "Bronnen"]];

function bouw() {
  const m = K.meta;
  $("#held-zin").textContent = m.ondertitel + ".";
  $("#held-meta").innerHTML = `<span>versie <b>${esc(m.versie)}</b></span><span>${esc(datum(m.datum))}</span><span>status <b>${esc(m.status.toLowerCase())}</b></span>`;
  $("#index").innerHTML = `<span>Inhoud</span>` + SECTIES.map(([id, n]) => `<a href="#${id}">${esc(n)}</a>`).join("");
  $("#inhoud").innerHTML = [wat(), principes(), planner(), sessie(), aanpak(), vragen(), onderbouwing(), mechanieken(), eisen(), datamodel(), tests(), extras(), app(), begrippen(), bronnen()].join("");
  $("#voet").innerHTML = `${esc(m.product)}. ${esc(m.uitleg)}`;
  tekenPlan(); tekenTips(); tekenUitkomst(); tekenBewijs();
  volgIndex();
  startTesseract();
}
const datum = iso => { const [y, mm, d] = iso.split("-").map(Number); return `${d} ${["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"][mm - 1]} ${y}`; };
const kop = (id, titel, sub) => `<div class="sectiekop"><h2>${esc(titel)}</h2>${sub ? `<p class="klein">${sub}</p>` : ""}</div>`;

function wat() {
  const d = K.doel;
  return `<section id="wat">${kop("wat", "Wat het is")}
    <div class="lees"><p><b>Probleem.</b> ${esc(d.probleem)}</p><p style="margin-top:10px"><b>Oplossing.</b> ${esc(d.oplossing)}</p></div>
    <div class="twee"><div class="vlak"><h3>Wel</h3><ul class="strak">${d.binnen.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="vlak"><h3>Niet</h3><ul class="strak">${d.buiten.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div></section>`;
}
function principes() {
  return `<section id="principes">${kop("principes", "Uitgangspunten")}<div class="principes">${K.principes.map(([t, u]) => `<div class="principe"><b>${esc(t)}</b><p>${esc(u)}</p></div>`).join("")}</div></section>`;
}

/* ---------- Planner: dezelfde regels als de app (zonder persoonlijke kalibratie) ---------- */
function planner() {
  const lijsten = K.huishouden.startlijsten;
  return `<section id="planner">${kop("planner", "Probeer de planner", "Kies een richting, een startlijst en je tijd. Dit zijn dezelfde regels als in de app, alleen zonder jouw persoonlijke tijdkalibratie.")}
    <div class="planner">
      <div class="bediening">
        <div class="veld"><label for="p-richting">Richting</label><select id="p-richting">${Object.entries(K.richtingen).map(([k, r]) => `<option value="${k}"${k === S.richting ? " selected" : ""}>${r.ico} ${esc(r.naam)}</option>`).join("")}</select></div>
