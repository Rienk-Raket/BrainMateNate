/* ---------- Subtaken: een platte lijst waarin elk item een niveau heeft (0 = subtaak, 1 = sub-subtaak, …) ---------- */
const subNiveau = s => Math.max(0, parseInt((s && s.niveau) || 0, 10) || 0);
function subNaam(nv) { const t = "sub-".repeat(nv) + "subtaak"; return t[0].toUpperCase() + t.slice(1); }
/** Elk item hoogstens één niveau dieper dan het item erboven. */
function normaliseerSubtaken(lijst) {
  let vorig = -1;
  (lijst || []).forEach(x => { const nv = Math.min(subNiveau(x), vorig + 1); if (nv) x.niveau = nv; else delete x.niveau; vorig = nv; });
  return lijst;
}
/** Een item plus alles wat eronder hangt (de volgende items met een hoger niveau). */
function subBlok(lijst, i) {
  const nv = subNiveau(lijst[i]); let j = i + 1;
  while (j < lijst.length && subNiveau(lijst[j]) > nv) j++;
  return [i, j];
}
/** Afvinken geldt ook voor alles wat eronder hangt. */
function subVink(lijst, i) {
  const af = !lijst[i].af, [a, z] = subBlok(lijst, i);
  for (let k = a; k < z; k++) lijst[k].af = af;
  return af;
}
function subVerschuif(lijst, i, delta) {
  const nv = subNiveau(lijst[i]) + delta, max = i ? subNiveau(lijst[i - 1]) + 1 : 0;
  if (nv < 0 || nv > max) return false;
  const [a, z] = subBlok(lijst, i);

    if (a.tijd && !a.datum) a.datum = vandaagISO();
    a.deadline = $("#a-deadline").value || "";
    a.plek = $("#a-plek").value.trim();
    a.personen = $("#a-personen").value.split(",").map(x => x.trim()).filter(Boolean);
    a.voorbereiding = $("#a-voor").value.trim();
    const aw2 = $$("[data-awerk]").find(x => x.getAttribute("aria-pressed") === "true");
    a.werk = aw2 ? aw2.dataset.awerk === "1" : !!a.werk;
    a.herhaal = herhaal;
    if (a.herhaal && !a.datum) a.datum = eersteHerhaalDatum(a.herhaal);
    await bewaar("afspraken", a);
    if (!bestaat) await logGebeurtenis("afspraak",
      (a.soort === "toezegging" ? "Afspraak gemaakt" : "Gesprek gepland") + ": " + a.titel +
      (a.personen.length ? " (met " + a.personen.join(", ") + ")" : ""), a.id);
    bladSluit(); ga("afspraak", a.id); toast("Opgeslagen");
    await reeksNaOpslaan("afspraken", a, oud);
  };
  if (!bestaat) setTimeout(() => { const f = $("#a-titel"); f && f.focus(); }, 260);
}

/* ---------- Overige bladen ---------- */
function openGewoonteBlad(id) {
  const bestaat = id ? vind("gewoontes", id) : null;
  const g = bestaat || { id: uid(), naam: "", dagen: [], kleur: "#12875a", gemaakt: new Date().toISOString(), archief: false };
  bladOpen(bestaat ? "Gewoonte bewerken" : "Nieuwe gewoonte", `
    <div class="veld"><label for="g-naam">Gewoonte</label>
      <input class="invoer" id="g-naam" type="text" value="${esc(g.naam)}" placeholder="Bv. 10 minuten lezen"></div>
    <div class="veld"><span class="labeltekst">Hoe wil je het bijhouden?</span>
      <div class="keuzerij">
        <button class="keuze" data-gmodus="dagen" aria-pressed="${!g.perWeek}">Vaste dagen</button>
        <button class="keuze" data-gmodus="week" aria-pressed="${!!g.perWeek}">Aantal keer per week</button>
      </div></div>
    <div class="veld" id="g-dagenveld" style="${g.perWeek ? "display:none" : ""}">
      <span class="labeltekst">Op welke dagen? (niets = elke dag)</span>
      <div class="keuzerij">${[1, 2, 3, 4, 5, 6, 0].map(d =>
        `<button class="keuze dag" data-gdag="${d}" aria-pressed="${(g.dagen || []).includes(d)}">${DAGKORT[d]}</button>`).join("")}</div></div>
    <div class="veld" id="g-weekveld" style="${g.perWeek ? "" : "display:none"}">
      <label for="g-perweek">Aantal keer per week</label>
      <input class="invoer" id="g-perweek" type="number" min="1" max="21" inputmode="numeric" value="${g.perWeek || 3}">
      <div class="klein" style="margin-top:6px">Je kiest zelf wanneer. De app telt hoe vaak je het deze week deed.</div></div>
    ${bestaat ? `<div class="hr"></div><button class="knop breed gevaar" id="g-weg">${ico("prullenbak")} Verwijderen</button>` : ""}
  `, `<button class="knop breed primair" id="g-opslaan">Opslaan</button>`);
  $("#bladinhoud").onclick = e => {
    const d = e.target.closest("[data-gdag]");
    if (d) { d.setAttribute("aria-pressed", d.getAttribute("aria-pressed") !== "true"); return; }
    const m = e.target.closest("[data-gmodus]");
    if (m) {
      $$("[data-gmodus]").forEach(x => x.setAttribute("aria-pressed", x === m));
      const week = m.dataset.gmodus === "week";
      $("#g-dagenveld").style.display = week ? "none" : "";
      $("#g-weekveld").style.display = week ? "" : "none";
    }
  };
  if (bestaat) $("#g-weg").onclick = () => bevestigVerwijderen(
    async () => { await verwijder("gewoontes", g.id); teken(); toast("Verwijderd"); });
  $("#g-opslaan").onclick = async () => {
    const naam = $("#g-naam").value.trim();
    if (!naam) { toast("Geef de gewoonte een naam"); return; }
    g.naam = naam;
    const weekModus = ($$("[data-gmodus]").find(x => x.getAttribute("aria-pressed") === "true") || {}).dataset;
    if (weekModus && weekModus.gmodus === "week") {
      g.perWeek = clamp(+$("#g-perweek").value || 3, 1, 21);
      g.dagen = [];
    } else {
      g.perWeek = null;
      g.dagen = $$("[data-gdag]").filter(x => x.getAttribute("aria-pressed") === "true").map(x => +x.dataset.gdag).sort();
    }
    await bewaar("gewoontes", g); bladSluit(); teken(); toast("Opgeslagen");
  };
  if (!bestaat) setTimeout(() => $("#g-naam").focus(), 260);
}

function openDagboekBlad(datum) {
  datum = datum || vandaagISO();
  const bestaat = S.dagboek.find(d => d.datum === datum);
  const d = bestaat || { id: uid(), datum, stemming: null, energie: null, tekst: "", dankbaar: "", gemaakt: new Date().toISOString() };
  bladOpen(datumLabel(datum, true), `
    <div class="veld"><span class="labeltekst">Stemming</span>
      <div class="keuzerij" style="justify-content:space-between">${STEMMINGEN.map((e, i) =>
        `<button class="keuze" data-stem="${i + 1}" aria-pressed="${d.stemming === i + 1}" style="font-size:23px;min-width:52px;justify-content:center">${e}</button>`).join("")}</div></div>
    <div class="veld"><span class="labeltekst">Energie</span>
      <div class="keuzerij">${["laag", "midden", "hoog"].map(e =>
        `<button class="keuze" data-den="${e}" aria-pressed="${d.energie === e}">${ico("bliksem")} ${e}</button>`).join("")}</div></div>
    <div class="veld"><label for="d-tekst">Hoe ging het?</label>
      <textarea class="invoer" id="d-tekst" style="min-height:150px" placeholder="Wat gebeurde er? Wat viel op?">${esc(d.tekst || "")}</textarea></div>
    <div class="veld"><label for="d-dank">Waar ben je blij mee?</label>
      <input class="invoer" id="d-dank" type="text" value="${esc(d.dankbaar || "")}" placeholder="Eén ding is genoeg"></div>
    ${bestaat ? `<button class="knop breed gevaar" id="d-weg" style="margin-top:8px">${ico("prullenbak")} Notitie verwijderen</button>` : ""}
  `, `<button class="knop breed primair" id="d-opslaan">Opslaan</button>`);
  $("#bladinhoud").onclick = e => {
    const s = e.target.closest("[data-stem]");
    if (s) { $$("[data-stem]").forEach(x => x.setAttribute("aria-pressed", x === s)); return; }
    const en = e.target.closest("[data-den]");
    if (en) { $$("[data-den]").forEach(x => x.setAttribute("aria-pressed", x === en)); }
  };
  if (bestaat) $("#d-weg").onclick = () => bevestigVerwijderen(
    async () => { await verwijder("dagboek", d.id); teken(); toast("Verwijderd"); });
  $("#d-opslaan").onclick = async () => {
    const s = $$("[data-stem]").find(x => x.getAttribute("aria-pressed") === "true");
    const en = $$("[data-den]").find(x => x.getAttribute("aria-pressed") === "true");
    d.stemming = s ? +s.dataset.stem : null;
    d.energie = en ? en.dataset.den : null;
    d.tekst = $("#d-tekst").value.trim();
    d.dankbaar = $("#d-dank").value.trim();
    if (!d.tekst && !d.stemming && !d.dankbaar) { bladSluit(); return; }
    await bewaar("dagboek", d);
    if (!bestaat) await logGebeurtenis("dagboek", "Dagboek: " + (d.tekst.slice(0, 70) || "stemming genoteerd"), d.id);
    bladSluit(); teken(); toast("Opgeslagen");
  };
}

const PROJECTKLEUREN = ["#2f6fed", "#12875a", "#d63c42", "#b7791f", "#7a4fd6", "#0f8b8d", "#c2410c", "#be185d"];
async function maakProject(naam, kleur) {
  const bestaat = S.projecten.find(p => p.naam.toLowerCase() === naam.toLowerCase());
  if (bestaat) return bestaat;
  const p = { id: uid(), naam, kleur: kleur || PROJECTKLEUREN[S.projecten.length % PROJECTKLEUREN.length], volgorde: S.projecten.length, gemaakt: new Date().toISOString() };
  await bewaar("projecten", p);
  return p;
}
function openProjectBlad(id) {
  const bestaat = id ? vind("projecten", id) : null;
  const p = bestaat || { id: uid(), naam: "", kleur: PROJECTKLEUREN[S.projecten.length % PROJECTKLEUREN.length], volgorde: S.projecten.length };
  bladOpen(bestaat ? "Project bewerken" : "Nieuw project", `
    <div class="veld"><label for="p-naam">Naam</label>
      <input class="invoer" id="p-naam" type="text" value="${esc(p.naam)}" placeholder="Bv. Verbouwing"></div>
    <div class="veld"><span class="labeltekst">Kleur</span>
      <div class="keuzerij">${PROJECTKLEUREN.map(k =>
        `<button class="keuze" data-kleur="${k}" aria-pressed="${p.kleur === k}" style="min-width:44px;justify-content:center">
          <span class="kleurbol" style="background:${k};width:17px;height:17px"></span></button>`).join("")}</div></div>
    ${bestaat ? `<div class="hr"></div><button class="knop breed gevaar" id="p-weg">${ico("prullenbak")} Project verwijderen</button>
      <div class="klein" style="margin-top:7px">Taken in dit project blijven bestaan en gaan terug naar de inbox.</div>` : ""}
  `, `<button class="knop breed primair" id="p-opslaan">Opslaan</button>`);
  $("#bladinhoud").onclick = e => {
    const k = e.target.closest("[data-kleur]");
    if (k) $$("[data-kleur]").forEach(x => x.setAttribute("aria-pressed", x === k));
  };
  if (bestaat) $("#p-weg").onclick = () => bevestigVerwijderen(async () => {
    for (const t of takenVanProject(p.id)) { t.projectId = null; await bewaar("taken", t); }
    await verwijder("projecten", p.id); ga("projecten"); toast("Project verwijderd");
  });
  $("#p-opslaan").onclick = async () => {
    const naam = $("#p-naam").value.trim();
    if (!naam) { toast("Geef het project een naam"); return; }
    p.naam = naam;
    const k = $$("[data-kleur]").find(x => x.getAttribute("aria-pressed") === "true");
    p.kleur = k ? k.dataset.kleur : p.kleur;
    await bewaar("projecten", p); bladSluit(); teken(); toast("Opgeslagen");
  };
  if (!bestaat) setTimeout(() => $("#p-naam").focus(), 260);
}

function openPersoonBlad(naam) {
  const taken = reeksDedup(S.taken.filter(t => (t.personen || []).includes(naam)));
  const afspr = reeksDedup(S.afspraken.filter(a => (a.personen || []).includes(naam)));
  const p = S.personen.find(x => x.naam === naam);
  bladOpen(naam, `
    <div class="veld"><label for="pp-notitie">Notitie</label>
      <textarea class="invoer" id="pp-notitie" placeholder="Rol, context, wat je moet onthouden">${esc(p ? p.notitie || "" : "")}</textarea></div>
    ${afspr.length ? `<div class="sectie"><h2>Afspraken</h2></div><div class="card">${afspr.slice(0, 10).map(afspraakRij).join("")}</div>` : ""}
    ${taken.length ? `<div class="sectie"><h2>Taken</h2></div>${takenLijst(taken.slice(0, 15))}` : ""}
  `, `<button class="knop breed primair" id="pp-opslaan">Opslaan</button>`);
  $("#pp-opslaan").onclick = async () => {
    const obj = p || { id: uid(), naam };
    obj.notitie = $("#pp-notitie").value.trim();
    await bewaar("personen", obj); bladSluit(); teken(); toast("Opgeslagen");

}

<script>
"use strict";
/* ==========================================================================
   22. Instellingen toepassen
   ========================================================================== */
function pasInstellingenToe() {
  const h = document.documentElement;
  h.dataset.tekst = inst("tekst", "normaal");
  h.dataset.dicht = inst("dicht", "normaal");
  h.dataset.thema = inst("thema", "systeem");
  h.dataset.contrast = inst("contrast", false) ? "1" : "0";
  h.dataset.rust = inst("rust", false) ? "1" : "0";
  const thema = inst("thema", "systeem");
  h.style.colorScheme = thema === "licht" ? "light" : thema === "donker" ? "dark" : "light dark";
}

/* ==========================================================================
   23. Startscherm — vastleggen via 3D-knoppen
   ========================================================================== */
function groet() {
  const u = new Date().getHours();
  if (u < 6) return "Goedenacht";
  if (u < 12) return "Goedemorgen";
  if (u < 18) return "Goedemiddag";
  return "Goedenavond";
}
function knop3d(opt) {
  return `<button class="knop3d${opt.breed ? " breed" : ""}" style="--k:${opt.kleur}"
      data-act="start-knop" data-soort="${opt.soort}" aria-label="${esc(opt.naam)}">
    <svg class="ill3d" viewBox="0 0 100 80" aria-hidden="true" focusable="false"><use href="#ill-${opt.soort}"/></svg>
    ${opt.telling ? `<span class="bal3d">${opt.telling}</span>` : ""}
    <span class="tekst3d">
      <span class="nm3d" style="display:block">${esc(opt.naam)}</span>
      ${opt.uitleg ? `<span class="ds3d" style="display:block">${esc(opt.uitleg)}</span>` : ""}
    </span>
  </button>`;
}
/** De 3 categorieknoppen — elk brengt je naar een eigen "vandaag" voor dat onderwerp. */
function catKnop(opt) {
  return `<button class="knop3d breed" style="--k:${opt.kleur}" data-act="ga" data-view="${opt.view}" aria-label="${esc(opt.naam)}">
    <svg class="ill3d" viewBox="0 0 100 80" aria-hidden="true" focusable="false"><use href="#ill-${opt.ill}"/></svg>
    ${opt.telling ? `<span class="bal3d">${opt.telling}</span>` : ""}
    <span class="tekst3d">
      <span class="nm3d" style="display:block">${esc(opt.naam)}</span>
      <span class="ds3d" style="display:block">${esc(opt.uitleg)}</span>
    </span>
  </button>`;
}
function vwStart() {
  // Nieuw is puur voor vastleggen: geen weekoverzicht (dat staat op Vandaag) en geen uitgaven-widget (die staat op het dagoverzicht).
  let h = "";

  h += `<div class="startgrid">
    ${knop3d({ soort: "snel", naam: "Snel typen", uitleg: "“morgen 15:00 tandarts #zorg”", kleur: "#ea580c", breed: true })}
    ${catKnop({ view: "persoonlijk", ill: "persoonlijk", naam: "Persoonlijk", uitleg: "Taken, afspraken en alles er tussenin", kleur: "#2f6fed" })}
    ${catKnop({ view: "werk", ill: "werk", naam: "Werk", uitleg: "Meetings, plannen, strategie en reflectie", kleur: "#c0202f", telling: (typeof werkTelling === "function" ? werkTelling() : "") })}
    ${catKnop({ view: "gezondheid", ill: "gezondheid", naam: "Gezondheid", uitleg: "Eten, sport, water en gewicht", kleur: "#16a34a", telling: (typeof vsTelling === "function" ? vsTelling() : "") })}
    ${catKnop({ view: "financieel", ill: "financieel", naam: "Financieel", uitleg: "Dagbudget, uitgaven en incasso's", kleur: "#0f766e", telling: (typeof geldTelling === "function" ? geldTelling() : "") })}
    ${catKnop({ view: "sidehustles", ill: "sidehustle", naam: "Side Hustle", uitleg: "Ideeën omzetten in een eigen bedrijf", kleur: "#d97706", telling: (typeof shTelling === "function" ? shTelling() : "") })}
    ${catKnop({ view: "mindmap", ill: "mindmap", naam: "Mindmap", uitleg: "Ideeën, doelen en plannen uittekenen", kleur: "#7a4fd6" })}
  </div>`;

  const vast = S.filters.filter(f => f.vast);
  if (vast.length) {
    h += sectie("Vastgezette lijsten", vast.length);
    h += `<div class="card">${vast.map(f => `<button class="rijknop" data-act="filter-open" data-id="${f.id}">
      ${ico("bliksem", "width:18px;height:18px;color:var(--accent)")}
      <span class="nm">${esc(f.naam)}</span>
      <span class="rechts">${filterTaken(f.query).length}${ico("pijlr", "width:16px;height:16px;color:var(--line2)")}</span></button>`).join("")}</div>`;
  }
  h += `<button class="startstrip" data-act="ga" data-view="logboek">
    ${ico("logboek", "width:20px;height:20px;color:var(--muted)")}
    <span class="nm">Laatst gelogd: ${esc(S.gebeurtenissen.length ? S.gebeurtenissen.slice().sort((a, b) => a.ts < b.ts ? 1 : -1)[0].tekst.slice(0, 44) : "nog niets")}</span>
    ${ico("pijlr", "width:16px;height:16px;color:var(--line2)")}</button>`;
  return h;
}

/* ---------- Persoonlijk — de oude vastlegknoppen, nu per categorie ---------- */
function vwPersoonlijk() {
  const v = vandaagISO();
  const afsprVandaag = S.afspraken.filter(a => a.datum === v).length;
  const deadlineLaat = S.afspraken.filter(a => afspraakLaat(a)).length;
  const gewVandaag = gewoontesVoor(v);
  const gewOpen = gewVandaag.filter(g => !gewoonteAf(g.id, v)).length;
  const dbVandaag = S.dagboek.find(d => d.datum === v);

  let h = `<div class="werk-kop" style="--kk:#2f6fed">
    <svg class="ill" viewBox="0 0 100 80" aria-hidden="true"><use href="#ill-persoonlijk"/></svg>
    <div class="ttl">Persoonlijk</div>
    <div class="sub">Alles wat bij je leven hoort, buiten werk om</div>
  </div>`;

  h += `<div class="startgrid">
    ${knop3d({ soort: "taak", naam: "Taak", uitleg: "Iets wat je moet doen", kleur: "#2f6fed", telling: openTaken().length || "" })}
    ${knop3d({ soort: "gesprek", naam: "Afspraak", uitleg: "Gesprek op een moment", kleur: "#7a4fd6", telling: afsprVandaag || "" })}
    ${knop3d({ soort: "toezegging", naam: "Toezegging", uitleg: "Wat je iemand beloofde", kleur: "#4f46b8", telling: deadlineLaat || "" })}
    ${knop3d({ soort: "checklist", naam: "Checklist", uitleg: "Lijstje om af te vinken", kleur: "#0f8b6c", telling: S.checklists.filter(c => !c.sjabloon).length || "" })}
    ${knop3d({ soort: "gewoonte", naam: "Gewoonte", uitleg: gewOpen ? gewOpen + " nog te doen" : "Streak bijhouden", kleur: "#c2410c", telling: gewOpen || "" })}
    ${knop3d({ soort: "dagboek", naam: "Dagboek", uitleg: dbVandaag ? "Vandaag al geschreven" : "Hoe gaat het?", kleur: "#be185d" })}
    ${knop3d({ soort: "notitie", naam: "Notitie", uitleg: "Zomaar in je logboek", kleur: "#475569", breed: true })}
    ${knop3d({ soort: "focus", naam: "Focussessie", uitleg: "Timer op één taak", kleur: "#1f2937", breed: true })}
  </div>`;

  h += `<button class="startstrip" data-act="ga" data-view="vandaag">
    ${ico("vandaag", "width:20px;height:20px;color:var(--muted)")}
    <span class="nm">Bekijk je hele dag op de tijdlijn</span>
    ${ico("pijlr", "width:16px;height:16px;color:var(--line2)")}</button>`;
  return h;
}

function snelVastlegBlad() {
  bladOpen("Snel typen", `
    <div class="veld">
      <input class="invoer" id="snelveld" type="text" enterkeyhint="done" autocomplete="off"
             placeholder="Bv. vrijdag 10:00 offerte nakijken p1 #werk">
      <div class="parser-uit" id="snelparser" style="padding-top:12px"></div>
    </div>
    <div class="klein">
      <p><b>Wat je kunt typen</b></p>
      <p><code>morgen</code> <code>vrijdag</code> <code>over 3 dagen</code> <code>15/3</code> <code>eind van de week</code></p>
      <p><code>15:00</code> <code>half 4</code> <code>kwart over 3</code> <code>vanavond</code> <code>over een half uur</code></p>
      <p><code>elke maandag</code> <code>elke werkdag</code> <code>om de dag</code> <code>elke 15e van de maand</code></p>
      <p><code>p1</code> prioriteit · <code>#project</code> · <code>@label</code> · <code>+persoon</code> · <code>~20m</code> duur</p>
    </div>`,
    `<button class="knop breed primair" id="snelok">Toevoegen</button>`);
  const veld = $("#snelveld");
  const teken2 = () => {
    const p = parseNL(veld.value);
    $("#snelparser").innerHTML = veld.value.trim()
      ? (p.titel ? `<span class="chip groen">${ico("check")}${esc(p.titel)}</span>` : `<span class="hint">Nog geen titel herkend</span>`) + parserChips(p)
      : `<span class="hint">Tik hierboven en zie meteen wat de app herkent.</span>`;
  };
  veld.oninput = teken2;
  veld.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#snelok").click(); } };
  teken2();
  setTimeout(() => veld.focus(), 260);
  $("#snelok").onclick = async () => {
    const t = await maakTaakUitTekst(veld.value);
    if (!t) { toast("Niets herkend"); return; }
    bladSluit(); teken();
    toast("Toegevoegd" + (t.datum ? " · " + datumLabel(t.datum) : ""), "Bewerken", () => openTaakBlad(t.id));
  };
}

async function startKnopActie(soort) {
  tril(9);
  switch (soort) {
    case "snel": snelVastlegBlad(); break;
    case "taak": openTaakBlad(null); break;
    case "gesprek": openAfspraakBlad(null, { soort: "gesprek" }); break;
    case "toezegging": openAfspraakBlad(null, { soort: "toezegging" }); break;
    case "checklist": ga("checklists"); break;
    case "gewoonte": ga("gewoontes"); break;
    case "dagboek": openDagboekBlad(vandaagISO()); break;
    case "notitie":
      bladVraag("Notitie in logboek", "", "Wat wil je vastleggen?", async tekst => {
        if (!tekst) return;
        await logGebeurtenis("notitie", tekst);
        teken(); toast("In je logboek gezet");
      }, true);
      break;
    case "foto": {
      const k = $("#bestandkiezer");
      k.onchange = async () => {
        const ids = [];
        for (const f of Array.from(k.files || [])) {
          const bl = { id: uid(), naam: f.name, type: f.type, blob: f, ts: new Date().toISOString() };
          await bewaar("bijlagen", bl); ids.push(bl.id);
        }
        k.value = "";
        if (ids.length) openTaakBlad(null, { bijlagen: ids, titel: "" });
      };
      k.click();

/* ==========================================================================
   27. Vegen over een taakregel
   ========================================================================== */
let veeg = null, veegKlaar = 0;
document.addEventListener("pointerdown", e => {
  if (!inst("vegen", true) || bulk.aan) return;
  if (e.target.closest("[data-greep]")) return;
  const rij = e.target.closest(".swipe");
  if (!rij || !$(".swipe-laag", rij)) return;
  veeg = { rij, x: e.clientX, y: e.clientY, richting: null, kaart: $(".taak", rij) };
}, { passive: true });
/* Na een echte veeg geen klik laten doorgaan (anders vink je dubbel af). */
document.addEventListener("click", e => {
  if (Date.now() - veegKlaar < 400) { e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener("pointermove", e => {
  if (!veeg) return;
  const dx = e.clientX - veeg.x, dy = e.clientY - veeg.y;
  if (!veeg.richting) {
    if (Math.abs(dy) > 9 && Math.abs(dy) > Math.abs(dx)) { veeg = null; return; }
    if (Math.abs(dx) > 11) { veeg.richting = "x"; veeg.rij.classList.add("sleept"); }
    else return;
  }
  e.preventDefault();
  const laag = $(".swipe-laag", veeg.rij);
  laag.classList.toggle("groen", dx > 0);
  laag.classList.toggle("oranje", dx <= 0);
  veeg.kaart.style.transform = `translateX(${clamp(dx, -150, 150)}px)`;
}, { passive: false });
document.addEventListener("pointerup", async e => {
  if (!veeg) return;
  const dx = e.clientX - veeg.x, rij = veeg.rij, kaart = veeg.kaart, id = rij.dataset.taak;
  const raak = veeg.richting === "x" && Math.abs(dx) > 84;
  if (veeg.richting === "x") veegKlaar = Date.now();
  rij.classList.remove("sleept");
  kaart.style.transform = "";
  veeg = null;
  if (!raak) return;
  if (dx > 0) vinkTaak(id);
  else openSnoozeBlad(id);
});
document.addEventListener("pointercancel", () => {
  if (veeg) { veeg.rij.classList.remove("sleept"); veeg.kaart.style.transform = ""; veeg = null; }
});

/* ==========================================================================
   28. Meerdere taken tegelijk
   ========================================================================== */
const bulk = { aan: false, ids: new Set() };
function bulkToon() {
  const b = $("#bulkbalk");
  b.classList.toggle("zicht", bulk.aan);
  $("#bulk-aantal").textContent = bulk.ids.size + " gekozen";
}
function bulkUit() { bulk.aan = false; bulk.ids.clear(); bulkToon(); teken(); }
let langTimer = null, langStart = null;
document.addEventListener("pointerdown", e => {
  const rij = e.target.closest("[data-taak]");
  if (!rij || bulk.aan || e.target.closest("[data-greep]")) return;
  langStart = { x: e.clientX, y: e.clientY };
  langTimer = setTimeout(() => {
    bulk.aan = true; bulk.ids.add(rij.dataset.taak);
    veeg = null;
    tril(14); bulkToon(); teken();
  }, 550);
}, { passive: true });
document.addEventListener("pointermove", e => {
  if (!langStart) return;
  if (Math.abs(e.clientX - langStart.x) > 10 || Math.abs(e.clientY - langStart.y) > 10) {
    clearTimeout(langTimer); langStart = null;
  }
}, { passive: true });
["pointerup", "pointercancel"].forEach(ev =>
  document.addEventListener(ev, () => { clearTimeout(langTimer); langStart = null; }, { passive: true }));

async function bulkActie(wat) {
  const ids = Array.from(bulk.ids);
  if (!ids.length) { toast("Kies eerst een paar taken"); return; }
  if (wat === "af") {
    for (const id of ids) { const t = vind("taken", id); if (t && !t.af) await vinkTaak(id); }
    bulkUit(); toast(ids.length + " taken afgevinkt");
  } else if (wat === "weg") {
    bevestigVerwijderen(async () => {
      for (const id of ids) await verwijder("taken", id);
      bulkUit(); toast("Verwijderd");
    });
  } else if (wat === "datum") {
    bladOpen("Datum voor " + ids.length + " taken", `<div class="card">
      ${[["Vandaag", 0], ["Morgen", 1], ["Overmorgen", 2], ["Volgende week", 7], ["Datum wissen", "wis"]].map(([n, d]) =>
        `<button class="rijknop" data-bulkdatum="${d}">${ico("komend", "width:19px;height:19px;color:var(--accent)")}<span class="nm">${n}</span></button>`).join("")}
    </div>`);
    $("#bladinhoud").onclick = async ev => {
      const k = ev.target.closest("[data-bulkdatum]"); if (!k) return;
      const w = k.dataset.bulkdatum;
      for (const id of ids) {
        const t = vind("taken", id); if (!t) continue;
        const oudeDatum = t.datum;
        t.datum = w === "wis" ? null : plusDagen(vandaagISO(), +w);
        if (w === "wis") t.tijd = null;
        if (oudeDatum && t.datum && t.datum > oudeDatum) t.uitgesteld = (t.uitgesteld || 0) + 1;
        await bewaar("taken", t);
      }
      bladSluit(); bulkUit(); toast("Datum aangepast");
    };
  } else if (wat === "project") {
    bladOpen("Project voor " + ids.length + " taken", `<div class="card">
      <button class="rijknop" data-bulkproject=""><span class="nm">Geen project (inbox)</span></button>
      ${S.projecten.map(p => `<button class="rijknop" data-bulkproject="${p.id}">
        <span class="kleurbol" style="background:${p.kleur}"></span><span class="nm">${esc(p.naam)}</span></button>`).join("")}
    </div>`);
    $("#bladinhoud").onclick = async ev => {
      const k = ev.target.closest("[data-bulkproject]"); if (!k) return;
      for (const id of ids) { const t = vind("taken", id); if (t) { t.projectId = k.dataset.bulkproject || null; await bewaar("taken", t); } }
      bladSluit(); bulkUit(); toast("Verplaatst");
    };
  }
}

   29. Vergrendeling met pincode (slot voor meekijkers, geen versleuteling)
   ========================================================================== */
const slot = { invoer: "", nieuw: null, stap: 0 };
function slotToon(tekst) {
  $("#slot").classList.add("zicht");
  $("#slot-tekst").textContent = tekst || "Voer je pincode in";
  $("#slot-cijfers").innerHTML =
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-cijfer="${n}">${n}</button>`).join("") +
    `<button class="leeg" data-cijfer="annuleer" style="font-size:14px">${slot.nieuw !== null ? "Stop" : ""}</button>
     <button data-cijfer="0">0</button>
     <button class="leeg" data-cijfer="wis" style="font-size:14px">Wis</button>`;
  slotBolletjes();
}
function slotBolletjes() {
  $("#slot-bolletjes").innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < slot.invoer.length ? "vol" : ""}"></i>`).join("");
}
$("#slot").addEventListener("click", async e => {
  const k = e.target.closest("[data-cijfer]"); if (!k) return;
  const c = k.dataset.cijfer;
  if (c === "wis") { slot.invoer = slot.invoer.slice(0, -1); slotBolletjes(); return; }
  if (c === "annuleer") { slot.nieuw = null; slot.invoer = ""; $("#slot").classList.remove("zicht"); teken(); return; }
  slot.invoer += c; tril(4); slotBolletjes();
  if (slot.invoer.length < 4) return;
  const code = slot.invoer; slot.invoer = "";
  setTimeout(async () => {
    if (slot.nieuw === "stap1") { slot.nieuw = code; slotToon("Herhaal de code"); return; }
    if (slot.nieuw) {
      if (slot.nieuw === code) { await zetInst("pincode", code); slot.nieuw = null; $("#slot").classList.remove("zicht"); teken(); toast("Pincode ingesteld"); }
      else { slot.nieuw = "stap1"; slotToon("Codes verschillen — kies opnieuw"); tril(30); }
      return;
    }
    if (code === inst("pincode", null)) { $("#slot").classList.remove("zicht"); slotBolletjes(); }
    else { slotToon("Onjuiste code — probeer opnieuw"); tril(40); }
  }, 90);
});
function pinInstellen() { slot.nieuw = "stap1"; slot.invoer = ""; slotToon("Kies een nieuwe code van 4 cijfers"); }

/* ==========================================================================

   ========================================================================== */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (el) {
    const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case "start-knop": startKnopActie(el.dataset.soort); break;
      case "bulk-kies": {
        if (bulk.ids.has(id)) bulk.ids.delete(id); else bulk.ids.add(id);
        if (!bulk.ids.size) { bulkUit(); return; }
        bulkToon(); teken();
        break;
      }
      case "sub-open": {
        if (uitgeklapt.has(id)) uitgeklapt.delete(id); else uitgeklapt.add(id);
        teken();
        break;
      }
      case "sub-vink": {
        const t = vind("taken", id);
        subVink(t.subtaken, +el.dataset.i);
        await bewaar("taken", t); tril(6); teken();
        break;
      }
      case "focus-klaar": {
        const lijst = focusKandidaten();
        const t = lijst[clamp(inst("focusIndex", 0), 0, lijst.length - 1)];
        if (t) await vinkTaak(t.id);
        await zetInst("focusIndex", 0); teken();
        break;
      }
      case "focus-volgende": {
        const lijst = focusKandidaten();
        await zetInst("focusIndex", (clamp(inst("focusIndex", 0), 0, lijst.length - 1) + 1) % Math.max(1, lijst.length));
        teken();
        break;
      }
      case "focus-snooze": {
        const lijst = focusKandidaten();
        const t = lijst[clamp(inst("focusIndex", 0), 0, lijst.length - 1)];
        if (t) openSnoozeBlad(t.id);
        break;
      }
      case "focus-timer": {
        const lijst = focusKandidaten();
        const t = lijst[clamp(inst("focusIndex", 0), 0, lijst.length - 1)];
        if (!t) break;
        if (T.taakId === t.id) pauzeTimer(); else startTimer(t.id);
        teken();
        break;
      }
      case "focus-sub": {
        const lijst = focusKandidaten();
        const t = lijst[clamp(inst("focusIndex", 0), 0, lijst.length - 1)];
        if (!t) break;
        subVink(t.subtaken, +el.dataset.i);
        await bewaar("taken", t); tril(6); teken();
        break;
      }
      case "pin-wijzig": pinInstellen(); break;
      case "filter-vast": {
        const f = vind("filters", id);
        f.vast = !f.vast; await bewaar("filters", f); teken();
        toast(f.vast ? "Op het startscherm gezet" : "Van het startscherm gehaald");
        break;
      }
    }
  }
  // Instellingen: segmenten en schakelaars
  const seg = e.target.closest("[data-inst]");
  if (seg) {
    await zetInst(seg.dataset.inst, seg.dataset.waarde);
    pasInstellingenToe(); teken();
    return;
  }
  const tg = e.target.closest("[data-toggle]");
  if (tg) {

async function vinkTaak(id) {
  const t = vind("taken", id);

  if (t.af) {
    t.af = false; t.afOp = null; t.overgeslagen = false;

    teken(); return;
  }

  }
  if (t.reeksId && typeof reeksVink === "function") { await reeksVink(t); return; }
  if (t.herhaal) {
    const oud = t.datum;
    const volgende = volgendeDatum(t.datum, t.herhaal);
    await logGebeurtenis("taak", "Afgerond: " + t.titel, t.id);
    t.datum = volgende;
    t.uitgesteldTot = null;
    (t.subtaken || []).forEach(s => (s.af = false));
    await bewaar("taken", t);
    teken();
    toast("Afgerond · volgende keer " + datumLabel(volgende), "Ongedaan", async () => {
      t.datum = oud; await bewaar("taken", t);
      const g = S.gebeurtenissen.filter(x => x.refId === t.id).pop();
      if (g) await verwijder("gebeurtenissen", g.id);
      teken();
    });
    return;
  }
  t.af = true;
  t.afOp = new Date().toISOString();
  await bewaar("taken", t);
  await logGebeurtenis("taak", "Afgerond: " + t.titel, t.id);
  teken();
  toast("Afgerond", "Ongedaan", async () => {
    t.af = false; t.afOp = null; await bewaar("taken", t);
    const g = S.gebeurtenissen.filter(x => x.refId === t.id).pop();
    if (g) await verwijder("gebeurtenissen", g.id);
    teken();

}

/* ==========================================================================
   15. Focustimer
   ========================================================================== */
const T = { taakId: null, start: null, opgebouwd: 0, actief: false, tick: null };
function timerToon() {
  const balk = $("#timerbalk");
  if (!T.actief && !T.start) { balk.classList.remove("zicht"); return; }
  balk.classList.add("zicht");
  const t = T.taakId ? vind("taken", T.taakId) : null;
  $("#timer-naam").textContent = t ? t.titel : "Focussessie";
  $("#timer-tijd").textContent = secTekst(timerSeconden());
  $("#timer-pauze").innerHTML = T.actief ? ico("pauze") : ico("play");
}
const timerSeconden = () => Math.floor(T.opgebouwd + (T.actief && T.start ? (Date.now() - T.start) / 1000 : 0));
function timerBewaarStatus() {
  zetInst("timer", { taakId: T.taakId, start: T.start, opgebouwd: T.opgebouwd, actief: T.actief });
}
function startTimer(taakId) {
  if (T.actief || T.start) stopTimer(true);
  T.taakId = taakId || null; T.opgebouwd = 0; T.start = Date.now(); T.actief = true;
  clearInterval(T.tick); T.tick = setInterval(timerToon, 1000);
  timerToon(); timerBewaarStatus();
  toast("Timer gestart");
}
function pauzeTimer() {
  if (T.actief) { T.opgebouwd = timerSeconden(); T.actief = false; T.start = null; }
  else { T.start = Date.now(); T.actief = true; }
  timerToon(); timerBewaarStatus();
}
async function stopTimer(stil) {
  const sec = timerSeconden();
  const taakId = T.taakId;
  clearInterval(T.tick);
  T.taakId = null; T.start = null; T.opgebouwd = 0; T.actief = false;
  timerToon(); timerBewaarStatus();
  if (sec < 20) { if (!stil) toast("Te kort om te bewaren"); return; }
  const t = taakId ? vind("taken", taakId) : null;
  await bewaar("tijdlog", { id: uid(), taakId, seconden: sec, datum: vandaagISO(), ts: new Date().toISOString() });
  await logGebeurtenis("tijd", `${secTekst(sec)} gewerkt aan ${t ? t.titel : "een focussessie"}`, taakId);
  if (!stil) { teken(); toast(secTekst(sec) + " geregistreerd"); }
}
function herstelTimer() {
  const s = inst("timer", null);
  if (!s || (!s.actief && !s.opgebouwd)) return;
  Object.assign(T, s);
  if (T.actief) { clearInterval(T.tick); T.tick = setInterval(timerToon, 1000); }
  timerToon();
}

/* ==========================================================================
   16. Meldingen (alleen terwijl de app open is)
   ========================================================================== */
let meldTimers = [];
function plangMeldingen() {
  meldTimers.forEach(clearTimeout);
  meldTimers = [];
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const nu = Date.now();
  S.taken.filter(t => !t.af && t.datum && t.tijd).forEach(t => {
    const tijdstip = new Date(t.datum + "T" + t.tijd + ":00").getTime();
    const wacht = tijdstip - nu;
    if (wacht > 0 && wacht < 86400000 && meldTimers.length < 40) {
      meldTimers.push(setTimeout(() => {
        try { new Notification(t.titel, { body: "Gepland voor " + t.tijd, tag: t.id }); } catch (e) {}
        toast("⏰ " + t.titel);
      }, wacht));

async function vraagMeldingen() {
  if (!("Notification" in window)) { toast("Deze browser kent geen meldingen"); return; }
  try {

/* ==========================================================================
   17. Back-up: exporteren en importeren
   ========================================================================== */
const blobNaarBase64 = blob => new Promise(res => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => res(null);
  r.readAsDataURL(blob);
});
async function base64NaarBlob(dataUrl) {
  const r = await fetch(dataUrl);
  return await r.blob();
}
async function exportJSON(metBijlagen) {
  toast("Back-up wordt gemaakt…");
  const data = { app: "FutureMe", versie: 2, dbVersie: DB_VERSIE, gemaakt: new Date().toISOString(), data: {} };
  for (const w of Object.keys(WINKELS)) {
    if (w === "instellingen") data.data.instellingen = Object.entries(S.instellingen).map(([sleutel, waarde]) => ({ sleutel, waarde }));
    else if (w === "bijlagen") {
      data.data.bijlagen = metBijlagen
        ? await Promise.all(S.bijlagen.map(async b => ({ id: b.id, naam: b.naam, type: b.type, ts: b.ts, data: await blobNaarBase64(b.blob) })))
        : [];
    } else data.data[w] = S[w];
  }
  const naam = `futureme-backup-${vandaagISO()}${metBijlagen ? "-compleet" : ""}.json`;
  await deelOfDownload(naam, JSON.stringify(data), "application/json");
  await zetInst("laatsteBackup", new Date().toISOString());
  teken();
  toast("Back-up klaar — bewaar hem in Bestanden of iCloud", null, null, 5000);
}
async function importJSON(bestand, modus) {
  let data;
  try { data = JSON.parse(await bestand.text()); }
  catch (e) { toast("Dit is geen geldig back-upbestand"); return; }
  if (!data || !data.data) { toast("Dit is geen FutureMe-back-up"); return; }
  if (data.dbVersie && data.dbVersie > DB_VERSIE) { toast("Deze back-up komt uit een nieuwere versie."); return; }
  if (modus === "vervangen") for (const w of Object.keys(WINKELS)) { await idbLeeg(w); S[w] = w === "instellingen" ? {} : []; }
  let aantal = 0;
  for (const w of Object.keys(WINKELS)) {
    const rijen = data.data[w] || [];
    for (const rij of rijen) {
      if (w === "instellingen") { S.instellingen[rij.sleutel] = rij.waarde; await idbZet(w, rij); aantal++; continue; }
      if (w === "bijlagen") {
        if (!rij.data) continue;
        if (S.bijlagen.some(b => b.id === rij.id)) continue;
        const blob = await base64NaarBlob(rij.data);
        await bewaar("bijlagen", { id: rij.id, naam: rij.naam, type: rij.type, ts: rij.ts, blob });
        aantal++; continue;
      }
      if (modus !== "vervangen" && S[w].some(x => x.id === rij.id)) continue;
      await bewaar(w, rij);
      aantal++;
    }
  }
  teken();
  toast(`${aantal} onderdelen teruggezet`, null, null, 5000);
}

/* ==========================================================================
   18. Slepen om te herordenen
   ========================================================================== */
let sleep = null;
document.addEventListener("pointerdown", e => {
  const greep = e.target.closest("[data-greep]");
  if (!greep) return;
  const rij = greep.closest("[data-taak]"), lijst = rij && rij.parentElement;
  if (!lijst || !lijst.dataset.sleeplijst) return;
  e.preventDefault();
  sleep = { rij, lijst, y: e.clientY };
  rij.classList.add("slepen");
  tril(8);
  greep.setPointerCapture(e.pointerId);
}, { passive: false });
document.addEventListener("pointermove", e => {
  if (!sleep) return;
  e.preventDefault();
  const onder = document.elementFromPoint(e.clientX, e.clientY);
  const doel = onder && onder.closest("[data-taak]");
  if (doel && doel !== sleep.rij && doel.parentElement === sleep.lijst) {
    const rect = doel.getBoundingClientRect();
    const na = e.clientY > rect.top + rect.height / 2;
    sleep.lijst.insertBefore(sleep.rij, na ? doel.nextSibling : doel);
  }
}, { passive: false });
document.addEventListener("pointerup", async () => {
  if (!sleep) return;
  sleep.rij.classList.remove("slepen");
  const ids = Array.from(sleep.lijst.children).filter(r => r.dataset.taak).map(r => r.dataset.taak);
  sleep = null;
  let n = 0;
  for (const id of ids) { const t = vind("taken", id); if (t) { t.volgorde = n++; await bewaar("taken", t); } }
  teken();
});

    }
    case "cl-hernoem": {
      const c = vind("checklists", id);
      bladVraag("Hernoemen", c.naam, "", async naam => { if (naam) { c.naam = naam; await bewaar("checklists", c); teken(); } });
      break;
    }
    case "cl-verwijder": {
      const c = vind("checklists", id);
      bevestigVerwijderen(async () => {
        await verwijder("checklists", id); ga("checklists"); toast("Verwijderd");
      });
      break;
    }
    case "gew-vink": {
      const datum = el.dataset.datum, sleutel = id + "|" + datum;
      const g = vind("gewoontes", id);
      if (gewoonteAf(id, datum)) await verwijder("gewoontelog", sleutel);
      else {
        await bewaar("gewoontelog", { id: sleutel, gewoonteId: id, datum, ts: new Date().toISOString() });
        await logGebeurtenis("gewoonte", "Gewoonte volbracht: " + (g ? g.naam : ""), id);
        tril(10);
      }
      teken();
      break;
    }
    case "nieuwe-gewoonte": openGewoonteBlad(null); break;
    case "bewerk-gewoonte": openGewoonteBlad(id); break;
    case "zoek-wis": V.zoek = ""; teken(); break;
    case "zoek-plak": {
      V.zoek = (V.zoek + " " + el.dataset.f).trim();
      teken();
      const z = $("#zoekveld"); z && z.focus();
      break;
    }
    case "filter-opslaan":
      bladVraag("Slimme lijst bewaren", "", "Naam, bv. Deze week urgent", async naam => {
        if (!naam) return;
        await bewaar("filters", { id: uid(), naam, query: V.zoek, gemaakt: new Date().toISOString() });
        teken(); toast("Bewaard");
      });
      break;
    case "filter-open": {
      const f = vind("filters", id);
      V.zoek = f.query; ga("zoeken");
      break;
    }
    case "nieuwe-persoon":
      bladVraag("Persoon toevoegen", "", "Naam", async naam => {
        if (!naam) return;
        await bewaar("personen", { id: uid(), naam, notitie: "" });
        teken();
      });
      break;
    case "persoon-open": openPersoonBlad(el.dataset.naam); break;
    case "terugblik-log": {
      const start = weekStart(vandaagISO());
      const af = S.taken.filter(t => t.af && (t.afOp || "") >= start).length;
      await logGebeurtenis("notitie", `Weekterugblik: ${af} taken afgerond, ${S.afspraken.filter(a => a.datum >= start).length} afspraken.`);
      toast("In logboek gezet");
      break;
    }
    case "timer-start-los": startTimer(null); break;
    case "backup-json": exportJSON(el.dataset.bijlagen === "1"); break;
    case "backup-ics": exportICS(); break;
    case "backup-tekst": exportTekst(); break;
    case "backup-import": {
      const k = $("#jsonkiezer"), modus = el.dataset.modus;
      k.onchange = async () => {
        const f = k.files && k.files[0];
        k.value = "";
        if (!f) return;
        if (modus === "vervangen")
          bevestig("Alles vervangen?", "Alles wat nu in de app staat wordt gewist en vervangen door de back-up.", "Vervangen", () => importJSON(f, "vervangen"));
        else importJSON(f, "samenvoegen");
      };
      k.click();
      break;
    }
    case "persist-nu": {
      const ok = await vraagPersistent();
      teken();
      toast(ok ? "Opslag is vastgezet" : "iOS heeft dit (nog) niet toegekend — zet de app op je beginscherm");
      break;
    }
    case "meldingen-aan": vraagMeldingen(); break;
    case "wis-alles":
      bevestigVerwijderen(async () => {
        for (const w of Object.keys(WINKELS)) { await idbLeeg(w); S[w] = w === "instellingen" ? {} : []; }
        ga("vandaag"); toast("Alles gewist");
      });
      break;
  }
});

/* ==========================================================================
   20. Losse bindingen na elke tekening
   ========================================================================== */
function naTekenen() {
  const z = $("#zoekveld");
  if (z) {
    z.oninput = () => { V.zoek = z.value; clearTimeout(z._t); z._t = setTimeout(() => { const p = z.selectionStart; teken(); const n = $("#zoekveld"); if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} } }, 320); };
  }
  const cl = $("#cl-nieuw");
  if (cl) {
    cl.onkeydown = async ev => {
      if (ev.key !== "Enter") return;
      const c = vind("checklists", cl.dataset.id), tekst = cl.value.trim();
      if (!tekst) return;
      c.items.push({ tekst, af: false });
      await bewaar("checklists", c);
      teken();
      const n = $("#cl-nieuw"); n && n.focus();
    };
  }
  $$("[data-afspraak-veld]").forEach(ta => {
    ta.oninput = () => {
      clearTimeout(ta._t);
      ta._t = setTimeout(async () => {
        const a = vind("afspraken", ta.dataset.id);
        if (!a) return;
        const was = a[ta.dataset.afspraakVeld];
        a[ta.dataset.afspraakVeld] = ta.value;
        await bewaar("afspraken", a);
        if (ta.dataset.afspraakVeld === "uitkomst" && !was && ta.value.trim())
          await logGebeurtenis("afspraak", "Afspraak afgerond: " + a.titel, a.id);
      }, 600);
    };
  });
  // Lang indrukken op een slimme lijst = verwijderen
  $$("[data-act='filter-open']").forEach(knop => {
    let tm = null;
    knop.addEventListener("pointerdown", () => {
      tm = setTimeout(() => {
        const f = vind("filters", knop.dataset.id);
        bevestigVerwijderen(
          async () => { await verwijder("filters", f.id); teken(); });
      }, 600);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => knop.addEventListener(ev, () => clearTimeout(tm)));
  });
  const ruimte = $("#ruimte");
  if (ruimte) opslagRuimte().then(r => {
    if (r) ruimte.innerHTML = `<b>Ruimte:</b> ${(r.gebruikt / 1048576).toFixed(1)} MB gebruikt${r.quota ? " van " + (r.quota / 1048576).toFixed(0) + " MB beschikbaar" : ""}`;
  });
  const ps = $("#persiststatus");
  if (ps) ps.textContent = PWA.persist;
}

$("#tabs").addEventListener("click", e => {

});
$("#terug").onclick = terug;

}, { passive: true });
document.addEventListener("input", e => { if (e.target.id === "vastlegveld") vastlegLive(); });
document.addEventListener("keydown", e => {

});

});

/* Spraakdictaat (werkt alleen waar de browser het ondersteunt) */
let herkenner = null;
function startDictaat() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Dicteren wordt hier niet ondersteund"); return; }
  const knop = $("#micknop");
  if (herkenner) { herkenner.stop(); herkenner = null; knop && knop.classList.remove("aan"); return; }
  herkenner = new SR();
  herkenner.lang = "nl-NL";
  herkenner.interimResults = true;
  herkenner.continuous = false;
  knop && knop.classList.add("aan");
  herkenner.onresult = ev => {
    let tekst = "";
    for (let i = 0; i < ev.results.length; i++) tekst += ev.results[i][0].transcript;
    const veld = $("#vastlegveld");
    if (veld) { veld.value = tekst; vastlegLive(); }
  };
  herkenner.onerror = () => { toast("Dicteren lukte niet"); knop && knop.classList.remove("aan"); herkenner = null; };
  herkenner.onend = () => { knop && knop.classList.remove("aan"); herkenner = null; };
  try { herkenner.start(); } catch (e) { herkenner = null; knop && knop.classList.remove("aan"); }
}

/* Dagwissel: bij terugkeer op een nieuwe dag alles opnieuw tekenen */
let laatsteDag = vandaagISO();
document.addEventListener("visibilitychange", () => {

async function start() {

  } catch (e) {

      <h2>De opslag kon niet worden geopend</h2>
      <p>Dit gebeurt bijna altijd in een privévenster of als er nog een tabblad van deze app openstaat.
      Sluit andere tabbladen, zet privénavigatie uit en laad de pagina opnieuw.</p>
      <p style="color:#888;font-size:13px">${esc(e && e.message || e)}</p></div>`;
    return;
  }
  for (const w of Object.keys(WINKELS)) {

<script>
"use strict";
/* ==========================================================================
   31. Diepgang uit de testrondes — gewoontes, dagboek, checklists,
       terugblik, logboek en zoeken
   ========================================================================== */

/* ---------- Gewoontes: weekdoel en jaaroverzicht ---------- */
function gewoonteWeek(g, iso) {
  const start = weekStart(iso || vandaagISO());
  let n = 0;
  for (let i = 0; i < 7; i++) if (gewoonteAf(g.id, plusDagen(start, i))) n++;
  return n;
}
function gewoonteDoel(g) {
  if (g.perWeek) return g.perWeek;
  if (g.dagen && g.dagen.length) return g.dagen.length;
  return 7;
}
gewoontesVoor = function (datum) {
  const wd = weekdagVan(datum);
  return S.gewoontes.filter(g => {
    if (g.archief) return false;
    if (g.perWeek) return gewoonteWeek(g, datum) < g.perWeek || gewoonteAf(g.id, datum);
    return !g.dagen || !g.dagen.length || g.dagen.includes(wd);
  });
};
function jaarHeatmap(g) {
  const eind = vandaagISO();
  const start = plusDagen(eind, -363);
  const cellen = [];
  const eersteMa = weekStart(start);
  for (let i = 0; i < 371; i++) {
    const d = plusDagen(eersteMa, i);
    if (d > eind) break;
    const hoort = g.perWeek ? true : (!g.dagen || !g.dagen.length || g.dagen.includes(weekdagVan(d)));
    const af = gewoonteAf(g.id, d);
    cellen.push(`<i data-n="${af ? 2 : 0}" class="${hoort ? "" : "nvt"}" title="${d}"></i>`);
  }
  return `<div class="heat">${cellen.join("")}</div>`;
}
vwGewoontes = function () {
  const v = vandaagISO();
  const actief = S.gewoontes.filter(g => !g.archief);
  let h = `<button class="knop breed primair" style="margin:10px 0" data-act="nieuwe-gewoonte">${ico("plus")} Nieuwe gewoonte</button>`;
  if (!actief.length)
    return h + `<div class="card">${leeg("🔥", "Nog geen gewoontes", "Bijvoorbeeld: elke dag 10 minuten lezen, of 3× per week sporten.")}</div>`;
  const vandaagLijst = gewoontesVoor(v);
  h += sectie("Vandaag", `${vandaagLijst.filter(g => gewoonteAf(g.id, v)).length}/${vandaagLijst.length}`);
  h += vandaagLijst.length ? `<div class="card">${vandaagLijst.map(g => gewoonteRij(g, v)).join("")}</div>`
    : `<div class="card"><div class="leeg"><p>Voor vandaag staat er niets op de planning. Mooi zo.</p></div></div>`;
  const rest = actief.filter(g => !vandaagLijst.includes(g));
  if (rest.length) { h += sectie("Niet vandaag gepland", rest.length); h += `<div class="card">${rest.map(g => gewoonteRij(g, v)).join("")}</div>`; }

  h += sectie("Deze week");
  h += `<div class="card card-pad">` + actief.map(g => {
    const n = gewoonteWeek(g), doel = gewoonteDoel(g), pct = Math.min(100, Math.round(n / doel * 100));
    return `<div style="margin:10px 0">
      <div style="display:flex;justify-content:space-between;font-size:calc(14px * var(--t))">
        <span>${esc(g.naam)}${g.perWeek ? ` <span class="chip">${g.perWeek}× p/w</span>` : ""}</span><b>${n}/${doel}</b></div>
      <div class="balk" style="margin-top:4px"><i style="width:${pct}%"></i></div></div>`;
  }).join("") + `</div>`;

  h += sectie("Een jaar terug", null, `<span class="telling">elk blokje is een dag</span>`);
  h += `<div class="card card-pad">` + actief.map(g => `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
        <b style="font-size:calc(14px * var(--t))">${esc(g.naam)}</b>
        <span class="streak">${ico("vuur", "width:12px;height:12px;vertical-align:-2px")} ${streakVan(g)} op rij · ${S.gewoontelog.filter(l => l.gewoonteId === g.id).length} keer totaal</span>
      </div>${jaarHeatmap(g)}</div>`).join("") + `</div>`;
  return h;
};

/* ---------- Dagboek: schrijfhulp, vorig jaar, stemming over tijd ---------- */
const SCHRIJFVRAGEN = [
  "Wat was vandaag het beste moment?",
  "Waar liep je tegenaan, en wat deed je toen?",
  "Wie sprak je vandaag, en wat bleef hangen?",
  "Wat heb je vandaag geleerd?",
  "Waar ben je trots op, hoe klein ook?",
  "Wat kostte je de meeste energie?",
  "Wat zou je morgen anders doen?",
  "Waar keek je vandaag naar uit?",
  "Wat wil je over een jaar nog weten van vandaag?",
  "Wat heb je vandaag níet gedaan, en is dat erg?"
];
const vraagVanDeDag = iso => SCHRIJFVRAGEN[(parseISO(iso).getDate() + parseISO(iso).getMonth()) % SCHRIJFVRAGEN.length];

vwDagboek = function () {
  const v = vandaagISO();
  const vandaag = S.dagboek.find(d => d.datum === v);
  let h = `<div class="card card-pad">
    <div class="labeltekst">Hoe was vandaag?</div>
    <div class="keuzerij" style="justify-content:space-between">
      ${STEMMINGEN.map((e, i) => `<button class="keuze" data-act="stemming" data-n="${i + 1}" aria-pressed="${vandaag && vandaag.stemming === i + 1}"
        style="font-size:calc(24px * var(--t));min-width:52px;justify-content:center">${e}</button>`).join("")}
    </div>
    <div class="banner blauw" style="margin:14px 0 10px">${ico("pen")}<div><b>Vraag van vandaag</b>${esc(vraagVanDeDag(v))}</div></div>
    <button class="knop breed ${vandaag ? "rand" : "primair"}" data-act="dagboek-nu">
      ${ico("pen")} ${vandaag ? "Notitie van vandaag bewerken" : "Schrijf over vandaag"}</button>
  </div>`;

  const lijst = S.dagboek.slice().sort((a, b) => a.datum < b.datum ? 1 : -1);
  const metStemming = lijst.filter(d => d.stemming);
  if (metStemming.length > 2) {
    const dagen = Array.from({ length: 30 }, (_, i) => plusDagen(v, -29 + i));
    h += sectie("Stemming, laatste 30 dagen");
    h += `<div class="card card-pad"><div style="display:flex;align-items:flex-end;gap:2px;height:76px">` +
      dagen.map(d => {
        const e = S.dagboek.find(x => x.datum === d);
        const hoog = e && e.stemming ? e.stemming / 5 * 100 : 0;
        const kleur = !e || !e.stemming ? "var(--line)" : e.stemming >= 4 ? "var(--green)" : e.stemming === 3 ? "var(--accent)" : "var(--amber)";
        return `<div style="flex:1;height:${Math.max(6, hoog)}%;background:${kleur};border-radius:3px" title="${d}"></div>`;
      }).join("") +
      `</div><div class="klein" style="display:flex;justify-content:space-between;margin-top:6px"><span>30 dagen geleden</span><span>vandaag</span></div>
      <div class="klein" style="margin-top:6px">Gemiddeld ${STEMMINGEN[Math.round(metStemming.slice(0, 30).reduce((a, b) => a + b.stemming, 0) / Math.min(30, metStemming.length)) - 1] || "—"} over ${Math.min(30, metStemming.length)} ingevulde dagen.</div></div>`;
  }

  const terugblikken = [[1, "Een jaar geleden"], [0.5, "Een half jaar geleden"]]
    .map(([jr, lab]) => {
      const d = plusMaanden(v, -Math.round(jr * 12));
      const e = S.dagboek.find(x => x.datum === d);
      return e ? `<button class="rijknop" style="align-items:flex-start" data-act="dagboek-open" data-datum="${e.datum}">
        <span style="font-size:calc(20px * var(--t))">${e.stemming ? STEMMINGEN[e.stemming - 1] : "📝"}</span>
        <span class="nm"><b>${lab}</b><span class="klein" style="display:block;white-space:normal">${esc((e.tekst || "").slice(0, 100))}</span></span></button>` : "";
    }).filter(Boolean);
  if (terugblikken.length) { h += sectie("Op deze dag"); h += `<div class="card">${terugblikken.join("")}</div>`; }

  if (!lijst.length) return h + `<div class="card">${leeg("📓", "Nog geen dagboeknotities", "Eén regel per dag is al genoeg om later iets aan te hebben.")}</div>`;
  h += sectie("Eerder", lijst.length);
  h += `<div class="card">` + lijst.slice(0, 60).map(d => `
    <button class="rijknop" style="align-items:flex-start" data-act="dagboek-open" data-datum="${d.datum}">
      <span style="font-size:calc(22px * var(--t));flex:0 0 auto">${d.stemming ? STEMMINGEN[d.stemming - 1] : "📝"}</span>
      <span class="nm"><b>${esc(datumLabel(d.datum, true))}</b>
        <span class="klein" style="display:block;white-space:normal">${esc((d.tekst || "").slice(0, 120))}${(d.tekst || "").length > 120 ? "…" : ""}</span></span>
    </button>`).join("") + `</div>`;
  return h;
};

/* ---------- Checklists: secties, aantallen, kopiëren ---------- */
const clSectie = it => /^\s*(#|--)\s*/.test(it.tekst);
const clSchoon = it => it.tekst.replace(/^\s*(#|--)\s*/, "");
function clAantal(tekst) {
  const m = tekst.match(/^\s*(\d{1,3})\s*[x×]\s+(.*)$/i);
  return m ? { aantal: +m[1], rest: m[2] } : null;
}
vwChecklist = function () {
  const c = vind("checklists", V.param);
  if (!c) return leeg("🤷", "Lijst bestaat niet meer");
  const echte = c.items.filter(i => !clSectie(i));
  const af = echte.filter(i => i.af).length;
  const pct = echte.length ? Math.round(af / echte.length * 100) : 0;
  let h = `<div class="card card-pad">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px">
      <b>${af} van ${echte.length} af</b><span class="klein">${pct}%</span></div>
    <div class="balk"><i style="width:${pct}%"></i></div></div>`;
  h += `<div class="card">` + c.items.map((it, i) => {
    if (clSectie(it)) return `<div style="padding:12px 13px 5px;font-size:calc(12px * var(--t));font-weight:800;
      letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--card2)">${esc(clSchoon(it))}
      <button class="icon-btn" style="min-width:30px;min-height:30px;float:right;margin:-4px -4px 0 0" data-act="cl-weg" data-id="${c.id}" data-i="${i}">${ico("x", "width:14px;height:14px")}</button></div>`;
    const a = clAantal(it.tekst);
    return `<div class="subtaak${it.af ? " af" : ""}" style="padding:8px 13px;border-bottom:1px solid var(--line)">
      <button class="mini-vink" data-act="cl-vink" data-id="${c.id}" data-i="${i}">${ico("check")}</button>
      <span style="flex:1;display:flex;align-items:center;gap:8px;${it.af ? "text-decoration:line-through;color:var(--faint)" : ""}"
        data-act="cl-bewerk" data-id="${c.id}" data-i="${i}">
        ${a ? `<span class="telbol">${a.aantal}×</span>${esc(a.rest)}` : esc(it.tekst)}</span>
      <button class="icon-btn" style="min-width:34px;min-height:34px" data-act="cl-weg" data-id="${c.id}" data-i="${i}">${ico("x", "width:16px;height:16px")}</button>
    </div>`;
  }).join("") +
    `<div class="subtaak" style="padding:8px 13px">
      <span class="mini-vink" style="opacity:.35"></span>
      <input type="text" id="cl-nieuw" placeholder="Item toevoegen… (2x melk, of # Koeling)" enterkeyhint="done" data-id="${c.id}">
    </div></div>`;
  h += `<div class="klein" style="margin:8px 2px">Tip: begin met <code>#</code> voor een kopje (<code># Koeling</code>) en met een aantal voor hoeveelheid (<code>2x melk</code>).</div>`;
  h += `<div class="knoprij" style="margin-top:12px">
    <button class="knop rand" data-act="cl-reset" data-id="${c.id}">${ico("herhaal")} Reset</button>
    <button class="knop rand" data-act="cl-kopieer" data-id="${c.id}">${ico("kopieer")} Kopiëren</button>
  </div>
  <div class="knoprij" style="margin-top:9px">
    ${c.sjabloon ? `<button class="knop primair" data-act="cl-gebruik" data-id="${c.id}">${ico("plus")} Nieuwe lijst hiervan</button>`
      : `<button class="knop rand" data-act="cl-naar-sjabloon" data-id="${c.id}">${ico("sjabloon")} Bewaar als sjabloon</button>`}
    <button class="knop rand" data-act="cl-hernoem" data-id="${c.id}">${ico("pen")} Hernoemen</button>
  </div>
  <button class="knop breed gevaar" style="margin-top:9px" data-act="cl-verwijder" data-id="${c.id}">${ico("prullenbak")} Verwijderen</button>`;
  return h;
};

/* ---------- Terugblik met periodekeuze en uitstelgedrag ---------- */
vwStats = function () {
  const v = vandaagISO();
  const periode = inst("statsPeriode", "week");
  const vanaf = periode === "week" ? weekStart(v) : periode === "maand" ? plusDagen(v, -29) : plusDagen(v, -364);
  const label = { week: "deze week", maand: "30 dagen", jaar: "een jaar" }[periode];
  const afIn = (van, tot) => S.taken.filter(t => t.af && werkOk(t) && (t.afOp || "") >= van && (!tot || (t.afOp || "") < tot)).length;
  const afNu = afIn(vanaf, null);
  const lengte = dagVerschil(v, vanaf) + 1;
  const afVorige = afIn(plusDagen(vanaf, -lengte), vanaf);

  const klaar = S.taken.filter(t => t.af && werkOk(t) && t.afOp && t.gemaakt && (t.afOp || "") >= vanaf);
  const doorloop = klaar.length
    ? Math.round(klaar.reduce((a, t) => a + (new Date(t.afOp) - new Date(t.gemaakt)) / 86400000, 0) / klaar.length * 10) / 10
    : null;
  const uitgesteld = S.taken.filter(t => (t.uitgesteld || 0) > 0 && werkOk(t));
  const uitstelTotaal = uitgesteld.reduce((a, t) => a + t.uitgesteld, 0);
  const tijd = S.tijdlog.filter(l => l.datum >= vanaf).reduce((a, b) => a + b.seconden, 0);
  const toezeggingen = S.afspraken.filter(a => werkOk(a) && afspraakSoort(a) === "toezegging" && a.deadline);
  const nagekomen = toezeggingen.filter(a => a.uitkomst).length;
  const open = openTaken().length, laat = openTaken().filter(t => t.datum && t.datum < v).length;

  let h = `<div class="segment" style="margin:12px 0">
    ${[["week", "Deze week"], ["maand", "30 dagen"], ["jaar", "Jaar"]].map(([w, l]) =>
      `<button data-inst="statsPeriode" data-waarde="${w}" aria-pressed="${periode === w}">${l}</button>`).join("")}</div>`;
  h += `<div class="stats">
    <div class="stat"><div class="getal">${afNu}</div><div class="lab">afgerond in ${label}</div></div>
    <div class="stat"><div class="getal">${afVorige ? (afNu >= afVorige ? "+" : "") + (afNu - afVorige) : "—"}</div><div class="lab">t.o.v. periode ervoor</div></div>
    <div class="stat"><div class="getal">${open}</div><div class="lab">nog open${laat ? ` · ${laat} te laat` : ""}</div></div>
    <div class="stat"><div class="getal">${Math.round(tijd / 3600)}<span style="font-size:calc(14px * var(--t))">u</span></div><div class="lab">geregistreerde tijd</div></div>
    <div class="stat"><div class="getal">${doorloop != null ? doorloop : "—"}<span style="font-size:calc(14px * var(--t))">d</span></div><div class="lab">van aanmaken tot afronden</div></div>
    <div class="stat"><div class="getal">${uitstelTotaal}</div><div class="lab">keer uitgesteld (${uitgesteld.length} taken)</div></div>
  </div>`;

  const dagen = periode === "week" ? 7 : periode === "maand" ? 30 : 52;
  if (periode === "jaar") {
    h += sectie("Afgerond per week");
    const weken = Array.from({ length: 26 }, (_, i) => plusDagen(weekStart(v), -(25 - i) * 7));
    const n = weken.map(w => afIn(w, plusDagen(w, 7)));
    const max = Math.max(1, ...n);
    h += `<div class="card card-pad"><div class="grafiek" style="height:90px">` +
      n.map((x, i) => `<div class="kolom"><div class="staaf" style="height:${Math.round(x / max * 100)}%;opacity:${i === 25 ? 1 : .6}"></div></div>`).join("") +
      `</div><div class="klein" style="display:flex;justify-content:space-between"><span>26 weken terug</span><span>nu</span></div></div>`;
  } else {
    const reeks = Array.from({ length: dagen }, (_, i) => plusDagen(periode === "week" ? weekStart(v) : plusDagen(v, -29), i));
    const n = reeks.map(d => S.taken.filter(t => t.af && werkOk(t) && (t.afOp || "").slice(0, 10) === d).length);
    const max = Math.max(1, ...n);
    h += sectie("Afgerond per dag");
    h += `<div class="card card-pad"><div class="grafiek">` + n.map((x, i) => `
      <div class="kolom">${dagen <= 7 ? `<span class="waarde">${x || ""}</span>` : ""}
        <div class="staaf" style="height:${Math.round(x / max * 100)}%;${reeks[i] === v ? "" : "opacity:.6"}"></div>
        ${dagen <= 7 ? `<span class="dag">${DAGKORT[weekdagVan(reeks[i])]}</span>` : ""}</div>`).join("") + `</div></div>`;
  }

  const perProject = {};
  S.taken.filter(t => t.af && werkOk(t) && (t.afOp || "") >= vanaf).forEach(t => {
    const p = vind("projecten", t.projectId); const nm = p ? p.naam : "Zonder project";
    perProject[nm] = (perProject[nm] || 0) + 1;
  });
  const pp = Object.entries(perProject).sort((a, b) => b[1] - a[1]);
  if (pp.length) {
    h += sectie("Waar ging het heen?");
    h += `<div class="card card-pad">` + pp.map(([nm, n]) => `
      <div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:calc(14px * var(--t))"><span>${esc(nm)}</span><b>${n}</b></div>
      <div class="balk" style="margin-top:4px"><i style="width:${Math.round(n / pp[0][1] * 100)}%;background:var(--accent)"></i></div></div>`).join("") + `</div>`;
  }

  if (toezeggingen.length) {
    h += sectie("Kom je na wat je belooft?");
    h += `<div class="card card-pad">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="ring" style="--p:${Math.round(nagekomen / toezeggingen.length * 100)};width:58px;height:58px">
          <span style="width:46px;height:46px;font-size:calc(13px * var(--t))">${Math.round(nagekomen / toezeggingen.length * 100)}%</span></div>
        <div class="klein" style="flex:1">${nagekomen} van de ${toezeggingen.length} toezeggingen met een deadline heb je afgerond.
        ${toezeggingen.length - nagekomen ? `Er ${toezeggingen.length - nagekomen === 1 ? "staat er nog 1 open" : `staan er nog ${toezeggingen.length - nagekomen} open`}.` : "Alles nagekomen."}</div>
      </div></div>`;
  }

  const gew = S.gewoontes.filter(g => !g.archief);
  if (gew.length) {
    h += sectie("Gewoontes");
    h += `<div class="card card-pad">` + gew.map(g => {
      const n = gewoonteWeek(g), doel = gewoonteDoel(g);
      return `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:calc(14px * var(--t))">
        <span>${esc(g.naam)}</span><b>${n}/${doel} deze week</b></div>
        <div class="balk" style="margin-top:4px"><i style="width:${Math.min(100, Math.round(n / doel * 100))}%"></i></div></div>`;
    }).join("") + `</div>`;
  }

  h += `<div class="knoprij" style="margin-top:16px">
    <button class="knop rand" data-act="terugblik-log">${ico("boek")} In logboek zetten</button>
    <button class="knop rand" data-act="backup-tekst">${ico("download")} Exporteren</button></div>`;
  return h;
};

/* ---------- Logboek met zoekveld en wisbare regels ---------- */
vwLogboek = function () {
  const q = (V.logZoek || "").toLowerCase();
  let h = `<div class="zoekbalk">${ico("zoek")}
      <input type="search" id="logzoek" placeholder="Zoek in je logboek…" value="${esc(V.logZoek || "")}">
      ${q ? `<button data-act="log-zoek-wis" style="min-width:34px;min-height:34px">${ico("x", "width:16px;height:16px")}</button>` : ""}</div>
    <div class="chiprij scroll">` +
    LOGFILTERS.map(([k, l]) => `<button class="keuze" data-act="logfilter" data-f="${k}" aria-pressed="${V.logFilter === k}">${l}</button>`).join("") +
    werkChip() + `</div>
    <button class="knop breed rand" style="margin:10px 0" data-act="snelle-notitie">${ico("pen")} Notitie in logboek zetten</button>`;
  let items = S.gebeurtenissen.filter(werkOk);
  if (V.logFilter !== "alles") items = items.filter(g => g.soort === V.logFilter);
  if (q) items = items.filter(g => (g.tekst || "").toLowerCase().includes(q));
  items.sort((a, b) => a.ts < b.ts ? 1 : -1);
  if (!items.length)
    return h + `<div class="card">${leeg("📖", q ? "Niets gevonden" : "Nog niets in het logboek",
      q ? "Probeer een ander woord." : "Alles wat je afvinkt, afrondt of noteert komt hier chronologisch te staan.")}</div>`;
  h += `<div class="klein" style="margin:4px 2px 0">${items.length} regels${q ? " met “" + esc(q) + "”" : ""}</div>`;
  let dag = "";
  h += `<div class="tijdlijn">`;
  items.slice(0, 400).forEach(g => {
    const d = g.datum || g.ts.slice(0, 10);
    if (d !== dag) { dag = d; h += `</div><div class="dagkop">${esc(datumLabel(d, true))}</div><div class="tijdlijn">`; }
    const kl = { taak: "taak-af", afspraak: "afspraak", gewoonte: "gewoonte", dagboek: "dagboek" }[g.soort] || "";
    h += `<div class="tl-item ${kl}" style="display:flex;gap:8px;align-items:flex-start">
      <div style="flex:1" ${g.refId ? `data-act="log-open" data-soort="${g.soort}" data-id="${g.refId}"` : ""}>
        <div class="tl-tijd">${esc(g.ts.slice(11, 16))}${g.soort !== "taak" ? " · " + esc(g.soort) : ""}</div>
        <div class="tl-tekst">${esc(g.tekst)}</div>
      </div>
      <button class="icon-btn" style="min-width:36px;min-height:36px;color:var(--line2)" data-act="log-weg" data-id="${g.id}" aria-label="Regel verwijderen">${ico("x", "width:14px;height:14px")}</button>
    </div>`;
  });
  h += `</div>`;
  return h;
};

/* ---------- Recente zoekopdrachten ---------- */
function bewaarZoek(q) {
  q = (q || "").trim();
  if (q.length < 3) return;
  let r = (inst("recenteZoek", []) || []).filter(x => x !== q && !q.startsWith(x));
  r.unshift(q);
  zetInst("recenteZoek", r.slice(0, 8));
}
const _vwZoeken = vwZoeken;
vwZoeken = function () {
  let h = _vwZoeken();
  const recent = inst("recenteZoek", []) || [];
  if (!V.zoek.trim() && recent.length) {
    h = h.replace('<div class="klein" style="margin-top:14px">',
      `<div class="sectie"><h2>Recent gezocht</h2></div><div class="chiprij">` +
      recent.map(r => `<button class="chip groot blauw" data-act="zoek-recent" data-q="${esc(r)}">${ico("zoek")}${esc(r)}</button>`).join("") +
      `</div><div class="klein" style="margin-top:14px">`);
  }
  return h;
};

/* ---------- Extra acties ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "log-weg") {
    await verwijder("gebeurtenissen", id); teken(); toast("Regel uit logboek gehaald");
  } else if (act === "log-zoek-wis") {
    V.logZoek = ""; teken();
  } else if (act === "zoek-recent") {
    V.zoek = el.dataset.q; teken();
  } else if (act === "cl-kopieer") {
    const c = vind("checklists", id);
    const tekst = c.naam + "\n" + c.items.map(i =>
      clSectie(i) ? "\n" + clSchoon(i).toUpperCase() : (i.af ? "[x] " : "[ ] ") + i.tekst).join("\n");
    let gelukt = false;
    try { await navigator.clipboard.writeText(tekst); gelukt = true; } catch (err) {}
    if (gelukt) toast("Lijst gekopieerd");
    else { await deelOfDownload(bestandsnaam(c.naam) + ".txt", tekst, "text/plain"); toast("Lijst gedeeld als tekstbestand"); }
  }
});

/* Zoekopdrachten onthouden zodra je even stopt met typen */
const _naTekenen = naTekenen;
naTekenen = function () {
  _naTekenen();
  const z = $("#zoekveld");
  if (z) {
    const oud = z.oninput;
    z.oninput = function () {
      oud.call(this);
      clearTimeout(z._bew);
      z._bew = setTimeout(() => bewaarZoek(z.value), 1400);
    };
  }
  const lz = $("#logzoek");
  if (lz) {
    lz.oninput = () => {
      clearTimeout(lz._t);
      lz._t = setTimeout(() => {
        const p = lz.selectionStart;
        V.logZoek = lz.value; teken();
        const n = $("#logzoek");
        if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (err) {} }
      }, 320);
    };
  }
};
</script>
<script>
"use strict";
/* ==========================================================================
   32. Vandaag als interactieve tijdlijn
   Een strook door het midden: dikke lijnen zijn weken, dunne lijnen dagen.
   Vanuit de strook loopt een lijn naar een kaartje met de samenvatting.
   Vandaag staat altijd in het midden; omhoog scrollen is terug in de tijd.
   ========================================================================== */

/* soort → [label, kleurvariabele] */
const TL_SOORTEN = {
  taak:      ["Afgerond", "var(--green)"],
  afspraak:  ["Afspraken", "var(--purple)"],
  gewoonte:  ["Gewoontes", "var(--amber)"],
  dagboek:   ["Dagboek", "var(--accent)"],
  notitie:   ["Notities", "var(--muted)"],
  tijd:      ["Tijd", "var(--accent)"],
  gepland:   ["Gepland", "var(--accent)"]
};
const tlAan = soort => inst("tlFilter_" + soort, true);

V.tlTerug = 30;          // hoeveel dagen terug er getekend worden
const TL_VOORUIT = 14;   // en hoeveel dagen vooruit

/* ---------- De briefing: alles wat vandaag toe doet, in één oogopslag ----------
   Combineert het dagpaneel (taken/afspraken/gewoontes/incasso's) met een
   geld- en rookstrook, zodat je bij het openen van Vandaag meteen weet waar je staat. */
function briefingGeld() {
  const heeftFin = typeof dagbudget === "function";
  const v = vandaagISO();
  const rook = typeof rookCijfers === "function" ? rookCijfers() : null;
  const tegels = [];
  if (heeftFin) {
    const b = dagbudget(v);
    if (b.maand) tegels.push({ w: eur(b.over), l: b.over < 0 ? "over je dagbudget" : "dagbudget over", view: "financieel", alarm: b.over < 0 });
    else tegels.push({ w: eur(uitgavenOp(v)), l: "uitgegeven vandaag", view: "financieel" });
  }
  if (rook) {
    tegels.push({ w: eur(rook.perDag), l: "bespaard vandaag", view: "roken" });
    tegels.push({ w: getal(rook.sigDag), l: "sigaretten niet", view: "roken" });
  }
  if (!tegels.length) return "";
  return `<div class="dagpaneel" style="padding-top:12px;margin-top:8px">
    <div class="dp-stats" style="grid-template-columns:repeat(${tegels.length},1fr)">
      ${tegels.map(t => `<button class="dp-stat${t.alarm ? " alarm" : ""}" data-act="ga" data-view="${t.view}"><b>${t.w}</b><span>${esc(t.l)}</span></button>`).join("")}
    </div>
  </div>`;
}
/** De briefing: het bestaande dagpaneel (taken/afspraken/gewoontes/incasso's), plus — als
    die er zijn — een tweede strookje met geld en, bij het bijhouden van roken, wat dat oplevert. */
function briefing() {
  return (typeof dagPaneel === "function" ? dagPaneel() : "") + briefingGeld();
}

/** Alle items per dag, met respect voor de filters. */
function tijdlijnItems(van, tot) {
  const perDag = {};
  const zet = (d, item) => { (perDag[d] = perDag[d] || []).push(item); };
  S.gebeurtenissen.forEach(g => {
    const d = g.datum || (g.ts || "").slice(0, 10);
    if (!d || d < van || d > tot) return;
    if (!TL_SOORTEN[g.soort] || !tlAan(g.soort)) return;
    zet(d, { soort: g.soort, tijd: (g.ts || "").slice(11, 16), tekst: g.tekst, ref: g.refId, refSoort: g.soort, werk: !!g.werk });
  });
  if (tlAan("gepland")) {
    S.taken.filter(t => !t.af && t.datum && t.datum >= van && t.datum <= tot).forEach(t =>
      zet(t.datum, {
        soort: "gepland", tijd: t.tijd || "", gepland: true, taak: true,
        tekst: t.titel, ref: t.id, refSoort: "taak", werk: !!t.werk,
        kleur: t.prioriteit === 1 ? "var(--red)" : t.prioriteit === 2 ? "var(--amber)" : "var(--accent)"
      }));
    S.afspraken.filter(a => a.datum && a.datum >= van && a.datum <= tot).forEach(a =>
      zet(a.datum, {
        soort: "gepland", tijd: a.tijd || "", gepland: true,
        tekst: a.titel + (a.personen && a.personen.length ? " · " + a.personen.join(", ") : ""),
        ref: a.id, refSoort: "afspraak", werk: !!a.werk, kleur: "var(--purple)"
      }));
  }
  for (const d in perDag)
    perDag[d].sort((a, b) => (a.tijd || "99:99") < (b.tijd || "99:99") ? -1 : 1);
  return perDag;
}

let tlTeller = 0;
function tlKaart(item) {
  const i = tlTeller++;
  const kleur = item.kleur || (TL_SOORTEN[item.soort] || [])[1] || "var(--accent)";
  const kant = i % 2 === 0 ? "links" : "rechts";
  const label = item.gepland
    ? (item.tijd ? item.tijd : "gepland")
    : (item.tijd || TL_SOORTEN[item.soort][0]);
  return `<div class="tl2-rij ${kant}${item.gepland ? " gepland" : ""}" style="--dot:${kleur}">
    <button class="tl2-kaart${item.gepland ? " gepland" : ""}"
      data-act="tl-open" data-soort="${item.refSoort || item.soort}" data-id="${item.ref || ""}">
      <span class="t">${esc(label)}</span>
      <span class="s">${esc(item.tekst)}</span>
    </button>
  </div>`;
}

function tlDag(d, lijst) {
  const v = vandaagISO(), dt = parseISO(d);
  const isNu = d === v, later = d > v;
  const maandStart = dt.getDate() === 1;
  return `<div class="tl2-dag${isNu ? " nu" : ""}${later ? " later" : ""}${lijst.length ? "" : " leeg"}${maandStart ? " maandstart" : ""}"
      data-datum="${d}" data-maand="${MAANDKORT[dt.getMonth()]}" ${isNu ? 'id="tl-vandaag"' : ""}>
    <div class="tl2-tickrij">
      <button class="tl2-tick" data-act="tl-dag" data-datum="${d}"
        aria-label="Bekijk ${esc(langDatumLabel(d))} per uur">
        <b>${dt.getDate()}</b><span>${isNu ? "nu" : DAGKORT[dt.getDay()]}</span>
      </button>
    </div>
    ${lijst.map(x => tlKaart(x)).join("")}
  </div>`;
}

/* ---------- Ingeklapte weergave: horizontale strook, alleen bolletjes ---------- */
const TLM_TERUG = 7, TLM_VOORUIT = 7;
function tlMini(items) {
  const v = vandaagISO();
  const van = plusDagen(v, -TLM_TERUG), tot = plusDagen(v, TLM_VOORUIT);
  let dagen = "";
  for (let d = van; d <= tot; d = plusDagen(d, 1)) {
    const lijst = items[d] || [];
    const isNu = d === v;
    dagen += `<div class="tlm-dag${isNu ? " nu" : ""}" data-datum="${d}">
      <div class="tlm-stips">${lijst.slice(0, 7).map(x =>
        `<span class="tlm-stip" style="--dot:${x.kleur || (TL_SOORTEN[x.soort] || [])[1] || "var(--accent)"}"></span>`).join("")}
        ${lijst.length > 7 ? `<span class="tlm-meer">+${lijst.length - 7}</span>` : ""}</div>
      <div class="tlm-lijn"></div>
    </div>`;
  }
  return `<button class="tl-mini" data-act="tl-uitklap" aria-label="Tijdlijn uitklappen">
    <div class="tlm-rail">${dagen}</div>
    <div class="tlm-hint">${ico("pijlr", "width:13px;height:13px;transform:rotate(90deg)")} Tik om de tijdlijn uit te klappen</div>
  </button>`;
}

function vwVandaagTijdlijn() {
  const v = vandaagISO();
  const van = plusDagen(v, -V.tlTerug), tot = plusDagen(v, TL_VOORUIT);
  const items = tijdlijnItems(van, tot);
  tlTeller = 0;
  const laatste = S.gebeurtenissen.slice().sort((a, b) => a.ts < b.ts ? 1 : -1)[0];

/* ---------- Scrollen: vandaag in het midden, positie bewaren ---------- */
/** Scrollen zonder dat de browser er een animatie van maakt. */
function zetScroll(sc, y, zacht) {
  y = Math.max(0, Math.round(y));
  if (zacht) { try { sc.scrollTo({ top: y, behavior: "smooth" }); return; } catch (e) {} }
  sc.scrollTop = y;
}

function centreerVandaag(zacht) {
  const el = $("#tl-vandaag"), sc = $("#scherm");
  if (!el || !sc) return;
  void sc.scrollHeight;               // dwing de opmaak af voordat we meten
  const y = sc.scrollTop + el.getBoundingClientRect().top - sc.getBoundingClientRect().top
    - sc.clientHeight / 2 + el.offsetHeight / 2;
  zetScroll(sc, y, zacht);
  naarVandaagKnop();
}
function naarVandaagKnop() {
  const el = $("#tl-vandaag"), sc = $("#scherm"), knop = $("#naarvandaag");
  if (!knop) return;
  if (!el || V.view !== "vandaag") { knop.classList.remove("zicht"); return; }
  const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect();
  knop.classList.toggle("zicht", r.bottom < s.top + 40 || r.top > s.bottom - 40);
}

let tlBewaar = true;
const _teken11 = teken;

const _ga11 = ga;

};
