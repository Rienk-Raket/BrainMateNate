/* ---------- Tikacties van de tijdlijn ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "tl-filter") {
    const f = el.dataset.f;
    await zetInst("tlFilter_" + f, !tlAan(f));
    teken();
  } else if (act === "tl-modus") {
    await zetInst("tlModus", el.dataset.m);
    tlBewaar = false; teken(); tlBewaar = true;
    if (el.dataset.m === "tijdlijn") { centreerVandaag(false); requestAnimationFrame(() => centreerVandaag(false)); }
    else { $("#scherm").scrollTop = 0; $("#naarvandaag").classList.remove("zicht"); }
  } else if (act === "tl-verder") {
    const sc = $("#scherm"), y = sc.scrollTop, hoogteVoor = sc.scrollHeight;
    V.tlTerug += 60;
    tlBewaar = false; teken(); tlBewaar = true;
    sc.scrollTop = y + (sc.scrollHeight - hoogteVoor);   // blijf op dezelfde plek staan
    toast("Nog 60 dagen terug geladen");
  } else if (act === "tl-dag") {
    tril(8);
    ga("dag", el.dataset.datum);
  } else if (act === "tl-uitklap") {
    const rail = el.closest(".tl-mini");
    if (!rail || rail.classList.contains("tl-mini-weg")) return;
    tril(6);
    rail.classList.add("tl-mini-weg");
    setTimeout(() => {

    tlBewaar = false; teken(); tlBewaar = true;
    $("#scherm").scrollTop = 0;

    if (!id) return;
    if (soort === "taak") { if (vind("taken", id)) openTaakBlad(id); }

    else if (soort === "gewoonte") ga("gewoontes");
    else if (soort === "tijd") ga("tijd");
  }
});

<script>
"use strict";
/* ==========================================================================
   33. Dagpaneel, week- en maandoverzicht, en de vooruitblik
   ========================================================================== */

/** Hoeveel minuten kost een afspraak? */
function afspraakMinuten(a) {
  if (!a.tijd) return 0;
  if (a.eindTijd) {
    const [u1, m1] = a.tijd.split(":").map(Number), [u2, m2] = a.eindTijd.split(":").map(Number);
    return Math.max(15, (u2 * 60 + m2) - (u1 * 60 + m1));
  }
  return 60;
}

/** Alles wat er over één dag te zeggen valt. */
function dagCijfers(d) {
  const takenOpen = S.taken.filter(t => !t.af && t.datum === d);
  const af = S.taken.filter(t => t.af && (t.afOp || "").slice(0, 10) === d);
  const afspraken = S.afspraken.filter(a => a.datum === d);
  const deadlines = S.afspraken.filter(a => a.deadline === d && !a.uitkomst);
  const gew = gewoontesVoor(d);
  const gewAf = gew.filter(g => gewoonteAf(g.id, d)).length;
  const minuten = takenOpen.reduce((s, t) => s + (t.duur || 0), 0)
    + afspraken.reduce((s, a) => s + afspraakMinuten(a), 0);
  return {
    datum: d, takenOpen, af, afspraken, deadlines,
    open: takenOpen.length, klaar: af.length, afspr: afspraken.length,
    gew: gew.length, gewAf, minuten,
    tijd: S.tijdlog.filter(l => l.datum === d).reduce((s, l) => s + l.seconden, 0),
    log: S.gebeurtenissen.filter(g => (g.datum || (g.ts || "").slice(0, 10)) === d).length
  };
}

/* ---------- Het paneel bovenaan het Nieuw-scherm ---------- */
function dagPaneel() {
  const v = vandaagISO(), c = dagCijfers(v);
  const laat = openTaken().filter(t => t.datum && t.datum < v).length
    + S.afspraken.filter(a => afspraakLaat(a)).length;
  const totaal = c.open + c.klaar;
  const pct = totaal ? Math.round(c.klaar / totaal * 100) : 0;
  const nu = nuTijd();
  const volgende = []
    .concat(c.afspraken.filter(a => a.tijd && a.tijd >= nu).map(a => ({ t: a.tijd, s: a.titel, soort: "afspraak", id: a.id })))
    .concat(c.takenOpen.filter(t => t.tijd && t.tijd >= nu).map(t => ({ t: t.tijd, s: t.titel, soort: "taak", id: t.id })))
    .sort((a, b) => a.t < b.t ? -1 : 1)[0];

  const ws = weekStart(v);
  const week = Array.from({ length: 7 }, (_, i) => {
    const d = plusDagen(ws, i), w = dagCijfers(d);
    return { d, n: d <= v ? w.klaar + w.log : w.open + w.afspr, toekomst: d > v };
  });
  const max = Math.max(1, ...week.map(w => w.n));

  return `<div class="dagpaneel">
    <div class="dp-kop">
      <div style="flex:1;min-width:0">
        <div class="dp-datum">${esc(langDatumLabel(v).replace(/^\w/, m => m.toUpperCase()))}</div>
        <div class="dp-sub">week ${weekNummer(v)} · ${totaal ? `${c.klaar} van de ${totaal} gedaan` : "nog niets gepland"}${c.minuten ? " · " + duurTekst(c.minuten) + " ingepland" : ""}</div>
      </div>
      <div class="ring" style="--p:${pct}"><span>${totaal ? pct + "%" : "–"}</span></div>
    </div>

    <div class="dp-stats">
      <button class="dp-stat" data-act="ga" data-view="vandaag"><b>${c.open}</b><span>te doen</span></button>
      <button class="dp-stat" data-act="ga" data-view="afspraken"><b>${c.afspr}</b><span>afspra${c.afspr === 1 ? "ak" : "ken"}</span></button>
      <button class="dp-stat" data-act="ga" data-view="gewoontes"><b>${c.gewAf}/${c.gew}</b><span>gewoontes</span></button>
      ${laat
        ? `<button class="dp-stat alarm" data-act="ga" data-view="vandaag"><b>${laat}</b><span>te laat</span></button>`
        : `<button class="dp-stat" data-act="ga" data-view="logboek"><b>${c.klaar}</b><span>afgerond</span></button>`}
    </div>

    ${volgende ? `<button class="dp-volgende" data-act="dp-volgende" data-soort="${volgende.soort}" data-id="${volgende.id}">
      ${ico("klok")}<span class="tijd">${esc(volgende.t)}</span><span class="wat">${esc(volgende.s)}</span>${ico("pijlr")}</button>` : ""}

    <div class="dp-weekstrip">
      ${week.map(w => `<button class="${w.d === v ? "nu" : ""}${w.toekomst ? " toekomst" : ""}"
        data-act="ov-dag" data-datum="${w.d}" aria-label="${esc(datumLabel(w.d, true))}">
        <span class="st" style="height:${Math.max(6, Math.round(w.n / max * 100))}%"></span>
        <span class="dg">${DAGKORT[weekdagVan(w.d)]}</span></button>`).join("")}
    </div>

    <div class="dp-knoppen">
      <button class="dp-knop" data-act="ov" data-m="week">${ico("grafiek")} Week</button>
      <button class="dp-knop" data-act="ov" data-m="maand">${ico("komend")} Maand</button>
      <button class="dp-knop" data-act="ov" data-m="vooruit">${ico("verder")} Vooruit</button>
    </div>
  </div>`;
}

/* ---------- Het overzicht: week / maand / vooruitblik ---------- */
V.ovModus = "week";
V.ovAnker = null;   // week- of maandanker, null = deze

function ovDagRij(d) {
  const v = vandaagISO(), c = dagCijfers(d), dt = parseISO(d);
  const delen = [
    ["var(--green)", c.klaar, "afgerond"],
    ["var(--accent)", c.open, d < v ? "blijven liggen" : "te doen"],
    ["var(--purple)", c.afspr, "afspraken"],
    ["var(--amber)", c.gewAf, "gewoontes"]

  const totaal = delen.reduce((s, x) => s + x[1], 0);
  return `<button class="ov-dag${d === v ? " nu" : ""}${totaal ? "" : " vrij"}" data-act="ov-dag" data-datum="${d}">

    <span class="mid">
      <span class="lbl">${totaal
        ? delen.map(x => `${x[1]} ${x[2]}`).join(" · ")
        : (d > v ? "nog vrij" : "niets gelogd")}${c.minuten ? ` · ${duurTekst(c.minuten)}` : ""}</span>
      ${totaal ? `<span class="balkjes">${delen.map(x =>
        `<i class="bj" style="background:${x[0]};flex:${x[1]}"></i>`).join("")}</span>` : ""}
    </span>

function ovWeek() {
  const v = vandaagISO();
  const start = V.ovAnker || weekStart(v);
  const dagen = Array.from({ length: 7 }, (_, i) => plusDagen(start, i));
  const c = dagen.map(dagCijfers);
  const klaar = c.reduce((s, x) => s + x.klaar, 0);
  const tijd = c.reduce((s, x) => s + x.tijd, 0);
  const afspr = c.reduce((s, x) => s + x.afspr, 0);
  const open = c.reduce((s, x) => s + x.open, 0);
  const drukste = c.slice().sort((a, b) => (b.klaar + b.afspr + b.log) - (a.klaar + a.afspr + a.log))[0];

    <button class="icon-btn" data-act="ov-schuif" data-n="7">${ico("pijlr")}</button></div>`;
  h += `<div class="stats" style="grid-template-columns:repeat(4,1fr)">

  h += `<div class="knoprij" style="margin-top:12px">

function ovMaand() {

  const maandDagen = Array.from({ length: dagenInMaand }, (_, i) =>
    `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(i + 1)}`);
  const cijfers = maandDagen.map(dagCijfers);
  const max = Math.max(1, ...cijfers.map(c => c.klaar + c.afspr + c.open));

  let h = `<div class="ov-nav">
    <button class="icon-btn" data-act="ov-schuif" data-n="-30">${ico("pijll")}</button>

    <button class="icon-btn" data-act="ov-schuif" data-n="30">${ico("pijlr")}</button></div>`;
  h += `<div class="card card-pad">

      data-act="ov-dag" data-datum="${dag}" aria-label="${esc(datumLabel(dag, true))}">
      ${dt.getDate()}${n ? `<span class="vul" style="height:${Math.round(8 + n / max * 62)}%;opacity:${(0.25 + n / max * 0.6).toFixed(2)}"></span>` : ""}

    <div class="stat"><div class="getal">${cijfers.filter(x => x.klaar).length}</div><div class="lab">actieve dagen</div></div>
  </div>`;
  if (beste && beste.klaar) h += `<div class="card card-pad klein">
    <p><b>Beste dag:</b> ${esc(datumLabel(beste.datum, true))} met ${beste.klaar} afgeronde taken.</p>
    <p><b>Gemiddeld:</b> ${(klaar / dagenInMaand).toFixed(1)} per dag.</p></div>`;

/** Herhalende taken die binnen zoveel dagen terugkomen. */
function komendeHerhalingen(dagen) {
  const v = vandaagISO(), grens = plusDagen(v, dagen), uit = [];
  const perReeks = {};

      // Een reeks bestaat uit echte keren: neem die gewoon over (max. 8 per reeks).
      if (t.datum && t.datum > v && t.datum <= grens && (perReeks[t.reeksId] = (perReeks[t.reeksId] || 0) + 1) <= 8)
        uit.push({ datum: t.datum, titel: t.titel, id: t.id, herhaal: herhaalTekst(t.herhaal) });
      return;
    }
    let d = t.datum || v, n = 0;
    while (d && d <= grens && n < 8) {
      if (d > v) uit.push({ datum: d, titel: t.titel, id: t.id, herhaal: herhaalTekst(t.herhaal) });
      d = volgendeDatum(d, t.herhaal); n++;
    }
  });
  return uit.sort((a, b) => a.datum < b.datum ? -1 : 1);
}

function ovVooruit() {
  const v = vandaagISO(), dagen = 14;
  const reeks = Array.from({ length: dagen }, (_, i) => plusDagen(v, i));
  const c = reeks.map(dagCijfers);
  const max = Math.max(60, ...c.map(x => x.minuten));
  const totaalMin = c.reduce((s, x) => s + x.minuten, 0);
  const drukste = c.slice().sort((a, b) => b.minuten - a.minuten)[0];
  const vrij = c.filter(x => !x.minuten && !x.open && !x.afspr);
  const deadlines = S.afspraken.filter(a => !a.uitkomst && a.deadline && a.deadline >= v && a.deadline <= plusDagen(v, 30))
    .sort((a, b) => a.deadline < b.deadline ? -1 : 1);
  const herh = komendeHerhalingen(dagen);
  const risico = S.gewoontes.filter(g => !g.archief && g.perWeek)
    .map(g => ({ g, n: gewoonteWeek(g), doel: g.perWeek, rest: 7 - ((weekdagVan(v) + 6) % 7) }))
    .filter(x => x.n < x.doel);

  let h = `<div class="card card-pad">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b style="font-size:calc(15px * var(--t))">Komende 14 dagen</b>
      <span class="klein">${duurTekst(totaalMin) || "niets ingepland"}</span>
    </div>
    <div class="vb-staaf">
      ${c.map((x, i) => {
        const h2 = Math.max(4, Math.round(x.minuten / max * 100));
        const kl = x.minuten > 360 ? " vol" : x.minuten > 210 ? " druk" : "";
        return `<button class="${i === 0 ? "nu" : ""}" data-act="ov-dag" data-datum="${x.datum}"
          aria-label="${esc(datumLabel(x.datum, true))}: ${duurTekst(x.minuten) || "vrij"}">
          <span class="st${kl}" style="height:${h2}%"></span>
          <span class="dg">${parseISO(x.datum).getDate()}</span></button>`;
      }).join("")}
    </div>
    <div class="klein" style="margin-top:8px">
      Hoogte = geschatte bezetting per dag: duur van je taken plus de lengte van je afspraken.
      ${drukste && drukste.minuten ? `<br><b>Drukste dag:</b> ${esc(datumLabel(drukste.datum, true))} met ${duurTekst(drukste.minuten)}.` : ""}
      ${vrij.length ? `<br><b>Nog helemaal vrij:</b> ${vrij.slice(0, 4).map(x => esc(datumLabel(x.datum))).join(", ")}${vrij.length > 4 ? ` en ${vrij.length - 4} meer` : ""}.` : ""}
    </div>
  </div>`;

  const metIets = c.filter(x => x.open || x.afspr || x.deadlines.length);
  h += sectie("Wat er staat te gebeuren", metIets.length);
  h += metIets.length
    ? `<div class="card">${metIets.map(x => ovDagRij(x.datum)).join("")}</div>`
    : `<div class="card">${leeg("🌤️", "De komende twee weken is nog leeg", "Mooi moment om iets vooruit te plannen.")}</div>`;

  if (deadlines.length) {
    h += sectie("Deadlines", deadlines.length, `<button class="actie" data-act="ga" data-view="afspraken">Alles</button>`);
    h += `<div class="card">${deadlines.slice(0, 8).map(a => {
      const dagenTot = dagVerschil(a.deadline, v);
      return `<button class="rijknop" data-act="ga" data-view="afspraak" data-param="${a.id}">
        ${ico("ketting", "width:18px;height:18px;color:var(--accent)")}
        <span class="nm">${esc(a.titel)}<span class="klein" style="display:block">${esc((a.personen || []).join(", ") || "zonder personen")}</span></span>
        <span class="rechts"><span class="chip ${dagenTot <= 2 ? "rood" : dagenTot <= 7 ? "oranje" : ""}">${dagenTot === 0 ? "vandaag" : "over " + dagenTot + " d"}</span></span>
      </button>`;
    }).join("")}</div>`;
  }

  if (herh.length) {
    h += sectie("Komt vanzelf terug", herh.length);
    h += `<div class="card">${herh.slice(0, 10).map(x =>
      `<button class="rijknop" data-act="open-taak" data-id="${x.id}">
        ${ico("herhaal", "width:18px;height:18px;color:var(--purple)")}
        <span class="nm">${esc(x.titel)}<span class="klein" style="display:block">${esc(x.herhaal)}</span></span>
        <span class="rechts">${esc(datumLabel(x.datum))}</span></button>`).join("")}</div>`;
  }

  if (risico.length) {
    h += sectie("Gewoontes die aandacht vragen", risico.length);
    h += `<div class="card card-pad">${risico.map(x =>
      `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:calc(14px * var(--t))">
        <span>${esc(x.g.naam)}</span><b>${x.n}/${x.doel} · nog ${x.rest} dag${x.rest === 1 ? "" : "en"}</b></div>
      <div class="balk" style="margin-top:4px"><i style="width:${Math.round(x.n / x.doel * 100)}%"></i></div></div>`).join("")}</div>`;
  }

  h += `<div class="knoprij" style="margin-top:12px">
    <button class="knop rand" data-act="ga" data-view="komend">${ico("komend")} Komende 7 dagen</button>
    <button class="knop rand" data-act="ga" data-view="kalender">${ico("komend")} Kalender</button></div>`;
  return h;
}

function vwOverzicht() {
  const m = V.ovModus || "week";
  let h = `<div class="segment" style="margin:10px 0 2px">
    ${[["week", "Week"], ["maand", "Maand"], ["vooruit", "Vooruitblik"]].map(([k, l]) =>
      `<button data-act="ov" data-m="${k}" aria-pressed="${m === k}">${esc(l)}</button>`).join("")}</div>`;
  h += m === "maand" ? ovMaand() : m === "vooruit" ? ovVooruit() : ovWeek();
  return h;
}

/* ---------- Eén dag in detail ---------- */
function dagBlad(d) {
  const c = dagCijfers(d), v = vandaagISO();
  const log = S.gebeurtenissen.filter(werkOk).filter(g => (g.datum || (g.ts || "").slice(0, 10)) === d)
    .sort((a, b) => a.ts < b.ts ? -1 : 1);
  const db = S.dagboek.find(x => x.datum === d);
  let h = `<div class="chiprij" style="margin:4px 0 12px">
    ${c.open ? `<span class="chip blauw">${ico("check")}${c.open} te doen</span>` : ""}
    ${c.klaar ? `<span class="chip groen">${ico("check")}${c.klaar} afgerond</span>` : ""}
    ${c.afspr ? `<span class="chip paars">${ico("groep")}${c.afspr} afspra${c.afspr === 1 ? "ak" : "ken"}</span>` : ""}
    ${c.gew ? `<span class="chip oranje">${ico("vuur")}${c.gewAf}/${c.gew} gewoontes</span>` : ""}
    ${c.minuten ? `<span class="chip">${ico("tijd")}${duurTekst(c.minuten)} ingepland</span>` : ""}
    ${c.tijd ? `<span class="chip">${ico("klok")}${secTekst(c.tijd)} geregistreerd</span>` : ""}
  </div>`;
  if (c.afspraken.length) h += `<div class="sectie"><h2>Afspraken</h2></div><div class="card">${c.afspraken.map(afspraakRij).join("")}</div>`;
  if (c.takenOpen.length) h += `<div class="sectie"><h2>Nog te doen</h2></div>${takenLijst(c.takenOpen.sort(sorteerTaken))}`;
  if (c.af.length) h += `<div class="sectie"><h2>Afgerond</h2></div>${takenLijst(c.af, { notitie: false })}`;
  if (db) h += `<div class="sectie"><h2>Dagboek</h2></div>
    <button class="card card-pad" style="width:100%;text-align:left" data-act="dagboek-open" data-datum="${d}">
      <div style="font-size:calc(21px * var(--t))">${db.stemming ? STEMMINGEN[db.stemming - 1] : "📝"}</div>
      <div class="klein" style="margin-top:4px;white-space:pre-wrap">${esc((db.tekst || "").slice(0, 300))}</div></button>`;
  if (log.length) h += `<div class="sectie"><h2>Logboek</h2></div><div class="card card-pad">
    ${log.map(g => `<div style="display:flex;gap:9px;padding:5px 0;font-size:calc(13.5px * var(--t))">
      <span class="mono" style="color:var(--faint);flex:0 0 auto">${esc((g.ts || "").slice(11, 16))}</span>
      <span>${esc(g.tekst)}</span></div>`).join("")}</div>`;
  if (!c.afspraken.length && !c.takenOpen.length && !c.af.length && !log.length && !db)
    h += `<div class="card">${leeg(d > v ? "🌤️" : "🍃", d > v ? "Nog niets gepland" : "Niets gelogd op deze dag")}</div>`;
  h += `<div class="knoprij" style="margin-top:14px">
    <button class="knop primair" data-act="dagblad-nieuw" data-datum="${d}">${ico("plus")} Iets vastleggen</button>
    <button class="knop rand" data-act="dagblad-tijdlijn" data-datum="${d}">${ico("logboek")} In de tijdlijn</button></div>`;
  bladOpen(langDatumLabel(d)[0].toUpperCase() + langDatumLabel(d).slice(1), h);
}

/* ---------- Acties ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "ov") {
    V.ovModus = el.dataset.m;
    V.ovAnker = null;
    if (V.view === "overzicht") teken(); else ga("overzicht");
  } else if (act === "ov-schuif") {
    const n = +el.dataset.n;
    const basis = V.ovAnker || (V.ovModus === "maand" ? vandaagISO() : weekStart(vandaagISO()));
    V.ovAnker = Math.abs(n) === 30 ? plusMaanden(basis, n > 0 ? 1 : -1) : plusDagen(basis, n);
    teken();
  } else if (act === "ov-dag") {
    dagBlad(el.dataset.datum);
  } else if (act === "dp-volgende") {
    if (el.dataset.soort === "afspraak") ga("afspraak", el.dataset.id);
    else openTaakBlad(el.dataset.id);
  } else if (act === "dagblad-nieuw") {
    const d = el.dataset.datum;
    bladSluit();
    setTimeout(() => openTaakBlad(null, { datum: d }), 280);
  } else if (act === "dagblad-tijdlijn") {
    const d = el.dataset.datum;
    bladSluit();
    await zetInst("tlModus", "tijdlijn");
    setTimeout(() => {
      ga("vandaag");
      setTimeout(() => {
        const rij = document.querySelector(`.tl2-dag[data-datum="${d}"]`), sc = $("#scherm");
        if (rij) zetScroll(sc, sc.scrollTop + rij.getBoundingClientRect().top - sc.getBoundingClientRect().top - sc.clientHeight / 2, false);
      }, 60);
    }, 260);
  }
});
</script>
<script>
"use strict";
/* ==========================================================================
   34. Eén dag uitvergroot: agenda per uur
   Tik in de tijdlijn op een dagnummer en je zoomt in op die dag.
   De vastlegopties blijven bereikbaar via de knop Vastleggen.
   ========================================================================== */
const UUR_HOOGTE = 58;                       // pixels per uur
const inMin = t => { const [u, m] = String(t).split(":").map(Number); return u * 60 + (m || 0); };
const uitMin = m => pad(Math.floor(m / 60) % 24) + ":" + pad(Math.round(m) % 60);

/** Alles op een dag, gesplitst in items met een tijd en items zonder. */
function agendaItems(d) {
  const metTijd = [], heleDag = [];
  S.afspraken.filter(a => a.datum === d).forEach(a => {
    const basis = {
      titel: a.titel, soort: "afspraak", id: a.id, kleur: "var(--purple)",
      sub: [a.plek, (a.personen || []).join(", ")].filter(Boolean).join(" · ")
    };
    if (a.tijd) metTijd.push(Object.assign({ start: inMin(a.tijd), duur: afspraakMinuten(a) }, basis));
    else heleDag.push(basis);
  });
  S.afspraken.filter(a => a.deadline === d && !a.uitkomst && a.datum !== d).forEach(a =>
    heleDag.push({ titel: "Deadline: " + a.titel, soort: "afspraak", id: a.id, kleur: "var(--amber)", sub: (a.personen || []).join(", ") }));
  S.taken.filter(t => t.datum === d).forEach(t => {
    const kleur = t.af ? "var(--green)" : t.prioriteit === 1 ? "var(--red)" : t.prioriteit === 2 ? "var(--amber)" : "var(--accent)";
    const basis = { titel: t.titel, soort: "taak", id: t.id, kleur, af: t.af, sub: t.duur ? duurTekst(t.duur) : "" };
    if (t.tijd) metTijd.push(Object.assign({ start: inMin(t.tijd), duur: t.duur || 30 }, basis));
    else heleDag.push(basis);
  });
  S.taken.filter(t => t.af && (t.afOp || "").slice(0, 10) === d && t.datum !== d).forEach(t =>
    heleDag.push({ titel: t.titel, soort: "taak", id: t.id, kleur: "var(--green)", af: true, sub: "afgerond" }));
  gewoontesVoor(d).forEach(g =>
    heleDag.push({ titel: g.naam, soort: "gewoonte", id: g.id, kleur: "var(--amber)", af: gewoonteAf(g.id, d), sub: gewoonteAf(g.id, d) ? "gedaan" : "nog te doen" }));
  const db = S.dagboek.find(x => x.datum === d);
  if (db) heleDag.push({ titel: "Dagboek" + (db.stemming ? " " + STEMMINGEN[db.stemming - 1] : ""), soort: "dagboek", id: db.id, kleur: "var(--accent)", sub: (db.tekst || "").slice(0, 40) });
  metTijd.sort((a, b) => a.start - b.start || b.duur - a.duur);
  return { metTijd, heleDag };
}

/** Overlappende items naast elkaar zetten. */
function verdeelBanen(items) {
  const eind = x => x.start + Math.max(20, x.duur);
  let groep = [], groepEind = -1;
  const groepen = [];
  items.forEach(it => {
    if (it.start >= groepEind && groep.length) { groepen.push(groep); groep = []; }
    groep.push(it);
    groepEind = Math.max(groepEind, eind(it));
  });
  if (groep.length) groepen.push(groep);
  groepen.forEach(g => {
    const banen = [];
    g.forEach(it => {
      let b = banen.findIndex(tot => tot <= it.start);
      if (b === -1) { b = banen.length; banen.push(0); }
      banen[b] = eind(it);
      it.baan = b;
    });
    g.forEach(it => { it.banen = banen.length; });
  });
  return items;
}

function vwDag() {
  const d = V.param || vandaagISO(), v = vandaagISO();
  const { metTijd, heleDag } = agendaItems(d);
  const c = dagCijfers(d);

  let van = 7, tot = 22;
  metTijd.forEach(it => {
    van = Math.min(van, Math.floor(it.start / 60));
    tot = Math.max(tot, Math.ceil((it.start + Math.max(20, it.duur)) / 60));
  });
  if (d === v) { const u = new Date().getHours(); van = Math.min(van, u); tot = Math.max(tot, u + 1); }
  van = clamp(van, 0, 23); tot = clamp(Math.max(tot, van + 4), 1, 24);
  const beginMin = van * 60, uren = tot - van;

  let h = `<div class="ov-nav" style="margin-top:8px">
    <button class="icon-btn" data-act="dag-schuif" data-n="-1" aria-label="Vorige dag">${ico("pijll")}</button>
    <b>${esc(DAGNAMEN[parseISO(d).getDay()])} ${parseISO(d).getDate()} ${esc(MAANDNAMEN[parseISO(d).getMonth()])}</b>
    <button class="icon-btn" data-act="dag-schuif" data-n="1" aria-label="Volgende dag">${ico("pijlr")}</button>
  </div>`;

  h += `<div class="chiprij scroll" style="margin-bottom:4px">
    ${d !== v ? `<button class="keuze" data-act="ga" data-view="dag" data-param="${v}">${ico("vandaag")} Naar vandaag</button>` : ""}
    ${c.open ? `<span class="chip blauw">${ico("check")}${c.open} te doen</span>` : ""}
    ${c.klaar ? `<span class="chip groen">${ico("check")}${c.klaar} afgerond</span>` : ""}
    ${c.afspr ? `<span class="chip paars">${ico("groep")}${c.afspr} afspra${c.afspr === 1 ? "ak" : "ken"}</span>` : ""}
    ${c.minuten ? `<span class="chip">${ico("tijd")}${duurTekst(c.minuten)} ingepland</span>` : ""}
    ${c.tijd ? `<span class="chip">${ico("klok")}${secTekst(c.tijd)} gewerkt</span>` : ""}
  </div>`;

  if (heleDag.length) {
    h += `<div class="ag-heledag">
      <span class="lb">Hele dag</span>
      <div class="rij">${heleDag.map(x =>
        `<button class="ag-chip${x.af ? " af" : ""}" style="--k:${x.kleur}"
           data-act="ag-open" data-soort="${x.soort}" data-id="${x.id}">
           ${esc(x.titel)}${x.sub ? `<small>${esc(x.sub)}</small>` : ""}</button>`).join("")}</div>
    </div>`;
  }

  verdeelBanen(metTijd);
  h += `<div class="ag-wrap" style="--uh:${UUR_HOOGTE}px">
    <div class="ag-uren">
      ${Array.from({ length: uren }, (_, i) => {
        const u = van + i;
        return `<div class="ag-uur">
          <span class="lb">${pad(u)}:00</span>
          <button class="vak" data-act="ag-leeg" data-datum="${d}" data-tijd="${pad(u)}:00"
            aria-label="Iets vastleggen om ${pad(u)}:00"></button></div>`;
      }).join("")}
    </div>
    <div class="ag-lagen">
      ${metTijd.map(it => {
        const top = (it.start - beginMin) / 60 * UUR_HOOGTE;
        const hoog = Math.max(26, Math.max(20, it.duur) / 60 * UUR_HOOGTE - 3);
        const breed = 100 / (it.banen || 1);
        return `<button class="ag-item${it.af ? " af" : ""}${hoog < 46 ? " kort" : ""}" style="--k:${it.kleur};top:${top.toFixed(1)}px;height:${hoog.toFixed(1)}px;left:${(it.baan * breed).toFixed(2)}%;width:calc(${breed.toFixed(2)}% - 4px)"
          data-act="ag-open" data-soort="${it.soort}" data-id="${it.id}">
          <span class="tt">${esc(uitMin(it.start))}${it.duur >= 45 ? "–" + esc(uitMin(it.start + it.duur)) : ""}</span>
          <span class="ss">${esc(it.titel)}</span>
          ${hoog > 52 && it.sub ? `<span class="tt">${esc(it.sub)}</span>` : ""}
        </button>`;
      }).join("")}
    </div>
    ${d === v && new Date().getHours() * 60 + new Date().getMinutes() >= beginMin && new Date().getHours() < tot
      ? `<div class="ag-nu" style="top:${((new Date().getHours() * 60 + new Date().getMinutes()) - beginMin) / 60 * UUR_HOOGTE}px"></div>` : ""}
  </div>`;

  h += `<div class="knoprij" style="margin-top:14px">
    <button class="knop primair" data-act="dag-vastleg" data-datum="${d}">${ico("plus")} Vastleggen op deze dag</button>
  </div>
  <div class="knoprij" style="margin-top:9px">
    <button class="knop rand" data-act="dag-tijdlijn" data-datum="${d}">${ico("logboek")} In de tijdlijn</button>
    <button class="knop rand" data-act="ov-dag" data-datum="${d}">${ico("lijst")} Als lijst</button>
  </div>
  <div class="klein" style="text-align:center;margin-top:10px">Tik op een leeg uur om er meteen iets in te zetten.</div>`;
  return h;
}

/** Het keuzemenu dat je eerder kreeg bij een tik op een dag — nu ook met tijd. */
function vastlegOpties(datum, tijd) {
  const opties = [
    ["taak", tijd ? `Taak om ${tijd}` : "Taak op deze dag", "check"],
    ["gesprek", tijd ? `Afspraak om ${tijd}` : "Afspraak op deze dag", "groep"],
    ["toezegging", "Toezegging met deze deadline", "ketting"],
    ["dagboek", "Dagboeknotitie", "boek"],
    ["notitie", "Notitie in logboek", "pen"],
    ["uur", "Deze dag per uur bekijken", "klok"]
  ];
  bladOpen(langDatumLabel(datum)[0].toUpperCase() + langDatumLabel(datum).slice(1) + (tijd ? " · " + tijd : ""),
    `<div class="card">${opties.map(([s, lab, ic]) =>
      `<button class="rijknop" data-vastleg="${s}" data-datum="${datum}" data-tijd="${tijd || ""}">
        ${ico(ic, "width:19px;height:19px;color:var(--accent)")}<span class="nm">${esc(lab)}</span>
        ${ico("pijlr", "width:15px;height:15px;color:var(--line2)")}</button>`).join("")}</div>`);
  $("#bladinhoud").onclick = ev => {
    const k = ev.target.closest("[data-vastleg]"); if (!k) return;
    const s = k.dataset.vastleg, d = k.dataset.datum, t = k.dataset.tijd || null;
    bladSluit();
    setTimeout(() => {
      if (s === "taak") openTaakBlad(null, { datum: d, tijd: t });
      else if (s === "gesprek") openAfspraakBlad(null, { soort: "gesprek", datum: d, tijd: t || "" });
      else if (s === "toezegging") openAfspraakBlad(null, { soort: "toezegging", deadline: d });
      else if (s === "dagboek") openDagboekBlad(d);
      else if (s === "uur") ga("dag", d);
      else bladVraag("Notitie in logboek", "", "Wat wil je vastleggen?", async tekst => {
        if (!tekst) return;
        const g = await logGebeurtenis("notitie", tekst);
        g.datum = d; await bewaar("gebeurtenissen", g);
        teken(); toast("In je logboek gezet");
      }, true);
    }, 280);
  };
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "dag-schuif") {
    ga("dag", plusDagen(V.param || vandaagISO(), +el.dataset.n), true);
  } else if (act === "dag-vastleg") {
    vastlegOpties(el.dataset.datum, null);
  } else if (act === "ag-leeg") {
    vastlegOpties(el.dataset.datum, el.dataset.tijd);
  } else if (act === "ag-open") {
    const s = el.dataset.soort, id = el.dataset.id;
    if (s === "taak" && vind("taken", id)) openTaakBlad(id);
    else if (s === "afspraak" && vind("afspraken", id)) ga("afspraak", id);
    else if (s === "dagboek") { const x = vind("dagboek", id); if (x) openDagboekBlad(x.datum); }
    else if (s === "gewoonte") {
      const datum = V.param || vandaagISO();
      if (gewoonteAf(id, datum)) await verwijder("gewoontelog", id + "|" + datum);
      else {
        await bewaar("gewoontelog", { id: id + "|" + datum, gewoonteId: id, datum, ts: new Date().toISOString() });
        const g = vind("gewoontes", id);
        await logGebeurtenis("gewoonte", "Gewoonte volbracht: " + (g ? g.naam : ""), id);
      }
      tril(9); teken();
    }
  } else if (act === "dag-tijdlijn") {
    const d = el.dataset.datum;
    await zetInst("tlModus", "tijdlijn");
    ga("vandaag");
    setTimeout(() => {
      const rij = document.querySelector(`.tl2-dag[data-datum="${d}"]`), sc = $("#scherm");
      if (rij) zetScroll(sc, sc.scrollTop + rij.getBoundingClientRect().top - sc.getBoundingClientRect().top - sc.clientHeight / 2, false);
    }, 60);
  }
});
</script>
<script>
"use strict";
/* ==========================================================================
   35. Werk — een eigen ruimte voor meetings, plannen, strategie en reflectie
   Alles wat je hier vastlegt krijgt de markering `werk: true`. Met het
   werkfilter in de kopbalk zet je die informatie overal in de app aan of uit.
   ========================================================================== */

/* ---------- Het werkfilter ---------- */
const WERKSTANDEN = [
  ["alles", "Werk", "Alles zichtbaar"],
  ["alleen", "Alleen werk", "Alleen werkitems"],
  ["uit", "Werk uit", "Werk verborgen"]
];
const werkStand = () => inst("werkFilter", "alles");
/** Mag dit item nu zichtbaar zijn? */
function werkOk(x) {
  const f = werkStand();
  if (f === "alles") return true;
  const w = !!(x && x.werk);
  return f === "alleen" ? w : !w;
}
async function werkFilterWissel(naar) {
  const i = WERKSTANDEN.findIndex(s => s[0] === werkStand());
  const nieuw = naar || WERKSTANDEN[(i + 1) % 3][0];
  await zetInst("werkFilter", nieuw);
  werkPilBij();
  teken();
  toast(WERKSTANDEN.find(s => s[0] === nieuw)[2]);
}
function werkPilBij() {
  const p = $("#werkpil");
  if (!p) return;
  const f = werkStand();
  p.dataset.f = f;
  $("span", p).textContent = WERKSTANDEN.find(s => s[0] === f)[1];
}
$("#werkpil").onclick = () => werkFilterWissel();

/** Filterknop die je overal in een chiprij kunt zetten. */
function werkChip(cls) {
  const f = werkStand();
  const lab = { alles: "Werk: alles", alleen: "Alleen werk", uit: "Werk uit" }[f];
  return `<button class="${cls || "keuze"}" data-act="werk-cycle" aria-pressed="${f !== "alles"}"
    style="${f === "alleen" ? "color:var(--werk);border-color:var(--werk);background:var(--werk-zacht)" : ""}">
    ${ico("koffer", "width:14px;height:14px")} ${lab}</button>`;
}

/* ---------- Het filter overal toepassen ---------- */
const _openTaken14 = openTaken;
openTaken = () => _openTaken14().filter(werkOk);
const _takenVanProject14 = takenVanProject;
takenVanProject = id => _takenVanProject14(id).filter(werkOk);
const _filterTaken14 = filterTaken;
filterTaken = (q, bron) => _filterTaken14(q, bron).filter(werkOk);
const _tijdlijnItems14 = tijdlijnItems;
tijdlijnItems = (van, tot) => {
  const uit = _tijdlijnItems14(van, tot);
  for (const d in uit) {
    uit[d] = uit[d].filter(it => {
      const bron = it.refSoort === "taak" ? vind("taken", it.ref)
        : it.refSoort === "afspraak" ? vind("afspraken", it.ref) : null;
      it.werk = !!it.werk || !!(bron && bron.werk);
      return werkOk(it);
    });
    if (!uit[d].length) delete uit[d];
  }
  return uit;
};
const _agendaItems14 = agendaItems;
agendaItems = d => {
  const r = _agendaItems14(d);
  const bijwerk = x => {
    const bron = x.soort === "taak" ? vind("taken", x.id) : x.soort === "afspraak" ? vind("afspraken", x.id) : null;
    return werkOk(bron || x);
  };
  return { metTijd: r.metTijd.filter(bijwerk), heleDag: r.heleDag.filter(bijwerk) };
};
const _dagCijfers14 = dagCijfers;
dagCijfers = d => {
  const c = _dagCijfers14(d);
  c.takenOpen = c.takenOpen.filter(werkOk);
  c.af = c.af.filter(werkOk);
  c.afspraken = c.afspraken.filter(werkOk);
  c.deadlines = c.deadlines.filter(werkOk);
  c.open = c.takenOpen.length; c.klaar = c.af.length; c.afspr = c.afspraken.length;
  c.minuten = c.takenOpen.reduce((s, t) => s + (t.duur || 0), 0)
    + c.afspraken.reduce((s, a) => s + afspraakMinuten(a), 0);
  c.log = S.gebeurtenissen.filter(g => (g.datum || (g.ts || "").slice(0, 10)) === d).filter(werkOk).length;
  return c;
};
const _komendeHerhalingen14 = komendeHerhalingen;
komendeHerhalingen = n => _komendeHerhalingen14(n).filter(x => werkOk(vind("taken", x.id)));

/* Een werkmarkering bij taken en afspraken in de lijsten */
const _taakMeta14 = taakMeta;
taakMeta = t => {
  let h = _taakMeta14(t);
  if (t.werk) {
    const chip = `<span style="color:var(--werk);font-weight:700">werk</span>`;
    h = h ? h.replace('<div class="taak-meta">', `<div class="taak-meta">${chip}`) : `<div class="taak-meta">${chip}</div>`;
  }
  return h;
};
const _afspraakRij14 = afspraakRij;
afspraakRij = a => {
  let h = _afspraakRij14(a);
  if (a.werk) h = h.replace('<span class="chiprij" style="margin-top:5px">',
    '<span class="chiprij" style="margin-top:5px"><span class="chip werk">werk</span>');
  return h;
};

/* ---------- Werkdocumenten ---------- */
const DOCSOORTEN = {
  meeting:      { naam: "Meeting", icoon: "groep", kleur: "#7a4fd6", uitleg: "Overleg met agenda, notulen en besluiten" },
  reflectie:    { naam: "Reflectie", icoon: "boek", kleur: "#0e7490", uitleg: "Terugkijken op je week of periode" },
  strategie:    { naam: "Strategie", icoon: "kompas", kleur: "#c2410c", uitleg: "Koers voor de komende tijd" },
  meerjarenplan:{ naam: "Meerjarenplan", icoon: "trap", kleur: "#0f8b6c", uitleg: "Meerdere jaren, met mijlpalen" },
  besluit:      { naam: "Besluit", icoon: "hamer", kleur: "#b7791f", uitleg: "Wat is besloten, door wie en waarom" },
  notitie:      { naam: "Werknotitie", icoon: "pen", kleur: "#475569", uitleg: "Losse aantekening" }
};
const DOCSTATUS = ["concept", "actief", "afgerond", "archief"];
const SECTIES = {
  strategie: [
    ["nu", "Waar staan we nu?", "Feiten, cijfers, wat opvalt."],
    ["doel", "Waar willen we heen?", "Het beeld over een of twee jaar."],
    ["hoe", "Hoe komen we daar?", "De keuzes en de route."],
    ["risico", "Wat kan het dwarsbomen?", "Risico's en wat je eraan doet."],
    ["meten", "Waaraan meet je succes?", "Meetpunten, cijfers, signalen."]
  ],
  meerjarenplan: [
    ["nu", "Uitgangssituatie", "Waar beginnen we?"],
    ["doel", "Eindbeeld", "Waar moet het over een paar jaar staan?"],
    ["hoe", "Aanpak per jaar", "Wat gebeurt er wanneer?"],
    ["middelen", "Wat is ervoor nodig?", "Mensen, geld, tijd."],
    ["risico", "Risico's", "En hoe je die opvangt."]
  ],
  reflectie: [
    ["goed", "Wat ging goed?", ""],
    ["energie", "Wat kostte energie?", ""],
    ["leer", "Wat leer ik hiervan?", ""],
    ["anders", "Wat doe ik anders?", ""]
  ],
  meeting: [
    ["agenda", "Agenda", "Wat wil je bespreken?"],
    ["notulen", "Notities tijdens", ""],
    ["besluit", "Besluiten", "Wat is er besloten?"]
  ],
  besluit: [
    ["situatie", "Waar ging het over?", ""],
    ["besluit", "Het besluit", ""],
    ["waarom", "Waarom deze keuze?", ""],
    ["gevolg", "Wat betekent dit?", ""]
  ],
  notitie: [["tekst", "Notitie", ""]]
};
const werkdocsVan = soort => S.werkdocs.filter(d => d.soort === soort && d.status !== "archief");
function werkTelling() {
  const v = vandaagISO();
  const n = S.afspraken.filter(a => a.werk && a.datum === v).length
    + S.taken.filter(t => t.werk && !t.af && t.datum === v).length;
  return n || "";
}

async function nieuwWerkdoc(soort, extra) {
  const d = Object.assign({
    id: uid(), soort, titel: "", status: "concept", werk: true,
    personen: [], secties: {}, mijlpalen: [], notitie: "",
    datum: soort === "meeting" ? vandaagISO() : "", tijd: "",
    periodeVan: "", periodeTot: "", herzien: "",
    gemaakt: new Date().toISOString(), bijgewerkt: new Date().toISOString()
  }, extra || {});
  await bewaar("werkdocs", d);
  return d;
}

/* ---------- Het Werk-tabblad ---------- */
function vwWerk() {
  const v = vandaagISO();
  const weekEind = plusDagen(v, 7);
  const meetings = S.afspraken.filter(a => a.werk && a.datum >= v && a.datum <= weekEind)
    .sort((a, b) => (a.datum + (a.tijd || "")) < (b.datum + (b.tijd || "")) ? -1 : 1);
  const werktaken = S.taken.filter(t => t.werk && !t.af && t.datum && t.datum <= weekEind).sort(sorteerTaken);
  const uren = S.tijdlog.filter(l => l.datum >= weekStart(v))
    .filter(l => { const t = vind("taken", l.taakId); return t && t.werk; })
    .reduce((s, l) => s + l.seconden, 0);
  const toezeggingen = S.afspraken.filter(a => a.werk && afspraakSoort(a) === "toezegging" && !a.uitkomst);
  const herzien = S.werkdocs.filter(d => d.herzien && d.herzien <= plusDagen(v, 30) && d.status !== "archief")
    .sort((a, b) => a.herzien < b.herzien ? -1 : 1);

  let h = `<div class="werk-kop">
    <svg class="ill" viewBox="0 0 100 80" aria-hidden="true"><use href="#ill-werk"/></svg>
    <div class="ttl">Werk</div>
    <div class="sub">week ${weekNummer(v)} · ${S.werkdocs.filter(d => d.status !== "archief").length} documenten</div>
    <div class="cijfers">
      <div class="cf"><b>${meetings.length}</b><span>meetings deze week</span></div>
      <div class="cf"><b>${werktaken.length}</b><span>open werktaken</span></div>
      <div class="cf"><b>${Math.round(uren / 3600)}u</b><span>geregistreerd</span></div>
    </div>
  </div>`;

  h += `<div class="werkgrid">${Object.entries(DOCSOORTEN).map(([k, s]) =>
    `<button class="werkknop" style="--k:${s.kleur}" data-act="werk-nieuw" data-soort="${k}">
      ${ico(s.icoon)}<span class="nm">${esc(s.naam)}</span></button>`).join("")}
    <button class="werkknop" style="--k:var(--accent)" data-act="werk-taak">${ico("check")}<span class="nm">Werktaak</span></button>
    <button class="werkknop" style="--k:var(--purple)" data-act="werk-afspraak">${ico("komend")}<span class="nm">Werkafspraak</span></button>
  </div>`;

  if (werkStand() !== "alleen") h += `<button class="banner blauw" style="width:100%;text-align:left" data-act="werk-filter" data-f="alleen">
    ${ico("koffer")}<span style="flex:1"><b>Alleen werk tonen</b>Zet de rest van de app even opzij.</span>${ico("pijlr")}</button>`;
  else h += `<button class="banner" style="width:100%;text-align:left" data-act="werk-filter" data-f="alles">
    ${ico("koffer")}<span style="flex:1"><b>Je ziet nu alleen werk</b>Tik om alles weer te tonen.</span>${ico("pijlr")}</button>`;

  if (meetings.length) {
    h += sectie("Komende meetings", meetings.length, `<button class="actie" data-act="ga" data-view="afspraken">Alles</button>`);
    h += `<div class="card">${meetings.slice(0, 6).map(afspraakRij).join("")}</div>`;
  }
  if (werktaken.length) {
    h += sectie("Werktaken", werktaken.length);
    h += `<div class="card">${werktaken.slice(0, 8).map(t => taakHTML(t)).join("")}</div>`;
  }
  if (toezeggingen.length) {
    h += sectie("Open toezeggingen", toezeggingen.length);
    h += `<div class="card">${toezeggingen.slice(0, 6).map(afspraakRij).join("")}</div>`;
  }
  if (herzien.length) {
    h += sectie("Binnenkort herzien", herzien.length, `<span class="telling">plannen die aandacht vragen</span>`);
    h += `<div class="card">${herzien.map(docRij).join("")}</div>`;
  }

  Object.entries(DOCSOORTEN).forEach(([k, s]) => {
    const lijst = werkdocsVan(k).sort((a, b) => (b.bijgewerkt || "") < (a.bijgewerkt || "") ? -1 : 1);
    if (!lijst.length) return;
    h += sectie(s.naam === "Meeting" ? "Meetingverslagen" : s.naam + (lijst.length === 1 ? "" : k === "strategie" ? "ën" : "nen"), lijst.length);
    h += `<div class="card">${lijst.slice(0, 8).map(docRij).join("")}</div>`;
  });

  const archief = S.werkdocs.filter(d => d.status === "archief");
  if (archief.length) {
    h += sectie("Archief", archief.length);
    h += `<div class="card">${archief.slice(0, 10).map(docRij).join("")}</div>`;
  }
  if (!S.werkdocs.length && !meetings.length && !werktaken.length)
    h += `<div class="card">${leeg("💼", "Nog niets op werk vastgelegd",
      "Begin met een meeting of een reflectie. Een strategie of meerjarenplan kun je in stukjes opbouwen — hij blijft gewoon staan.")}</div>`;
  return h;
}

function docRij(d) {
  const s = DOCSOORTEN[d.soort] || DOCSOORTEN.notitie;
  const periode = d.periodeVan
    ? datumLabel(d.periodeVan) + (d.periodeTot ? " – " + datumLabel(d.periodeTot) : "")
    : d.datum ? datumLabel(d.datum) : "";
  const mijl = (d.mijlpalen || []).length;
  return `<button class="docrij" data-act="ga" data-view="werkdoc" data-param="${d.id}">
    ${ico(s.icoon, `width:19px;height:19px;color:${s.kleur};flex:0 0 auto;margin-top:2px`)}
    <span class="nm">
      <b>${esc(d.titel || "Zonder titel")}</b>
      <span class="klein" style="display:block">${[periode, (d.personen || []).join(", "),
        mijl ? mijl + " mijlpalen" : "", d.herzien ? "herzien " + datumLabel(d.herzien) : ""]
        .filter(Boolean).map(esc).join(" · ") || s.uitleg}</span>
    </span>
    <span class="statuschip ${d.status}">${d.status}</span>
  </button>`;
}

/* ---------- Eén werkdocument ---------- */
function vwWerkdoc() {
  const d = vind("werkdocs", V.param);
  if (!d) return leeg("🤷", "Dit document bestaat niet meer");
  const s = DOCSOORTEN[d.soort] || DOCSOORTEN.notitie;
  const secties = SECTIES[d.soort] || SECTIES.notitie;
  const taken = S.taken.filter(t => t.werkdocId === d.id);

  let h = `<div class="card card-pad">
    <div class="chiprij" style="margin-bottom:10px">
      <span class="chip" style="color:${s.kleur};background:color-mix(in srgb,${s.kleur} 14%,transparent)">${ico(s.icoon)}${s.naam}</span>
      ${d.datum ? `<span class="chip blauw">${ico("komend")}${esc(datumLabel(d.datum))}${d.tijd ? " " + esc(d.tijd) : ""}</span>` : ""}
      ${d.periodeVan ? `<span class="chip">${ico("komend")}${esc(datumLabel(d.periodeVan))}${d.periodeTot ? " – " + esc(datumLabel(d.periodeTot)) : ""}</span>` : ""}
      ${d.herzien ? `<span class="chip ${d.herzien < vandaagISO() ? "rood" : "oranje"}">${ico("klok")}herzien ${esc(datumLabel(d.herzien))}</span>` : ""}
      ${(d.personen || []).map(p => `<button class="chip paars" data-act="persoon-open" data-naam="${esc(p)}">${ico("persoon")}${esc(p)}</button>`).join("")}
    </div>
    <div class="segment">${DOCSTATUS.map(st =>
      `<button data-act="doc-status" data-id="${d.id}" data-s="${st}" aria-pressed="${d.status === st}">${st}</button>`).join("")}</div>
    <div class="knoprij" style="margin-top:10px">
      <button class="knop klein rand" data-act="doc-bewerk" data-id="${d.id}">${ico("pen")} Gegevens</button>
      <button class="knop klein rand" data-act="doc-taak" data-id="${d.id}">${ico("plus")} Actiepunt</button>
      ${d.datum ? `<button class="knop klein rand" data-act="doc-ics" data-id="${d.id}">${ico("komend")} Agenda</button>` : ""}
    </div>
  </div>`;

  secties.forEach(([sl, titel, hint]) => {
    h += `<div class="sectie"><h2>${esc(titel)}</h2></div>
      <div class="card card-pad">
        <textarea class="invoer" data-docveld="${sl}" data-id="${d.id}"
          placeholder="${esc(hint)}" style="min-height:${sl === "tekst" ? 190 : 110}px">${esc((d.secties || {})[sl] || "")}</textarea>
      </div>`;
  });

  if (d.soort === "strategie" || d.soort === "meerjarenplan") {
    h += sectie("Mijlpalen", (d.mijlpalen || []).length, `<button class="actie" data-act="doc-mijlpaal" data-id="${d.id}">Toevoegen</button>`);
    h += `<div class="card card-pad">${(d.mijlpalen || []).length
      ? d.mijlpalen.slice().sort((a, b) => (a.datum || "9999") < (b.datum || "9999") ? -1 : 1).map((m, i) =>
        `<div class="mijlpaal${m.af ? " af" : ""}">
          <button class="mini-vink" data-act="doc-mijl-vink" data-id="${d.id}" data-i="${i}">${ico("check")}</button>
          <span class="dt">${esc(m.datum ? datumLabel(m.datum) : "—")}</span>
          <span class="tx">${esc(m.tekst)}</span>
          <button class="icon-btn" style="min-width:36px;min-height:36px" data-act="doc-mijl-taak" data-id="${d.id}" data-i="${i}"
            aria-label="Als taak">${ico("plus", "width:15px;height:15px")}</button>
        </div>`).join("")
      : `<div class="klein">Nog geen mijlpalen. Voeg er een toe om het plan in stappen te knippen.</div>`}</div>`;
  }

  if (taken.length) {
    h += sectie("Actiepunten", taken.filter(t => !t.af).length + " open");
    h += `<div class="card">${taken.sort(sorteerTaken).map(t => taakHTML(t)).join("")}</div>`;
  }

  h += `<div class="sectie"><h2>Bijwerkingen</h2></div>
    <div class="card card-pad klein">
      <p>Gemaakt ${esc(datumLabel((d.gemaakt || "").slice(0, 10), true))} · laatst bijgewerkt ${esc(datumLabel((d.bijgewerkt || "").slice(0, 10), true))}</p>
      ${(d.log || []).length ? (d.log || []).slice().reverse().slice(0, 12).map(x =>
        `<p><b>${esc(datumLabel(x.datum, true))}</b> — ${esc(x.tekst)}</p>`).join("") : ""}
      <button class="knop klein rand" style="margin-top:6px" data-act="doc-log" data-id="${d.id}">${ico("pen")} Wijziging noteren</button>
    </div>`;

  h += `<div class="hr"></div>
    <button class="knop breed gevaar" data-act="doc-weg" data-id="${d.id}">${ico("prullenbak")} Document verwijderen</button>`;
  return h;
}

/* ---------- Gegevensblad van een werkdocument ---------- */
function docBlad(id) {
  const d = vind("werkdocs", id);
  const s = DOCSOORTEN[d.soort];
  const meerjaar = d.soort === "strategie" || d.soort === "meerjarenplan";
  bladOpen(s.naam + " — gegevens", `
    <div class="veld"><label for="d-titel">Titel</label>
      <input class="invoer" id="d-titel" type="text" value="${esc(d.titel)}" placeholder="Waar gaat het over?"></div>
    <div class="veld"><label for="d-personen">Betrokkenen</label>
      <input class="invoer" id="d-personen" type="text" value="${esc((d.personen || []).join(", "))}" placeholder="Namen, met komma's"></div>
    ${d.soort === "meeting" ? `<div class="rij2">
      <div class="veld"><label for="d-datum">Datum</label><input class="invoer" id="d-datum" type="date" value="${d.datum || ""}"></div>
      <div class="veld"><label for="d-tijd">Tijd</label><input class="invoer" id="d-tijd" type="time" value="${d.tijd || ""}"></div>
    </div>` : `<div class="rij2">
      <div class="veld"><label for="d-van">Periode van</label><input class="invoer" id="d-van" type="date" value="${d.periodeVan || ""}"></div>
      <div class="veld"><label for="d-tot">tot en met</label><input class="invoer" id="d-tot" type="date" value="${d.periodeTot || ""}"></div>
    </div>`}

  setTimeout(() => { if (!d.titel) $("#d-titel").focus(); }, 260);
}

/* ---------- Acties ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");

  } else if (act === "doc-bewerk") {

  } else if (act === "doc-ics") {

      await bewaar("werkdocs", d); teken(); toast("Mijlpaal toegevoegd");
    });
  } else if (act === "doc-mijl-vink") {
    const d = vind("werkdocs", id), i = +el.dataset.i;
    const gesorteerd = d.mijlpalen.slice().sort((a, b) => (a.datum || "9999") < (b.datum || "9999") ? -1 : 1);
    const m = gesorteerd[i];
    m.af = !m.af; d.bijgewerkt = new Date().toISOString();
    await bewaar("werkdocs", d);
    if (m.af) await logGebeurtenis("taak", "Mijlpaal behaald: " + m.tekst, d.id, { werk: true });
    tril(9); teken();
  } else if (act === "doc-mijl-taak") {
    const d = vind("werkdocs", id), i = +el.dataset.i;
    const m = d.mijlpalen.slice().sort((a, b) => (a.datum || "9999") < (b.datum || "9999") ? -1 : 1)[i];
    const t = await maakTaakUitTekst(m.tekst, { werk: true, werkdocId: d.id, datum: m.datum || null });
    if (t) { teken(); toast("Als taak op je lijst gezet", "Bewerken", () => openTaakBlad(t.id)); }
  } else if (act === "doc-log") {
    const d = vind("werkdocs", id);
    bladVraag("Wijziging noteren", "", "Wat is er veranderd, en waarom?", async tekst => {
      if (!tekst) return;
      d.log = d.log || [];
      d.log.push({ datum: vandaagISO(), tekst });
      d.bijgewerkt = new Date().toISOString();
      await bewaar("werkdocs", d); teken(); toast("Genoteerd");
    }, true);
  } else if (act === "doc-weg") {
    const d = vind("werkdocs", id);
    bevestigVerwijderen(
      async () => { await verwijder("werkdocs", id); ga("werk"); toast("Verwijderd"); });
  }
});
