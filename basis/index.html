<script>
"use strict";
/* ==========================================================================
   36. Financieel — maandbudget, dagbudget, uitgaven en incasso's
   ========================================================================== */
const eur = n => "€ " + (Math.round((+n || 0) * 100) / 100).toLocaleString("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const eurKort = n => "€" + Math.round(+n || 0).toLocaleString("nl-NL");
const maandSleutel = iso => iso.slice(0, 7);
const dagenInMaand = iso => new Date(parseISO(iso).getFullYear(), parseISO(iso).getMonth() + 1, 0).getDate();
const maandBudget = iso => +inst("budget_" + maandSleutel(iso), inst("budgetStandaard", 0)) || 0;
/* Uitgaven die aan een potje hangen gaan niet van het dagbudget af — die tellen hier niet mee. */
const uitgavenOp = iso => S.uitgaven.filter(u => u.datum === iso && !u.potjeId).reduce((s, u) => s + u.bedrag, 0);
const uitgavenMaand = iso => S.uitgaven.filter(u => maandSleutel(u.datum) === maandSleutel(iso) && !u.potjeId).reduce((s, u) => s + u.bedrag, 0);

const CATEGORIEEN = [
  ["boodschappen", "Boodschappen", "#0f8b6c"], ["eten", "Eten buiten de deur", "#c2410c"],
  ["vervoer", "Vervoer", "#2f6fed"], ["huis", "Huis", "#7a4fd6"],
  ["vrijetijd", "Vrije tijd", "#be185d"], ["zorg", "Zorg", "#0e7490"],
  ["overig", "Overig", "#64748b"]
];
const catKleur = k => (CATEGORIEEN.find(c => c[0] === k) || CATEGORIEEN[6])[2];
const catNaam = k => (CATEGORIEEN.find(c => c[0] === k) || CATEGORIEEN[6])[1];

/* ---------- Incasso's ---------- */
const FREQ = { week: ["Wekelijks", 0, 7], maand: ["Maandelijks", 1, 0], kwartaal: ["Per kwartaal", 3, 0], halfjaar: ["Half jaarlijks", 6, 0], jaar: ["Jaarlijks", 12, 0] };
const INTENSITEIT = {
  stil:   { naam: "Stil", uitleg: "Alleen in de lijst en op je tijdlijn." },
  zacht:  { naam: "Zacht", uitleg: "Een melding bovenaan je scherm op de dagen die je koos." },
  stevig: { naam: "Stevig", uitleg: "Melding én er komt automatisch een taak op je lijst." }
};
const HERINNER_KEUZE = [[7, "week ervoor"], [3, "3 dagen"], [1, "dag ervoor"], [0, "op de dag zelf"]];

/** Alle incassodata van één incasso binnen een periode. */
function incassoData(i, van, tot) {
  if (!i.actief || !i.start) return [];
  const f = FREQ[i.freq] || FREQ.maand;
  const uit = [];
  let d = i.start, n = 0;
  while (d <= tot && n < 400) {
    if (d >= van) uit.push(d);
    d = f[1] ? plusMaanden(d, f[1]) : plusDagen(d, f[2]);
    n++;
  }
  return uit;
}
const volgendeIncasso = i => (incassoData(i, vandaagISO(), plusDagen(vandaagISO(), 400))[0] || null);
function incassosIn(van, tot) {
  const uit = [];
  S.incassos.forEach(i => incassoData(i, van, tot).forEach(d => uit.push({ datum: d, incasso: i })));
  return uit.sort((a, b) => a.datum < b.datum ? -1 : 1);
}
const incassoMaand = iso => incassosIn(iso.slice(0, 8) + "01", `${iso.slice(0, 8)}${dagenInMaand(iso)}`)
  .reduce((s, x) => s + (x.incasso.bedrag || 0), 0);

/* ---------- Dagbudget ---------- */
function dagbudget(iso) {
  iso = iso || vandaagISO();
  const maand = maandBudget(iso);
  const reserve = inst("budgetIncasso", false) ? incassoMaand(iso) : 0;
  const teVerdelen = Math.max(0, maand - reserve);
  const dagen = dagenInMaand(iso);
  const uit = uitgavenOp(iso);
  if (inst("budgetDynamisch", false)) {
    // Dynamisch: wat er nog in het budget zit (startbedrag min alle uitgaven tot nu),
    // gedeeld door het VASTE aantal dagen van de maand — niet de resterende dagen.
    const ervoor = S.uitgaven
      .filter(u => maandSleutel(u.datum) === maandSleutel(iso) && u.datum < iso && !u.potjeId)
      .reduce((s, u) => s + u.bedrag, 0);
    const basis = Math.max(0, teVerdelen - ervoor) / dagen;
    return { basis, uitgegeven: uit, over: basis - uit, maand, reserve, modus: "dynamisch" };
  }
  if (!inst("budgetMeenemen", false)) {
    const basis = teVerdelen / dagen;
    return { basis, uitgegeven: uit, over: basis - uit, maand, reserve, modus: "vast" };
  }
  const dagnr = parseISO(iso).getDate();
  const ervoor = S.uitgaven
    .filter(u => maandSleutel(u.datum) === maandSleutel(iso) && u.datum < iso && !u.potjeId)
    .reduce((s, u) => s + u.bedrag, 0);
  const restDagen = Math.max(1, dagen - dagnr + 1);
  const basis = Math.max(0, teVerdelen - ervoor) / restDagen;
  return { basis, uitgegeven: uit, over: basis - uit, maand, reserve, modus: "meenemen", restDagen };
}
function geldTelling() {
  const b = dagbudget();
  if (!b.maand) return "";
  return b.over < 0 ? "!" : "";
}

/* ---------- Potjes: inkomen verdelen over eigen budgetjes ---------- */
const POTJE_PALET = ["#0f8b6c", "#2f6fed", "#c2410c", "#7a4fd6", "#be185d", "#0e7490", "#c0202f", "#a16207"];
const potjeKleur = i => POTJE_PALET[i % POTJE_PALET.length];
const maandInkomen = iso => +inst("inkomen_" + maandSleutel(iso), inst("inkomenStandaard", 0)) || 0;
const potjeUitgegeven = (id, iso) => S.uitgaven
  .filter(u => u.potjeId === id && maandSleutel(u.datum) === maandSleutel(iso))
  .reduce((s, u) => s + u.bedrag, 0);
const potjeOver = (p, iso) => (+p.bedrag || 0) - potjeUitgegeven(p.id, iso);
const potjesVerdeeld = () => S.potjes.reduce((s, p) => s + (+p.bedrag || 0), 0);

function finPotjes() {
  const v = vandaagISO();
  const inkomen = maandInkomen(v);
  const potjes = S.potjes.slice().sort((a, b) => (b.bedrag || 0) - (a.bedrag || 0));
  const verdeeld = potjesVerdeeld();
  const onverdeeld = inkomen - verdeeld;

  let h = `<div class="geldkaart" style="background:linear-gradient(160deg,#7a4fd6,#4f46b8)">
    <div class="lbl">Maandinkomen</div>
    <div class="bedrag">${eur(inkomen)}</div>
    <div class="lbl">${potjes.length ? eur(verdeeld) + " verdeeld over " + potjes.length + " potje" + (potjes.length === 1 ? "" : "s") : "Nog niets verdeeld"}</div>
    <div class="knoprij" style="margin-top:13px">
      <button class="knop primair" data-act="fin-potje-nieuw" style="background:#fff;color:#4f46b8">${ico("plus")} Potje</button>
      <button class="knop rand" data-act="fin-inkomen" style="border-color:rgba(255,255,255,.5);color:#fff">${ico("pen")} Inkomen</button>
    </div>
  </div>`;

  if (!inkomen) h += `<div class="banner blauw">${ico("let")}<div><b>Nog geen inkomen ingevuld</b>
    Vul in wat je maandelijks binnenkrijgt. Dat is niet verplicht om potjes te gebruiken, maar zo zie je wat er nog te verdelen is.</div></div>`;

  if (potjes.length) {
    h += `<div class="card card-pad">
      <div style="display:flex;justify-content:space-between;font-size:calc(14px * var(--t))">
        <b>Verdeling</b>${inkomen ? `<span class="klein" style="color:${onverdeeld < 0 ? "var(--red)" : "var(--muted)"}">${eur(onverdeeld)} onverdeeld</span>` : ""}</div>
      <div style="display:flex;height:11px;border-radius:6px;overflow:hidden;margin-top:9px;gap:2px;background:var(--card2)">
        ${potjes.map(p => `<i style="flex:${Math.max(+p.bedrag || 0, 0.01)};background:${p.kleur}"></i>`).join("")}
        ${inkomen && onverdeeld > 0 ? `<i style="flex:${onverdeeld};background:var(--line)"></i>` : ""}
      </div>
      <div class="chiprij" style="margin-top:9px">
        ${potjes.map(p => `<span class="chip" style="color:${p.kleur};background:color-mix(in srgb,${p.kleur} 13%,transparent)">${esc(p.naam)} ${eurKort(p.bedrag)}</span>`).join("")}</div>
    </div>`;
  }

  if (!potjes.length) {
    h += `<div class="card">${leeg("🫙", "Nog geen potjes",
      "Maak een potje aan, bijvoorbeeld “Benzine” met € 320 per maand. Kies dat potje straks bij het loggen van een uitgave en het bedrag gaat van het potje af, niet van je dagbudget.")}</div>`;
    return h;
  }

  h += sectie("Potjes deze maand", potjes.length);
  h += `<div class="card">${potjes.map(p => potjeRij(p, v)).join("")}</div>`;
  h += `<div class="klein" style="text-align:center;margin-top:10px">Elke nieuwe maand beginnen je potjes weer vol. Wat je erin overhoudt, neemt niet vanzelf over.</div>`;
  return h;
}

function potjeRij(p, iso) {
  const over = potjeOver(p, iso);
  const pct = p.bedrag ? clamp(Math.round((p.bedrag - over) / p.bedrag * 100), 0, 100) : 0;
  const op = over < 0;
  return `<button class="rijknop" data-act="fin-potje-open" data-id="${p.id}" style="flex-direction:column;align-items:stretch;gap:7px">
    <span style="display:flex;align-items:center;gap:10px;width:100%">
      <span class="kleurbol" style="background:${p.kleur}"></span>
      <span class="nm" style="flex:1">${esc(p.naam)}</span>
      <span style="font-weight:700;color:${op ? "var(--red)" : "var(--text)"}">${eur(over)}</span>
    </span>
    <span class="balk" style="height:6px;margin-left:22px">
      <i style="width:${pct}%;background:${op ? "var(--red)" : p.kleur}"></i></span>
    <span class="klein" style="margin-left:22px">van ${eur(p.bedrag)} per maand</span>
  </button>`;
}

function inkomenBlad() {
  const v = vandaagISO();
  bladOpen("Maandinkomen", `
    <div class="veld"><label for="i-bedrag">Wat komt er deze maand binnen?</label>
      <input class="invoer" id="i-bedrag" type="number" inputmode="decimal" step="0.01" min="0"
        value="${maandInkomen(v) || ""}" placeholder="bv. 2400" style="font-size:calc(22px * var(--t));font-weight:700"></div>
    <div class="veld"><span class="labeltekst">Volgende maanden</span>
      <div class="keuzerij">
        <button class="keuze" data-istd="0" aria-pressed="${!(inst("inkomenStandaard", 0) > 0)}">Alleen deze maand</button>
        <button class="keuze" data-istd="1" aria-pressed="${inst("inkomenStandaard", 0) > 0}">Ook volgende maanden</button>
      </div></div>
  `, `<button class="knop breed primair" id="i-ok">Opslaan</button>`);
  $("#bladinhoud").onclick = e => {
    const k = e.target.closest("[data-istd]");
    if (k) $$("[data-istd]").forEach(x => x.setAttribute("aria-pressed", x === k));
  };
  setTimeout(() => $("#i-bedrag").focus(), 260);
  $("#i-ok").onclick = async () => {
    const n = +$("#i-bedrag").value || 0;
    await zetInst("inkomen_" + maandSleutel(v), n);
    const alt = $$("[data-istd]").find(x => x.getAttribute("aria-pressed") === "true");
    await zetInst("inkomenStandaard", alt && alt.dataset.istd === "1" ? n : 0);
    bladSluit(); teken(); toast("Inkomen bijgewerkt: " + eur(n));
  };
}

function potjeBlad(id) {
  const bestaat = id ? vind("potjes", id) : null;
  const p = bestaat || { id: uid(), naam: "", bedrag: 0, kleur: potjeKleur(S.potjes.length), ts: new Date().toISOString() };
  bladOpen(bestaat ? "Potje bewerken" : "Nieuw potje", `
    <div class="veld"><label for="p-naam">Naam</label>
      <input class="invoer" id="p-naam" type="text" value="${esc(p.naam)}" placeholder="bv. Benzine"></div>
    <div class="veld"><label for="p-bedrag">Bedrag per maand</label>
      <input class="invoer" id="p-bedrag" type="number" inputmode="decimal" step="0.01" min="0"
        value="${p.bedrag || ""}" placeholder="bv. 320" style="font-size:calc(22px * var(--t));font-weight:700"></div>
    <div class="klein">Elke maand begint dit potje weer vol. Kies dit potje bij het loggen van een uitgave en het bedrag gaat van het potje af, niet van je dagbudget.</div>
    ${bestaat ? `<button class="knop breed gevaar" id="p-weg" style="margin-top:12px">${ico("prullenbak")} Verwijderen</button>` : ""}
  `, `<button class="knop breed primair" id="p-ok">${bestaat ? "Opslaan" : "Aanmaken"}</button>`);
  if (bestaat) $("#p-weg").onclick = () => bevestigVerwijderen(
    async () => { await verwijder("potjes", p.id); ga("financieel"); toast("Verwijderd"); });
  $("#p-ok").onclick = async () => {
    const naam = $("#p-naam").value.trim();
    if (!naam) { toast("Geef het potje een naam"); $("#p-naam").focus(); return; }
    p.naam = naam;
    p.bedrag = +$("#p-bedrag").value || 0;
    await bewaar("potjes", p);
    bladSluit(); teken(); toast("Potje opgeslagen");
  };
  setTimeout(() => $("#p-naam").focus(), 260);
}

/* ---------- Het financiële scherm ---------- */
V.finModus = "budget";

/** Cijfers voor het financiële dashboardpaneel, analoog aan dagCijfers(). */
function finCijfers(iso) {
  const b = dagbudget(iso);
  const maandUit = uitgavenMaand(iso);
  const dagen = dagenInMaand(iso);
  const pct = b.maand ? clamp(Math.round((maandUit + b.reserve) / b.maand * 100), 0, 100) : 0;
  const potjes = S.potjes || [];
  const potjesOver = potjes.reduce((s, p) => s + potjeOver(p, iso), 0);
  const incassosWeek = incassosIn(iso, plusDagen(iso, 6));
  return { b, maandUit, dagen, pct, potjes, potjesOver, incassosWeek };
}

/** Financieel dashboardpaneel, zelfde opzet als dagPaneel() maar dan met geldcijfers. */
function finPaneel() {
  const v = vandaagISO(), c = finCijfers(v);
  const negatief = c.b.over < 0;
  const ws = weekStart(v);
  const week = Array.from({ length: 7 }, (_, i) => {
    const d = plusDagen(ws, i);
    return { d, n: uitgavenOp(d), toekomst: d > v };
  });
  const max = Math.max(1, c.b.basis || 1, ...week.map(w => w.n));
  const volgende = c.incassosWeek[0];
  return `<div class="dagpaneel">
    <div class="dp-kop">
      <div style="flex:1;min-width:0">
        <div class="dp-datum">Financieel overzicht</div>
        <div class="dp-sub">${esc(MAANDNAMEN[parseISO(v).getMonth()])} · ${c.b.maand ? `${eur(c.maandUit)} van ${eur(c.b.maand)} uitgegeven` : "nog geen maandbudget"}</div>
      </div>
      <div class="ring" style="--p:${c.pct}"><span>${c.b.maand ? c.pct + "%" : "–"}</span></div>
    </div>
    <div class="dp-stats">
      <button class="dp-stat${negatief ? " alarm" : ""}" data-act="fin" data-m="budget"><b>${eur(c.b.over)}</b><span>vandaag over</span></button>
      <button class="dp-stat" data-act="fin" data-m="uitgaven"><b>${eur(c.maandUit)}</b><span>deze maand</span></button>
      <button class="dp-stat" data-act="fin" data-m="potjes"><b>${eur(c.potjesOver)}</b><span>in potjes</span></button>
      <button class="dp-stat" data-act="fin" data-m="incasso"><b>${c.incassosWeek.length}</b><span>incasso${c.incassosWeek.length === 1 ? "" : "'s"}</span></button>
    </div>
    ${volgende ? `<button class="dp-volgende" data-act="fin-incasso-open" data-id="${volgende.incasso.id}">
      ${ico("kringloop")}<span class="tijd">${esc(datumLabel(volgende.datum))}</span><span class="wat">${esc(volgende.incasso.naam)}</span>${ico("pijlr")}</button>` : ""}
    <div class="dp-weekstrip">
      ${week.map(w => `<button class="${w.d === v ? "nu" : ""}${w.toekomst ? " toekomst" : ""}"
        data-act="fin-dag" data-datum="${w.d}" aria-label="${esc(datumLabel(w.d, true))}">
        <span class="st" style="height:${Math.max(6, Math.round(w.n / max * 100))}%"></span>
        <span class="dg">${DAGKORT[weekdagVan(w.d)]}</span></button>`).join("")}
    </div>
    <div class="dp-knoppen">
      <button class="dp-knop" data-act="fin" data-m="uitgaven">${ico("plus")} Uitgaven</button>
      <button class="dp-knop" data-act="fin" data-m="potjes">${ico("grafiek")} Potjes</button>
      <button class="dp-knop" data-act="fin" data-m="vast">${ico("komend")} Vaste lasten</button>
    </div>
  </div>`;
}

function vwFinancieel() {
  const m = V.finModus || "budget";
  let h = finPaneel();
  h += `<div class="segment vijf" style="margin:10px 0 2px">
    ${[["budget", "Dagbudget"], ["uitgaven", "Uitgaven"], ["potjes", "Potjes"], ["vast", "Vaste lasten"], ["incasso", "Incasso's"]].map(([k, l]) =>
      `<button data-act="fin" data-m="${k}" aria-pressed="${m === k}">${l}</button>`).join("")}</div>`;
  return h + (m === "uitgaven" ? finUitgaven() : m === "vast" ? finVaste() : m === "potjes" ? finPotjes()
    : m === "incasso" ? finIncasso() : finBudget());
}

function finBudget() {
  const v = vandaagISO(), b = dagbudget(v);
  const dagen = dagenInMaand(v), dagnr = parseISO(v).getDate();
  const maandUit = uitgavenMaand(v);
  const overMaand = b.maand - maandUit - b.reserve;
  const pct = b.maand ? clamp(Math.round((maandUit + b.reserve) / b.maand * 100), 0, 100) : 0;
  const negatief = b.over < 0;

  let h = `<div class="geldkaart${negatief ? " op" : ""}">
    <div class="lbl">Je mag vandaag nog</div>
    <div class="bedrag">${eur(b.over)}</div>
    <div class="lbl">van ${eur(b.basis)} dagbudget · ${eur(b.uitgegeven)} uitgegeven</div>
    <div class="knoprij" style="margin-top:13px">
      <button class="knop primair" data-act="fin-uitgave" style="background:#fff;color:#0f766e">${ico("plus")} Uitgave</button>
      <button class="knop rand" data-act="fin-budget" style="border-color:rgba(255,255,255,.5);color:#fff">${ico("pen")} Maandbudget</button>
    </div>
  </div>`;

  if (!b.maand) h += `<div class="banner blauw">${ico("let")}<div><b>Nog geen maandbudget</b>
    Vul in wat je deze maand te besteden hebt. De app deelt dat door ${dagen} dagen en houdt je dagbudget bij.</div></div>`;

  h += `<div class="knoprij" style="margin:10px 0 2px">${csvKnop("budget", "Budget importeren (CSV)")}</div>`;

  h += `<div class="card card-pad">
    <div style="display:flex;justify-content:space-between;font-size:calc(14px * var(--t))">
      <b>${MAANDNAMEN[parseISO(v).getMonth()]}</b><span class="klein">dag ${dagnr} van ${dagen}</span></div>
    <div class="balk" style="margin-top:7px;height:10px">
      <i style="width:${pct}%;background:${pct > 92 ? "var(--red)" : pct > 75 ? "var(--amber)" : "var(--green)"}"></i></div>
    <div class="klein" style="display:flex;justify-content:space-between;margin-top:6px">
      <span>${eur(maandUit)} uitgegeven${b.reserve ? " + " + eur(b.reserve) + " incasso's" : ""}</span>
      <span style="color:${overMaand < 0 ? "var(--red)" : "var(--muted)"}">${eur(overMaand)} over</span></div>
    <div class="hr"></div>
    <div class="klein"><p><b>Zo rekent de app:</b> ${b.modus === "vast"
      ? `maandbudget ${eur(b.maand)}${b.reserve ? " min " + eur(b.reserve) + " aan incasso's" : ""} gedeeld door ${dagen} dagen = ${eur(b.basis)} per dag. Wat je vandaag uitgeeft gaat daar direct vanaf.`
      : b.modus === "dynamisch"
      ? `wat er nog in het budget zit${b.reserve ? " (incasso's al gereserveerd)" : ""}, gedeeld door alle ${dagen} dagen van de maand — niet alleen de dagen die nog komen. Elke uitgave verlaagt je dagbudget meteen.`
      : `wat er nog over is${b.reserve ? " (incasso's al gereserveerd)" : ""}, gedeeld door de ${b.restDagen} dagen die deze maand nog komen.`}</p></div>
  </div>`;

  h += `<div class="card card-pad">
    ${schakelaar("budgetDynamisch", "Dynamisch dagbudget", "Rekent niet met een vast bedrag per dag, maar met wat er nu nog in het budget zit gedeeld door alle dagen van de maand. Geeft je vandaag minder als je gisteren te veel uitgaf.", inst("budgetDynamisch", false))}
    ${schakelaar("budgetMeenemen", "Restant meenemen", "Uit: elke dag hetzelfde bedrag. Aan: wat je overhoudt of te veel uitgeeft wordt over de resterende dagen verdeeld.", inst("budgetMeenemen", false))}
    ${schakelaar("budgetIncasso", "Incasso's reserveren", "Haalt de incasso's van deze maand eerst van je budget af.", inst("budgetIncasso", false))}
  </div>`;

  const reeks = Array.from({ length: 14 }, (_, i) => plusDagen(v, -13 + i));
  const maxU = Math.max(b.basis || 1, ...reeks.map(uitgavenOp));
  h += sectie("Laatste 14 dagen");
  h += `<div class="card card-pad">
    <div class="grafiek" style="height:104px;position:relative">
      ${b.basis ? `<div style="position:absolute;left:0;right:0;bottom:${Math.round(b.basis / maxU * 88) + 16}px;border-top:1.5px dashed var(--accent);opacity:.6"></div>` : ""}
      ${reeks.map(d => {
        const u = uitgavenOp(d), over = b.basis && u > b.basis;
        return `<div class="kolom">
          <div class="staaf" style="height:${Math.round(u / maxU * 100)}%;background:${over ? "var(--red)" : "var(--green)"};${d === v ? "" : "opacity:.65"}"></div>
          <span class="dag">${parseISO(d).getDate()}</span></div>`;
      }).join("")}
    </div>
    <div class="klein" style="margin-top:6px">De stippellijn is je dagbudget. Rood betekent dat je er die dag overheen ging.</div>
  </div>`;

  const komend = incassosIn(v, plusDagen(v, 14));
  if (komend.length) {
    h += sectie("Incasso's binnen 14 dagen", komend.length, `<button class="actie" data-act="fin" data-m="incasso">Alles</button>`);
    h += `<div class="card">${komend.slice(0, 5).map(x => incassoRij(x.incasso, x.datum)).join("")}</div>`;
  }
  return h;
}

function finUitgaven() {
  const v = vandaagISO();
  const maandU = S.uitgaven.filter(u => maandSleutel(u.datum) === maandSleutel(v))
    .sort((a, b) => a.datum < b.datum ? 1 : (a.ts < b.ts ? 1 : -1));
  const perCat = {};
  maandU.forEach(u => { perCat[u.categorie || "overig"] = (perCat[u.categorie || "overig"] || 0) + u.bedrag; });
  const cats = Object.entries(perCat).sort((a, b) => b[1] - a[1]);
  const totaal = maandU.reduce((s, u) => s + u.bedrag, 0);

  let h = `<button class="knop breed primair" style="margin:10px 0" data-act="fin-uitgave">${ico("plus")} Uitgave loggen</button>
    <div class="knoprij" style="margin:0 0 10px">${csvKnop("uitgaven", "Uitgaven importeren (CSV)")}</div>`;
  if (!maandU.length) return h + `<div class="card">${leeg("🧾", "Nog niets uitgegeven deze maand",
    "Log een uitgave en hij gaat meteen van je dagbudget af.")}</div>`;

  h += `<div class="card card-pad">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b style="font-size:calc(15px * var(--t))">${MAANDNAMEN[parseISO(v).getMonth()]}</b>
      <span style="font-size:calc(19px * var(--t));font-weight:800">${eur(totaal)}</span></div>
    <div style="display:flex;height:11px;border-radius:6px;overflow:hidden;margin-top:9px;gap:2px">
      ${cats.map(([k, n]) => `<i style="flex:${n};background:${catKleur(k)}"></i>`).join("")}</div>
    <div class="chiprij" style="margin-top:9px">
      ${cats.map(([k, n]) => `<span class="chip" style="color:${catKleur(k)};background:color-mix(in srgb,${catKleur(k)} 13%,transparent)">${esc(catNaam(k))} ${eurKort(n)}</span>`).join("")}</div>
  </div>`;

  let dag = "";
  h += `<div class="card">`;
  maandU.slice(0, 60).forEach(u => {
    if (u.datum !== dag) {
      dag = u.datum;
      const d = dagbudget(dag);
      h += `<div style="padding:9px 13px 4px;background:var(--card2);display:flex;justify-content:space-between;
        font-size:calc(11.5px * var(--t));font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">
        <span>${esc(datumLabel(dag, true))}</span>
        <span style="color:${d.over < 0 ? "var(--red)" : "var(--green)"}">${eur(d.over)} over</span></div>`;
    }
    const potje = u.potjeId ? vind("potjes", u.potjeId) : null;
    h += `<button class="rijknop" data-act="fin-bewerk" data-id="${u.id}">
      <span class="kleurbol" style="background:${catKleur(u.categorie)}"></span>
      <span class="nm">${esc(u.omschrijving || catNaam(u.categorie))}
        <span class="klein" style="display:block">${esc(catNaam(u.categorie))}${potje ? ` · <span style="color:${potje.kleur}">${esc(potje.naam)}</span>` : ""}</span></span>
      <span class="rechts" style="font-weight:700">${eur(u.bedrag)}</span></button>`;
  });
  h += `</div>`;
  return h;
}

function incassoRij(i, datum) {
  const d = datum || volgendeIncasso(i);
  const dagen = d ? dagVerschil(d, vandaagISO()) : null;
  return `<button class="rijknop" data-act="fin-incasso-open" data-id="${i.id}">
    ${ico("kringloop", `width:19px;height:19px;color:${i.actief ? "var(--accent)" : "var(--faint)"};flex:0 0 auto`)}
    <span class="nm"><b style="font-weight:650">${esc(i.naam)}</b>
      <span class="klein" style="display:block">${esc((FREQ[i.freq] || FREQ.maand)[0])}${d ? " · " + esc(datumLabel(d)) : ""}${i.actief ? "" : " · uit"}</span></span>
    <span class="rechts" style="font-weight:700;color:${dagen !== null && dagen <= 2 ? "var(--red)" : "var(--text)"}">${eur(i.bedrag)}</span>
  </button>`;
}

function finIncasso() {
  const v = vandaagISO();
  const komend = incassosIn(v, plusDagen(v, 62));
  const perMaand = incassoMaand(v);
  let h = `<button class="knop breed primair" style="margin:10px 0" data-act="fin-incasso-nieuw">${ico("plus")} Incasso toevoegen</button>
    <div class="knoprij" style="margin:0 0 10px">${csvKnop("incasso", "Incasso's importeren (CSV)")}</div>`;
  if (!S.incassos.length) return h + `<div class="card">${leeg("🔁", "Nog geen incasso's",
    "Zet je vaste lasten erin: huur, verzekering, abonnementen. De app rekent uit wanneer ze komen en waarschuwt je vooraf.")}</div>`;

  h += `<div class="card card-pad">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b style="font-size:calc(15px * var(--t))">Deze maand van je rekening</b>
      <span style="font-size:calc(19px * var(--t));font-weight:800">${eur(perMaand)}</span></div>
    <div class="klein" style="margin-top:4px">${S.incassos.filter(i => i.actief).length} actieve incasso's${inst("budgetIncasso", false) ? " · gereserveerd in je dagbudget" : ""}</div>
    <div class="knoprij" style="margin-top:10px">
      <button class="knop klein rand" data-act="fin-ics-alles">${ico("komend")} Alles naar Agenda</button>
      <button class="knop klein rand" data-act="fin-forecast">${ico("verder")} Vooruitblik</button>
    </div>
  </div>`;

  h += sectie("Komende 2 maanden", komend.length);
  h += komend.length
    ? `<div class="card">${komend.map(x => incassoRij(x.incasso, x.datum)).join("")}</div>`
    : `<div class="card"><div class="leeg"><p>Geen incasso's gepland.</p></div></div>`;

  h += sectie("Alle incasso's", S.incassos.length);
  h += `<div class="card">${S.incassos.slice().sort((a, b) => b.bedrag - a.bedrag).map(i => incassoRij(i)).join("")}</div>`;

  h += `<div class="card card-pad klein" style="margin-top:12px">
    <p><b>Waarschuwingen</b> ${S.incassos.filter(i => i.actief && i.intensiteit !== "stil").length} van je incasso's laten iets van zich horen.
    Per incasso stel je in hoeveel dagen van tevoren en hoe nadrukkelijk.</p>
    <p>Op je tijdlijn zet je ze aan of uit met de knop <b>Incasso's</b> bij de filters.</p>
  </div>`;
  return h;
}

/* ---------- Invoerbladen ---------- */
function budgetBlad() {
  const v = vandaagISO();
  bladOpen("Maandbudget", `
    <div class="veld"><label for="b-bedrag">Te besteden in ${esc(MAANDNAMEN[parseISO(v).getMonth()])}</label>
      <input class="invoer" id="b-bedrag" type="number" inputmode="decimal" step="0.01" min="0"
        value="${maandBudget(v) || ""}" placeholder="bv. 800" style="font-size:calc(22px * var(--t));font-weight:700">
      <div class="klein" style="margin-top:7px">Gedeeld door ${dagenInMaand(v)} dagen wordt dat je dagbudget.
      <span id="b-voorbeeld"></span></div></div>
    <div class="veld"><span class="labeltekst">Volgende maanden</span>
      <div class="keuzerij">
        <button class="keuze" data-bstd="0" aria-pressed="${!(inst("budgetStandaard", 0) > 0)}">Alleen deze maand</button>
        <button class="keuze" data-bstd="1" aria-pressed="${inst("budgetStandaard", 0) > 0}">Ook volgende maanden</button>
      </div></div>
  `, `<button class="knop breed primair" id="b-ok">Opslaan</button>`);
  const toon = () => {
    const n = +$("#b-bedrag").value || 0;
    $("#b-voorbeeld").textContent = n ? `Dat is ${eur(n / dagenInMaand(v))} per dag.` : "";
  };
  $("#b-bedrag").oninput = toon; toon();
  $("#bladinhoud").onclick = e => {
    const k = e.target.closest("[data-bstd]");
    if (k) $$("[data-bstd]").forEach(x => x.setAttribute("aria-pressed", x === k));
  };
  setTimeout(() => $("#b-bedrag").focus(), 260);
  $("#b-ok").onclick = async () => {
    const n = +$("#b-bedrag").value || 0;
    await zetInst("budget_" + maandSleutel(v), n);
    const alt = $$("[data-bstd]").find(x => x.getAttribute("aria-pressed") === "true");
    await zetInst("budgetStandaard", alt && alt.dataset.bstd === "1" ? n : 0);
    bladSluit(); teken(); toast("Dagbudget: " + eur(n / dagenInMaand(v)));
  };
}

function uitgaveBlad(id) {
  const bestaat = id ? vind("uitgaven", id) : null;
  const u = bestaat || { id: uid(), datum: vandaagISO(), bedrag: 0, omschrijving: "", categorie: "boodschappen", potjeId: null, ts: new Date().toISOString() };
  const potjes = S.potjes.slice().sort((a, b) => a.naam.localeCompare(b.naam));
  bladOpen(bestaat ? "Uitgave bewerken" : "Uitgave loggen", `
    <div class="veld"><label for="u-bedrag">Bedrag</label>
      <input class="invoer" id="u-bedrag" type="number" inputmode="decimal" step="0.01" min="0"
        value="${u.bedrag || ""}" placeholder="0,00" style="font-size:calc(26px * var(--t));font-weight:800;text-align:center"></div>
    <div class="veld"><span class="labeltekst">Waarvoor?</span>
      <div class="keuzerij">${CATEGORIEEN.map(([k, n, kl]) =>
        `<button class="keuze" data-cat="${k}" aria-pressed="${u.categorie === k}"
          style="${u.categorie === k ? `color:${kl};border-color:${kl};background:color-mix(in srgb,${kl} 12%,transparent)` : ""}">${esc(n)}</button>`).join("")}</div></div>
    <div class="veld"><span class="labeltekst">Van welk budget?</span>
      ${potjes.length ? `<div class="keuzerij">
        <button class="keuze" data-potje="" aria-pressed="${!u.potjeId}">Dagbudget</button>
        ${potjes.map(p => `<button class="keuze" data-potje="${p.id}" aria-pressed="${u.potjeId === p.id}"
          style="${u.potjeId === p.id ? `color:${p.kleur};border-color:${p.kleur};background:color-mix(in srgb,${p.kleur} 12%,transparent)` : ""}">${esc(p.naam)}</button>`).join("")}
      </div>
      <div class="klein" id="u-potje-info" style="margin-top:6px"></div>`
      : `<div class="klein">Gaat van je dagbudget af. Je hebt nog geen potjes —
        <button data-act="fin-potje-nieuw" style="color:var(--accent);font-weight:700;text-decoration:underline">maak er een aan</button>
        om een uitgave zoals benzine apart bij te houden.</div>`}</div>
    <div class="veld"><label for="u-oms">Omschrijving (mag leeg)</label>
      <input class="invoer" id="u-oms" type="text" value="${esc(u.omschrijving)}" placeholder="bv. Albert Heijn"></div>
    <div class="veld"><label for="u-datum">Datum</label>
      <input class="invoer" id="u-datum" type="date" value="${u.datum}"></div>
    ${bestaat ? `<button class="knop breed gevaar" id="u-weg" style="margin-top:8px">${ico("prullenbak")} Verwijderen</button>` : ""}
  `, `<button class="knop breed primair" id="u-ok">${bestaat ? "Opslaan" : "Vastleggen"}</button>`);
  const potjeInfoToon = () => {
    const el = $("#u-potje-info"); if (!el) return;
    const gekozen = $$("[data-potje]").find(x => x.getAttribute("aria-pressed") === "true");
    const pid = gekozen ? gekozen.dataset.potje : "";
    if (!pid) { el.textContent = "Gaat van je dagbudget af."; return; }
    const p = vind("potjes", pid);
    el.textContent = p ? `Nog ${eur(potjeOver(p, u.datum))} in ${p.naam} deze maand.` : "";
  };
  $("#bladinhoud").onclick = e => {
    const kCat = e.target.closest("[data-cat]");
    if (kCat) {
      $$("[data-cat]").forEach(x => {
        const aan = x === kCat, kl = catKleur(x.dataset.cat);
        x.setAttribute("aria-pressed", aan);
        x.style.cssText = aan ? `color:${kl};border-color:${kl};background:color-mix(in srgb,${kl} 12%,transparent)` : "";
      });
      return;
    }
    const kPot = e.target.closest("[data-potje]");
    if (kPot) {
      $$("[data-potje]").forEach(x => {
        const aan = x === kPot, p = x.dataset.potje ? vind("potjes", x.dataset.potje) : null;
        x.setAttribute("aria-pressed", aan);
        x.style.cssText = aan && p ? `color:${p.kleur};border-color:${p.kleur};background:color-mix(in srgb,${p.kleur} 12%,transparent)` : "";
      });
      potjeInfoToon();
    }
  };
  potjeInfoToon();
  if (bestaat) $("#u-weg").onclick = () => bevestigVerwijderen(
    async () => { await verwijder("uitgaven", u.id); teken(); toast("Verwijderd"); });
  $("#u-ok").onclick = async () => {
    const n = +$("#u-bedrag").value || 0;
    if (n <= 0) { toast("Vul een bedrag in"); $("#u-bedrag").focus(); return; }
    u.bedrag = n;
    u.omschrijving = $("#u-oms").value.trim();
    u.datum = $("#u-datum").value || vandaagISO();
    const k = $$("[data-cat]").find(x => x.getAttribute("aria-pressed") === "true");
    u.categorie = k ? k.dataset.cat : "overig";
    const kp = $$("[data-potje]").find(x => x.getAttribute("aria-pressed") === "true");
    u.potjeId = kp && kp.dataset.potje ? kp.dataset.potje : null;
    await bewaar("uitgaven", u);
    if (!bestaat) await logGebeurtenis("geld", `${eur(u.bedrag)} · ${u.omschrijving || catNaam(u.categorie)}`, u.id, { datum: u.datum });
    bladSluit(); teken();
    if (u.potjeId) {
      const p = vind("potjes", u.potjeId), over = p ? potjeOver(p, u.datum) : 0;
      toast(p ? (over >= 0 ? `Nog ${eur(over)} in ${p.naam}` : `${eur(-over)} over ${p.naam}`) : "Opgeslagen");
    } else {
      const b = dagbudget(u.datum);
      toast(b.over >= 0 ? `Nog ${eur(b.over)} voor ${u.datum === vandaagISO() ? "vandaag" : "die dag"}` : `${eur(-b.over)} over je dagbudget`);
    }
  };
  setTimeout(() => $("#u-bedrag").focus(), 260);
}

function incassoBlad(id) {
  const bestaat = id ? vind("incassos", id) : null;
  const i = bestaat || {
    id: uid(), naam: "", bedrag: 0, freq: "maand", start: vandaagISO(), actief: true,
    cat: "abonnement", herinner: [3, 0], intensiteit: "zacht", agenda: false
  };

/* ---------- CSV-import vanuit een ingevuld Excel-sjabloon ----------
   Zo kan iemand het sjabloon elke maand invullen, als CSV opslaan
   (Excel doet dat in NL vaak met een puntkomma — dat herkent de app zelf)
   en dat bestand hier uploaden, zonder alles los in de app te hoeven typen. */
const csvKnop = (doel, label) => `<button class="knop klein rand" data-act="fin-csv" data-doel="${doel}">${ico("upload")} ${esc(label || "CSV importeren")}</button>`;

function csvVeld(regel, sep) {
  const velden = []; let veld = "", inQuotes = false;
  for (let i = 0; i < regel.length; i++) {
    const c = regel[i];
    if (inQuotes) {
      if (c === '"') { if (regel[i + 1] === '"') { veld += '"'; i++; } else inQuotes = false; }
      else veld += c;
    } else if (c === '"') inQuotes = true;
    else if (c === sep) { velden.push(veld); veld = ""; }
    else veld += c;
  }
  velden.push(veld);
  return velden;
}
function csvNaarRijen(tekst) {
  const schoon = tekst.replace(/^﻿/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const regels = schoon.split("\n").filter(r => r.trim() !== "");
  if (!regels.length) return [];
  const sep = (regels[0].match(/;/g) || []).length > (regels[0].match(/,/g) || []).length ? ";" : ",";
  const kop = csvVeld(regels[0], sep).map(k => k.trim().toLowerCase());
  return regels.slice(1).map(regel => {
    const velden = csvVeld(regel, sep);
    const rij = {};
    kop.forEach((k, i) => { rij[k] = (velden[i] || "").trim(); });
    return rij;
  });
}
/** Nederlandse en internationale getalnotatie: "1.234,56", "42,50", "42.50", "€ 42,50" mogen allemaal. */
function csvGetal(s) {
  let t = String(s == null ? "" : s).trim().replace(/[€\s]/g, "");
  if (!t) return 0;
  const neg = /^-/.test(t) || /^\(.*\)$/.test(t);
  t = t.replace(/^-/, "").replace(/^\(|\)$/g, "");
  if (t.includes(",") && t.includes(".")) {
    t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  } else if (t.includes(",")) t = t.replace(",", ".");
  const n = parseFloat(t);
  return (isNaN(n) ? 0 : n) * (neg ? -1 : 1);
}
/** yyyy-mm-dd blijft zo. dd-mm-jjjj (met - of /) wordt omgezet — is het eerste getal boven de 12,
    dan kan dat alleen de dag zijn; is juist het tweede boven de 12, dan staat de maand toch eerst
    (bv. een Excel-export in het Engels). Zijn beide 12 of minder, dan gaat de app uit van de
    Nederlandse volgorde dag-maand. Leeg of onherkenbaar → terugvalwaarde. */
function csvDatum(s, terug) {
  const t = String(s || "").trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const m = t.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if (m) {
    let dag = +m[1], maand = +m[2];
    if (maand > 12 && dag <= 12) { const w = dag; dag = maand; maand = w; }
    if (dag >= 1 && dag <= 31 && maand >= 1 && maand <= 12) return `${m[3]}-${pad(maand)}-${pad(dag)}`;
  }
  return terug !== undefined ? terug : vandaagISO();
}
/** Zoek een sleutel op de interne naam of het Nederlandse label, ongeacht hoofdletters. */
function csvSleutel(waarde, lijst, terug) {
  const t = String(waarde || "").trim().toLowerCase();
  if (!t) return terug;
  const m = lijst.find(([k, n]) => k.toLowerCase() === t || String(n || "").toLowerCase() === t);
  return m ? m[0] : terug;
}
function csvJaNee(s, terug) {
  const t = String(s || "").trim().toLowerCase();
  if (!t) return terug;
  return ["ja", "j", "yes", "y", "true", "waar", "1", "actief"].includes(t);
}
/** Zoek, tussen wat al in de app staat (of al eerder in dit bestand is geïmporteerd), de OUDSTE
    dubbeling die aan `gelijk` voldoet — id's beginnen met Date.now() in base36, dus alfabetisch
    sorteren op id geeft ook meteen de oudste eerst. Wordt gebruikt zodat een CSV-import nooit een
    2e versie van dezelfde incasso/uitgave aanmaakt: de oudste bestaande wordt overschreven. */
function csvOudsteDubbeling(lijst, gelijk) {
  return lijst.filter(gelijk).sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0)[0] || null;
}

async function importUitgavenCSV(bestand) {
  const rijen = csvNaarRijen(await bestand.text());
  let nieuw = 0, overschreven = 0; const potjesNietGevonden = new Set();
  for (const r of rijen) {
    const bedrag = csvGetal(r.bedrag);
    if (!bedrag) continue;
    const datum = csvDatum(r.datum);
    const categorie = csvSleutel(r.categorie, CATEGORIEEN, "overig");
    const omschrijving = (r.omschrijving || "").trim();
    let potjeId = null;
    const potjeNaam = (r.potje || "").trim();
    if (potjeNaam) {
      const p = S.potjes.find(x => x.naam.toLowerCase() === potjeNaam.toLowerCase());
      if (p) potjeId = p.id; else potjesNietGevonden.add(potjeNaam);
    }
    const dubbel = csvOudsteDubbeling(S.uitgaven, u =>
      u.datum === datum && Math.abs(u.bedrag - bedrag) < 0.005 && (u.omschrijving || "").trim().toLowerCase() === omschrijving.toLowerCase());
    await bewaar("uitgaven", {
      id: dubbel ? dubbel.id : uid(), datum, bedrag, categorie, omschrijving, potjeId,
      ts: dubbel ? dubbel.ts : new Date().toISOString()
    });
    dubbel ? overschreven++ : nieuw++;
  }
  teken();
  const stukjes = [];
  if (nieuw) stukjes.push(`${nieuw} nieuwe uitgave${nieuw === 1 ? "" : "n"}`);
  if (overschreven) stukjes.push(`${overschreven} dubbele bijgewerkt`);
  toast((stukjes.join(", ") || "Niets geïmporteerd") +
    (potjesNietGevonden.size ? ` — potje niet gevonden: ${[...potjesNietGevonden].join(", ")}` : ""), null, null, 6000);
}

const HERINNER_LIJST = [[7, "week ervoor"], [3, "3 dagen"], [1, "dag ervoor"], [0, "op de dag zelf"]];
async function importIncassosCSV(bestand) {
  const rijen = csvNaarRijen(await bestand.text());
  let nieuw = 0, overschreven = 0;
  for (const r of rijen) {
    const naam = (r.naam || "").trim();
    if (!naam) continue;
    const bedrag = csvGetal(r.bedrag);
    const freq = csvSleutel(r.frequentie, Object.entries(FREQ).map(([k, f]) => [k, f[0]]), "maand");
    const start = csvDatum(r["eerstvolgende datum"] || r.datum, vandaagISO());
    const cat = csvSleutel(r.categorie, VLCATS, "abonnement");
    const herinnerRuw = (r.herinneren || r.herinnering || "").split(/[,;]/).map(x => x.trim().toLowerCase()).filter(Boolean);
    const herinner = herinnerRuw.map(x => {
      const m = HERINNER_LIJST.find(([d, lab]) => String(d) === x || lab === x);
      return m ? m[0] : (/^\d+$/.test(x) ? +x : null);
    }).filter(x => x !== null).sort((a, b) => b - a);
    const intensiteit = csvSleutel(r.nadruk || r.nadrukkelijkheid, Object.entries(INTENSITEIT).map(([k, x]) => [k, x.naam]), "zacht");
    const actief = csvJaNee(r.actief, true);
    // Dubbeling = zelfde naam (ongeacht hoofdletters) — overschrijf de oudste in plaats van
    // er een 2e versie van dezelfde incasso bij te maken.
    const dubbel = csvOudsteDubbeling(S.incassos, i => (i.naam || "").trim().toLowerCase() === naam.toLowerCase());
    await bewaar("incassos", {
      id: dubbel ? dubbel.id : uid(), naam, bedrag, freq, start, cat, herinner, intensiteit, actief,
      agenda: dubbel ? dubbel.agenda : false
    });
    dubbel ? overschreven++ : nieuw++;
  }
  teken();
  const stukjes = [];
  if (nieuw) stukjes.push(`${nieuw} nieuwe post${nieuw === 1 ? "" : "en"}`);
  if (overschreven) stukjes.push(`${overschreven} dubbele bijgewerkt (oudste overschreven)`);
  toast(stukjes.join(", ") || "Niets geïmporteerd", null, null, 5000);
}

async function importDagbudgetCSV(bestand) {
  const rijen = csvNaarRijen(await bestand.text());
  let aantal = 0;
  for (const r of rijen) {
    const bedrag = csvGetal(r.maandbudget || r.bedrag);
    if (!bedrag) continue;
    const maandRuw = (r.maand || "").trim();
    const maand = /^\d{4}-\d{2}$/.test(maandRuw) ? maandRuw : maandSleutel(csvDatum(maandRuw));
    await zetInst("budget_" + maand, bedrag);
    if (csvJaNee(r["ook voor volgende maanden"] || r.standaard, false)) await zetInst("budgetStandaard", bedrag);
    aantal++;
  }
  teken();
  toast(`Dagbudget bijgewerkt voor ${aantal} maand${aantal === 1 ? "" : "en"}`, null, null, 5000);
}

"use strict";
/* ==========================================================================
   37. Vaste lasten — totaal, en een tijdlijn waarop het budget in een
   bakje hangt en leegloopt zodra het een incassodag passeert.
   ========================================================================== */
const VLCATS = [
  ["wonen", "Wonen", "#7a4fd6"],
  ["energie", "Energie & water", "#c2410c"],
  ["verzekering", "Verzekeringen", "#0e7490"],
  ["telecom", "Telefoon & internet", "#2f6fed"],
  ["abonnement", "Abonnementen", "#be185d"],
  ["vervoer", "Vervoer", "#0f8b6c"],
  ["overig", "Overig", "#64748b"]
];
const vlKleur = k => (VLCATS.find(c => c[0] === k) || VLCATS[6])[2];
const vlNaam = k => (VLCATS.find(c => c[0] === k) || VLCATS[6])[1];

/** Wat kost deze vaste last omgerekend per maand? */
function perMaand(i) {
  const b = +i.bedrag || 0;
  if (i.freq === "week") return b * 52 / 12;
  const m = (FREQ[i.freq] || FREQ.maand)[1] || 1;
  return b / m;
}
const vasteLastenTotaal = () => S.incassos.filter(i => i.actief).reduce((s, i) => s + perMaand(i), 0);

/* Het venster van de tijdlijn: 2 dagen terug, vandaag, 10 dagen vooruit. */
const VL_TERUG = 2, VL_VOORUIT = 10;
function vlVenster() {
  const v = vandaagISO();
  const dagen = [];
  for (let i = -VL_TERUG; i <= VL_VOORUIT; i++) {
    const d = plusDagen(v, i);
    const posten = incassosIn(d, d).map(x => x.incasso);
    dagen.push({ datum: d, posten, bedrag: posten.reduce((s, p) => s + (+p.bedrag || 0), 0) });
  }
  return { dagen, vandaagIdx: VL_TERUG, totaal: dagen.reduce((s, d) => s + d.bedrag, 0) };
}

function finVaste() {
  const v = vandaagISO();
  const actief = S.incassos.filter(i => i.actief);
  const maandTotaal = vasteLastenTotaal();
  const { dagen, vandaagIdx, totaal } = vlVenster();
  const maxDag = Math.max(1, ...dagen.map(d => d.bedrag));
  const blokH = (bedrag, dagSom) => {
    const deel = dagSom ? (+bedrag || 0) / dagSom : 1;
    const totaalH = Math.max(18, Math.round(dagSom / maxDag * 86));
    return Math.max(14, Math.round(totaalH * deel));
  };
  const perCat = {};
  actief.forEach(i => { perCat[i.cat || "abonnement"] = (perCat[i.cat || "abonnement"] || 0) + perMaand(i); });
  const cats = Object.entries(perCat).sort((a, b) => b[1] - a[1]);

  let h = `<div class="card card-pad">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div><b style="font-size:calc(15px * var(--t))">Vaste lasten per maand</b>
        <div class="klein">${actief.length} post${actief.length === 1 ? "" : "en"}${maandTotaal ? " · " + eur(maandTotaal * 12) + " per jaar" : ""}</div></div>
      <span style="font-size:calc(23px * var(--t));font-weight:800;letter-spacing:-.02em">${eur(maandTotaal)}</span>
    </div>
    ${cats.length ? `<div style="display:flex;height:11px;border-radius:6px;overflow:hidden;margin-top:11px;gap:2px">
      ${cats.map(([k, n]) => `<i style="flex:${n};background:${vlKleur(k)}"></i>`).join("")}</div>
      <div class="chiprij" style="margin-top:9px">${cats.map(([k, n]) =>
        `<span class="chip" style="color:${vlKleur(k)};background:color-mix(in srgb,${vlKleur(k)} 13%,transparent)">${esc(vlNaam(k))} ${eurKort(n)}</span>`).join("")}</div>` : ""}
  </div>`;

  const csvRij = `<div class="knoprij" style="margin:10px 0 2px">${csvKnop("incasso", "Vaste lasten importeren (CSV)")}</div>`;

  if (!actief.length) {
    return h + `<div class="card">${leeg("🏠", "Nog geen vaste lasten",
      "Zet je huur, energie, verzekeringen en abonnementen erin. Je ziet dan precies wanneer ze van je rekening gaan.")}</div>
      <button class="knop breed primair" data-act="fin-incasso-nieuw">${ico("plus")} Vaste last toevoegen</button>` + csvRij;
  }

  h += `<div class="vl-kaart">
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 2px">
      <b style="font-size:calc(14px * var(--t))">Deze 13 dagen</b>
      <span class="klein">${totaal ? eur(totaal) + " gaat eraf" : "niets ingepland"}</span>
    </div>
    <div class="vl-lijn" id="vl" data-totaal="${totaal}" data-vandaag="${vandaagIdx}"
      data-dagen='${JSON.stringify(dagen.map(d => ({ b: Math.round(d.bedrag * 100) / 100 })))}'>
      <div class="vl-rail"></div>
      <div class="vl-dagen">
        ${dagen.map((d, i) => `<button class="vl-dag${i < vandaagIdx ? " verleden" : ""}${i === vandaagIdx ? " vandaag" : ""}"
            data-act="vl-dag" data-i="${i}" data-datum="${d.datum}"
            aria-label="${esc(datumLabel(d.datum, true))}${d.bedrag ? ": " + eur(d.bedrag) : ""}">
          <span class="blokken">${d.posten.map(p =>
            `<span class="vl-blok" data-i="${i}" style="--k:${vlKleur(p.cat)};height:${blokH(p.bedrag, d.bedrag)}px"
              title="${esc(p.naam)}">${eurKort(p.bedrag)}</span>`).join("")}</span>
          <span class="tik"></span>
          <span class="gat"></span>
          <span class="nr">${parseISO(d.datum).getDate()}</span>
          <span class="dg">${i === vandaagIdx ? "nu" : DAGKORT[weekdagVan(d.datum)]}</span>
        </button>`).join("")}
      </div>
      <div class="vl-bakje" id="vl-bakje" style="left:0">
        <span class="vl-haak"></span>
        <span class="vl-touw"></span>
        <span class="vl-pot" id="vl-pot"><small>nog af te schrijven</small><span id="vl-bedrag">${eur(totaal)}</span></span>
      </div>
    </div>
    <div class="vl-legenda">
      <span><i style="background:#0f766e"></i>komt nog</span>
      <span><i style="background:#0f766e;opacity:.42"></i>al afgeschreven</span>
      <span>tik op een dag om het bakje te verplaatsen</span>
    </div>
  </div>`;

  h += `<button class="knop breed primair" style="margin:12px 0 4px" data-act="fin-incasso-nieuw">${ico("plus")} Vaste last toevoegen</button>` + csvRij;

  VLCATS.forEach(([k, naam]) => {
    const lijst = actief.filter(i => (i.cat || "abonnement") === k).sort((a, b) => perMaand(b) - perMaand(a));
    if (!lijst.length) return;
    h += sectie(naam, eur(lijst.reduce((s, i) => s + perMaand(i), 0)) + " p/m");
    h += `<div class="card">${lijst.map(i => {
      const d = volgendeIncasso(i);
      return `<button class="vl-rij" data-act="fin-incasso-open" data-id="${i.id}">
        <span class="kleurbol" style="background:${vlKleur(i.cat)};width:10px;height:10px"></span>
        <span class="nm"><b>${esc(i.naam)}</b>
          <span class="klein" style="display:block">${esc((FREQ[i.freq] || FREQ.maand)[0])}${d ? " · volgende " + esc(datumLabel(d)) : ""}</span></span>
        <span class="rechts" style="text-align:right">
          <b style="font-weight:700">${eur(i.bedrag)}</b>
          ${i.freq !== "maand" ? `<span class="klein" style="display:block">${eur(perMaand(i))} p/m</span>` : ""}</span>
      </button>`;
    }).join("")}</div>`;
  });

  const gestopt = S.incassos.filter(i => !i.actief);
  if (gestopt.length) {
    h += sectie("Gestopt", gestopt.length);
    h += `<div class="card">${gestopt.map(i => `<button class="vl-rij" data-act="fin-incasso-open" data-id="${i.id}">
      <span class="kleurbol" style="background:var(--line2);width:10px;height:10px"></span>
      <span class="nm"><b style="color:var(--muted)">${esc(i.naam)}</b></span>
      <span class="rechts">${eur(i.bedrag)}</span></button>`).join("")}</div>`;
  }

  const b = dagbudget(v);
  h += `<div class="card card-pad klein" style="margin-top:12px">
    <p><b>Wat zegt dit getal?</b> ${eur(maandTotaal)} per maand gaat automatisch van je rekening.
    ${b.maand ? `Naast je maandbudget van ${eur(b.maand)} ${inst("budgetIncasso", false)
      ? "— en die is al gereserveerd in je dagbudget."
      : `— zet <i>Incasso's reserveren</i> aan bij Dagbudget als je dat eraf wilt halen.`}` : ""}</p>
  </div>`;
  return h;
}

/* ---------- De animatie: het bakje glijdt naar vandaag en loopt leeg ---------- */
/** Het touwtje hangt boven de dag; het bakje schuift bij de randen naar binnen. */
function plaatsBakje(wrap, bak, pot, pos, n) {
  const breed = wrap.clientWidth || 1;
  const x = (pos + 0.5) / n * breed;
  bak.style.left = x.toFixed(1) + "px";
  bak.style.transform = "translateX(-50%)";
  const potB = pot.offsetWidth || 120;
  const doel = clamp(x, potB / 2 + 2, breed - potB / 2 - 2);
  pot.style.left = (doel - x).toFixed(1) + "px";
}

function vlAnimatie() {
  const wrap = $("#vl");
  if (!wrap) return;
  let dagen;
  try { dagen = JSON.parse(wrap.dataset.dagen); } catch (e) { return; }
  const totaal = +wrap.dataset.totaal || 0;
  const doel = +wrap.dataset.vandaag || 0;
  const bak = $("#vl-bakje"), veld = $("#vl-bedrag"), pot = $("#vl-pot");
  const n = dagen.length;

  const zet = pos => {
    plaatsBakje(wrap, bak, pot, pos, n);
    let rest = totaal;
    dagen.forEach((d, i) => { if (i <= pos + 0.0001) rest -= d.b; });
    rest = Math.max(0, Math.round(rest * 100) / 100);
    veld.textContent = eur(rest);
    pot.classList.toggle("leeg", rest < 0.005);
    $$(".vl-blok", wrap).forEach(b => b.classList.toggle("betaald", +b.dataset.i <= pos + 0.0001));
  };

  const stil = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (stil || !doel) {
    bak.classList.add("glij");
    zet(doel);
    return;
  }
  bak.classList.remove("glij");
  zet(0);
  const duur = 420 + doel * 300;
  const t0 = performance.now();
  const stap = now => {
    const p = clamp((now - t0) / duur, 0, 1);
    zet((1 - Math.pow(1 - p, 3)) * doel);
    if (p < 1) requestAnimationFrame(stap);
    else { zet(doel); bak.classList.add("glij"); }
  };
  requestAnimationFrame(stap);
}

const _naTekenen16 = naTekenen;
naTekenen = function () {
  _naTekenen16();
  if (V.view === "financieel" && (V.finModus || "budget") === "vast") vlAnimatie();
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act='vl-dag']");
  if (!el) return;
  const wrap = $("#vl");
  if (!wrap) return;
  const i = +el.dataset.i;
  const bak = $("#vl-bakje"), pot = $("#vl-pot");
  bak.classList.add("glij");
  let dagen;
  try { dagen = JSON.parse(wrap.dataset.dagen); } catch (err) { return; }
  const totaal = +wrap.dataset.totaal || 0;
  plaatsBakje(wrap, bak, pot, i, dagen.length);
  let rest = totaal;
  dagen.forEach((d, k) => { if (k <= i) rest -= d.b; });
  rest = Math.max(0, Math.round(rest * 100) / 100);
  $("#vl-bedrag").textContent = eur(rest);
  $("#vl-pot").classList.toggle("leeg", rest < 0.005);
  $$(".vl-blok", wrap).forEach(b => b.classList.toggle("betaald", +b.dataset.i <= i));
  const d = el.dataset.datum;
  const posten = incassosIn(d, d);
  tril(6);
  if (posten.length) toast(datumLabel(d) + ": " + posten.map(x => x.incasso.naam + " " + eur(x.incasso.bedrag)).join(", "));
});
</script>
<script>
"use strict";
/* ==========================================================================
   38. Stoppen met roken — sinds wanneer, wat het scheelt, en een widget
   op het startscherm.
   ========================================================================== */
const DAGEN_PER_MAAND = 30.4375;

/** Alles wat we kunnen uitrekenen over het stoppen. */
function rookCijfers() {
  const stop = inst("rookStop", null);
  if (!stop) return null;
  const prijs = +inst("rookPrijs", 0) || 0;
  const pakjesMaand = +inst("rookPakjes", 0) || 0;
  const perPakje = +inst("rookPerPakje", 20) || 20;
  const start = new Date(stop).getTime();
  const nu = Date.now();
  const ms = Math.max(0, nu - start);
  const dagen = ms / 86400000;
  const pakjesDag = pakjesMaand / DAGEN_PER_MAAND;
  const sigDag = pakjesDag * perPakje;
  return {
    stop, start, ms, dagen,
    heleDagen: Math.floor(dagen),
    uren: Math.floor(ms / 3600000),
    prijs, pakjesMaand, perPakje, pakjesDag, sigDag,
    perDag: pakjesDag * prijs,
    perMaand: pakjesMaand * prijs,
    perJaar: pakjesMaand * prijs * 12,
    bespaard: pakjesDag * prijs * dagen,
    sigaretten: sigDag * dagen,
    pakjes: pakjesDag * dagen
  };
}

const MIJLPALEN = [
  [1, "Eerste dag"], [3, "Drie dagen"], [7, "Een week"], [14, "Twee weken"],
  [30, "Een maand"], [90, "Drie maanden"], [182, "Een half jaar"],
  [365, "Een jaar"], [730, "Twee jaar"], [1825, "Vijf jaar"]
];
function rookMijlpaal(dagen) {
  const gehaald = MIJLPALEN.filter(m => dagen >= m[0]);
  const volgende = MIJLPALEN.find(m => dagen < m[0]);
  return { gehaald, laatste: gehaald[gehaald.length - 1] || null, volgende };
}
const getal = n => Math.round(n).toLocaleString("nl-NL");

/* ---------- De widget op het startscherm ---------- */
function rokenWidget() {
  const c = rookCijfers();
  if (!c || !inst("rookWidget", true)) return "";
  const m = rookMijlpaal(c.dagen);
  return `<button class="rookwidget" data-act="ga" data-view="roken">
    <svg class="ill" viewBox="0 0 100 80" aria-hidden="true"><use href="#ill-rook"/></svg>
    <span class="kop">
      <span class="lb">${ico("blad")} Rookvrij sinds ${esc(datumLabel(c.stop.slice(0, 10)))}</span>
      <span class="dg">${c.heleDagen >= 1 ? c.heleDagen + " dag" + (c.heleDagen === 1 ? "" : "en") : c.uren + " uur"}</span>
    </span>
    <span class="cijfers">
      <span class="cf"><b id="rw-geld">${eur(c.bespaard)}</b><span>bespaard</span></span>
      <span class="cf"><b id="rw-sig">${getal(c.sigaretten)}</b><span>niet gerookt</span></span>
    </span>
    ${m.volgende ? `<span class="volgende">Volgende mijlpaal: ${esc(m.volgende[1])} — nog ${Math.ceil(m.volgende[0] - c.dagen)} dag${Math.ceil(m.volgende[0] - c.dagen) === 1 ? "" : "en"}</span>` : ""}
  </button>`;
}
const _vwStart17 = vwStart;
vwStart = function () {
  const h = _vwStart17();
  const w = rokenWidget();
  if (!w) return h;
  // net onder het dagpaneel, boven de knoppen
  return h.includes('<div class="startgrid">') ? h.replace('<div class="startgrid">', w + '<div class="startgrid">') : w + h;
};

/* ---------- Het volledige scherm ---------- */
function vwRoken() {
  const c = rookCijfers();
  if (!c) {
    return `<div class="card card-pad" style="text-align:center;padding:26px 18px">
        <div style="font-size:42px">🌱</div>
        <h2 style="margin:8px 0 4px;font-size:calc(19px * var(--t))">Rookvrij</h2>
        <p class="klein">Vul in wanneer je gestopt bent, wat een pakje kostte en hoeveel pakjes je per maand rookte.
        De app rekent dan bij hoeveel je bespaart en hoeveel sigaretten je niet hebt gerookt.</p>
        <button class="knop breed primair" style="margin-top:14px" data-act="rook-instellen">${ico("plus")} Instellen</button>
      </div>
      <div class="card card-pad klein">
        <p>Alles blijft op dit toestel. Er gaat niets naar een server, en niemand ziet het behalve jij.</p>
      </div>`;
  }
  const m = rookMijlpaal(c.dagen);
  const doel = +inst("rookDoel", 0) || 0;
  const doelNaam = inst("rookDoelNaam", "");
  const pct = doel ? clamp(Math.round(c.bespaard / doel * 100), 0, 100) : 0;

  let h = `<div class="rookkaart">
    <svg class="ill" viewBox="0 0 100 80" aria-hidden="true"><use href="#ill-rook"/></svg>
    <div class="lb">${ico("blad")} Rookvrij sinds ${esc(langDatumLabel(c.stop.slice(0, 10)))}</div>
    <div class="groot" id="rk-dagen">${c.heleDagen >= 1 ? c.heleDagen : c.uren}</div>
    <div class="lb">${c.heleDagen >= 1 ? (c.heleDagen === 1 ? "dag" : "dagen") : (c.uren === 1 ? "uur" : "uur")} volgehouden</div>
  </div>`;

  h += `<div class="stats" style="grid-template-columns:1fr 1fr;margin-top:10px">
    <div class="stat"><div class="getal" id="rk-geld" style="color:var(--green)">${eur(c.bespaard)}</div><div class="lab">bespaard</div></div>
    <div class="stat"><div class="getal" id="rk-sig">${getal(c.sigaretten)}</div><div class="lab">sigaretten niet gerookt</div></div>
    <div class="stat"><div class="getal">${getal(c.pakjes)}</div><div class="lab">pakjes niet gekocht</div></div>
    <div class="stat"><div class="getal">${eur(c.perDag)}</div><div class="lab">per dag</div></div>
  </div>`;

  if (doel) {
    h += sectie("Spaardoel", pct + "%");
    h += `<div class="card card-pad">
      <div style="display:flex;justify-content:space-between;font-size:calc(14px * var(--t))">
        <span>${esc(doelNaam || "Mijn doel")}</span><b>${eur(c.bespaard)} van ${eur(doel)}</b></div>
      <div class="balk" style="margin-top:6px;height:10px"><i style="width:${pct}%"></i></div>
      <div class="klein" style="margin-top:6px">${c.bespaard >= doel
        ? "Gehaald. Koop het maar."
        : `Nog ${eur(doel - c.bespaard)} te gaan — dat duurt ongeveer ${Math.ceil((doel - c.bespaard) / Math.max(0.01, c.perDag))} dagen.`}</div>
    </div>`;
  }

  h += sectie("Als je zo doorgaat");
  h += `<div class="card">
    <div class="rijknop"><span class="nm">Over een week</span><span class="rechts">${eur(c.perDag * 7)} · ${getal(c.sigDag * 7)} sigaretten</span></div>
    <div class="rijknop"><span class="nm">Over een maand</span><span class="rechts">${eur(c.perMaand)} · ${getal(c.sigDag * DAGEN_PER_MAAND)} sigaretten</span></div>
    <div class="rijknop"><span class="nm">Over een jaar</span><span class="rechts">${eur(c.perJaar)} · ${getal(c.sigDag * 365)} sigaretten</span></div>
  </div>`;

  h += sectie("Mijlpalen", m.gehaald.length + " van " + MIJLPALEN.length);
  h += `<div class="card card-pad"><div class="mijlrij">
    ${MIJLPALEN.map(mp => {
      const af = c.dagen >= mp[0];
      return `<span class="mijl${af ? " af" : ""}">
        <b>${af ? ico("check", "width:13px;height:13px") : mp[0] >= 365 ? Math.round(mp[0] / 365) + "j" : mp[0] + "d"}</b>
        <small>${esc(mp[1])}</small></span>`;
    }).join("")}
  </div>${m.volgende ? `<div class="klein" style="margin-top:10px">Volgende: <b>${esc(m.volgende[1])}</b> over ${Math.ceil(m.volgende[0] - c.dagen)} dagen.</div>` : `<div class="klein" style="margin-top:10px">Alle mijlpalen gehaald. Chapeau.</div>`}</div>`;

  h += sectie("Jouw cijfers");
  h += `<div class="card card-pad klein">
    <p><b>${eur(c.prijs)}</b> per pakje · <b>${c.pakjesMaand}</b> pakjes per maand · <b>${c.perPakje}</b> sigaretten per pakje</p>
    <p>Dat is ${c.pakjesDag.toFixed(2)} pakje per dag, ofwel ${Math.round(c.sigDag)} sigaretten per dag en
    ${getal(c.sigDag * 365)} per jaar die je niet meer rookt.</p>
    <p style="color:var(--muted)">De bedragen zijn een schatting op basis van wat je invulde — ze zijn niet gekoppeld aan je bankrekening.</p>
  </div>`;

  h += `<div class="knoprij" style="margin-top:14px">
    <button class="knop rand" data-act="rook-instellen">${ico("pen")} Gegevens aanpassen</button>
    <button class="knop rand" data-act="rook-doel">${ico("ster")} Spaardoel</button>
  </div>
  <div class="knoprij" style="margin-top:9px">
    <button class="knop rand" data-act="rook-log">${ico("boek")} In logboek zetten</button>
    <button class="knop gevaar" data-act="rook-opnieuw">${ico("herhaal")} Opnieuw beginnen</button>
  </div>
  <div class="klein" style="text-align:center;margin-top:12px">
    Terugval hoort er soms bij. Zet de teller opnieuw en ga verder — wat je tot nu toe niet rookte, blijft gewoon staan.
  </div>`;
  return h;
}

/* ---------- Instelblad ---------- */
function rookBlad() {
  const stop = inst("rookStop", null);
  const d = stop ? stop.slice(0, 10) : vandaagISO();
  const t = stop ? stop.slice(11, 16) : "08:00";
  bladOpen("Stoppen met roken", `
    <div class="rij2">
      <div class="veld"><label for="r-datum">Gestopt op</label>
        <input class="invoer" id="r-datum" type="date" value="${d}" max="${vandaagISO()}"></div>
      <div class="veld"><label for="r-tijd">Rond</label>
        <input class="invoer" id="r-tijd" type="time" value="${t}"></div>
    </div>
    <div class="chiprij" style="margin:-6px 0 12px">
      ${[["Vandaag", 0], ["Gisteren", 1], ["Een week geleden", 7], ["Een maand geleden", 30]].map(([n, x]) =>

let rookTik = null;
function rookTikStart() {

  if (!$("#rw-geld") && !$("#rk-geld")) return;
  rookTik = setInterval(() => {
    const c = rookCijfers();
    if (!c) { clearInterval(rookTik); return; }
    const zet = (id, w) => { const e = $(id); if (e) e.textContent = w; };
    zet("#rw-geld", eur(c.bespaard)); zet("#rw-sig", getal(c.sigaretten));

  }, 5000);
}
const _naTekenen17 = naTekenen;
naTekenen = function () {

};

/* ---------- Acties ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");

  const act = el.dataset.act;
  if (act === "rook-instellen") rookBlad();

    bladVraag("Spaardoel", inst("rookDoelNaam", ""), "Bv. Weekendje weg 400", async tekst => {
      if (!tekst) { await zetInst("rookDoel", 0); await zetInst("rookDoelNaam", ""); teken(); return; }
      const m = tekst.match(/(\d+(?:[.,]\d{1,2})?)\s*$/);
      const bedrag = m ? parseFloat(m[1].replace(",", ".")) : 0;
      if (!bedrag) { toast("Zet het bedrag aan het eind, bv. “Nieuwe fiets 400”"); return; }
      await zetInst("rookDoel", bedrag);
      await zetInst("rookDoelNaam", tekst.replace(/\s*\d+(?:[.,]\d{1,2})?\s*$/, "").trim());
      teken(); toast("Doel: " + eur(bedrag));
    });
  } else if (act === "rook-log") {
    const c = rookCijfers();
    if (!c) return;
    await logGebeurtenis("notitie",
      `${c.heleDagen} dagen rookvrij · ${eur(c.bespaard)} bespaard · ${getal(c.sigaretten)} sigaretten niet gerookt`);

      });
  }
});

function vsLogsOp(datum) { return S.vs_logs.filter(l => l.datum === datum); }

  const logs = vsLogsOp(datum).filter(l => l.moment !== "water");
  const water = vsLogsOp(datum).filter(l => l.moment === "water").reduce((s, l) => s + (l.ml || 0), 0);
  const groente = logs.reduce((s, l) => s + (l.groenteFruitGram || 0), 0);
  return {
    kcal: logs.reduce((s, l) => s + l.kcal, 0),
    eiwit: logs.reduce((s, l) => s + l.eiwit, 0),
    vet: logs.reduce((s, l) => s + l.vet, 0),
    kh: logs.reduce((s, l) => s + l.kh, 0),

}
function vsIsTrainingsdag(datum) {
  return typeof vsSportOccurrences === "function" && vsSportOccurrences(datum, datum).length > 0;
}
function vsKcalDoelVandaag(datum) {
  const d = vsDoelen();

/* ---------- Sportplanning: herhalende en losse trainingen ---------- */
const VS_SPORTSOORT = { kracht: "Kracht", cardio: "Cardio", sportles: "Sportles", algemeen: "Algemeen" };
function vsSportInPauze(s, datum) {
  return s.pauzeVan && s.pauzeTot && datum >= s.pauzeVan && datum <= s.pauzeTot;
}
/** Alle keren dat er gesport moet worden tussen van en tot (incl.). */
function vsSportOccurrences(van, tot) {
  const uit = [];
  S.vs_sport.forEach(s => {
    if (!s.datum) return;
    const voegToe = d => {
      if (d < van || d > tot) return;
      if (s.eindigt === "op" && s.eindDatum && d > s.eindDatum) return;
      if (vsSportInPauze(s, d)) return;
      uit.push({ datum: d, sportId: s.id, titel: s.titel, tijd: s.tijd || "", duurMin: s.duurMin || 60, soort: s.soort });
    };
    if (!s.herhaal) { voegToe(s.datum); return; }
    let d = s.datum >= van ? s.datum : van;
    // begin bij de eerst mogelijke herhaling op of na "van"
    if (d > s.datum) {
      let k = s.datum;
      for (let i = 0; i < 400 && k < van; i++) k = volgendeDatum(k, s.herhaal);
      d = k;
    }
    for (let i = 0; i < 400 && d && d <= tot; i++) { voegToe(d); d = volgendeDatum(d, s.herhaal); }
  });
  uit.sort((a, b) => a.datum === b.datum ? (a.tijd || "").localeCompare(b.tijd || "") : (a.datum < b.datum ? -1 : 1));
  return uit;
}
function vsSportVandaag() { return vsSportOccurrences(vandaagISO(), vandaagISO()); }
function vsSportStatus(sportId, datum) {

  const bestaand = S.vs_sportlog.find(x => x.sportId === sportId && x.datum === datum);
  const l = bestaand || { id: uid(), sportId, datum };
  l.status = status; l.ts = new Date().toISOString();
  await bewaar("vs_sportlog", l);
  return l;
}
function vsSportWeekTelling() {
  const v = vandaagISO(), ws = weekStart(v);
  const dezeWeek = vsSportOccurrences(ws, plusDagen(ws, 6));

/* ---------- Weergave: Gezondheid ---------- */
function vwGezondheid() {
  const m = V.vsModus || "vandaag";
  let h = `<div class="segment vier" style="margin:2px 0 2px">
    ${[["vandaag", "Vandaag"], ["loggen", "Loggen"], ["doelen", "Doelen"], ["planning", "Planning"]].map(([k, l]) =>
      `<button data-act="vs" data-m="${k}" aria-pressed="${m === k}">${l}</button>`).join("")}</div>`;
  return h + (m === "loggen" ? vsVwLoggen() : m === "doelen" ? vsVwDoelen() : m === "planning" ? vsVwPlanning() : vsVwVandaag());
}

function vsVwVandaag() {
  const v = vandaagISO(), c = vsCijfersOp(v), d = vsDoelen(), kd = vsKcalDoelVandaag(v);
  const kcalPct = clamp(Math.round(c.kcal / kd.max * 100), 0, 100);
  const eiwitPct = clamp(Math.round(c.eiwit / d.eiwit * 100), 0, 100);
  const waterPct = clamp(Math.round(c.water / d.water * 100), 0, 100);
  const sportVandaag = vsSportVandaag();

  let h = `<div class="vs-ringen">
    <div class="vs-ring-item"><div class="ring" style="--p:${kcalPct};--rc:var(--gezond)"><span><b>${getal(c.kcal)}</b><small>/ ${getal(kd.max)}</small></span></div><div class="lab">kcal</div></div>
    <div class="vs-ring-item"><div class="ring" style="--p:${eiwitPct};--rc:var(--accent)"><span><b>${getal(Math.round(c.eiwit))}</b><small>/ ${getal(d.eiwit)} g</small></span></div><div class="lab">eiwit</div></div>
    <div class="vs-ring-item"><div class="ring" style="--p:${waterPct};--rc:#0ea5e9"><span><b>${(c.water / 1000).toFixed(1)}</b><small>/ ${(d.water / 1000).toFixed(1)} L</small></span></div><div class="lab">water</div></div>
  </div>`;

  h += `<div class="vs-macro">
    <span class="lab">Koolhydraten</span><div class="balk"><i style="width:${clamp(c.kh / d.kh * 100, 0, 100)}%"></i></div>
    <span class="waarde">${getal(Math.round(c.kh))}/${getal(d.kh)} g</span></div>
  <div class="vs-macro">
    <span class="lab">Vet</span><div class="balk"><i style="width:${clamp(c.vet / d.vet * 100, 0, 100)}%"></i></div>
    <span class="waarde">${getal(Math.round(c.vet))}/${getal(d.vet)} g</span></div>
  <div class="vs-macro">
    <span class="lab">Groente/fruit</span><div class="balk"><i style="width:${clamp(c.groente / d.groente * 100, 0, 100)}%"></i></div>
    <span class="waarde">${getal(c.groente)}/${getal(d.groente)} g</span></div>`;

  h += `<div class="knoprij" style="margin-top:10px;flex-wrap:wrap">
    <button class="knop klein rand" data-act="vs-water" data-ml="250">${ico("druppel", "width:15px;height:15px")} +250 ml</button>
    <button class="knop klein rand" data-act="vs-water" data-ml="500">${ico("druppel", "width:15px;height:15px")} +500 ml</button>
  </div>`;

  if (sportVandaag.length) {
    sportVandaag.forEach(o => {
      const st = vsSportStatus(o.sportId, v);
      h += `<button class="banner ${st === "gedaan" ? "blauw" : "rood"}" style="width:100%;text-align:left;margin-top:10px" data-act="ga" data-view="gezondheid">
        ${ico(st === "gedaan" ? "check" : "sport")}
        <span style="flex:1"><b>${st === "gedaan" ? "Training gedaan" : "Trainingsdag"}</b>${esc(o.titel)}${o.tijd ? " · " + esc(o.tijd) : ""}${kd.bonus ? " · doel +" + kd.bonus + " kcal · eet 1–3 uur vooraf koolhydraten" : ""}</span>
        ${st === "gedaan" ? "" : `<span data-act="vs-sport-vink" data-id="${o.sportId}" data-datum="${o.datum}" style="display:flex">${ico("check")}</span>`}
      </button>`;
    });
  }

  const MOMENTEN = ["ontbijt", "lunch", "diner", "tussendoor"];
  MOMENTEN.forEach(m => {
    const items = c.logs.filter(l => l.moment === m);
    const kcal = items.reduce((s, l) => s + l.kcal, 0);
    h += `<div class="vs-maaltijd">
      <div class="kop"><b>${vsMoment(m)}</b><span>${kcal ? getal(kcal) + " kcal" : ""}</span></div>
      ${items.map(l => `<div class="vs-item">
        <span class="nm">${esc(l.naam)}<small>${esc(l.label)}</small></span>
        <span class="kc">${getal(l.kcal)} kcal</span>
        <button class="icon-btn" style="min-width:30px;min-height:30px" data-act="vs-log-weg" data-id="${l.id}">${ico("x", "width:14px;height:14px")}</button>
      </div>`).join("")}
      <button class="vs-toevoeg" data-act="vs-log" data-moment="${m}">${ico("plus", "width:15px;height:15px")} Toevoegen</button>
    </div>`;
  });
  return h;
}

function vsZoekrij(p) {

    ${ico("pijlr", "width:15px;height:15px;color:var(--line2)")}

function vsVwDoelen() {
  const d = vsDoelen(), reeks = vsWeekReeks(14);
  const gem = Math.round(reeks.reduce((s, r) => s + r.kcal, 0) / reeks.length) || 0;
  const max = Math.max(d.kcalMax, ...reeks.map(r => r.kcal), 1);
  const sportW = vsSportWeekTelling();
  const gewicht = vsGewichtReeks(30);
  const trend = vsGewichtTrend();

  let h = `<div class="card card-pad">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b style="font-size:calc(15px * var(--t))">Energie per dag</b>
      <span class="klein">gem. ${getal(gem)}</span>
    </div>
    <div class="grafiek">
      ${reeks.map(r => `<div class="kolom"><span class="staaf" style="height:${Math.max(3, Math.round(r.kcal / max * 100))}%;background:${r.kcal >= d.kcalMin && r.kcal <= d.kcalMax ? "var(--gezond)" : "var(--amber)"}"></span><span class="dag">${DAGKORT[weekdagVan(r.datum)]}</span></div>`).join("")}
    </div>
    <div class="klein" style="margin-top:6px">Doel: ${getal(d.kcalMin)}–${getal(d.kcalMax)} kcal per dag.</div>
  </div>`;

  h += `<div class="card card-pad">
    <b style="font-size:calc(15px * var(--t))">Sporten</b>
    <div class="klein" style="margin-top:2px">${sportW.gedaan} van de ${sportW.totaal || d.sportPerWeek} deze week · doel ${d.sportPerWeek}× per week</div>
    <div class="balk" style="margin-top:8px"><i style="width:${clamp((sportW.gedaan / (d.sportPerWeek || 1)) * 100, 0, 100)}%"></i></div>
  </div>`;

  h += `<div class="card card-pad">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b style="font-size:calc(15px * var(--t))">Gewicht · trend</b>
      ${trend != null ? `<span class="klein" style="color:${trend <= 0 ? "var(--gezond)" : "var(--muted)"}">${trend > 0 ? "+" : ""}${trend} kg</span>` : ""}
    </div>
    ${gewicht.length >= 2 ? vsLijnSvg(gewicht) : `<div class="klein" style="margin-top:8px">Nog geen twee metingen om een trend te tonen.</div>`}
    <button class="knop klein rand" style="margin-top:10px" data-act="vs-gewicht">${ico("weegschaal", "width:15px;height:15px")} Gewicht loggen</button>
  </div>`;

  h += vsWeekevaluatie();

  h += `<button class="knop breed rand" style="margin-top:4px" data-act="vs-doelen-bewerk">${ico("doel")} Doelen aanpassen</button>`;
  return h;
}
function vsLijnSvg(reeks) {
  const w = 300, hh = 60, kgs = reeks.map(r => r.kg), min = Math.min(...kgs), max = Math.max(...kgs);
  const spreiding = Math.max(0.2, max - min);
  const pts = reeks.map((r, i) => {
    const x = reeks.length > 1 ? (i / (reeks.length - 1)) * w : 0;
    const y = hh - ((r.kg - min) / spreiding) * (hh - 10) - 5;
    return x + "," + y;
  }).join(" ");
  return `<div class="vs-lijn"><svg viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--gezond)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg></div>`;
}
function vsWeekevaluatie() {
  const v = vandaagISO(), ws = weekStart(v);
  if (v !== plusDagen(ws, 6) && weekdagVan(v) !== 0) return ""; // alleen tonen rond het einde van de week (zondag)
  const reeks = Array.from({ length: 7 }, (_, i) => plusDagen(ws, i)).map(vsCijfersOp);
  const d = vsDoelen();
  const dagenBinnenDoel = reeks.filter(r => r.kcal >= d.kcalMin && r.kcal <= d.kcalMax).length;
  const gemEiwit = Math.round(reeks.reduce((s, r) => s + r.eiwit, 0) / 7);
  const sportW = vsSportWeekTelling();
  const tip = gemEiwit < d.eiwit * 0.8
    ? "Tip: plan wat vaker een eiwitrijk moment, zoals kwark of vis."
    : sportW.gedaan < sportW.totaal
      ? "Tip: er staat deze week nog een training open."
      : "Mooi op schema deze week.";
  return `<div class="card card-pad">
    <b style="font-size:calc(15px * var(--t))">Weekevaluatie</b>
    <div class="klein" style="margin-top:6px">
      ${dagenBinnenDoel} van de 7 dagen binnen je energiedoel · gemiddeld ${gemEiwit} g eiwit per dag · ${sportW.gedaan}/${sportW.totaal || d.sportPerWeek} keer gesport.
      <br>${tip}
    </div>
  </div>`;
}

function vsVwPlanning() {
  const modus = V.vsPlanModus || "week";
  const v = vandaagISO();
  let h = `<div class="segment" style="margin:2px 0 10px">
    ${[["week", "Week"], ["lijst", "Lijst"], ["reeksen", "Reeksen"]].map(([k, l]) =>
      `<button data-act="vs-planmodus" data-m="${k}" aria-pressed="${modus === k}">${l}</button>`).join("")}
  </div>`;

  if (modus === "reeksen") {
    if (!S.vs_sport.length) h += `<div class="card">${leeg("🏃", "Nog geen sportreeks", "Maak een herhalende training of een losse sportafspraak.")}</div>`;
    else h += `<div class="card">${S.vs_sport.map(s => {
      const w = vsSportOccurrences(v, plusDagen(v, 90));
      const gedaan = w.filter(o => o.sportId === s.id && vsSportStatus(o.sportId, o.datum) === "gedaan").length;
      const gepland = w.filter(o => o.sportId === s.id).length;
      return `<button class="vs-sportkaart" data-act="vs-sport-open" data-id="${s.id}" style="width:100%;text-align:left;border-top:1px solid var(--line)">
        <span class="dot"></span>
        <span class="nm"><b>${esc(s.titel)}</b><small>${VS_SPORTSOORT[s.soort] || ""} · ${s.herhaal ? esc(herhaalTekst(s.herhaal)) : "eenmalig"}${s.pauzeVan ? " · gepauzeerd" : ""}</small></span>
        <span class="klein">${gedaan}/${gepland || 1}</span>
      </button>`;
    }).join("")}</div>`;
  } else {
    const tot = modus === "week" ? plusDagen(v, 6) : plusDagen(v, 60);
    const van = modus === "week" ? weekStart(v) : v;
    const occ = vsSportOccurrences(van, tot);
    if (!occ.length) h += `<div class="card">${leeg("🏃", "Niets gepland", "Zet een vaste training neer — die verschijnt vanzelf op je tijdlijn.")}</div>`;
    else h += `<div class="card">${occ.map(o => {
      const st = vsSportStatus(o.sportId, o.datum);
      return `<button class="vs-sportkaart" data-act="vs-sport-open" data-id="${o.sportId}" style="width:100%;text-align:left;border-top:1px solid var(--line)">
        <span class="dot" style="${st === "gedaan" ? "background:var(--line2)" : ""}"></span>
        <span class="nm"><b>${esc(datumLabel(o.datum, true))}${o.tijd ? " · " + esc(o.tijd) : ""}</b><small>${esc(o.titel)}${st === "gedaan" ? " · gedaan" : ""}</small></span>
      </button>`;
    }).join("")}</div>`;
  }

  h += `<div class="knoprij" style="margin-top:12px;flex-wrap:wrap">
    <button class="knop rand" data-act="vs-sport-nieuw">${ico("plus")} Nieuwe sportafspraak</button>
    <button class="knop rand" data-act="vs-sport-export">${ico("komend")} Exporteer naar Agenda</button>
  </div>`;
  return h;
}

/* ---------- Blad: eten loggen (portie kiezen) ---------- */
function vsLogBlad(product, moment) {
  const portie = product.portie || 100, eenheid = product.eenheid || "portie";
  bladOpen("Toevoegen aan " + vsMoment(moment), `
    <div class="klein" style="margin-bottom:6px"><b>${esc(product.naam)}</b> · ${getal(product.kcal100)} kcal / 100 g</div>
    <div class="rij3" id="vs-portiekeuze">
      ${[0.5, 1, 1.5, 2].map(f => `<button class="keuze" data-portiefactor="${f}" aria-pressed="${f === 1}">${f}×</button>`).join("")}
      <button class="keuze" data-portiefactor="eigen">gram</button>
    </div>
    <div class="veld" id="vs-gramveld" style="display:none;margin-top:10px">
      <label for="vs-gram">Aantal gram</label>
      <input class="invoer" id="vs-gram" type="number" min="1" max="2000" inputmode="numeric" value="${portie}">
    </div>
    <div class="card card-pad" style="margin-top:12px" id="vs-preview"></div>
  `, `<button class="knop breed primair" id="vs-log-ok">Toevoegen</button>`);
  let gram = portie;
  const preview = () => {
    const f = gram / 100;
    $("#vs-preview").innerHTML = `<div class="rij3" style="text-align:center">
      <div><b>${Math.round(product.kcal100 * f)}</b><div class="klein">kcal</div></div>
      <div><b>${(product.eiwit100 * f).toFixed(1)}g</b><div class="klein">eiwit</div></div>
      <div><b>${(product.kh100 * f).toFixed(1)}g</b><div class="klein">kh</div></div>
    </div>`;
  };
  preview();
  $$("[data-portiefactor]", $("#vs-portiekeuze")).forEach(b => b.onclick = () => {
    $$("[data-portiefactor]", $("#vs-portiekeuze")).forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    if (b.dataset.portiefactor === "eigen") { $("#vs-gramveld").style.display = ""; gram = +$("#vs-gram").value || portie; }
    else { $("#vs-gramveld").style.display = "none"; gram = Math.round(portie * +b.dataset.portiefactor); }
    preview();
  });
  $("#vs-gram").oninput = () => { gram = +$("#vs-gram").value || 0; preview(); };
  $("#vs-log-ok").onclick = async () => {
    if (!gram) { toast("Vul een aantal gram in"); return; }
    const f = $("[data-portiefactor][aria-pressed=\"true\"]", $("#vs-portiekeuze"));
    const label = f && f.dataset.portiefactor !== "eigen" ? f.dataset.portiefactor + "× " + eenheid + " (" + gram + " g)" : gram + " g";
    await vsLogToevoegen({ product, gram, moment, label });
    bladSluit(); teken();
    toast("Toegevoegd aan " + vsMoment(moment));
  };
}

const MELD_SOORTEN = { systeem: "Systeem", herinnering: "Herinnering", rapport: "Overzicht" };

async function meldingMaak(v) {

function meldingenSignalen() {
  const v = vandaagISO();

<script>

/* ==========================================================================
