   ========================================================================== */
const MM_KLEUREN = ["#7c9bff", "#f5b942", "#a78bfa", "#22d3ee", "#34d399", "#ff6b81"];
const MM = { hoofd: null, actief: null, pips: [], historie: {}, pipZ: 50, focus: null };

/* ---------- Datamodel ---------- */
function mmNode(o) {
  return Object.assign({
    id: uid(), parentId: null, tekst: "Nieuwe node", x: 0, y: 0, kleur: MM_KLEUREN[0],
    ingeklapt: false, voorbeeld: false, portals: [], checklist: [], checklistOpen: false,
    startDatum: null, eindDatum: null, deadline: null,
    projectId: null, personen: [], notitie: "", koppeling: null
  }, o || {});
}
function mmSeed(naam) {
  const root = mmNode({ tekst: naam || "Mijn mindmap", kleur: "" });
  const a = mmNode({ parentId: root.id, tekst: "💡 Ideeën", x: -170, y: -150, kleur: "#f5b942" });
  const b = mmNode({ parentId: root.id, tekst: "🎯 Doelen", x: 170, y: -150, kleur: "#a78bfa" });
  const c = mmNode({ parentId: root.id, tekst: "🗺️ Plannen", x: 0, y: 190, kleur: "#22d3ee" });
  return { rootId: root.id, nodes: [root, a, b, c,
    mmNode({ parentId: a.id, tekst: "bv. een weekendproject", x: -230, y: -290, kleur: a.kleur, voorbeeld: true }),
    mmNode({ parentId: b.id, tekst: "bv. een marathon lopen", x: 230, y: -290, kleur: b.kleur, voorbeeld: true }),
    mmNode({ parentId: c.id, tekst: "bv. planning Q4", x: 0, y: 320, kleur: c.kleur, voorbeeld: true })] };
}
/** benoemd = de gebruiker heeft de mindmap een naam gegeven (= "opgeslagen"). */
function mmRecord(naam, clusterId, seed, benoemd) {
  if (!seed) { const r = mmNode({ tekst: naam, kleur: "" }); seed = { rootId: r.id, nodes: [r] }; }
  return {
    id: uid(), naam: naam || "Naamloze mindmap", clusterId: clusterId || null,
    rootId: seed.rootId, nodes: seed.nodes, connections: [], pan: { x: 0, y: 0 }, schaal: 1,
    nieuw: true, opTijdlijn: true, benoemd: benoemd !== false, gemaakt: new Date().toISOString(), updatedAt: Date.now()
  };
}
const MM_STANDAARDNAMEN = ["Mijn mindmap", "Naamloze mindmap", "Nieuwe mindmap"];
const mmIsBenoemd = mm => !!mm && mm.benoemd !== false;

/* Zet oude (Engelstalige, localStorage) of geïmporteerde nodes om naar het FutureMe-formaat. */
function mmNormNode(n) {
  const kleur = n.kleur !== undefined ? n.kleur : n.color;
  return mmNode({
    id: n.id || uid(), parentId: n.parentId || null,
    tekst: String(n.tekst != null ? n.tekst : n.text != null ? n.text : ""),
    x: +n.x || 0, y: +n.y || 0,
    kleur: kleur === "#e8e8f2" ? "" : (kleur == null ? MM_KLEUREN[0] : kleur),
    ingeklapt: !!(n.ingeklapt != null ? n.ingeklapt : n.collapsed),
    voorbeeld: !!(n.voorbeeld != null ? n.voorbeeld : n.example),
    portals: Array.isArray(n.portals) ? n.portals.slice() : [],
    checklist: (n.checklist || []).map(c => ({ id: c.id || uid(), tekst: String(c.tekst != null ? c.tekst : c.text || ""), af: !!(c.af != null ? c.af : c.done) })),
    checklistOpen: !!n.checklistOpen,
    startDatum: n.startDatum || n.startDate || null, eindDatum: n.eindDatum || n.endDate || null, deadline: n.deadline || null,
    projectId: n.projectId || null, personen: Array.isArray(n.personen) ? n.personen.slice() : [],
    notitie: n.notitie || "", koppeling: n.koppeling || null,
    subDiep: n.subDiep != null ? !!n.subDiep : undefined
  });
}
function mmNormMindmap(m) {
  const nodes = (m.nodes || []).map(mmNormNode);
  let rootId = m.rootId && nodes.some(n => n.id === m.rootId) ? m.rootId : null;
  if (!rootId) { const r = nodes.find(n => !n.parentId) || nodes[0]; rootId = r ? r.id : null; }
  if (!rootId) { const r = mmNode({ tekst: m.naam || m.name || "Mindmap", kleur: "" }); nodes.push(r); rootId = r.id; }
  const ids = new Set(nodes.map(n => n.id));
  return {
    id: m.id || uid(), naam: m.naam || m.name || "Mindmap", clusterId: m.clusterId || null,
    rootId, nodes,
    connections: (m.connections || []).filter(c => ids.has(c.a) && ids.has(c.b)).map(c => ({ id: c.id || uid(), a: c.a, b: c.b })),
    pan: { x: 0, y: 0 }, schaal: 1, nieuw: true, opTijdlijn: m.opTijdlijn !== false, benoemd: m.benoemd !== false,
    gemaakt: m.gemaakt || new Date().toISOString(), updatedAt: m.updatedAt || Date.now()
  };
}

/* ---------- Opslag ---------- */
const mmVind = id => id ? vind("mm_mindmaps", id) : null;
function mmNieuwste() { return S.mm_mindmaps.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0] || null; }

/** Eenmalig: stond er nog een bibliotheek van de losse mindmap-tool in localStorage (zelfde domein)?
    Dan verhuist die naar IndexedDB. De oude gegevens blijven staan, er wordt niets gewist. */
function mmMigreerLocalStorage() {
  if (S.mm_mindmaps.length || inst("mmMigratieKlaar", false)) return false;
  let data = null;
  try { const raw = localStorage.getItem("mindmap_library_v2"); if (raw) data = JSON.parse(raw); } catch (e) {}
  if (!data) {
    try {
      const oud = JSON.parse(localStorage.getItem("mindmap_v1_data") || "null");
      if (oud && oud.nodes && oud.nodes.length) data = { clusters: [], mindmaps: [{ name: "Mijn mindmap", nodes: oud.nodes, connections: [] }] };
    } catch (e) {}
  }
  if (!data || !Array.isArray(data.mindmaps) || !data.mindmaps.length) return false;
  (data.clusters || []).forEach(c => bewaar("mm_clusters", { id: c.id || uid(), naam: c.naam || c.name || "Map", ingeklapt: !!(c.ingeklapt || c.collapsed) }));
  data.mindmaps.forEach(m => bewaar("mm_mindmaps", mmNormMindmap(m)));
  zetInst("mmMigratieKlaar", true);
  if (data.activeId) zetInst("mmActief", data.activeId);
  return true;
}
function mmZorgVoorEen() {
  if (S.mm_mindmaps.length) return;
  if (mmMigreerLocalStorage() && S.mm_mindmaps.length) return;
  const mm = mmRecord("Mijn mindmap", null, mmSeed("Mijn mindmap"), false);
  bewaar("mm_mindmaps", mm);
  zetInst("mmMigratieKlaar", true);
}
/** De mindmap die nu in beeld hoort: expliciet (V.param), anders de laatst gebruikte, anders de nieuwste. */
function mmHuidige() {
  if (!S.mm_mindmaps.length) return null;
  return (V.view === "mindmap" && mmVind(V.param)) || mmVind(inst("mmActief", null)) || mmNieuwste();
}
function mmOnderschrift() {
  const mm = mmHuidige();
  return mm ? mm.nodes.length + (mm.nodes.length === 1 ? " node" : " nodes") : "Ideeën, doelen en plannen";
}
function mmKopBijwerken() {
  if (V.view !== "mindmap") return;
  const mm = mmHuidige(); if (!mm) return;
  $("#titel").textContent = mm.naam;
  $("#ondertitel").textContent = mmOnderschrift();
  $("#ondertitel").style.display = "";
}

async function mmNieuw(naam, clusterId, benoemd) {
  const mm = mmRecord(naam, clusterId, null, benoemd);
  await bewaar("mm_mindmaps", mm);
  return mm;
}
async function mmHernoem(id, naam) {
  const mm = mmVind(id); if (!mm || !naam) return;
  mm.naam = naam; mm.benoemd = true; mm.updatedAt = Date.now();
  await bewaar("mm_mindmaps", mm);
}
async function mmVerwijder(id) {
  mmPipSluit(id);
  await verwijder("mm_mindmaps", id);
  for (const m of S.mm_mindmaps) {
    let veranderd = false;
    m.nodes.forEach(n => { if ((n.portals || []).includes(id)) { n.portals = n.portals.filter(p => p !== id); veranderd = true; } });
    if (veranderd) await bewaar("mm_mindmaps", m);
  }
  if (inst("mmActief", null) === id) await zetInst("mmActief", null);
  delete MM.historie[id];
}
async function mmZetCluster(id, clusterId) {
  const mm = mmVind(id); if (!mm) return;
  mm.clusterId = clusterId || null;
  await bewaar("mm_mindmaps", mm);
}
async function mmNieuwCluster(naam) {
  const c = { id: uid(), naam: naam || "Nieuwe map", ingeklapt: false };
  await bewaar("mm_clusters", c);
  return c;
}
async function mmVerwijderCluster(id) {
  await verwijder("mm_clusters", id);
  for (const m of S.mm_mindmaps) if (m.clusterId === id) { m.clusterId = null; await bewaar("mm_mindmaps", m); }
}
/** Kopie van een hele boom met nieuwe id's (voor "kopieer in huidige mindmap"). */
function mmKloonBoom(id) {
  const mm = mmVind(id);
  const map = new Map(); mm.nodes.forEach(n => map.set(n.id, uid()));
  const nodes = mm.nodes.map(n => Object.assign(mmNormNode(JSON.parse(JSON.stringify(n))), {
    id: map.get(n.id), parentId: n.parentId ? (map.get(n.parentId) || null) : null
  }));
  const connections = (mm.connections || []).filter(c => map.has(c.a) && map.has(c.b)).map(c => ({ id: uid(), a: map.get(c.a), b: map.get(c.b) }));
  return { nodes, rootId: map.get(mm.rootId) || null, connections };
}

/* ---------- Boomhulpjes (werken op een Map van nodes) ---------- */
const mmKinderen = (nodes, id) => { const u = []; for (const n of nodes.values()) if (n.parentId === id) u.push(n); return u; };
function mmIsAfstammeling(nodes, voorouderId, nodeId) {
  if (voorouderId === nodeId) return true;
  return mmKinderen(nodes, voorouderId).some(k => mmIsAfstammeling(nodes, k.id, nodeId));
}
function mmLayoutTak(nodes, node, hoek, afstand) {
  const kids = mmKinderen(nodes, node.id);
  if (!kids.length) return;
  const spreiding = Math.PI / 2.4, start = hoek - spreiding / 2;
  kids.forEach((k, i) => {
    const a = kids.length > 1 ? start + spreiding * i / (kids.length - 1) : hoek;
    const r = Math.max(afstand || 190, kids.length * 40);
    k.x = node.x + Math.cos(a) * r; k.y = node.y + Math.sin(a) * r;
    mmLayoutTak(nodes, k, a, afstand);
  });
}
function mmSchuifTak(nodes, id, dx, dy) {
  const n = nodes.get(id); if (!n) return;
  n.x += dx; n.y += dy;
  mmKinderen(nodes, id).forEach(c => mmSchuifTak(nodes, c.id, dx, dy));
}
/** Automatisch schikken — waaier van de hoofdtakken, losse draden in een rij eronder. */
function mmAutoSchik(nodes, rootId) {
  const root = nodes.get(rootId); if (!root) return;
  root.x = 0; root.y = 0;
  const top = mmKinderen(nodes, rootId);
  const spreiding = Math.PI * 0.62, start = -Math.PI / 2 - spreiding / 2;
  top.forEach((t, i) => {
    const a = top.length > 1 ? start + spreiding * i / (top.length - 1) : -Math.PI / 2;
    const r = Math.max(320, top.length * 70);
    t.x = Math.cos(a) * r; t.y = Math.sin(a) * r;
    mmLayoutTak(nodes, t, a);
  });
  const hoofd = new Set();
  const verzamel = id => { hoofd.add(id); mmKinderen(nodes, id).forEach(c => verzamel(c.id)); };
  verzamel(rootId);
  const los = Array.from(nodes.values()).filter(n => !n.parentId && n.id !== rootId);
  if (los.length) {
    const hoofdNodes = Array.from(nodes.values()).filter(n => hoofd.has(n.id));
    const maxY = hoofdNodes.length ? Math.max(...hoofdNodes.map(n => n.y)) : 0;
    let x = -((los.length - 1) * 220) / 2;
    los.forEach(f => { mmSchuifTak(nodes, f.id, x - f.x, (maxY + 220) - f.y); x += 220; });
  }
}

/* ---------- Datums ---------- */
function mmKortDatum(iso) { if (!iso) return ""; const d = parseISO(iso); return d.getDate() + " " + MAANDKORT[d.getMonth()]; }
function mmDatumTekst(n) {
  const p = [];
  if (n.startDatum && n.eindDatum) p.push(mmKortDatum(n.startDatum) + " – " + mmKortDatum(n.eindDatum));
  else if (n.startDatum) p.push("vanaf " + mmKortDatum(n.startDatum));
  else if (n.eindDatum) p.push("tot " + mmKortDatum(n.eindDatum));
  if (n.deadline) p.push("⏰ " + mmKortDatum(n.deadline));
  return p.join(" · ");
}
const mmHeeftDatum = n => !!(n.startDatum || n.eindDatum || n.deadline);
function mmDatumBereik(n) {
  const heeftBereik = !!(n.startDatum && n.eindDatum);
  const s = n.startDatum || n.deadline || n.eindDatum;
  const e = heeftBereik ? n.eindDatum : s;
  return { s, e, heeftBereik };
}

/* ---------- Koppelingen met de rest van de app ---------- */
const MM_BRONNAAM = { taak: "Taak", afspraak: "Afspraak", notitie: "Notitie", dagboek: "Dagboek", werkdoc: "Werkdocument" };
function mmKoppelItem(k) {
  if (!k || !k.id) return null;
  if (k.soort === "taak") return vind("taken", k.id);
  if (k.soort === "afspraak") return vind("afspraken", k.id);
  if (k.soort === "notitie") return vind("gebeurtenissen", k.id);
  if (k.soort === "dagboek") return vind("dagboek", k.id);
  if (k.soort === "werkdoc") return vind("werkdocs", k.id);
  return null;
}
function mmKoppelLabel(k) {
  const it = mmKoppelItem(k);
  if (!it) return null;
  if (k.soort === "taak") return (it.af ? "✓ " : "📋 ") + "Taak";
  if (k.soort === "afspraak") return "📅 " + (afspraakSoort(it) === "toezegging" ? "Toezegging" : "Afspraak");
  return "↩ " + MM_BRONNAAM[k.soort];
}
function mmOpenKoppeling(k) {
  const it = mmKoppelItem(k);
  if (!it) { toast("Dat item bestaat niet meer"); return; }
  bladSluit();
  if (k.soort === "taak") setTimeout(() => openTaakBlad(it.id), 280);
  else if (k.soort === "afspraak") ga("afspraak", it.id);
  else if (k.soort === "dagboek") setTimeout(() => openDagboekBlad(it.datum), 280);
  else if (k.soort === "werkdoc") ga("werkdoc", it.id);
  else if (k.soort === "notitie") ga("logboek");
}
/** Alle bekende namen, uit personen, afspraken, taken, werkdocumenten én mindmaps. */
function mmAlleNamen() {
  const s = new Set();
  S.personen.forEach(p => p.naam && s.add(p.naam));
  S.afspraken.forEach(a => (a.personen || []).forEach(n => s.add(n)));
  S.taken.forEach(t => (t.personen || []).forEach(n => s.add(n)));
  S.werkdocs.forEach(d => (d.personen || []).forEach(n => s.add(n)));
  S.mm_mindmaps.forEach(m => m.nodes.forEach(n => (n.personen || []).forEach(x => s.add(x))));
  return [...s].filter(Boolean).sort((a, b) => a.localeCompare(b, "nl"));
}
/** Alle nodes (over alle mindmaps) die aan iets voldoen — voor project-, personen- en zoekpagina's. */
function mmNodesWaar(test) {
  const uit = [];
  S.mm_mindmaps.forEach(m => m.nodes.forEach(n => { if (test(n)) uit.push({ mm: m, n }); }));
  return uit;
}
function mmNodeRijen(lijst) {
  return `<div class="card">${lijst.slice(0, 40).map(({ mm, n }) => `<button class="rijknop" data-act="mm-naar-node" data-mm="${mm.id}" data-node="${n.id}">
    ${ico("mindmap", "width:20px;height:20px;color:" + (n.kleur || "var(--purple)"))}
    <span class="nm">${esc(n.tekst)}<span class="klein" style="display:block">${esc(mm.naam)}${mmHeeftDatum(n) ? " · " + esc(mmDatumTekst(n)) : ""}${n.personen && n.personen.length ? " · " + esc(n.personen.join(", ")) : ""}</span></span>
    ${ico("pijlr", "width:16px;height:16px;color:var(--line2)")}</button>`).join("")}</div>`;
}
</script>
<script>
"use strict";
/* ==========================================================================
   43. Mindmap — het canvas (één engine per zichtbare mindmap: hoofd of beeld-in-beeld)
   ========================================================================== */
const MM_NS = "http://www.w3.org/2000/svg";
const mmPad = (a, b) => { const dx = (b.x - a.x) * 0.5; return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`; };

class MmEngine {
  constructor(container, mmId, opties) {
    opties = opties || {};
    this.container = container; this.mmId = mmId;
    this.pip = !!opties.pip; this.actiebalkEl = opties.actiebalk || null;
    this.pointers = new Map();
    this.bouwDom(); this.laad(); this.bindEvents(); this.transform(); this.render();
    const mm = mmVind(mmId);
    if (mm && mm.nieuw) { this.passend(); mm.nieuw = false; this.opslaan(true); }
    else if (this.pip) this.centreerRoot();
    MM.actief = this;
  }

  /* ---------- Opbouw & gegevens ---------- */
  bouwDom() {
    this.container.innerHTML = "";
    this.vp = document.createElement("div"); this.vp.className = "mm-viewport";
    this.wereld = document.createElement("div"); this.wereld.className = "mm-wereld";
    this.svg = document.createElementNS(MM_NS, "svg"); this.svg.setAttribute("class", "mm-links");
    this.laag = document.createElement("div"); this.laag.className = "mm-nodes";
    this.wereld.append(this.svg, this.laag); this.vp.appendChild(this.wereld); this.container.appendChild(this.vp);
  }
  laad() {
    const mm = mmVind(this.mmId);
    this.nodes = new Map(mm.nodes.map(n => [n.id, mmNormNode(n)]));
    this.connections = (mm.connections || []).map(c => Object.assign({}, c));
    this.rootId = this.nodes.has(mm.rootId) ? mm.rootId : ((Array.from(this.nodes.values()).find(n => !n.parentId) || {}).id);
    this.panX = (mm.pan && mm.pan.x) || 0; this.panY = (mm.pan && mm.pan.y) || 0; this.schaal = mm.schaal || 1;
    this.sel = null; this.selVerbinding = null; this.bewerkId = null;
    this.verbindModus = false; this.verbindVan = null;
    this.sleep = null; this.pan = null; this.knijp = null; this.herverbind = null;
    this.hist = MM.historie[this.mmId] || (MM.historie[this.mmId] = { verleden: [], toekomst: [] });
    this.zichtbareIds = new Set();
  }
  get mm() { return mmVind(this.mmId); }
  _schrijf() {
    this._t = null;
    const mm = mmVind(this.mmId); if (!mm) return;
    mm.nodes = Array.from(this.nodes.values());
    mm.connections = this.connections; mm.rootId = this.rootId;
    mm.pan = { x: this.panX, y: this.panY }; mm.schaal = this.schaal; mm.updatedAt = Date.now();
    bewaar("mm_mindmaps", mm);
  }
  /** Direct opslaan bij echte wijzigingen; bij pannen/zoomen/slepen even wachten. */
  opslaan(direct) {
    clearTimeout(this._t);
    if (direct) this._schrijf(); else this._t = setTimeout(() => this._schrijf(), 280);
  }
  spoel() { if (this._t) { clearTimeout(this._t); this._schrijf(); } }

  kinderen(id) { return mmKinderen(this.nodes, id); }
  diepte(id) {
    let d = 0, cur = this.nodes.get(id), g = 0;
    while (cur && cur.parentId && g++ < 1000) { const p = this.nodes.get(cur.parentId); if (!p) break; d++; cur = p; }
    return d;
  }
  zichtbaar(n) {
    let cur = n, g = 0;
    while (cur.parentId && g++ < 1000) { const p = this.nodes.get(cur.parentId); if (!p) break; if (p.ingeklapt) return false; cur = p; }
    return true;
  }
  transform() {
    this.wereld.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.schaal})`;
    if (this === MM.hoofd) { const z = $("#mmZoom"); if (z) z.textContent = Math.round(this.schaal * 100) + "%"; }
  }

  /* ---------- Ongedaan maken ---------- */
  momentopname() { return JSON.stringify({ nodes: Array.from(this.nodes.values()), connections: this.connections, rootId: this.rootId }); }
  geschiedenis() {
    this.hist.verleden.push(this.momentopname());
    if (this.hist.verleden.length > 60) this.hist.verleden.shift();
    this.hist.toekomst = [];
  }
  ongedaan() {
    if (!this.hist.verleden.length) { toast("Niets om ongedaan te maken"); return; }
    this.hist.toekomst.push(this.momentopname());
    this.herstel(JSON.parse(this.hist.verleden.pop()));
  }
  opnieuw() {
    if (!this.hist.toekomst.length) { toast("Niets om opnieuw te doen"); return; }
    this.hist.verleden.push(this.momentopname());
    this.herstel(JSON.parse(this.hist.toekomst.pop()));
  }
  herstel(st) {
    this.nodes = new Map(st.nodes.map(n => [n.id, n]));
    this.connections = st.connections || [];
    if (st.rootId && this.nodes.has(st.rootId)) this.rootId = st.rootId;
    if (this.sel && !this.nodes.has(this.sel)) this.sel = null;
    this.render(); this.opslaan(true);
  }

  /* ---------- Tekenen ---------- */
  render() {
    this.laag.innerHTML = "";
    const zichtbaar = Array.from(this.nodes.values()).filter(n => this.zichtbaar(n));
    this.zichtbareIds = new Set(zichtbaar.map(n => n.id));
    const frag = document.createDocumentFragment();
    zichtbaar.forEach(n => {
      frag.appendChild(this.nodeEl(n));
      if (n.ingeklapt) { const k = this.kinderen(n.id); if (k.length) this.spoken(frag, n, k); }
    });
    this.laag.appendChild(frag);
    this.tekenLijnen();
    this.werkActiebalkBij();
    if (this === MM.hoofd) { mmTekenOutline(); mmTekenLade(); mmKopBijwerken(); }
  }
  tekenLijnen() {
    const svg = this.svg; svg.innerHTML = "";
    for (const n of this.nodes.values()) {
      if (!n.parentId || !this.zichtbareIds.has(n.id)) continue;
      const p = this.nodes.get(n.parentId); if (!p) continue;
      const el = document.createElementNS(MM_NS, "path");
      el.setAttribute("d", mmPad(p, n)); el.setAttribute("class", "mm-lijn");
      el.style.stroke = n.kleur || "var(--accent)";
      svg.appendChild(el);
    }
    this.connections.forEach(c => {
      const a = this.nodes.get(c.a), b = this.nodes.get(c.b);
      if (!a || !b || !this.zichtbareIds.has(a.id) || !this.zichtbareIds.has(b.id)) return;
      const d = mmPad(a, b);
      const zicht = document.createElementNS(MM_NS, "path");
      zicht.setAttribute("d", d); zicht.setAttribute("class", "mm-reflijn" + (c.id === this.selVerbinding ? " mm-actief" : ""));
      const raak = document.createElementNS(MM_NS, "path");
      raak.setAttribute("d", d); raak.setAttribute("class", "mm-reflijn-raak"); raak.setAttribute("data-verbinding", c.id);
      svg.append(zicht, raak);
    });
    if (this.herverbind && this.herverbind.lijn) svg.appendChild(this.herverbind.lijn);
  }
  nodeEl(n) {
    const el = document.createElement("div");
    const diepte = this.diepte(n.id);
    el.className = "mm-node" + (n.id === this.rootId ? " mm-root" : "") + (n.voorbeeld ? " mm-voorbeeld" : "")
      + (n.id === this.sel ? " mm-geselecteerd" : "") + (n.id === this.verbindVan ? " mm-wachtend" : "");
    el.style.left = n.x + "px"; el.style.top = n.y + "px";
    el.dataset.id = n.id;
    let h = `<div class="mm-balk" style="background:${n.kleur || "var(--text)"}"></div><div class="mm-tekst">${esc(n.tekst)}</div>`;
    const meta = [];
    if (mmHeeftDatum(n)) meta.push(`<span class="mm-badge datum">📅 ${esc(mmDatumTekst(n))}</span>`);
    const p = n.projectId ? vind("projecten", n.projectId) : null;
    if (p) meta.push(`<span class="mm-badge project" style="background:${p.kleur}">#${esc(p.naam)}</span>`);
    (n.personen || []).forEach(x => meta.push(`<span class="mm-badge persoon">👤 ${esc(x)}</span>`));
    const kl = mmKoppelLabel(n.koppeling);
    if (kl) meta.push(`<span class="mm-badge link" data-mmstop data-mmdo="koppeling">${esc(kl)}</span>`);
    if (n.notitie) meta.push(`<span class="mm-badge notitie" title="Heeft een notitie">📝</span>`);
    if (meta.length) h += `<div class="mm-meta">${meta.join("")}</div>`;
    const portals = (n.portals || []).filter(id => mmVind(id));
    if (portals.length) h += `<div class="mm-meta">${portals.map(id =>
      `<span class="mm-portal" data-mmstop data-mmdo="portal" data-doel="${id}">🔗 ${esc(mmVind(id).naam)}</span>`).join("")}</div>`;
    if (diepte >= 2) {
      const tot = n.checklist.length, af = n.checklist.filter(c => c.af).length;
      if (tot || n.checklistOpen) h += `<span class="mm-stappenknop" data-mmstop data-mmdo="stappen">${tot
        ? `☑ ${af}/${tot} stappen ${n.checklistOpen ? "▾" : "▸"}` : "☑ Stappen toevoegen"}</span>`;
      if (n.checklistOpen) h += `<div class="mm-stappen" data-mmstop>${n.checklist.map(c =>
        `<div class="mm-stap${c.af ? " af" : ""}" data-stap="${c.id}">
          <input type="checkbox"${c.af ? " checked" : ""} data-mmdo="stapvink" aria-label="Afvinken">
          <span class="mm-staptekst" data-mmdo="staptekst">${esc(c.tekst)}</span>
          <button class="mm-stapweg" data-mmdo="stapweg" aria-label="Stap verwijderen">×</button></div>`).join("")}
        <input class="mm-stapnieuw" type="text" placeholder="+ Stap toevoegen…" enterkeyhint="done"></div>`;
    }

  /* ---------- Selectie ---------- */

    while (cur.parentId && g++ < 1000) { const p = this.nodes.get(cur.parentId); if (!p) break; if (p.ingeklapt) { p.ingeklapt = false; open = true; } cur = p; }

    this.transform(); this.selecteer(id); this.opslaan();
  }

    const root = this.nodes.get(this.rootId); if (!root) return;
    const r = this.vp.getBoundingClientRect(); if (!r.width && !r.height) return;
    this.panX = r.width / 2 - root.x * this.schaal; this.panY = r.height / 2 - root.y * this.schaal;
    this.transform();
  }
  passend() {

    const xs = alle.map(n => n.x), ys = alle.map(n => n.y);
    const minX = Math.min(...xs) - 120, maxX = Math.max(...xs) + 120, minY = Math.min(...ys) - 80, maxY = Math.max(...ys) + 80;
    const w = maxX - minX, h = maxY - minY;

    this.transform(); this.opslaan();
  }

  /* ---------- Tekst bewerken (inline) ---------- */
  startBewerken(id) {
    if (this.bewerkId && this.bewerkId !== id) this.bevestigBewerking();
    this.sel = id; this.markeerSelectie();
    const el = this.laag.querySelector(`.mm-node[data-id="${id}"] .mm-tekst`); if (!el) return;
    this.bewerkId = id;
    el.contentEditable = "true"; el.spellcheck = true;
    el.focus();
    try { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    el.onkeydown = ev => {
      ev.stopPropagation();
      if (ev.key === "Enter") { ev.preventDefault(); this.bevestigBewerking(); }
      else if (ev.key === "Escape") { ev.preventDefault(); el.textContent = this.nodes.get(id).tekst; this.bevestigBewerking(); }
    };

    this.bewerkId = null;

    const n = this.nodes.get(id);
    if (el && n) {

  /* ---------- Wijzigen ---------- */
  voegKindToe(ouderId) {
    ouderId = ouderId && this.nodes.has(ouderId) ? ouderId : this.rootId;

    this.geschiedenis();
    const ouder = this.nodes.get(ouderId), kids = this.kinderen(ouderId), k = kids.length;

    const afst = opa ? 175 : 210;
    const kleur = ouder.kleur || MM_KLEUREN[k % MM_KLEUREN.length];
    const n = mmNode({ parentId: ouderId, tekst: "Nieuwe node", x: ouder.x + Math.cos(hoek) * afst, y: ouder.y + Math.sin(hoek) * afst, kleur,
      projectId: ouder.projectId || null });
    this.nodes.set(n.id, n);
    ouder.ingeklapt = false;
    this.render(); this.opslaan(true);
    this.startBewerken(n.id);
    return n;
  }
  voegNaasteToe(id) {
    const n = this.nodes.get(id);
    return this.voegKindToe(n && n.parentId ? n.parentId : this.rootId);
  }
  nieuwOpPlek(cx, cy) {
    const w = this.wereldPunt(cx, cy);
    this.geschiedenis();
    const n = mmNode({ parentId: this.rootId, tekst: "Nieuw idee", x: w.x, y: w.y, kleur: MM_KLEUREN[0] });
    this.nodes.set(n.id, n);
    this.render(); this.opslaan(true);
    this.startBewerken(n.id);
  }
  verwijderNode(id) {
    const n = this.nodes.get(id); if (!n) return;
    if (id === this.rootId) { toast("De middelste node kan niet weg — verwijder de mindmap via Mindmappen"); return; }
    const weg = () => {
      this.geschiedenis();
      const lijst = [id];
      const verzamel = pid => this.kinderen(pid).forEach(c => { lijst.push(c.id); verzamel(c.id); });
      verzamel(id);
      lijst.forEach(x => this.nodes.delete(x));
      this.connections = this.connections.filter(c => !lijst.includes(c.a) && !lijst.includes(c.b));
      if (lijst.includes(this.sel)) this.sel = null;
      this.render(); this.opslaan(true);
      toast(lijst.length > 1 ? `${lijst.length} nodes verwijderd` : "Node verwijderd", "Ongedaan maken", () => this.ongedaan());
    };
    if (this.kinderen(id).length) bevestigVerwijderen(weg); else weg();
  }
  zetKleur(id, kleur) {
    const n = this.nodes.get(id); if (!n) return;
    this.geschiedenis(); n.kleur = kleur; this.render(); this.opslaan(true);
  }
  maakLos(id) {
    const n = this.nodes.get(id); if (!n) return;
    if (id === this.rootId) { toast("De middelste node kan niet los"); return; }
    if (!n.parentId) { toast("Al los — sleep het oranje + naar een andere node"); return; }
    this.geschiedenis(); n.parentId = null; this.render(); this.opslaan(true);
    toast("Draad losgemaakt — sleep het oranje + naar een node om vast te maken");
  }
  hangOnder(id, ouderId) {
    const n = this.nodes.get(id); if (!n || id === this.rootId) return false;
    if (ouderId && mmIsAfstammeling(this.nodes, id, ouderId)) { toast("Een node kan niet onder zijn eigen tak hangen"); return false; }
    this.geschiedenis(); n.parentId = ouderId || null;
    const o = ouderId ? this.nodes.get(ouderId) : null; if (o) o.ingeklapt = false;
    this.render(); this.opslaan(true);
    return true;
  }
  /** Via de nodelijst: voor, na of onder een andere node hangen (ook de volgorde telt). */
  verplaatsRelatief(id, doelId, positie) {
    if (id === doelId) return;
    if (id === this.rootId) { toast("De middelste node kan niet verplaatst worden"); return; }
    if (mmIsAfstammeling(this.nodes, id, doelId)) { toast("Een node kan niet in zijn eigen tak"); return; }
    const n = this.nodes.get(id), t = this.nodes.get(doelId); if (!n || !t) return;
    this.geschiedenis();
    if (positie === "op") { n.parentId = t.id; t.ingeklapt = false; } else n.parentId = t.parentId;
    const arr = Array.from(this.nodes.values()).filter(x => x.id !== id);
    let i = arr.findIndex(x => x.id === doelId);
    if (i < 0) i = arr.length; else if (positie !== "voor") i++;
    arr.splice(i, 0, n);
    this.nodes = new Map(arr.map(x => [x.id, x]));
    this.render(); this.opslaan(true);
    toast("Verplaatst");
  }

  /* ---------- Verplaatsen zonder slepen: tik op de node, tik op de plek ---------- */
  startVerplaatsen(id) {
    if (!this.nodes.has(id)) return;
    if (this.bewerkId) this.bevestigBewerking();
    this.verplaatsId = id; this.sel = id;
    this.vp.classList.add("mm-verplaatsmodus");
    this.markeerSelectie();
  }
  stopVerplaatsen() {
    this.verplaatsId = null;
    this.vp.classList.remove("mm-verplaatsmodus");
    this.markeerSelectie();
  }
  /** De node gaat met alles wat eronder hangt naar de aangetikte plek. */
  verplaatsNaar(cx, cy) {
    const id = this.verplaatsId, n = this.nodes.get(id);
    this.verplaatsId = null; this.vp.classList.remove("mm-verplaatsmodus");
    if (!n) { this.markeerSelectie(); return; }
    const w = this.wereldPunt(cx, cy);
    this.geschiedenis();
    mmSchuifTak(this.nodes, id, w.x - n.x, w.y - n.y);
    this._tik = null; this._tikLeeg = null;
    this.render(); this.opslaan(true); this.selecteer(id);
    toast("Verplaatst", "Ongedaan maken", () => this.ongedaan());
  }

  /* ---------- Losse draad weer vastmaken door te slepen ---------- */
  startHerverbind(id, cx, cy) {
    const lijn = document.createElementNS(MM_NS, "path");
    lijn.setAttribute("class", "mm-voorbeeldlijn");
    this.herverbind = { id, lijn };
    this.svg.appendChild(lijn);
    this.werkHerverbindBij(cx, cy);
  }
  werkHerverbindBij(cx, cy) {
    const n = this.nodes.get(this.herverbind.id); if (!n) return;
    const w = this.wereldPunt(cx, cy);
    this.herverbind.lijn.setAttribute("d", `M ${n.x} ${n.y} L ${w.x} ${w.y}`);
  }
  eindHerverbind(cx, cy) {
    const id = this.herverbind.id;
    this.herverbind.lijn.remove(); this.herverbind = null;
    const el = document.elementFromPoint(cx, cy);
    const doelEl = el && el.closest ? el.closest(".mm-node") : null;
    const doelId = doelEl && this.laag.contains(doelEl) ? doelEl.dataset.id : null;
    if (!doelId || doelId === id) { this.render(); return; }
    if (this.hangOnder(id, doelId)) toast("Draad weer vastgemaakt");
  }

  /* ---------- Verbinden (dwarsverbanden) ---------- */
  zetVerbindModus(aan) {
    this.verbindModus = aan === undefined ? !this.verbindModus : !!aan;
    this.verbindVan = null;
    this.vp.classList.toggle("mm-verbindmodus", this.verbindModus);
    if (this === MM.hoofd) { const k = $("#mmVerbindKnop"); if (k) k.classList.toggle("aan", this.verbindModus); }
    if (this.pipKnop) this.pipKnop.classList.toggle("aan", this.verbindModus);
    if (this.verbindModus) { this.sel = null; this.selVerbinding = null; }
    this.markeerSelectie();
  }
  verbindKlik(id) {
    if (!this.verbindVan) { this.verbindVan = id; this.markeerSelectie(); return; }
    if (this.verbindVan === id) { this.zetVerbindModus(false); toast("Geannuleerd"); return; }
    const a = this.verbindVan;
    this.zetVerbindModus(false);
    this.maakVerbinding(a, id);
  }
  maakVerbinding(a, b) {
    if (this.connections.some(c => (c.a === a && c.b === b) || (c.a === b && c.b === a))) { toast("Deze nodes zijn al verbonden"); return; }
    this.geschiedenis();
    this.connections.push({ id: uid(), a, b });
    this.render(); this.opslaan(true); toast("Nodes verbonden");
  }
  verwijderVerbinding(id) {
    this.geschiedenis();
    this.connections = this.connections.filter(c => c.id !== id);
    this.selVerbinding = null; this.render(); this.opslaan(true);
  }

  /* ---------- Koppelen aan andere mindmaps ---------- */
  wisselPortal(nodeId, doelId) {
    const n = this.nodes.get(nodeId); if (!n) return;
    if (doelId === this.mmId) { toast("Een node kan niet naar zijn eigen mindmap linken"); return; }
    this.geschiedenis();
    n.portals = n.portals.includes(doelId) ? n.portals.filter(p => p !== doelId) : n.portals.concat(doelId);
    this.render(); this.opslaan(true);
  }

  /* ---------- Schikken ---------- */
  schik() {
    this.geschiedenis();
    mmAutoSchik(this.nodes, this.rootId);
    this.render(); this.opslaan(true); this.passend();
  }

  /* ---------- Acties uit de actiebalk ---------- */
  actie(wat, knop) {
    const id = this.sel;
    switch (wat) {
      case "kind": this.voegKindToe(id); break;
      case "naaste": this.voegNaasteToe(id); break;
      case "naam": this.startBewerken(id); break;
      case "verplaats": this.startVerplaatsen(id); break;
      case "verplaatsstop": this.stopVerplaatsen(); break;
      case "kleur": this.zetKleur(id, knop.dataset.kleur); break;
      case "stappen": {
        const n = this.nodes.get(id); if (!n) return;
        n.checklistOpen = true; this.render(); this.opslaan(true);
        const inp = this.laag.querySelector(`.mm-node[data-id="${id}"] .mm-stapnieuw`); if (inp) inp.focus();
        break;
      }
      case "datums": mmNodeBlad(this, id, "datums"); break;
      case "details": mmNodeBlad(this, id); break;
      case "planning": mmNodeBlad(this, id, "planning"); break;
      case "losmaken": this.maakLos(id); break;
      case "vastmaken": mmNodeBlad(this, id, "plaats"); break;
      case "mindmaplink": mmPortalBlad(this, id); break;
      case "weg": this.verwijderNode(id); break;
      case "verbindingweg": if (this.selVerbinding) this.verwijderVerbinding(this.selVerbinding); break;
      case "verbindstop": this.zetVerbindModus(false); break;
      case "sluit": this.deselecteer(); break;
    }
  }

  /* ---------- Toetsenbord ---------- */
  toets(e) {
    if (this.bewerkId) return;
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (mod && k === "z" && e.shiftKey) { e.preventDefault(); this.opnieuw(); return; }
    if (mod && k === "z") { e.preventDefault(); this.ongedaan(); return; }
    if (mod && k === "y") { e.preventDefault(); this.opnieuw(); return; }
    if (mod && k === "s") { e.preventDefault(); mmExportJSON(this); return; }
    if (mod && e.key === "0") { e.preventDefault(); this.passend(); return; }
    if (e.key === "Escape") {
      if (this.verplaatsId) { this.stopVerplaatsen(); return; }
      if (this.herverbind) { this.herverbind.lijn.remove(); this.herverbind = null; this.render(); }
      else if (this.verbindModus) this.zetVerbindModus(false);
      else this.deselecteer();
      return;
    }
    if (this.selVerbinding && (e.key === "Delete" || e.key === "Backspace")) { e.preventDefault(); this.verwijderVerbinding(this.selVerbinding); return; }
    if (!this.sel) return;
    if (e.key === "Tab") { e.preventDefault(); this.voegKindToe(this.sel); }
    else if (e.key === "Enter") { e.preventDefault(); this.voegNaasteToe(this.sel); }
    else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); this.verwijderNode(this.sel); }
    else if (e.key === "F2") { e.preventDefault(); this.startBewerken(this.sel); }
  }
}

/** Zolang een vinger op het canvas staat, kan de pagina eromheen niet scrollen. */
function mmScrollSlot(aan) {
  const sch = $("#scherm"); if (!sch) return;
  sch.classList.toggle("mm-scrollslot", !!aan);
}

/* ---------- Beeld-in-beeld: een tweede mindmap in een zwevend venster ---------- */
function mmPipVoor(rec) {
  MM.pipZ += 1; rec.el.style.zIndex = Math.min(MM.pipZ, 58);
  MM.pips.forEach(p => { if (p !== rec) p.el.style.zIndex = 50; });
  if (rec.engine) MM.actief = rec.engine;
}
function mmPipOpen(mmId, vanRect) {
  if (MM.hoofd && MM.hoofd.mmId === mmId) { toast("Die mindmap staat al open als hoofdweergave"); return; }
  const bestaand = MM.pips.find(p => p.mmId === mmId);
  if (bestaand) { mmPipVoor(bestaand); return; }
  const mm = mmVind(mmId); if (!mm) { toast("Die mindmap bestaat niet meer"); return; }
  const b = Math.min(window.innerWidth - 16, 460), h = Math.min(Math.round(window.innerHeight * 0.52), 400);
  let x = Math.max(8, (window.innerWidth - b) / 2 + MM.pips.length * 16), y = 90 + MM.pips.length * 22;
  if (vanRect) { x = clamp(vanRect.left, 8, Math.max(8, window.innerWidth - b - 8)); y = clamp(vanRect.bottom + 10, 70, Math.max(70, window.innerHeight - h - 80)); }
  const el = document.createElement("div");
  el.className = "mm-pip";
  el.style.cssText = `left:${x}px;top:${y}px;width:${b}px;height:${h}px`;
  el.innerHTML = `<div class="mm-pipkop"><span class="mm-piptitel">🪟 ${esc(mm.naam)}</span>
      <button class="mm-pipknop" data-pip="verbind" title="Verbinden" aria-label="Verbinden">🔗</button>
      <button class="mm-pipknop" data-pip="passend" title="Passend maken" aria-label="Passend maken">⤢</button>
      <button class="mm-pipknop" data-pip="hoofd" title="Openen als hoofdmindmap" aria-label="Openen als hoofdmindmap">↗</button>
      <button class="mm-pipknop" data-pip="sluit" title="Sluiten" aria-label="Sluiten">✕</button></div>
    <div class="mm-piplijf"><div class="mm-canvaswrap"></div><div class="mm-actiebalk verborgen"></div></div>
    <div class="mm-pipgreep" aria-hidden="true"></div>`;
  document.body.appendChild(el);
  const rec = { mmId, el };
  MM.pips.push(rec);
  rec.engine = new MmEngine(el.querySelector(".mm-canvaswrap"), mmId, { pip: true, actiebalk: el.querySelector(".mm-actiebalk") });
  rec.engine.pipKnop = el.querySelector('[data-pip="verbind"]');
  mmPipVoor(rec);
  let sleep = null;
  const kop = el.querySelector(".mm-pipkop"), greep = el.querySelector(".mm-pipgreep");
  kop.addEventListener("pointerdown", e => {
    if (e.target.closest(".mm-pipknop")) return;
    mmPipVoor(rec); e.preventDefault();
    sleep = { soort: "plek", sx: e.clientX, sy: e.clientY, ox: el.offsetLeft, oy: el.offsetTop };
  });
  [kop, greep].forEach(x => x.addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));
  greep.addEventListener("pointerdown", e => {
    mmPipVoor(rec); e.preventDefault(); e.stopPropagation();
    sleep = { soort: "maat", sx: e.clientX, sy: e.clientY, ow: el.offsetWidth, oh: el.offsetHeight };
  });
  rec.beweeg = e => {
    if (!sleep) return;
    if (sleep.soort === "plek") {
      el.style.left = clamp(sleep.ox + e.clientX - sleep.sx, 0, window.innerWidth - 60) + "px";
      el.style.top = clamp(sleep.oy + e.clientY - sleep.sy, 0, window.innerHeight - 50) + "px";
    } else {
      el.style.width = clamp(sleep.ow + e.clientX - sleep.sx, 240, window.innerWidth) + "px";
      el.style.height = clamp(sleep.oh + e.clientY - sleep.sy, 200, window.innerHeight) + "px";
    }
  };
  rec.los = () => { sleep = null; };
  window.addEventListener("pointermove", rec.beweeg);
  window.addEventListener("pointerup", rec.los);
  el.addEventListener("pointerdown", () => mmPipVoor(rec));
  el.querySelector(".mm-pipkop").addEventListener("click", e => {
    const k = e.target.closest("[data-pip]"); if (!k) return;
    const w = k.dataset.pip;
    if (w === "sluit") mmPipSluit(mmId);
    else if (w === "passend") rec.engine.passend();
    else if (w === "verbind") rec.engine.zetVerbindModus();
    else if (w === "hoofd") { mmPipSluit(mmId); ga("mindmap", mmId); }
  });
}
function mmPipSluit(mmId) {
  const i = MM.pips.findIndex(p => p.mmId === mmId); if (i < 0) return;
  const [rec] = MM.pips.splice(i, 1);
  window.removeEventListener("pointermove", rec.beweeg);
  window.removeEventListener("pointerup", rec.los);
  rec.engine.vernietig(); rec.el.remove();
}
function mmPipAllesSluiten() { [...MM.pips].forEach(p => mmPipSluit(p.mmId)); }
</script>
<script>
"use strict";
/* ==========================================================================
   44. Mindmap — scherm, nodelijst, tijdlijn & planbord, bladen, koppelingen
   ========================================================================== */
V.mmOutline = false; V.mmOutlineZoek = ""; V.mmLade = false; V.mmLadeTab = "tijdlijn"; V.mmMaand = 0;

function mmTekstKleur(kleur) {
  const m = /^#([0-9a-f]{6})$/i.exec(kleur || "");
  if (!m) return "#fff";
  const v = parseInt(m[1], 16), r = v >> 16 & 255, g = v >> 8 & 255, b = v & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#10131a" : "#fff";
}
const mmBalkKleur = n => n.kleur || MM_KLEUREN[0];
const mmBestandsnaam = s => String(s || "mindmap").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "mindmap";
function mmZoektekst(n) {
  const p = n.projectId ? vind("projecten", n.projectId) : null;
  return [n.tekst, n.notitie, (n.personen || []).join(" "), p ? p.naam : "", n.checklist.map(c => c.tekst).join(" ")].join(" ").toLowerCase();
}

/* ---------- Het scherm ---------- */
function vwMindmap() {
  mmZorgVoorEen();
  const mm = mmHuidige();
  if (!mm) return `<div class="card">${leeg("🧠", "Nog geen mindmap", "")}</div>`;
  if (inst("mmActief", null) !== mm.id) zetInst("mmActief", mm.id);
  V.param = mm.id;
  const gepland = mm.nodes.filter(mmHeeftDatum).length;
  const tb = (act, tekst, titel, extra) => `<button class="mm-tb${extra ? " " + extra : ""}" data-mmtb="${act}" title="${esc(titel)}"${act === "verbind" ? ' id="mmVerbindKnop"' : act === "outline" ? ' id="mmOutlineKnop"' : ""}>${tekst}</button>`;
  const benoemd = mmIsBenoemd(mm);
  return `<div class="mm-scherm${V.mmLade ? " lade-open" : ""}">
    <div class="mm-kopbalk">
      <button class="mm-nieuwknop" data-mmtb="opslaan-nieuw" id="mmNieuwKnop">＋ Nieuwe mindmap</button>
      <button class="mm-status${benoemd ? "" : " open"}" data-mmtb="opslaan-nieuw" id="mmStatus">${benoemd ? "✓ Opgeslagen" : "● Nog niet opgeslagen"}</button>
    </div>
    <div class="mm-toolbar" role="toolbar" aria-label="Mindmap">
      ${tb("kind", "＋ Node", "Node toevoegen (Tab)", "primair")}
      ${tb("verbind", "🔗 Verbinden", "Twee nodes met elkaar verbinden")}
      ${tb("schik", "⟲ Schikken", "Automatisch schikken")}
      ${tb("ongedaan", "↶", "Ongedaan maken (Ctrl+Z)")}
      ${tb("opnieuw", "↷", "Opnieuw (Ctrl+Shift+Z)")}
      <span class="mm-tbsep"></span>
      ${tb("uit", "－", "Uitzoomen")}<span class="mm-zoom" id="mmZoom">100%</span>${tb("in", "＋", "Inzoomen")}
      ${tb("passend", "⤢ Passend", "Alles in beeld (Ctrl+0)")}
      <span class="mm-tbsep"></span>
      ${tb("outline", "🗂 Nodes", "Nodelijst tonen of verbergen", V.mmOutline ? "aan" : "")}
      ${tb("bibliotheek", "📚 Mindmappen", "Al je mindmappen en mappen")}
      <span class="mm-tbsep"></span>
      ${tb("agenda", "📅 Agenda &amp; planning", "In je planning, tijdlijn of agenda-app zetten", "accent")}
      ${tb("import", "📥 Importeren", "Taken, afspraken en notities als mindmap binnenhalen", "accent")}
      ${tb("json", "⬇ JSON", "Exporteren als JSON (Ctrl+S)")}
      ${tb("outline-md", "⬇ Outline", "Exporteren als tekstoverzicht")}
      ${tb("laden", "⬆ JSON laden", "Mindmap uit een JSON-bestand laden")}
      ${tb("help", "?", "Gebaren en sneltoetsen")}
    </div>
    <div class="mm-canvasvak">
      <div class="mm-canvaswrap" id="mmCanvas"></div>
      <div class="mm-outline${V.mmOutline ? " open" : ""}" id="mmOutline" aria-label="Nodelijst">
        <div class="mm-outline-kop"><input type="search" id="mmOutlineZoek" placeholder="Zoek nodes…" value="${esc(V.mmOutlineZoek)}">
          <button class="mm-ladeknop" data-mmtb="outline" aria-label="Nodelijst sluiten">‹</button></div>
        <div class="mm-outline-lijst" id="mmOutlineLijst"></div>
      </div>
      <div class="mm-actiebalk" id="mmActiebalk"></div>
    </div>
    <button class="mm-ladebalk" data-mmtb="lade"><span class="ch">${V.mmLade ? "▼" : "▲"}</span> Tijdlijn, planbord &amp; mindmappen
      <span class="tel" id="mmLadeTel">${mmLadeTelling(gepland)}</span></button>
    ${V.mmLade ? `<div class="mm-lade" id="mmLade"></div>` : ""}
    <input type="file" id="mmBestand" accept=".json,application/json" style="display:none">
  </div>`;
}

/* ---------- Nodelijst (links) ---------- */
function mmTekenOutline() {
  const lijst = $("#mmOutlineLijst"), E = MM.hoofd;
  if (!lijst || !E) return;
  if (!V.mmOutline) { lijst.innerHTML = ""; return; }
  const f = (V.mmOutlineZoek || "").trim().toLowerCase();
  const past = n => !f || mmZoektekst(n).includes(f) || E.kinderen(n.id).some(past);
  let h = "";
  const rij = (n, d) => {
    if (!past(n)) return;
    const kids = E.kinderen(n.id);
    const af = n.checklist.filter(c => c.af).length;
    h += `<div class="mm-orij${n.id === E.sel ? " actief" : ""}" draggable="true" data-orij="${n.id}" style="padding-left:${6 + d * 14}px">
      ${kids.length ? `<span class="mm-ochev" data-ochev="${n.id}">${n.ingeklapt && !f ? "▸" : "▾"}</span>` : `<span class="mm-ochev" style="visibility:hidden">•</span>`}
      <span class="mm-ostip" style="background:${n.kleur || "var(--text)"}"></span>
      <span class="mm-olabel">${esc(n.tekst)}</span>
      ${n.checklist.length ? `<span class="mm-obadge">${af}/${n.checklist.length}</span>` : ""}

    if (f || !n.ingeklapt) kids.forEach(k => rij(k, d + 1));

  const los = Array.from(E.nodes.values()).filter(n => !n.parentId && n.id !== E.rootId && past(n));
  if (los.length) { h += `<div class="mm-osectie">Losse draden</div>`; los.forEach(n => rij(n, 0)); }
  lijst.innerHTML = h || `<div class="klein" style="padding:16px;text-align:center">Geen nodes gevonden.</div>`;
}
function mmBindOutline() {
  const lijst = $("#mmOutlineLijst"); if (!lijst) return;
  lijst.onclick = e => {
    const E = MM.hoofd; if (!E) return;
    const ch = e.target.closest("[data-ochev]");
    if (ch) { const n = E.nodes.get(ch.dataset.ochev); if (n) { n.ingeklapt = !n.ingeklapt; E.render(); E.opslaan(true); } return; }
    const r = e.target.closest("[data-orij]"); if (!r) return;
    E.centreerOp(r.dataset.orij);
    if (window.innerWidth < 640) mmZetOutline(false);
  };
  let sleepId = null;
  lijst.addEventListener("dragstart", e => {
    const r = e.target.closest("[data-orij]"); if (!r) return;
    sleepId = r.dataset.orij; e.dataTransfer.setData("text/plain", sleepId); e.dataTransfer.effectAllowed = "move";
    r.classList.add("sleept");
  });
  lijst.addEventListener("dragend", () => { sleepId = null; $$(".mm-orij", lijst).forEach(x => x.classList.remove("sleept", "drop-voor", "drop-na", "drop-op")); });
  lijst.addEventListener("dragover", e => {
    const r = e.target.closest("[data-orij]"); if (!r || !sleepId) return;
    e.preventDefault();
    const b = r.getBoundingClientRect(), f = b.height ? (e.clientY - b.top) / b.height : .5;
    r.classList.remove("drop-voor", "drop-na", "drop-op");
    r.classList.add(f < .25 ? "drop-voor" : f > .75 ? "drop-na" : "drop-op");
  });
  lijst.addEventListener("dragleave", e => { const r = e.target.closest("[data-orij]"); if (r) r.classList.remove("drop-voor", "drop-na", "drop-op"); });
  lijst.addEventListener("drop", e => {
    const r = e.target.closest("[data-orij]"); if (!r) return;
    e.preventDefault();
    const pos = r.classList.contains("drop-voor") ? "voor" : r.classList.contains("drop-na") ? "na" : "op";
    r.classList.remove("drop-voor", "drop-na", "drop-op");
    const id = e.dataTransfer.getData("text/plain") || sleepId;
    if (id && id !== r.dataset.orij && MM.hoofd) MM.hoofd.verplaatsRelatief(id, r.dataset.orij, pos);
  });
  const z = $("#mmOutlineZoek");
  if (z) z.oninput = () => { V.mmOutlineZoek = z.value; mmTekenOutline(); };
}

function mmTijdlijnHTML(E) {
  const gedateerd = Array.from(E.nodes.values()).filter(mmHeeftDatum);
  if (!gedateerd.length) return `<div class="mm-tlbaan"><div class="mm-tlleeg">Nog geen nodes met een datum.<br>Selecteer een node en tik op 📅 om hem te plannen.</div></div>`;
  let min = null, max = null;
  gedateerd.forEach(n => { const b = mmDatumBereik(n); [b.s, b.e].forEach(d => { if (!d) return; if (!min || d < min) min = d; if (!max || d > max) max = d; }); });
  const start = plusDagen(min, -1), eind = plusDagen(max, 1);
  const dagen = Math.max(1, dagVerschil(eind, start) + 1), B = 34, v = vandaagISO();
  let as = "";
  for (let i = 0; i < dagen; i++) {
    const d = plusDagen(start, i), dt = parseISO(d);
    as += `<div class="mm-tltik${d === v ? " vandaag" : ""}" style="width:${B}px">${i === 0 || dt.getDate() === 1 ? mmKortDatum(d) : dt.getDate()}</div>`;
  }
  const rijen = gedateerd.sort((a, b) => mmDatumBereik(a).s < mmDatumBereik(b).s ? -1 : 1).map(n => {
    const b = mmDatumBereik(n), off = dagVerschil(b.s, start), span = Math.max(1, dagVerschil(b.e, b.s) + 1);
    const kl = mmBalkKleur(n);

  }).join("");
  return `<div class="mm-tlbaan"><div class="mm-tlas" style="width:${dagen * B}px">${as}</div>

function mmPlanbordHTML(E) {

function mmBoomVolgorde(E) {
  const uit = [], gezien = new Set();
  const loop = (n, d) => { if (gezien.has(n.id)) return; gezien.add(n.id); uit.push({ n, d }); E.kinderen(n.id).forEach(k => loop(k, d + 1)); };
  const root = E.nodes.get(E.rootId); if (root) loop(root, 0);
  Array.from(E.nodes.values()).filter(n => !n.parentId && n.id !== E.rootId).forEach(n => loop(n, 0));
  return uit;
}

    if (start && eind && eind < start) { toast("De einddatum ligt vóór de startdatum"); return false; }

  }, 260);
}

/* ---------- Van mindmap naar planning ---------- */
const mmZonderVink = t => String(t || "").replace(/^✓\s*/, "");
/** Subtaken van een node: de nodes die eronder hangen, en daarna zijn eigen stappen.
    diep = uit → alleen nodes één niveau lager; diep = aan → ook dieper, als sub-subtaken (sub-sub-subtaken, …).
    Vinkjes uit de taak blijven staan, net als subtaken die je in de taak zelf toevoegde (op hun plek).
    Wat uit de mindmap verdween, verdwijnt ook uit de taak. */
function mmSubtakenVoor(n, alle, bestaand, diep) {
  const oud = (bestaand || []).map(x => Object.assign({}, x));
  const sleutel = x => x.mmNode ? "n:" + x.mmNode : x.mmStap ? "s:" + x.mmStap : null;
  // eigen subtaken onthouden met het mindmap-item dat er direct boven stond
  const eigen = []; let anker = null;
  oud.forEach(x => { const k = sleutel(x); if (k) anker = k; else if (String(x.tekst || "").trim()) eigen.push({ x, anker }); });
  const vrijeOud = oud.filter(x => !sleutel(x));
  const pakVrij = tekst => { const i = vrijeOud.findIndex(x => String(x.tekst || "").trim().toLowerCase() === tekst.toLowerCase()); if (i < 0) return null;
    const x = vrijeOud.splice(i, 1)[0]; const e = eigen.findIndex(y => y.x === x); if (e >= 0) eigen.splice(e, 1); return x; };
  const oudVan = k => oud.find(x => sleutel(x) === k);
  const uit = [];
  const stappen = (node, nv) => (node.checklist || []).forEach(c => {
    const o = oudVan("s:" + c.id) || pakVrij(c.tekst.trim());
    uit.push(Object.assign({ tekst: c.tekst, af: !!c.af || !!(o && o.af), mmStap: c.id }, nv ? { niveau: nv } : {}));
  });
  const loop = (ouder, nv) => alle.filter(k => k.parentId === ouder.id && !k.voorbeeld).forEach(k => {
    const tekst = mmZonderVink(k.tekst).trim(); if (!tekst) return;
    const o = oudVan("n:" + k.id) || pakVrij(tekst);
    const gek = k.koppeling && k.koppeling.soort === "taak" ? vind("taken", k.koppeling.id) : null;
    uit.push(Object.assign({ tekst, af: !!(o && o.af) || /^✓/.test(k.tekst) || !!(gek && gek.af), mmNode: k.id }, nv ? { niveau: nv } : {}));
    if (diep) { loop(k, nv + 1); stappen(k, nv + 1); }
  });
  loop(n, 0);
  stappen(n, 0);
  // eigen subtaken terug op hun plek: direct na het blok van hun anker (of bovenaan / onderaan)
  eigen.forEach(({ x, anker }) => {
    if (anker === null) { uit.unshift(x); return; }
    const i = uit.findIndex(y => sleutel(y) === anker);
    if (i < 0) { uit.push(x); return; }
    // hing hij ónder het anker → direct erna; op hetzelfde niveau of hoger → na de hele tak van het anker
    let j = subNiveau(x) > subNiveau(uit[i]) ? i + 1 : subBlok(uit, i)[1];
    while (j < uit.length && !sleutel(uit[j]) && subNiveau(uit[j]) >= subNiveau(x)) j++;
    uit.splice(j, 0, x);
  });
  return normaliseerSubtaken(uit);
}
const mmHeeftDiepereNodes = (n, alle) => alle.some(k => k.parentId === n.id && alle.some(g => g.parentId === k.id && !g.voorbeeld));
async function mmNaarPlanning(mm, n, soort, opties) {
  opties = opties || {};
  const k = n.koppeling, merk = "Uit mindmap: " + (mm ? mm.naam : "");
  if (soort === "taak") {
    let t = k && k.soort === "taak" ? vind("taken", k.id) : null;
    const nieuw = !t;
    if (!t) t = { id: uid(), titel: "", notitie: "", datum: null, tijd: null, herhaal: null, prioriteit: 4, projectId: null,
      labels: [], personen: [], subtaken: [], bijlagen: [], hangtAf: [], duur: null, energie: null, af: false,
      gemaakt: new Date().toISOString(), volgorde: Date.now() };
    t.titel = n.tekst;
    t.datum = n.deadline || n.startDatum || n.eindDatum || null;
    t.projectId = opties.projectId || n.projectId || t.projectId || null;
    t.personen = [...new Set([...(t.personen || []), ...(n.personen || [])])];
    const alle = opties.nodes ? Array.from(opties.nodes.values ? opties.nodes.values() : opties.nodes) : (mm ? mm.nodes : []);
    const diep = opties.diep != null ? !!opties.diep : (n.subDiep != null ? !!n.subDiep : inst("mmSubDiep", false));
    t.subtaken = mmSubtakenVoor(n, alle, t.subtaken, diep);
    if (nieuw) t.notitie = [n.notitie, merk].filter(Boolean).join("\n\n");
    else if (n.notitie && !(t.notitie || "").includes(n.notitie)) t.notitie = [n.notitie, t.notitie].filter(Boolean).join("\n\n");
    await bewaar("taken", t);
    n.koppeling = { soort: "taak", id: t.id };
    return { item: t, nieuw };
  }
  let a = k && k.soort === "afspraak" ? vind("afspraken", k.id) : null;
  const nieuw = !a;
  if (!a) a = { id: uid(), soort: "gesprek", titel: "", datum: "", totDatum: "", tijd: "", eindTijd: "", deadline: "", plek: "",
    personen: [], voorbereiding: "", notities: "", uitkomst: "", gemaakt: new Date().toISOString() };
  a.soort = n.startDatum ? "gesprek" : "toezegging";
  a.titel = n.tekst;
  a.datum = n.startDatum || "";
  a.totDatum = n.eindDatum && n.eindDatum !== n.startDatum && n.startDatum ? n.eindDatum : "";
  a.deadline = n.deadline || (!n.startDatum && n.eindDatum ? n.eindDatum : "");
  a.personen = [...new Set([...(a.personen || []), ...(n.personen || [])])];
  if (nieuw) a.voorbereiding = [n.notitie, merk].filter(Boolean).join("\n\n");
  await bewaar("afspraken", a);
  n.koppeling = { soort: "afspraak", id: a.id };
  return { item: a, nieuw };
}
function mmBulkKandidaten(E, bereik) {
  const alle = Array.from(E.nodes.values()).filter(n => n.id !== E.rootId && !n.voorbeeld);
  if (bereik === "datum") return alle.filter(mmHeeftDatum);
  if (bereik === "tak") {
    if (!E.sel) return [];
    const ids = new Set(); const loop = id => { ids.add(id); E.kinderen(id).forEach(k => loop(k.id)); }; loop(E.sel);
    return alle.filter(n => ids.has(n.id));
  }
  return alle;
}
function mmIcsVoor(mm, nodes) {
  const ev = [];
  nodes.forEach(n => {
    const notitie = [n.notitie, "Mindmap: " + mm.naam, n.personen.length ? "Met: " + n.personen.join(", ") : ""].filter(Boolean).join("\n");
    if (n.startDatum || n.eindDatum) {
      const s = n.startDatum || n.eindDatum;
      ev.push(icsEvenement({ uid: "mm-" + n.id, titel: n.tekst, datum: s, eindDatum: n.eindDatum && n.eindDatum > s ? n.eindDatum : null, notitie }));
    }
    if (n.deadline) ev.push(icsEvenement({ uid: "mm-dl-" + n.id, titel: "⏰ Deadline: " + n.tekst, datum: n.deadline, notitie }));
  });
  return ev;
}

/* ---------- Van FutureMe naar mindmap: importeren ---------- */
const MM_SOORTLABEL = { taak: "📋 Taken", afspraak: "📅 Afspraken", notitie: "📝 Notities", dagboek: "📔 Dagboek", werkdoc: "💼 Werkdocumenten" };
const MM_SOORTVOLG = { taak: 1, afspraak: 2, notitie: 3, dagboek: 4, werkdoc: 5 };
function mmEersteRegel(t) { const r = String(t || "").split("\n")[0].trim(); return r.length > 70 ? r.slice(0, 68) + "…" : (r || "Notitie"); }
function mmNamenIn(tekst) {
  const t = " " + String(tekst || "").toLowerCase() + " ";
  return mmAlleNamen().filter(n => n.length > 1 && new RegExp("[^\\p{L}]" + n.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[^\\p{L}]", "u").test(t));
}
function mmDagLabel(d) { const s = langDatumLabel(d).replace(/ \d{4}$/, ""); return s[0].toUpperCase() + s.slice(1); }
function mmImportKandidaten(f) {
  const uit = [];
  const inBereik = d => { if (!f.van && !f.tot) return true; if (!d) return false; return (!f.van || d >= f.van) && (!f.tot || d <= f.tot); };
  const dagOk = d => f.dagen.size === 7 || (!!d && f.dagen.has(weekdagVan(d)));
  const namen = [...f.personen].map(x => x.toLowerCase());
  const persOk = (lijst, tekst) => !namen.length || (lijst || []).some(p => namen.includes(String(p).toLowerCase()))
    || (!!tekst && namen.some(x => String(tekst).toLowerCase().includes(x)));
  const projOk = pid => !f.project || (f.project === "__geen" ? !pid : pid === f.project);
  const ok = (d, pers, tekst, pid) => inBereik(d) && dagOk(d) && persOk(pers, tekst) && projOk(pid);
  if (f.bronnen.has("taak")) S.taken.forEach(t => {
    if (t.af && !f.metAf) return;
    if (ok(t.datum, t.personen, null, t.projectId || null)) uit.push({ soort: "taak", id: t.id, titel: t.titel || "Taak", datum: t.datum || null,
      personen: t.personen || [], projectId: t.projectId || null, notitie: t.notitie || "", checklist: [],
      kinderen: normaliseerSubtaken((t.subtaken || []).filter(s => String(s.tekst || "").trim()).map(s => Object.assign({}, s)))
        .map(s => ({ tekst: (s.af ? "✓ " : "") + String(s.tekst).trim(), niveau: subNiveau(s) })) });
  });
  if (f.bronnen.has("afspraak")) S.afspraken.forEach(a => {
    const d = a.datum || a.deadline || null;
    if (ok(d, a.personen, null, null)) uit.push({ soort: "afspraak", id: a.id, titel: a.titel || "Afspraak", datum: a.datum || null,
      eindDatum: a.totDatum || null, deadline: a.deadline || null, personen: a.personen || [], projectId: null,
      notitie: [a.voorbereiding, a.notities, a.uitkomst ? "Uitkomst: " + a.uitkomst : ""].filter(Boolean).join("\n\n"), checklist: [] });
  });
  if (f.bronnen.has("notitie")) S.gebeurtenissen.filter(g => g.soort === "notitie").forEach(g => {
    const d = g.datum || (g.ts || "").slice(0, 10) || null;
    if (ok(d, g.personen, g.tekst, null)) uit.push({ soort: "notitie", id: g.id, titel: mmEersteRegel(g.tekst), datum: d,
      personen: mmNamenIn(g.tekst), projectId: null, notitie: String(g.tekst || "").includes("\n") || String(g.tekst || "").length > 70 ? g.tekst : "", checklist: [] });
  });
  if (f.bronnen.has("dagboek")) S.dagboek.forEach(d => {
    const tekst = [d.tekst, d.dankbaar ? "Dankbaar: " + d.dankbaar : ""].filter(Boolean).join("\n\n");
    if (!tekst) return;
    if (ok(d.datum, null, tekst, null)) uit.push({ soort: "dagboek", id: d.id, titel: "Dagboek · " + mmEersteRegel(d.tekst || d.dankbaar).slice(0, 50),
      datum: d.datum, personen: mmNamenIn(tekst), projectId: null, notitie: tekst, checklist: [] });
  });
  if (f.bronnen.has("werkdoc")) S.werkdocs.filter(d => d.status !== "archief").forEach(d => {
    const dt = d.datum || d.periodeVan || (d.gemaakt || "").slice(0, 10) || null;
    if (ok(dt, d.personen, null, null)) uit.push({ soort: "werkdoc", id: d.id, titel: d.titel || (DOCSOORTEN[d.soort] || {}).naam || "Document",
      datum: dt, eindDatum: d.periodeTot || null, personen: d.personen || [], projectId: null,
      notitie: Object.values(d.secties || {}).filter(x => typeof x === "string" && x.trim()).join("\n\n") || d.notitie || "",
      checklist: (d.mijlpalen || []).filter(m => m.tekst).map(m => ({ id: uid(), tekst: m.tekst + (m.datum ? " (" + mmKortDatum(m.datum) + ")" : ""), af: !!m.af })) });
  });
  return uit.sort((a, b) => (a.datum || "9999") < (b.datum || "9999") ? -1 : (a.datum || "9999") > (b.datum || "9999") ? 1 : 0);
}
function mmGroepVan(k, groep, filterNamen) {
  if (groep === "datum") return k.datum ? { key: k.datum, label: mmDagLabel(k.datum), sort: k.datum } : { key: "~", label: "Zonder datum", sort: "~" };
  if (groep === "persoon") {
    const naam = filterNamen.find(x => k.personen.some(p => p.toLowerCase() === x.toLowerCase())) || k.personen[0];
    return naam ? { key: "p:" + naam.toLowerCase(), label: "👤 " + naam, sort: naam.toLowerCase(), persoon: naam } : { key: "~", label: "Zonder persoon", sort: "~" };
  }
  if (groep === "project") {
    const p = k.projectId ? vind("projecten", k.projectId) : null;

  if (groep === "weekdag") {
    if (!k.datum) return { key: "~", label: "Zonder datum", sort: "~" };
    const w = weekdagVan(k.datum);

function mmPeriodeTekst(f) {
  if (!f.van && !f.tot) return "alles";
  if (f.van && f.tot) return f.van === f.tot ? mmKortDatum(f.van) : mmKortDatum(f.van) + " – " + mmKortDatum(f.tot);

async function mmVoerImportUit(f, kandidaten) {

  let nodes, basisId, mm = null, E = null, imp = null;
  if (f.doel === "nieuw") {
    mm = mmRecord(f.naam || ("Import " + periode), null);
    nodes = new Map(mm.nodes.map(n => [n.id, n]));
    basisId = mm.rootId;
  } else {
    E = MM.hoofd; if (!E) return null;
    nodes = E.nodes; E.geschiedenis();
    const ouder = (E.sel && E.nodes.get(E.sel)) || E.nodes.get(E.rootId);
    const opa = ouder.parentId ? E.nodes.get(ouder.parentId) : null;
    const hoek = opa ? Math.atan2(ouder.y - opa.y, ouder.x - opa.x) : 0;
    imp = mmNode({ parentId: ouder.id, tekst: "📥 Import " + periode, x: ouder.x + Math.cos(hoek) * 260, y: ouder.y + Math.sin(hoek) * 260 + 40, kleur: MM_KLEUREN[3] });
    nodes.set(imp.id, imp); basisId = imp.id; ouder.ingeklapt = false;
  }
  const aanwezig = new Set();
  if (E) for (const n of nodes.values()) if (n.koppeling) aanwezig.add(n.koppeling.soort + ":" + n.koppeling.id);
  let lijst = kandidaten.filter(k => !aanwezig.has(k.soort + ":" + k.id));
  const overgeslagen = kandidaten.length - lijst.length;
  const filterNamen = [...f.personen];
  if (f.groep !== "geen") lijst = lijst.map(k => ({ k, g: mmGroepVan(k, f.groep, filterNamen) }))
    .sort((a, b) => a.g.sort < b.g.sort ? -1 : a.g.sort > b.g.sort ? 1 : ((a.k.datum || "9") < (b.k.datum || "9") ? -1 : 1));
  else lijst = lijst.map(k => ({ k, g: null }));
  const groepen = new Map();
  lijst.forEach(({ k, g }, i) => {
    let ouderId = basisId;
    if (g) {
      if (!groepen.has(g.key)) {
        const gn = mmNode({ parentId: basisId, tekst: g.label, kleur: MM_KLEUREN[(groepen.size + (f.doel === "nieuw" ? 0 : 1)) % MM_KLEUREN.length],
          personen: g.persoon ? [g.persoon] : [], projectId: g.projectId || null });
        nodes.set(gn.id, gn); groepen.set(g.key, gn);
      }
      ouderId = groepen.get(g.key).id;
    }
    const ouder = nodes.get(ouderId);
    const n = mmNode({ parentId: ouderId, tekst: k.titel, kleur: ouder.kleur || MM_KLEUREN[i % MM_KLEUREN.length],
      startDatum: k.datum || null, eindDatum: k.eindDatum && k.eindDatum !== k.datum ? k.eindDatum : null, deadline: k.deadline || null,
      personen: (k.personen || []).slice(), projectId: k.projectId || null, notitie: k.notitie || "", checklist: k.checklist || [],
      koppeling: { soort: k.soort, id: k.id } });
    nodes.set(n.id, n);
    const ouders = [n];
    (k.kinderen || []).forEach(sub => {
      const o = ouders[Math.min(sub.niveau, ouders.length - 1)];
      const c = mmNode({ parentId: o.id, tekst: sub.tekst, kleur: n.kleur });
      nodes.set(c.id, c); ouders.length = Math.min(sub.niveau, ouders.length - 1) + 1; ouders.push(c);
    });

    mm.nodes = Array.from(nodes.values());

  }
  mmLayoutTak(nodes, imp, Math.atan2(imp.y - nodes.get(imp.parentId).y, imp.x - nodes.get(imp.parentId).x));
  E.render(); E.opslaan(true); E.selecteer(imp.id); E.passend();
  return { mm: E.mm, aantal: lijst.length, overgeslagen };
}

/** Mindmap "opslaan": alles staat al in IndexedDB, maar pas met een eigen naam telt hij als opgeslagen. */
function mmBenoem(E, naam) {
  const mm = E.mm; if (!mm || !naam) return;
  const root = E.nodes.get(E.rootId);
  if (root && (MM_STANDAARDNAMEN.includes(root.tekst) || root.tekst === mm.naam)) root.tekst = naam;
  mm.naam = naam; mm.benoemd = true;
  E.render(); E.opslaan(true);
}

function mmNieuweMindmapVraag() {
  bladVraag("Nieuwe mindmap", "", "Waar gaat hij over?", async naam => {

function mmInvoegen(bronId) {
  const E = MM.hoofd; if (!E) return;
  if (bronId === E.mmId) { toast("Een mindmap kan niet in zichzelf"); return; }
  const k = mmKloonBoom(bronId); if (!k.rootId) { toast("Niets om in te voegen"); return; }
  E.geschiedenis();
  const ouderId = E.sel || E.rootId, ouder = E.nodes.get(ouderId);
  const r = k.nodes.find(n => n.id === k.rootId);
  const dx = (ouder.x + 260) - r.x, dy = (ouder.y + 40 + Math.random() * 140) - r.y;
  k.nodes.forEach(n => { n.x += dx; n.y += dy; });
  r.parentId = ouderId; ouder.ingeklapt = false;
  k.nodes.forEach(n => E.nodes.set(n.id, n));
  k.connections.forEach(c => E.connections.push(c));
  E.render(); E.opslaan(true);
  toast(`“${mmVind(bronId).naam}” ingevoegd`, "Ongedaan maken", () => E.ongedaan());
}

async function mmExportJSON(E) {
  E.spoel();
  const mm = E.mm;
  const data = { formaat: "futureme-mindmap", versie: 1, naam: mm.naam, rootId: E.rootId, nodes: Array.from(E.nodes.values()), connections: E.connections };
  await deelOfDownload(`mindmap-${mmBestandsnaam(mm.naam)}-${vandaagISO()}.json`, JSON.stringify(data, null, 2), "application/json");
  toast("JSON geëxporteerd");
}
async function mmExportOutline(E) {
  const r = [], gezien = new Set();
  const extra = n => {
    const p = n.projectId ? vind("projecten", n.projectId) : null, x = [];
    if (mmHeeftDatum(n)) x.push("📅 " + mmDatumTekst(n));
    if (p) x.push("#" + p.naam);
    if (n.personen.length) x.push("met " + n.personen.join(", "));
    return x.length ? " (" + x.join(" · ") + ")" : "";
  };
  const loop = (id, d) => {
    const n = E.nodes.get(id); if (!n || gezien.has(id)) return; gezien.add(id);
    r.push(`${"  ".repeat(d)}- ${n.tekst}${extra(n)}`);
    if (n.notitie) r.push(`${"  ".repeat(d + 1)}> ${n.notitie.replace(/\n/g, " ")}`);
    n.checklist.forEach(c => r.push(`${"  ".repeat(d + 1)}- [${c.af ? "x" : " "}] ${c.tekst}`));
    E.kinderen(id).forEach(c => loop(c.id, d + 1));
  };
  loop(E.rootId, 0);
  const los = Array.from(E.nodes.values()).filter(n => !n.parentId && n.id !== E.rootId);
  if (los.length) { r.push("", "_Losse draden (nog niet vastgemaakt):_"); los.forEach(f => loop(f.id, 0)); }
  await deelOfDownload(`mindmap-${mmBestandsnaam(E.mm.naam)}-${vandaagISO()}.md`, r.join("\n"), "text/markdown");
  toast("Tekstoverzicht geëxporteerd");
}
function mmLaadJSON(bestand, E) {
  const lezer = new FileReader();
  lezer.onload = async () => {
    try {
      const p = JSON.parse(lezer.result);
      if (p && Array.isArray(p.mindmaps)) {
        (p.clusters || []).forEach(c => { if (!vind("mm_clusters", c.id)) bewaar("mm_clusters", { id: c.id || uid(), naam: c.naam || c.name || "Map", ingeklapt: false }); });
        for (const m of p.mindmaps) { const r = mmNormMindmap(m); if (vind("mm_mindmaps", r.id)) r.id = uid(); await bewaar("mm_mindmaps", r); }
        toast(`${p.mindmaps.length} mindmaps binnengehaald`, "Bekijk", () => mmBibliotheekBlad());
        return;
      }
      let arr = null, rootId = null, conns = [];
      if (Array.isArray(p)) arr = p;
      else if (p && Array.isArray(p.nodes)) { arr = p.nodes; rootId = p.rootId; conns = p.connections || []; }
      if (!arr || !arr.length) throw new Error("leeg");
      const nodes = arr.map(mmNormNode);
      if (!rootId || !nodes.some(n => n.id === rootId)) rootId = (nodes.find(n => !n.parentId) || nodes[0]).id;
      const ids = new Set(nodes.map(n => n.id));
      E.geschiedenis();
      E.nodes = new Map(nodes.map(n => [n.id, n])); E.rootId = rootId;
      E.connections = conns.filter(c => ids.has(c.a) && ids.has(c.b)).map(c => ({ id: c.id || uid(), a: c.a, b: c.b }));
      E.sel = null; E.render(); E.opslaan(true); E.passend();
      toast("Mindmap geladen", "Ongedaan maken", () => E.ongedaan());
    } catch (e) { toast("Laden mislukt — dit is geen geldig mindmap-bestand"); }
  };
  lezer.readAsText(bestand);
}

});
const mmSpoelAlles = () => { if (MM.hoofd) MM.hoofd.spoel(); MM.pips.forEach(p => p.engine.spoel()); };
window.addEventListener("pagehide", mmSpoelAlles);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") mmSpoelAlles(); });

/* ---------- De mindmap op je tijdlijn (Vandaag) ---------- */
TL_SOORTEN.mindmap = ["Mindmap", "var(--purple)"];
const _tijdlijnItems19 = tijdlijnItems;
tijdlijnItems = (van, tot) => {
  const uit = _tijdlijnItems19(van, tot);
  if (!tlAan("mindmap")) return uit;
  let erbij = false;
  const zet = (d, it) => { if (!d || d < van || d > tot) return; (uit[d] = uit[d] || []).push(it); erbij = true; };
  S.mm_mindmaps.forEach(mm => {
    if (mm.opTijdlijn === false) return;
    mm.nodes.forEach(n => {
      if (n.koppeling || n.voorbeeld || !mmHeeftDatum(n)) return;
      const basis = { soort: "mindmap", tijd: "", gepland: true, ref: mm.id + "|" + n.id, refSoort: "mindmap", kleur: "var(--purple)" };
      const t = n.tekst + " · " + mm.naam;
      const bereik = n.eindDatum && n.startDatum && n.eindDatum !== n.startDatum;
      if (n.startDatum) zet(n.startDatum, Object.assign({}, basis, { tekst: "🧠 " + (bereik ? "Start: " : "") + t }));
      if (n.eindDatum && n.eindDatum !== n.startDatum) zet(n.eindDatum, Object.assign({}, basis, { tekst: "🧠 " + (n.startDatum ? "Einde: " : "") + t }));
      if (n.deadline) zet(n.deadline, Object.assign({}, basis, { tekst: "🧠 Deadline: " + t, kleur: "var(--red)" }));
    });
  });
  if (erbij) for (const d in uit) uit[d].sort((a, b) => (a.tijd || "99:99") < (b.tijd || "99:99") ? -1 : 1);
  return uit;
};

/* ---------- Project-, personen- en zoekpagina: ook de mindmap-nodes ---------- */
const _vwProject19 = vwProject;
vwProject = () => {
  let h = _vwProject19();
  const p = vind("projecten", V.param); if (!p) return h;
  const lijst = mmNodesWaar(n => n.projectId === p.id);

    `<button class="actie" data-act="mm-import-voor" data-voor='${esc(JSON.stringify({ project: p.id, van: "", tot: "", groep: "soort", bronnen: ["taak"], nieuw: true }))}'>Maak mindmap</button>`);
  h += lijst.length ? mmNodeRijen(lijst) : `<div class="card">${leeg("🧠", "Nog in geen enkele mindmap", "Koppel een node aan dit project via 👤 Details.")}</div>`;
  return h;
};
const _vwPersonen19 = vwPersonen;
vwPersonen = () => {
  let h = _vwPersonen19();
  const tel = {};
  S.mm_mindmaps.forEach(m => m.nodes.forEach(n => (n.personen || []).forEach(x => { tel[x] = (tel[x] || 0) + 1; })));
  const namen = Object.keys(tel).sort((a, b) => tel[b] - tel[a]);
  if (!namen.length) return h;
  h += sectie("In je mindmaps", namen.length);
  h += `<div class="card">${namen.map(x => `<button class="rijknop" data-act="mm-persoon" data-naam="${esc(x)}">
    ${ico("mindmap", "width:20px;height:20px;color:var(--purple)")}<span class="nm">${esc(x)}</span>
    <span class="rechts">${tel[x]} ${tel[x] === 1 ? "node" : "nodes"}</span></button>`).join("")}</div>`;
  return h;
};
document.addEventListener("click", e => {
  const k = e.target.closest('[data-act="mm-persoon"]'); if (!k) return;
  const naam = k.dataset.naam, lijst = mmNodesWaar(n => (n.personen || []).some(x => x.toLowerCase() === naam.toLowerCase()));
  bladOpen("👤 " + naam + " in je mindmaps", mmNodeRijen(lijst) +
    `<button class="knop breed rand" style="margin-top:12px" data-act="mm-import-voor" data-voor='${esc(JSON.stringify({ personen: [naam], van: "", tot: "", groep: "soort", bronnen: ["taak", "afspraak", "notitie", "dagboek", "werkdoc"], nieuw: true }))}'>📥 Maak een mindmap van alles met ${esc(naam)}</button>`);
});
const _vwZoeken19 = vwZoeken;
vwZoeken = () => {
  let h = _vwZoeken19();
  const q = (V.zoek || "").trim().toLowerCase(); if (!q) return h;
  const lijst = mmNodesWaar(n => mmZoektekst(n).includes(q));
