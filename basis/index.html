<script>
"use strict";
/* ==========================================================================
   45. Dagoverzicht — het rustige beginscherm als de app opent
   Hooguit 5 zinnen en 5 beelden: ring, dagstrook en drie tegels.
   ========================================================================== */
const WK_CAT = {
  persoonlijk: { naam: "Persoonlijk", kleur: "#2f6fed", ill: "persoonlijk", view: "persoonlijk" },
  werk:        { naam: "Werk",        kleur: "var(--werk)", ill: "werk", view: "werk" },
  sociaal:     { naam: "Sociaal",     kleur: "#7a4fd6", ill: "gesprek", view: "afspraken" }
};
const WK_VOLGORDE = ["persoonlijk", "werk", "sociaal"];

/** Alles wat vandaag op de planning staat, ingedeeld in persoonlijk, werk en sociaal.
    Werk = gemarkeerd als werk; sociaal = privé en mét andere mensen; de rest is persoonlijk. */
function wkItems(v) {
  const uit = [];
  const cat = x => x.werk ? "werk" : ((x.personen || []).length ? "sociaal" : "persoonlijk");
  S.taken.filter(t => !t.af && t.datum === v).forEach(t =>
    uit.push({ cat: cat(t), titel: t.titel || "Taak", tijd: t.tijd || "", duur: t.duur || 0, personen: t.personen || [], soort: "taak", id: t.id }));
  S.afspraken.filter(a => (a.datum === v || (a.datum && a.totDatum && a.datum <= v && v <= a.totDatum) || (a.deadline === v && !a.uitkomst)))
    .forEach(a => uit.push({ cat: cat(a), titel: a.titel || "Afspraak", tijd: a.datum === v ? a.tijd || "" : "", eind: a.datum === v ? a.eindTijd || "" : "",
      personen: a.personen || [], soort: "afspraak", id: a.id, deadline: a.deadline === v && a.datum !== v }));
  S.werkdocs.filter(d => d.soort === "meeting" && d.datum === v && d.status !== "archief").forEach(d =>
    uit.push({ cat: "werk", titel: d.titel || "Meeting", tijd: d.tijd || "", personen: d.personen || [], soort: "werkdoc", id: d.id }));
  gewoontesVoor(v).filter(g => !gewoonteAf(g.id, v)).forEach(g =>
    uit.push({ cat: "persoonlijk", titel: g.naam || "Gewoonte", tijd: "", personen: [], soort: "gewoonte", id: g.id }));
  if (typeof vsSportVandaag === "function") vsSportVandaag().filter(o => vsSportStatus(o.sportId, v) !== "gedaan").forEach(o =>
    uit.push({ cat: "persoonlijk", titel: "Sporten: " + o.titel, tijd: o.tijd || "", duur: o.duurMin || 60, personen: [], soort: "sport", id: o.sportId }));
  const stand = typeof werkStand === "function" ? werkStand() : "alles";
  return uit.filter(x => stand === "alles" || (stand === "alleen" ? x.cat === "werk" : x.cat !== "werk"))
    .sort((a, b) => (a.tijd || "99:99") < (b.tijd || "99:99") ? -1 : (a.tijd || "99:99") > (b.tijd || "99:99") ? 1 : 0);
}

/* ---------- Taal ---------- */
const wkN = (n, een, meer) => n + " " + (n === 1 ? een : meer);
function wkOpsomming(delen) {
  if (delen.length <= 1) return delen.join("");
  return delen.slice(0, -1).join(", ") + " en " + delen[delen.length - 1];
}
function wkItemTekst(x) {
  let t = `“${x.titel}”`;
  const namen = (x.personen || []).filter(p => !x.titel.toLowerCase().includes(p.toLowerCase()));
  if (x.cat === "sociaal" && namen.length) t += " met " + wkOpsomming(namen);
  if (x.deadline) t = "de deadline van " + t;
  if (x.tijd) t += " om " + x.tijd;
  return t;
}
/** Eén zin per categorie: hoogstens twee dingen bij naam, de rest als aantal. */
function wkCatZin(cat, lijst) {
  if (!lijst.length) return null;
  const gew = lijst.filter(x => x.soort === "gewoonte").length;
  const dingen = lijst.filter(x => x.soort !== "gewoonte");
  const delen = dingen.slice(0, 2).map(wkItemTekst);
  const over = dingen.length - delen.length;
  if (over > 0) delen.push("nog " + wkN(over, "ding", "dingen"));
  if (gew) delen.push(wkN(gew, "gewoonte", "gewoontes"));
  const meer = delen.length > 1 || over > 0;
  const lijstTekst = wkOpsomming(delen);
  if (cat === "werk") return `Voor werk heb je ${lijstTekst}.`;
  if (cat === "sociaal") return `Sociaal ${meer ? "staan" : "staat"} ${lijstTekst} gepland.`;
  return `Persoonlijk ${meer ? "staan" : "staat"} ${lijstTekst} op je lijstje.`;
}
const wkMin = t => { const [u, m] = String(t).split(":").map(Number); return u * 60 + (m || 0); };
const wkTijd = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
function wkEindMin(x) {
  if (x.eind) return wkMin(x.eind);
  return wkMin(x.tijd) + (x.duur || (x.soort === "afspraak" || x.soort === "werkdoc" ? 60 : 30));
}
/** De afsluitende zin: eerst wat blijft liggen, dan wat eraan komt, anders de ruimte die je hebt. */
function wkSlotZin(items, v) {
  const laat = openTaken().filter(t => t.datum && t.datum < v).length + S.afspraken.filter(afspraakLaat).length;
  if (laat) return `Er ${laat === 1 ? "staat" : "staan"} nog ${wkN(laat, "ding", "dingen")} van eerder open — pak ${laat === 1 ? "dat" : "die"} rustig mee.`;
  const nu = wkNacht(wkMin(nuTijd()));
  const getimed = items.filter(x => x.tijd);
  const volgende = getimed.find(x => wkMin(x.tijd) >= nu);
  if (volgende && wkMin(volgende.tijd) - nu <= 120) return `Als eerste: ${wkItemTekst(volgende)}.`;
  // grootste vrije blok tussen nu (of 08:00) en 22:00
  let van = Math.max(nu, 8 * 60), beste = null;
  const blokken = getimed.map(x => [wkMin(x.tijd), wkEindMin(x)]).filter(b => b[1] > van).sort((a, b) => a[0] - b[0]);
  for (const [s, e] of blokken.concat([[22 * 60, 22 * 60]])) {
    if (s - van >= 120 && (!beste || s - van > beste[1] - beste[0])) beste = [van, s];
    van = Math.max(van, e);
  }
  if (beste && beste[1] <= 22 * 60) {
    const s = Math.ceil(beste[0] / 30) * 30, e = Math.floor(beste[1] / 30) * 30;
    if (e - s >= 120) return `Tussen ${wkTijd(s)} en ${wkTijd(e)} staat niets gepland — ruimte voor jezelf.`;
  }
  return items.length ? "Neem af en toe een pauze; de rest komt wel." : "Tijd voor iets wat je zelf leuk vindt.";
}
/** Hooguit 5 zinnen: overzicht, per categorie één zin, en een rustige afsluiter. */
function wkZinnen(items, v) {
  const tel = c => items.filter(x => x.cat === c).length;
  const n = { persoonlijk: tel("persoonlijk"), werk: tel("werk"), sociaal: tel("sociaal") };
  const zinnen = [];
  if (!items.length) zinnen.push({ cat: null, tekst: "Je planning voor vandaag is nog leeg — een rustige dag." });
  else {
    const delen = [];
    if (n.persoonlijk) delen.push(n.persoonlijk + " persoonlijk");
    if (n.werk) delen.push(n.werk + " voor werk");
    if (n.sociaal) delen.push(n.sociaal + " sociaal");
    const enige = WK_VOLGORDE.find(c => n[c] === items.length);
    const staart = !enige ? ": " + wkOpsomming(delen)
      : items.length === 1 ? ", " + { persoonlijk: "iets persoonlijks", werk: "iets voor werk", sociaal: "iets sociaals" }[enige]
      : ", " + { persoonlijk: "allemaal persoonlijk", werk: "allemaal voor werk", sociaal: "allemaal sociaal" }[enige];
    zinnen.push({ cat: null, tekst: `Vandaag ${items.length === 1 ? "staat er één ding" : "staan er " + items.length + " dingen"} op je planning${staart}.` });
  }
  WK_VOLGORDE.forEach(c => { const z = wkCatZin(c, items.filter(x => x.cat === c)); if (z) zinnen.push({ cat: c, tekst: z }); });
  zinnen.push({ cat: null, tekst: wkSlotZin(items, v), slot: true });
  return zinnen.slice(0, 5);
}

/* ---------- Beeld 1: de ring ---------- */
function wkRing(items) {
  const tot = items.length, r = 44, omtrek = 2 * Math.PI * r;
  let begin = 0;
  const bogen = tot ? WK_VOLGORDE.map(c => {
    const n = items.filter(x => x.cat === c).length; if (!n) return "";
    const lengte = omtrek * n / tot, gat = tot > 1 && n < tot ? 3 : 0;
    const boog = `<circle cx="60" cy="60" r="${r}" fill="none" style="stroke:${WK_CAT[c].kleur}" stroke-width="13" stroke-linecap="butt"
      stroke-dasharray="${Math.max(0, lengte - gat)} ${omtrek}" stroke-dashoffset="${-begin}" transform="rotate(-90 60 60)" opacity=".88"/>`;
    begin += lengte; return boog;
  }).join("") : "";
  return `<svg class="wk-ring" viewBox="0 0 120 120" role="img" aria-label="${tot} dingen vandaag">
    <circle cx="60" cy="60" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="13"/>${bogen}
    <text x="60" y="58" text-anchor="middle" class="wk-ring-getal">${tot}</text>
    <text x="60" y="76" text-anchor="middle" class="wk-ring-lbl">vandaag</text></svg>`;
}

/* ---------- Beeld 2: de dagstrook ---------- */
/* De strook loopt vast van 06:00 tot 02:00 's nachts. Tijden vóór 06:00 horen bij de nacht
   ná vandaag (00:30 staat dus achteraan, niet vooraan). */
const WK_VAN = 6 * 60, WK_TOT = 26 * 60;
const wkNacht = m => m < WK_VAN ? m + 24 * 60 : m;
function wkStrook(items) {
  const van = WK_VAN, tot = WK_TOT;
  const getimed = items.filter(x => x.tijd && wkNacht(wkMin(x.tijd)) <= tot);
  const B = 300, pos = m => Math.max(0, Math.min(B, (m - van) / (tot - van) * B));
  let h = "";
  for (let u = van / 60; u * 60 <= tot; u++) {
    const x = pos(u * 60), label = u % 3 === 0 || u * 60 === tot;
    h += `<line x1="${x}" x2="${x}" y1="${label ? 30 : 33}" y2="36" style="stroke:var(--line2)" stroke-width="1"/>`;
    if (label) h += `<text x="${x}" y="48" text-anchor="middle" class="wk-strook-uur">${pad(u % 24)}</text>`;
  }
  const banen = [[], [], []];
  getimed.forEach(x => {
    const start = wkNacht(wkMin(x.tijd)), eind = start + (wkEindMin(x) - wkMin(x.tijd) + 24 * 60) % (24 * 60) || 30;
    const s = pos(start), e = Math.max(s + 5, pos(eind));
    const baan = banen.findIndex(b => !b.some(([a, z]) => s < z + 2 && e > a - 2));
    const i = baan < 0 ? 2 : baan; banen[i].push([s, e]);
    h += `<rect x="${s}" y="${26 - i * 9}" width="${e - s}" height="7" rx="3.5" style="fill:${WK_CAT[x.cat].kleur}" opacity=".85"><title>${esc(x.titel + " · " + x.tijd)}</title></rect>`;
  });
  const nu = wkNacht(wkMin(nuTijd()));
  if (nu >= van && nu <= tot) h += `<line x1="${pos(nu)}" x2="${pos(nu)}" y1="2" y2="38" style="stroke:var(--red)" stroke-width="1.6" stroke-dasharray="2 2"/>
    <circle cx="${pos(nu)}" cy="2.5" r="2.5" style="fill:var(--red)"/>`;
  const zonder = items.filter(x => !x.tijd).length, buiten = items.filter(x => x.tijd).length - getimed.length;
  return `<div class="wk-strook">
    <svg viewBox="-6 0 312 52" preserveAspectRatio="none" role="img" aria-label="Je dag van ${wkTijd(van)} tot ${wkTijd(tot % (24 * 60))} 's nachts">
      <line x1="0" x2="${B}" y1="36" y2="36" style="stroke:var(--line2)" stroke-width="1.4"/>${h}</svg>
    <div class="wk-strook-onder">${getimed.length ? wkN(getimed.length, "ding", "dingen") + " met een tijd" : "Nog niets met een vaste tijd"}${zonder ? " · " + zonder + " zonder vaste tijd" : ""}${buiten ? " · " + buiten + " tussen 02:00 en 06:00" : ""}</div>
  </div>`;
}

/* ---------- Beelden 3–5: de drie tegels ---------- */
function wkTegel(c, items) {
  const cat = WK_CAT[c], lijst = items.filter(x => x.cat === c);
  const eerst = lijst.find(x => x.tijd && wkMin(x.tijd) >= wkMin(nuTijd())) || lijst.find(x => x.tijd) || lijst[0];
  const onder = !lijst.length ? "Niets gepland" : eerst.tijd ? eerst.tijd + " · " + eerst.titel : eerst.titel;
  return `<button class="wk-tegel" style="--wk:${cat.kleur}" data-act="ga" data-view="${cat.view}" aria-label="${esc(cat.naam)}: ${lijst.length}">
    <svg class="wk-ill" viewBox="0 0 100 80" aria-hidden="true"><use href="#ill-${cat.ill}"/></svg>
    <span class="wk-tegel-getal">${lijst.length}</span>
    <span class="wk-tegel-naam">${cat.naam}</span>
    <span class="wk-tegel-sub">${esc(onder)}</span>
  </button>`;
}

/* ---------- Het scherm ---------- */
function vwWelkom() {
  const v = vandaagISO(), items = wkItems(v), zinnen = wkZinnen(items, v);
  const stand = typeof werkStand === "function" ? werkStand() : "alles";
  return `<div class="wk">
    <div class="wk-top">
      ${wkRing(items)}
      <div class="wk-legenda">${WK_VOLGORDE.map(c => `<div class="wk-leg"><i style="background:${WK_CAT[c].kleur}"></i>${WK_CAT[c].naam}<b>${items.filter(x => x.cat === c).length}</b></div>`).join("")}
        ${stand !== "alles" ? `<div class="wk-filter">${stand === "uit" ? "Werk staat uit" : "Alleen werk"}</div>` : ""}</div>
    </div>
    <div class="wk-zinnen">${zinnen.map(z => `<p class="wk-zin${z.slot ? " slot" : ""}">${z.cat ? `<i style="background:${WK_CAT[z.cat].kleur}"></i>` : ""}${esc(z.tekst)}</p>`).join("")}</div>
    ${wkStrook(items)}
    <div class="wk-tegels">${WK_VOLGORDE.map(c => wkTegel(c, items)).join("")}</div>
    <button class="knop breed primair wk-knop" data-act="ga" data-view="vandaag">Bekijk je dag</button>
    <button class="wk-link" data-act="ga" data-view="start">Of leg meteen iets vast</button>
  </div>`;
}
Object.defineProperty(KOPPEN, "welkom", {
  get: () => [typeof groet === "function" ? groet() : "Welkom", () => { const s = langDatumLabel(vandaagISO()); return s[0].toUpperCase() + s.slice(1); }],
  configurable: true, enumerable: true
});
</script>
<script>
"use strict";
/* ==========================================================================
   46. Widget “Uitgave loggen” — op het dagoverzicht en in Nieuw
   Bedrag, waarvoor en categorie; gaat direct in Financieel (en je logboek).
   ========================================================================== */
/** Categorieën op volgorde van gebruik (laatste 90 dagen), anders de standaardvolgorde. */
function ugCategorieen() {
  const grens = plusDagen(vandaagISO(), -90), tel = {};
  S.uitgaven.forEach(u => { if (u.datum >= grens) tel[u.categorie] = (tel[u.categorie] || 0) + 1; });
  return CATEGORIEEN.map((c, i) => ({ c, n: tel[c[0]] || 0, i })).sort((a, b) => b.n - a.n || a.i - b.i).map(x => x.c);
}
function ugStand() {
  const b = dagbudget(vandaagISO());
  if (!b.maand) return { kort: `${eur(b.uitgegeven)} vandaag`, pct: null, rood: false };
  const pct = b.basis > 0 ? Math.min(100, Math.round(b.uitgegeven / b.basis * 100)) : 100;
  return b.over >= 0 ? { kort: `nog ${eur(b.over)} over`, pct, rood: false }
    : { kort: `${eur(-b.over)} te veel`, pct: 100, rood: true };
}
function ugWidget(plek) {
  const cats = ugCategorieen(), laatst = inst("ugLaatsteCat", cats[0][0]);
  const st = ugStand();
  return `<div class="ug-widget" data-plek="${plek}">
    <div class="ug-kop">
      <span class="ug-ico">${ico("portemonnee")}</span>
      <b>Uitgave loggen</b>
      <button class="ug-naar${st.rood ? " rood" : ""}" data-act="ga" data-view="financieel" aria-label="Naar Financieel: ${esc(st.kort)}">${esc(st.kort)} ${ico("pijlr", "width:13px;height:13px")}</button>
    </div>
    ${st.pct != null ? `<div class="ug-balk${st.rood ? " rood" : ""}" title="${st.pct}% van je dagbudget"><i style="width:${st.pct}%"></i></div>` : ""}
    <div class="ug-rij">
      <label class="ug-bedragvak"><span>€</span>
        <input class="ug-bedrag" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-label="Bedrag" enterkeyhint="done"></label>
      <input class="ug-oms" type="text" placeholder="Waaraan?" aria-label="Omschrijving (mag leeg)" enterkeyhint="done">
    </div>
    <div class="ug-cats" role="group" aria-label="Categorie">${cats.map(([k, n, kl]) =>
      `<button class="ug-cat" data-ug-cat="${k}" style="--c:${kl}" aria-pressed="${k === laatst}">${esc(n)}</button>`).join("")}</div>
    <div class="ug-voet">
      <button class="ug-meer" data-act="ug-meer">Meer opties</button>
      <button class="ug-knop" data-act="ug-log">Loggen</button>
    </div>
  </div>`;
}
async function ugLog(w) {
  const veld = $(".ug-bedrag", w);
  const bedrag = Math.round(csvGetal(veld.value) * 100) / 100;
  if (!(bedrag > 0)) { toast("Vul een bedrag in"); veld.focus(); return; }

<script>
"use strict";
/* ==========================================================================
   47. Herhalingen als echte reeks
   Een herhalende taak of afspraak wordt een reeks losse items (elk met een
   eigen datum, eigen afvinken, eigen notities). Met een t/m-datum tot die dag;
   zonder t/m-datum maximaal 12 maanden vooruit — dat venster schuift mee en
   wordt bij het openen van de app aangevuld.
   ========================================================================== */
const REEKS_MAANDEN = 12, REEKS_MAX = 1000;

/** Tot waar een reeks gevuld wordt. */
function reeksHorizon(h) {
  const vol = plusMaanden(vandaagISO(), REEKS_MAANDEN);
  return h && h.tot ? h.tot : vol;
}

/** Alle datums volgens schema h (verankerd op start) die na `na` en uiterlijk op `tot` vallen. */
function reeksDatums(start, h, na, tot, max) {
  const uit = [];
  if (!start || !h || !h.soort || !tot) return uit;
  max = max || REEKS_MAX;
  const e = Math.max(1, +h.elke || 1);
  const neem = d => { if (d > na && d <= tot) uit.push(d); };
  if (h.soort === "week" && h.dagen && h.dagen.length) {
    const ws0 = weekStart(start);
    let d = na > start ? na : start;
    for (let i = 0; i < 4000 && uit.length < max; i++) {
      d = plusDagen(d, 1);
      if (d > tot) break;
      const wk = Math.round(dagVerschil(weekStart(d), ws0) / 7);
      if (wk % e === 0 && h.dagen.includes(weekdagVan(d))) neem(d);
    }
    return uit;
  }
  const dt0 = parseISO(start);
  const dom = h.soort === "maand" && h.dagVanMaand ? +h.dagVanMaand : dt0.getDate();
  for (let k = 1; k < 5000 && uit.length < max; k++) {
    let d;
    if (h.soort === "dag") d = plusDagen(start, k * e);
    else if (h.soort === "week") d = plusDagen(start, 7 * k * e);
    else if (h.soort === "maand") {
      const m = new Date(dt0.getFullYear(), dt0.getMonth() + k * e, 1);
      const laatste = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      d = dISO(new Date(m.getFullYear(), m.getMonth(), Math.min(dom, laatste)));
    } else if (h.soort === "jaar") d = plusMaanden(start, 12 * k * e);
    else break;
    if (d > tot) break;
    neem(d);
  }
  return uit;
}

const reeksLeden = (w, rid) => rid ? S[w].filter(y => y.reeksId === rid) : [];
const reeksSorteer = (a, b) => (a.datum || "") < (b.datum || "") ? -1 : (a.datum || "") > (b.datum || "") ? 1 : (a.id < b.id ? -1 : 1);
/** "Aangeraakt": afgevinkt of al ingevuld — zulke keren gooien we nooit stilletjes weg. */
const reeksAangeraakt = (w, y) => w === "taken"
  ? !!(y.af || (y.subtaken || []).some(s => s.af))
  : !!(y.notities || y.uitkomst);

/** Een nieuwe keer van de reeks, gekopieerd van een bestaande keer. */
function reeksKloon(w, bron, datum) {
  const k = JSON.parse(JSON.stringify(Object.assign({}, bron, { bijlagen: [] })));
  const schuif = bron.datum ? dagVerschil(datum, bron.datum) : 0;
  k.id = uid();
  k.datum = datum;
  k.gemaakt = new Date().toISOString();
  if (w === "taken") {
    k.af = false; k.afOp = null; k.uitgesteldTot = null; k.uitgesteld = 0;
    delete k.overgeslagen; delete k.afspraakId; delete k.werkdocId;
    k.subtaken = (k.subtaken || []).map(s => Object.assign(s, { af: false }));
    k.volgorde = Date.now();
  } else {
    k.notities = ""; k.uitkomst = "";
    if (bron.totDatum) k.totDatum = plusDagen(bron.totDatum, schuif);
    if (bron.deadline) k.deadline = plusDagen(bron.deadline, schuif);
  }
  return k;
}

async function reeksBewaarVeel(w, lijst) {
  for (const x of lijst) await bewaar(w, x);
}
async function reeksZetGemaakt(rid, iso) {
  const kaart = Object.assign({}, inst("reeksGemaakt", {}));
  if (iso == null) delete kaart[rid]; else kaart[rid] = iso;
  await zetInst("reeksGemaakt", kaart);
}

/** Vul een reeks aan tot de horizon. Geeft het aantal nieuw gemaakte keren terug. */
async function reeksAanvullen(w, rid) {
  const leden = reeksLeden(w, rid);
  if (!leden.length) return 0;
  const sjabloon = leden.slice().sort(reeksSorteer).pop();
  const h = sjabloon.herhaal;
  if (!h || !h.soort) return 0;
  const start = sjabloon.reeksStart || leden.slice().sort(reeksSorteer)[0].datum;
  const gemaakt = inst("reeksGemaakt", {})[rid];
  const na = [gemaakt, ...leden.map(y => y.datum)].filter(Boolean).sort().pop();
  const datums = reeksDatums(start, h, na, reeksHorizon(h));
  await reeksBewaarVeel(w, datums.map(d => reeksKloon(w, sjabloon, d)));
  const tot = [na, ...datums].sort().pop();
  if (tot !== gemaakt) await reeksZetGemaakt(rid, tot);
  return datums.length;
}

/** Maak van één item (met een herhaalschema) een reeks. */
async function reeksNieuw(w, x) {
  if (!x || !x.herhaal || !x.herhaal.soort) return 0;
  if (!x.datum) x.datum = eersteHerhaalDatum(x.herhaal);
  x.reeksId = uid();
  x.reeksStart = x.datum;
  await bewaar(w, x);
  return reeksAanvullen(w, x.reeksId);
}

/** Bij het openen: oude herhalende taken omzetten en alle reeksen bijvullen. */
async function reeksenBijwerken() {
  let n = 0;
  for (const t of S.taken.filter(t => t.herhaal && t.herhaal.soort && !t.reeksId && !t.af)) n += await reeksNieuw("taken", t);
  for (const w of ["taken", "afspraken"]) {
    const rids = [...new Set(S[w].filter(y => y.reeksId).map(y => y.reeksId))];
    for (const rid of rids) n += await reeksAanvullen(w, rid);
  }
  return n;
}

/** In lijsten telt een reeks één keer: de eerstvolgende open keer (taken) of komende keer (afspraken). */
function reeksDedup(lijst) {
  const v = vandaagISO(), beste = {};
  const telt = x => !!x.reeksId && ("af" in x ? !x.af : (x.datum || "") >= v);
  lijst.forEach(x => {
    if (!telt(x)) return;
    const b = beste[x.reeksId];
    if (!b || reeksSorteer(x, b) < 0) beste[x.reeksId] = x;
  });
  return lijst.filter(x => !telt(x) || beste[x.reeksId] === x);
}

/* ---------- Uitleg onder het herhaalveld ---------- */
function herhaalUitlegHTML(datum, h) {
  const vast = `Zonder einddatum wordt het maximaal ${REEKS_MAANDEN} maanden vooruit herhaald (dat schuift vanzelf mee).`;
  if (!h || !h.soort) return vast;
  const start = datum || eersteHerhaalDatum(h);
  if (h.tot && h.tot < start) return `<span style="color:var(--red)">De einddatum ligt vóór de eerste keer (${esc(korteDatum(start))}).</span>`;
  const lijst = [start, ...reeksDatums(start, h, start, reeksHorizon(h))];
  const laatste = lijst[lijst.length - 1], kort = iso => `${DAGKORT[weekdagVan(iso)]} ${korteDatum(iso)}`;
  const telling = `<b>${lijst.length} keer</b> in je agenda: ${esc(kort(start))}${lijst.length > 1 ? " t/m " + esc(kort(laatste)) : ""}.`;
  return h.tot ? telling : `${vast}<br>${telling}`;
}
/** Leest het herhaalveld (prefix f = taak, a = afspraak) en werkt de uitleg live bij. */
function herhaalVeldLees(p, dagAttr) {
  const b = $("#bladinhoud"), s = ($("#" + p + "-herhaal-soort") || {}).value;
  if (!s) return null;
  const tot = ($("#" + p + "-herhaal-tot") || {}).value || "";
  const h = {
    soort: s, elke: Math.max(1, +$("#" + p + "-herhaal-elke").value || 1),
    dagen: s === "week" ? $$(`[${dagAttr}]`, b).filter(x => x.getAttribute("aria-pressed") === "true").map(x => +x.getAttribute(dagAttr)).sort() : []
  };
  if (tot) h.tot = tot;
  return h;
}
function herhaalUitlegBind(p, dagAttr) {
  const b = $("#bladinhoud"), uitleg = $("#" + p + "-herhaal-uitleg");
  if (!uitleg) return;
  const upd = () => {
    if (!uitleg.isConnected) return;
    uitleg.innerHTML = herhaalUitlegHTML(($("#" + p + "-datum") || {}).value || "", herhaalVeldLees(p, dagAttr));
  };
  upd();
  b.addEventListener("input", upd);
  b.addEventListener("change", upd);
  b.addEventListener("click", () => setTimeout(upd, 0));
}
/** Geeft een foutmelding als de t/m-datum niet klopt, anders null. */
function herhaalFout(datum, h) {
  if (!h || !h.tot) return null;
  const start = datum || eersteHerhaalDatum(h);
  return h.tot < start ? "De einddatum van de herhaling ligt vóór de eerste keer" : null;
}

/* ---------- Na opslaan in het taak- of afspraakblad ---------- */
const REEKS_VELDEN = {
  taken: ["titel", "tijd", "duur", "prioriteit", "projectId", "werk", "labels", "personen", "energie", "notitie", "waarom", "klaarAls", "subtaken"],
  afspraken: ["titel", "soort", "tijd", "eindTijd", "plek", "personen", "werk", "voorbereiding"]
};
const reeksSchema = h => h && h.soort ? JSON.stringify([h.soort, Math.max(1, +h.elke || 1), (h.dagen || []).slice().sort(), h.dagVanMaand || 0]) : "";
const reeksVeldGelijk = (w, a, b, k) => k === "subtaken"
  ? JSON.stringify((a.subtaken || []).map(s => [s.tekst, s.niveau || 0])) === JSON.stringify((b.subtaken || []).map(s => [s.tekst, s.niveau || 0]))
  : JSON.stringify(reeksLeeg(a[k])) === JSON.stringify(reeksLeeg(b[k]));
const reeksLeeg = v => v == null || v === "" || v === false || (Array.isArray(v) && !v.length) ? null : v;

/** Momentopname van reeksen + het item vóór de wijziging, om alles in één keer terug te zetten. */
function reeksFoto(w, rids, oud) {
  const set = new Set(rids.filter(Boolean));
  const leden = S[w].filter(y => set.has(y.reeksId)).map(y => structuredClone(y));
  const ids = new Set(leden.map(y => y.id));
  const kaart = structuredClone(inst("reeksGemaakt", {}));
  return async extraRids => {
    const weg = new Set([...set, ...(extraRids || [])]);
    for (const y of S[w].filter(y => weg.has(y.reeksId) && !ids.has(y.id) && (!oud || y.id !== oud.id))) await verwijder(w, y.id);
    for (const y of leden) await bewaar(w, structuredClone(y));
    if (oud) await bewaar(w, structuredClone(oud));
    await zetInst("reeksGemaakt", kaart);
    teken();
    toast("Teruggezet");
  };
}

async function reeksNaOpslaan(w, x, oud) {
  const nieuwS = reeksSchema(x.herhaal), oudS = oud ? reeksSchema(oud.herhaal) : "";
  const rid = oud && oud.reeksId;
  if (!nieuwS && !rid) return;

  // A. Nieuw herhalend (of een los item krijgt een herhaling)
  if (nieuwS && !rid) {
    const n = await reeksNieuw(w, x);
    const leden = reeksLeden(w, x.reeksId).sort(reeksSorteer);
    teken();
    toast(`Herhaling ingepland · ${n + 1} keer, t/m ${korteDatum(leden[leden.length - 1].datum)}`, null, null, 4500);
    return;
  }
  const splitsDatum = oud.datum || x.datum;
  const later = () => reeksLeden(w, rid).filter(y => y.id !== x.id && y.datum > splitsDatum);
  const eerder = () => reeksLeden(w, rid).filter(y => y.id !== x.id && y.datum < splitsDatum);
  const sluitEerdereAf = async () => {
    for (const y of eerder()) { y.herhaal = Object.assign({}, y.herhaal, { tot: plusDagen(splitsDatum, -1) }); await bewaar(w, y); }
  };

  // B. Herhaling uitgezet: vanaf hier stopt de reeks
  if (!nieuwS) {
    const herstel = reeksFoto(w, [rid], oud);
    const weg = later().filter(y => !reeksAangeraakt(w, y));
    for (const y of weg) await verwijder(w, y.id);
    await sluitEerdereAf();
    x.reeksId = null; x.reeksStart = null;
    await bewaar(w, x);
    teken();
    toast(`Herhaling gestopt${weg.length ? ` · ${weg.length} volgende ${weg.length === 1 ? "keer" : "keren"} weggehaald` : ""}`, "Ongedaan", herstel, 6000);
    return;
  }

  // C. Ander schema (bv. wekelijks → dagelijks): vanaf deze keer een nieuwe reeks
  if (nieuwS !== oudS) {
    const herstel = reeksFoto(w, [rid], oud);
    const weg = later().filter(y => !reeksAangeraakt(w, y));
    for (const y of weg) await verwijder(w, y.id);
    await sluitEerdereAf();
    const n = await reeksNieuw(w, x);
    teken();
    toast(`Herhaling aangepast · vanaf ${korteDatum(x.datum)} ${n + 1} keer ingepland`, "Ongedaan", () => herstel([x.reeksId]), 6000);
    return;
  }

  // D. Zelfde schema. Is de t/m-datum veranderd? Dan geldt die voor de hele reeks.
  const oudTot = (oud.herhaal && oud.herhaal.tot) || "", nieuwTot = x.herhaal.tot || "";
  let melding = "";
  if (oudTot !== nieuwTot) {
    for (const y of reeksLeden(w, rid)) {
      if (y.id !== x.id) { y.herhaal = Object.assign({}, y.herhaal); if (nieuwTot) y.herhaal.tot = nieuwTot; else delete y.herhaal.tot; await bewaar(w, y); }
    }
    let weg = 0;
    if (nieuwTot) {
      for (const y of reeksLeden(w, rid).filter(y => y.datum > nieuwTot && !reeksAangeraakt(w, y))) { await verwijder(w, y.id); weg++; }
      const gemaakt = inst("reeksGemaakt", {})[rid];
      if (!gemaakt || gemaakt > nieuwTot) await reeksZetGemaakt(rid, nieuwTot);
    }
    const bij = await reeksAanvullen(w, rid);
    melding = nieuwTot ? `Herhaling loopt nu t/m ${korteDatum(nieuwTot)}` : `Herhaling zonder einddatum (${REEKS_MAANDEN} maanden vooruit)`;
    if (weg) melding += ` · ${weg} keer weggehaald`;
    if (bij) melding += ` · ${bij} keer bijgezet`;
  }

  // Andere velden gewijzigd? Vraag of het voor de volgende keren ook moet gelden.
  const velden = REEKS_VELDEN[w].filter(k => !reeksVeldGelijk(w, x, oud, k));
  const volgende = reeksLeden(w, rid).filter(y => y.id !== x.id && y.datum > x.datum && (w === "taken" ? !y.af : !y.uitkomst));
  teken();
  if (velden.length && volgende.length) {
    toast(`${melding ? melding + " · " : ""}Ook voor de ${volgende.length} volgende ${volgende.length === 1 ? "keer" : "keren"}?`, "Doorvoeren", async () => {
      const bron = JSON.parse(JSON.stringify(velden.reduce((o, k) => (o[k] = x[k], o), {})));
      for (const y of volgende) {
        const kopie = JSON.parse(JSON.stringify(bron));
        if (kopie.subtaken) kopie.subtaken = kopie.subtaken.map(s => Object.assign(s, { af: false }));
        Object.assign(y, kopie);
        await bewaar(w, y);
      }
      teken();
      toast(`Doorgevoerd voor ${volgende.length} keer`);
    }, 7000);
  } else if (melding) toast(melding, null, null, 4500);
}

/* ---------- Afvinken van een keer uit een reeks ---------- */
async function reeksVink(t) {
  const v = vandaagISO();
  const gemist = S.taken.filter(y => y.reeksId === t.reeksId && y.id !== t.id && !y.af && y.datum && y.datum < v);
  const voor = [t, ...gemist].map(y => structuredClone(y));
  t.af = true; t.afOp = new Date().toISOString();
  await bewaar("taken", t);
  for (const y of gemist) { y.af = true; y.afOp = null; y.overgeslagen = true; await bewaar("taken", y); }
  const g = await logGebeurtenis("taak", "Afgerond: " + t.titel, t.id);
  teken();
  const volgende = S.taken.filter(y => y.reeksId === t.reeksId && !y.af && y.datum).sort(reeksSorteer)[0];
  const n = gemist.length;
  toast(`Afgerond${volgende ? " · volgende keer " + datumLabel(volgende.datum) : ""}${n ? ` · ${n} gemiste ${n === 1 ? "keer" : "keren"} overgeslagen` : ""}`,
    "Ongedaan", async () => {
      for (const y of voor) await bewaar("taken", y);
      if (g) await verwijder("gebeurtenissen", g.id);
      teken();
    });
}

/* ---------- Verwijderen: alleen deze keer, of deze en alle volgende ---------- */
function verwijderMetReeks(w, x, klaar) {
  const volgende = x.reeksId ? reeksLeden(w, x.reeksId).filter(y => y.id !== x.id && y.datum > x.datum) : [];
  if (!volgende.length) {
    bevestigVerwijderen(async () => { await verwijder(w, x.id); klaar(1); });
    return;
  }
  bladOpen("Verwijderen?",
    `<p class="klein" style="font-size:15px;margin:10px 2px 8px">Ewa zebbi, zeg wollah je wil deze definitief verwijderen a sah.</p>
     <p class="klein" style="margin:0 2px 16px">Dit is een herhaling (${esc(herhaalTekst(x.herhaal))}). Na ${esc(korteDatum(x.datum))} staan er nog ${volgende.length} in je agenda.</p>`,
    `<div style="display:grid;gap:8px;width:100%">
       <button class="knop rand breed" id="rv-deze">Alleen deze keer</button>
       <button class="knop gevaar breed" id="rv-volgende">Deze en alle ${volgende.length} volgende</button>
       <button class="knop rand breed" id="bevAnnuleer">Nee</button></div>`);
  $("#bevAnnuleer").onclick = bladSluit;
  $("#rv-deze").onclick = async () => { bladSluit(); await verwijder(w, x.id); klaar(1); };
  $("#rv-volgende").onclick = async () => {
    bladSluit();
    const rid = x.reeksId, grens = x.datum;
    for (const y of [x, ...volgende]) await verwijder(w, y.id);
    for (const y of reeksLeden(w, rid)) { y.herhaal = Object.assign({}, y.herhaal, { tot: plusDagen(grens, -1) }); await bewaar(w, y); }
    klaar(volgende.length + 1);
  };
}

/* ---------- Koppelen aan de rest van de app ---------- */
{
  const _openTaken24 = openTaken;
  openTaken = () => reeksDedup(_openTaken24());
  const _takenVanProject24 = takenVanProject;
  takenVanProject = id => reeksDedup(_takenVanProject24(id));
  const _filterTaken24 = filterTaken;
  filterTaken = (q, bron) => reeksDedup(_filterTaken24(q, bron));

  eersteKeer = async (...a) => {
    await _eersteKeer24(...a);
    try { await reeksenBijwerken(); } catch (e) { console.error("reeksen", e); }
  };
  const _openTaakBlad24 = openTaakBlad;
  openTaakBlad = (...a) => { _openTaakBlad24(...a); herhaalUitlegBind("f", "data-hdag"); };
  const _openAfspraakBlad24 = openAfspraakBlad;
  openAfspraakBlad = (...a) => { _openAfspraakBlad24(...a); herhaalUitlegBind("a", "data-ahdag"); };
}

const shH = id => id ? vind("sh_hustles", id) : null;

/** BR-02: kwaliteitsmeter per antwoord (0–4). */
function shKwaliteit(nr, tekst) {

}
const shKwalLabel = k => k >= 4 ? "Toetsbaar" : k >= 2 ? "Concreet" : "Vaag";

}

/* ---------- Opslag: meerdere records in één transactie (BR-03, FR-WZ-11) ---------- */
function shIdbVeel(ops) {
  const winkels = [...new Set(ops.map(o => o[0]))];
  return new Promise((res, rej) => {
    let t;
    try { t = db.transaction(winkels, "readwrite"); } catch (e) { return rej(e); }
    ops.forEach(([w, obj, weg]) => { if (obj) t.objectStore(w).put(obj); else t.objectStore(w).delete(weg); });
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error("Transactie afgebroken"));
  });
}
/** ops: [winkel, obj] = bewaren, [winkel, null, id] = verwijderen. Pas na een geslaagde transactie in S. */
async function shBewaarVeel(ops) {
  await shIdbVeel(ops);
  ops.forEach(([w, obj, weg]) => {
    const l = S[w];
    if (obj) { const i = l.findIndex(x => x.id === obj.id); if (i >= 0) l[i] = obj; else l.push(obj); }

  });
}

function shNieuwRecord(v) {
  const pijlers = {};
  SH_PIJLERS.forEach(p => {

/** BR-03: aanmaakprocedure in één IndexedDB-transactie. */
async function shMaakAan(velden, opties) {
  opties = opties || {};

  if (opties.voorbeeld) h.voorbeeld = true;
  const ops = [["sh_hustles", h]];
  // (2) checklist + Scope-punten
  (typeof shChecklistVoor === "function" ? shChecklistVoor(h) : []).forEach(c => ops.push(["sh_checks", c]));
  // (3) mappen
  const mappen = SH_MAPPEN.map(([nr, naam, emoji], i) => ({ id: uid(), shId: h.id, ouderId: null, naam: nr + " " + naam, kleur: "", emoji, standaard: nr, volgorde: i }));
  mappen.forEach(m => ops.push(["sh_mappen", m]));

  const kolommen = SH_KOLOMMEN.map(([rol, naam, kleur, wip], i) => ({ id: uid(), shId: h.id, naam, kleur, wip, rol, volgorde: i, gearchiveerd: false }));

  // (6) backlogkaart + concept-experiment uit pijler 5

  }]);

  await shBewaarVeel(ops);

  return h;
}

/* ---------- Tellers ---------- */
/** BR-15 */
function shTelling() {
  const v = vandaagISO();
  let n = 0;
  shActief().forEach(h => {
    n += shVan("sh_checks", h.id).filter(c => c.prioriteit === "hoog" && (c.status === "open" || c.status === "bezig")).length;
    const klaar = new Set(shVan("sh_kolommen", h.id).filter(k => k.rol === "klaar").map(k => k.id));
    n += shVan("sh_kaarten", h.id).filter(k => !k.gearchiveerd && k.deadline && k.deadline < v && !klaar.has(k.kolomId)).length;
  });
  return n || "";
}
function shMaandOmzet(shId, ym) {
  ym = ym || vandaagISO().slice(0, 7);
  return S.sh_geld.filter(g => (!shId || g.shId === shId) && g.soort === "in" && g.datum.slice(0, 7) === ym && (!shId ? !(shH(g.shId) || {}).gearchiveerd : true))

}
function shMinuten(shId, van, tot) {

/* ---------- Overzicht (SCR-01) ---------- */
function shSparkline(h, kleur) {
  const v = vandaagISO(), ws = weekStart(v), waarden = [];
  const heeftGeld = shVan("sh_geld", h.id).length > 0;

    const van = plusDagen(ws, -7 * i), tot = plusDagen(van, 6);
    waarden.push(heeftGeld
      ? shVan("sh_geld", h.id).filter(g => g.soort === "in" && g.datum >= van && g.datum <= tot).reduce((s, g) => s + g.bedrag, 0)
      : shMinuten(h.id, van, tot));
  }
  const max = Math.max(1, ...waarden), w = 84, hg = 26;
  const pt = waarden.map((x, i) => `${(i / 7 * w).toFixed(1)},${(hg - 2 - x / max * (hg - 4)).toFixed(1)}`).join(" ");
  const label = heeftGeld ? "Omzet per week, laatste 8 weken" : "Uren per week, laatste 8 weken";

function shScore(h) { return typeof shGezondheid === "function" ? shGezondheid(h).score : null; }

}

      </span>

    </span>

}
function shMatrixHTML(lijst) {

/* ---------- Herschikken door te slepen (lijst, backlog, dashboard) ---------- */
function shSorteerbaar(lijst, opt) {
  if (!lijst || lijst._sh) return;
  lijst._sh = true;
  lijst.addEventListener("pointerdown", e => {
    const greep = e.target.closest(opt.greep || ".sh-greep"); if (!greep || !lijst.contains(greep)) return;
    const item = greep.closest(opt.item); if (!item) return;
    e.preventDefault();
    try { greep.setPointerCapture(e.pointerId); } catch (x) {}
    item.classList.add("sh-sleept");
    const beweeg = ev => {
      const broers = $$(opt.item, lijst).filter(x => x !== item);
      const na = broers.find(x => { const r = x.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
      if (na) { if (item.nextElementSibling !== na) lijst.insertBefore(item, na); }
      else if (lijst.lastElementChild !== item) lijst.appendChild(item);
    };
    const klaar = () => {
      greep.removeEventListener("pointermove", beweeg); greep.removeEventListener("pointerup", klaar); greep.removeEventListener("pointercancel", klaar);
      item.classList.remove("sh-sleept");
      opt.klaar($$(opt.item, lijst).map(x => x.dataset[opt.sleutel || "shid"]));
    };
    greep.addEventListener("pointermove", beweeg); greep.addEventListener("pointerup", klaar); greep.addEventListener("pointercancel", klaar);
  });
}

/* ---------- Snelveld: "vr btw-nummer aanvragen !hoog #juridisch" (FR-CL-10) ---------- */
function shCheckParse(tekst) {
  let t = " " + tekst + " ", prioriteit = "middel", categorie = "eigen";
  t = t.replace(/\s!(hoog|middel|laag)(?=\s)/i, (m, p) => { prioriteit = p.toLowerCase(); return " "; });
  t = t.replace(/\s#([\p{L}-]+)/u, (m, c) => {

}

/* ---------- Afvinken, herhalen, status ---------- */
async function shCheckZetStatus(c, status, extra) {
  const oud = structuredClone(c), h = shH(c.shId), ops = [];

  let nieuw = null;
  if (status === "klaar" && oud.status !== "klaar" && c.herhaal) {
    // BR-08: volgende exemplaar met de nieuwe deadline

/* ---------- Documenten openen (SCR-09): notitie, automatisch document, sjabloon ---------- */
function shMd(md) {
  const regels = esc(md || "").split("\n");
  let uit = "", lijst = null, idx = 0;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>").replace(/_(.+?)_/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const sluit = () => { if (lijst) { uit += lijst === "ol" ? "</ol>" : "</ul>"; lijst = null; } };
  regels.forEach(r => {
    let m;
    if ((m = r.match(/^(#{1,3})\s+(.*)/))) { sluit(); uit += `<h${m[1].length + 2}>${inline(m[2])}</h${m[1].length + 2}>`; }
    else if ((m = r.match(/^\s*[-*]\s+\[( |x|X)\]\s*(.*)/))) { if (lijst !== "vl") { sluit(); uit += `<ul class="sh-vinklijst">`; lijst = "vl"; } uit += `<li><button class="sh-mdvink${m[1] !== " " ? " af" : ""}" data-mdvink="${idx++}" aria-label="Vinkje">${m[1] !== " " ? "✓" : ""}</button><span>${inline(m[2])}</span></li>`; }
    else if ((m = r.match(/^\s*[-*]\s+(.*)/))) { if (lijst !== "ul") { sluit(); uit += "<ul>"; lijst = "ul"; } uit += `<li>${inline(m[1])}</li>`; }
    else if ((m = r.match(/^\s*\d+[.)]\s+(.*)/))) { if (lijst !== "ol") { sluit(); uit += "<ol>"; lijst = "ol"; } uit += `<li>${inline(m[1])}</li>`; }
    else if (!r.trim()) { sluit(); }
    else { sluit(); uit += `<p>${inline(r)}</p>`; }
  });
  sluit();
  return uit;
}
function vwShDoc() {
  const b = vind("sh_bestanden", V.param);
  if (!b || b.verwijderdOp) return leeg("🤷", "Dit bestand bestaat niet meer");
  const h = shH(b.shId);
  if (!h) return leeg("🤷", "Deze side hustle bestaat niet meer");
  let u = `<div class="sh-werk sh-doc" style="${shStijl(h)}">`;
  if (b.soort === "notitie") {
    const voorbeeld = V.shMdVoorbeeld === b.id;
    u += `<div class="sh-mdbalk" role="toolbar" aria-label="Opmaak">
        ${[["kop", "H"], ["vet", "<b>B</b>"], ["cursief", "<i>I</i>"], ["lijst", "•"], ["vinkje", "☐"], ["link", "🔗"]].map(([k, t]) => `<button data-shmd="${k}" aria-label="${k}" ${voorbeeld ? "disabled" : ""}>${t}</button>`).join("")}
        <button data-shmd="voorbeeld" aria-pressed="${voorbeeld}" style="margin-left:auto">${voorbeeld ? "Bewerken" : "Voorbeeld"}</button></div>
      ${voorbeeld ? `<div class="card card-pad sh-md">${shMd(b.data.md) || '<p class="klein">Nog leeg.</p>'}</div>`
        : `<textarea class="invoer sh-mdveld" id="sh-md" aria-label="Notitie">${esc(b.data.md || "")}</textarea>`}
      <div class="sh-bewaard klein" id="sh-bewaard" aria-live="polite">Bewaard</div>`;
  } else if (b.soort === "auto") {
    u += `<div class="banner blauw">${ico("doc")}<span>Automatisch gemaakt document — alleen lezen.</span></div>
      <div class="card card-pad sh-md">${shMd(b.data.md)}</div>
      <button class="knop breed rand" data-sh="doc-kopie" data-id="${b.id}">${ico("kopieer")} Kopie bewerken</button>`;
  } else if (b.soort === "sjabloon" && typeof vwShSjabloon === "function") u += vwShSjabloon(b, h);
  else u += `<div class="card">${leeg("🧩", "Sjablonen komen in fase 3")}</div>`;
  return u + `</div>`;
}

  configurable: true, enumerable: true
});

});
async function shDocBewaar(b) {
  b.bijgewerkt = shNu();

SH_NA.push(() => {
  const ta = $("#sh-md"), b = V.view === "shdoc" && vind("sh_bestanden", V.param);
  const balk = $(".sh-mdbalk");
  if (balk && b) balk.onclick = e => {
    const k = e.target.closest("[data-shmd]"); if (!k) return;
    if (k.dataset.shmd === "voorbeeld") { V.shMdVoorbeeld = V.shMdVoorbeeld === b.id ? null : b.id; teken(); return; }
    if (!ta) return;
    const s = ta.selectionStart, e2 = ta.selectionEnd, sel = ta.value.slice(s, e2), voor = ta.value.slice(0, s), na = ta.value.slice(e2);
    const regelStart = voor.lastIndexOf("\n") + 1;
    let nieuw, cursor;
    const prefix = p => { nieuw = ta.value.slice(0, regelStart) + p + ta.value.slice(regelStart); cursor = e2 + p.length; };
    if (k.dataset.shmd === "kop") prefix("## ");
    else if (k.dataset.shmd === "lijst") prefix("- ");
    else if (k.dataset.shmd === "vinkje") prefix("- [ ] ");
    else if (k.dataset.shmd === "vet") { nieuw = voor + "**" + (sel || "vet") + "**" + na; cursor = s + 2 + (sel || "vet").length; }
    else if (k.dataset.shmd === "cursief") { nieuw = voor + "_" + (sel || "cursief") + "_" + na; cursor = s + 1 + (sel || "cursief").length; }
    else if (k.dataset.shmd === "link") { nieuw = voor + "[" + (sel || "tekst") + "](https://)" + na; cursor = s + 3 + (sel || "tekst").length + 8; }
    ta.value = nieuw; ta.focus(); ta.setSelectionRange(cursor, cursor);
    ta.dispatchEvent(new Event("input"));
  };
  if (ta && b) ta.oninput = () => {
    b.data.md = ta.value;
    const s = $("#sh-bewaard"); if (s) { s.textContent = "Bewaren…"; s.classList.add("bezig"); }
    clearTimeout(ta._t); ta._t = setTimeout(() => shDocBewaar(b), 800);

  const md = $(".sh-md");

    b.data.md = b.data.md.split("\n").map(r => r.replace(/^(\s*[-*]\s+\[)( |x|X)(\])/, (m, a, x, c) => (++n === +v.dataset.mdvink) ? a + (x === " " ? "x" : " ") + c : m)).join("\n");
    await shDocBewaar(b); teken();
  };
});
