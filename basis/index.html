.sh-tabs button[aria-selected="true"]{background:var(--sh);color:#fff}
.sh-tabs svg{width:16px;height:16px}
.sh-sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px -14px 8px;padding:2px 14px}
.sh-sub::-webkit-scrollbar{display:none}
.sh-sub button{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:999px;background:var(--card2);font-weight:650;font-size:calc(13.5px * var(--t));color:var(--muted)}
.sh-sub button[aria-pressed="true"]{background:var(--sh-zacht);color:var(--sh);box-shadow:inset 0 0 0 1.5px var(--sh)}
.sh-werk .knop.primair{background:var(--sh);color:#fff}
.sh-werk .balk>i{background:var(--sh)}
.sh-sr{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Side Hustle — checklist */
.sh-subscheid{flex:0 0 1px;background:var(--line2);margin:6px 2px}
.sh-voortgang .sh-vg-rij{display:flex;justify-content:space-between;margin-bottom:7px;font-size:calc(14px * var(--t))}
.sh-snel{margin-top:10px}
.sh-snel input{flex:1 1 auto;min-width:0;border:0;background:none;outline:none;min-height:38px;padding:0}
.sh-clfilter{margin:4px 0 6px}
.sh-clgroep{margin-top:14px}
.sh-clkop{display:flex;align-items:center;gap:8px;padding:0 2px}
.sh-clkop b{font-size:calc(14px * var(--t))}
.sh-clkop .balk{flex:1;height:6px;margin-left:6px}
.sh-cllijst{margin:8px 0}
.sh-check{position:relative;background:var(--green-soft);overflow:hidden;border-bottom:1px solid var(--line)}
.sh-check:last-child{border-bottom:0}
.sh-check[data-veeg="menu"]{background:var(--amber-soft)}
.sh-check-in{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card);border-left:4px solid var(--prio);transition:transform .15s;touch-action:pan-y;position:relative;min-height:var(--tap)}
.sh-check-mid{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.sh-check-titel{font-size:calc(15px * var(--t));line-height:1.35;word-break:break-word}
.sh-check.af .sh-check-titel,.sh-check.nvt .sh-check-titel{text-decoration:line-through;color:var(--faint)}
.sh-klaarsectie summary{min-height:var(--tap);display:flex;align-items:center;color:var(--muted);font-weight:650;cursor:pointer;padding:0 4px}
.sh-disclaimer{margin-top:14px}
.sh-waarom{background:var(--sh-zacht,var(--amber-soft));border-radius:12px;padding:11px 12px;margin:8px 0;font-size:calc(14px * var(--t))}
.sh-waarom p{margin:4px 0 6px}
.sh-waarom a{font-weight:650;margin-right:8px}
.sh-subrij{display:flex;align-items:center;gap:8px;min-height:var(--tap)}
.sh-subrij span{flex:1;min-width:0}
.sh-doorgestreept{text-decoration:line-through;color:var(--faint)}
.sh-chip{font-weight:700;color:var(--sh)}
.sh-dlrij{border-left:4px solid var(--sh)}
/* Bestanden */
.sh-kruimel{font-size:calc(13.5px * var(--t));color:var(--muted);margin:6px 2px;display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
.sh-kruimel button{color:var(--sh);font-weight:650;min-height:34px}
.sh-bsbalk{display:flex;gap:8px;align-items:center}
.sh-bsbalk .invoer{flex:1;min-width:0}
.sh-bestand{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-bottom:1px solid var(--line);min-height:56px}
.sh-bestand:last-child{border-bottom:0}
.sh-bestand-hoofd{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left;min-height:52px}
.sh-bestand .nm{flex:1;min-width:0}
.sh-bestand .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-bestand .nm small{display:block;color:var(--muted);font-size:calc(12px * var(--t));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-bestand .icon-btn{min-width:var(--tap);min-height:var(--tap);font-size:20px;color:var(--muted)}
.sh-bico{width:36px;height:36px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.sh-map{background:color-mix(in srgb,var(--mk,var(--sh)) 18%,transparent)}
.sh-mini{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.sh-miniring{width:26px;height:26px}
.sh-miniring>span{width:18px;height:18px}
.sh-bslijst.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--line)}
.sh-bslijst.raster .sh-bestand{background:var(--card);border:0;flex-direction:column;align-items:stretch;padding:10px;min-height:120px}
.sh-bslijst.raster .sh-bestand-hoofd{flex-direction:column;align-items:flex-start}
.sh-bslijst.raster .sh-bico,.sh-bslijst.raster .sh-mini{width:54px;height:54px;font-size:26px}
.sh-bslijst.raster .icon-btn{align-self:flex-end;margin-top:-8px}
.sh-prulknop{border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 0}
.sh-link{color:var(--sh);font-weight:650;min-height:32px;text-decoration:underline}
.sh-selbalk{position:sticky;bottom:calc(8px);z-index:7;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card);box-shadow:var(--shadow-lg);border-radius:14px;padding:8px 10px;margin:10px 0}
.sh-selbalk span{font-weight:700;margin-right:auto}
/* Notities */
.sh-mdbalk{display:flex;gap:6px;margin:10px 0 8px;flex-wrap:wrap}
.sh-mdbalk button{min-width:var(--tap);min-height:40px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-weight:700;padding:0 10px}
.sh-mdbalk button[aria-pressed="true"]{background:var(--sh);color:#fff}
.sh-mdveld{min-height:55dvh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:calc(15px * var(--t));line-height:1.55}
.sh-bewaard{text-align:right;margin:6px 4px}
.sh-bewaard.bezig{color:var(--amber)}
.sh-md{font-size:calc(15px * var(--t));line-height:1.55;overflow-wrap:anywhere}
.sh-md h3,.sh-md h4,.sh-md h5{margin:14px 0 6px}
.sh-md p{margin:6px 0}
.sh-vinklijst{list-style:none;padding-left:0}
.sh-vinklijst li{display:flex;gap:8px;align-items:center;min-height:var(--tap)}
.sh-mdvink{width:26px;height:26px;border-radius:7px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.sh-mdvink.af{background:var(--green);border-color:var(--green)}

@media (min-width:640px){
  #app{max-width:720px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}
  nav#tabs{max-width:720px;margin:0 auto}
  #timerbalk{max-width:704px;margin:0 auto}
  .blad{max-width:720px;margin:0 auto}
  .stats{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<div id="app">
  <header id="top">
    <div class="top-row">
      <button class="icon-btn verborgen" id="terug" aria-label="Terug"><svg><use href="#i-pijll"/></svg></button>
      <h1 id="titel">Vandaag</h1>
      <button class="werkpil" id="werkpil" data-f="alles" aria-label="Werkfilter"><svg><use href="#i-koffer"/></svg><span>Werk</span></button>
      <button class="icon-btn" id="inboxknop" data-act="ga" data-view="meldingen" aria-label="Inbox"><svg><use href="#i-inbox"/></svg><span class="tab-dot verborgen" id="inboxdot"></span></button>
      <button class="icon-btn" id="zoekknop" aria-label="Zoeken"><svg><use href="#i-zoek"/></svg></button>
      <button class="icon-btn" id="instelknop" aria-label="Instellingen"><svg><use href="#i-instel"/></svg></button>
    </div>
    <div class="sub" id="ondertitel"></div>
    <div id="vastleghouder"></div>
  </header>

  <main id="scherm"></main>

  <div id="timerbalk">
    <svg style="width:17px;height:17px;flex:0 0 auto"><use href="#i-tijd"/></svg>
    <span class="nm" id="timer-naam"></span>
    <span class="tijd" id="timer-tijd">00:00</span>
    <button id="timer-pauze" aria-label="Pauzeren"><svg><use href="#i-pauze"/></svg></button>
    <button id="timer-stop" aria-label="Stoppen"><svg><use href="#i-stop"/></svg></button>
  </div>

  <button id="naarvandaag"><svg><use href="#i-vandaag"/></svg><span>Naar vandaag</span></button>

  <div id="bulkbalk">

<script>
"use strict";
/* ==========================================================================
   1. Hulpjes
   ========================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ico = (naam, stijl) => `<svg${stijl ? ' style="' + stijl + '"' : ""}><use href="#i-${naam}"/></svg>`;
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

let toastTimer = null;
function toast(tekst, actieLabel, actieFn, ms) {
  const el = $("#toast");
  el.innerHTML = `<span>${esc(tekst)}</span>`;
  if (actieLabel) {
    const b = document.createElement("button");
    b.textContent = actieLabel;
    b.onclick = () => { el.classList.remove("zicht"); actieFn && actieFn(); };
    el.appendChild(b);
  }
  el.classList.add("zicht");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("zicht"), ms || (actieLabel ? 5200 : 2400));
}
function tril(ms) { try { if (inst("trillen", true) && navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }

/* ==========================================================================
   2. Datum & tijd
   ========================================================================== */
const DAGNAMEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
const DAGKORT  = ["zo", "ma", "di", "wo", "do", "vr", "za"];
const MAANDNAMEN = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const MAANDKORT  = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

const dISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const vandaagISO = () => dISO(new Date());
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
const plusDagen = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return dISO(d); };
const plusMaanden = (iso, n) => {
  const d = parseISO(iso); const dag = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(dag, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  return dISO(d);
};
const nuTijd = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dagVerschil = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const weekdagVan = iso => parseISO(iso).getDay();
/** maandag = start van de week */
function weekStart(iso) { const d = parseISO(iso); const w = (d.getDay() + 6) % 7; return plusDagen(iso, -w); }
function weekNummer(iso) {
  const d = parseISO(iso); const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const eerste = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - eerste) / 86400000 - 3 + ((eerste.getDay() + 6) % 7)) / 7);
}
function datumLabel(iso, lang) {
  if (!iso) return "";
  const v = vandaagISO(), d = dagVerschil(iso, v), dt = parseISO(iso);
  if (d === 0) return "Vandaag";
  if (d === 1) return "Morgen";
  if (d === 2) return "Overmorgen";
  if (d === -1) return "Gisteren";
  if (!lang && d > 2 && d < 7) return DAGNAMEN[dt.getDay()][0].toUpperCase() + DAGNAMEN[dt.getDay()].slice(1);
  const jaar = dt.getFullYear() !== new Date().getFullYear() ? " " + dt.getFullYear() : "";
  return `${DAGKORT[dt.getDay()]} ${dt.getDate()} ${MAANDKORT[dt.getMonth()]}${jaar}`;
}
function langDatumLabel(iso) {
  const dt = parseISO(iso);
  return `${DAGNAMEN[dt.getDay()]} ${dt.getDate()} ${MAANDNAMEN[dt.getMonth()]} ${dt.getFullYear()}`;
}
const isVerleden = (iso, tijd) => {
  if (!iso) return false;
  const v = vandaagISO();
  if (iso < v) return true;
  if (iso > v) return false;
  return tijd ? tijd < nuTijd() : false;
};
function duurTekst(min) {
  if (!min) return "";
  if (min < 60) return min + " min";
  const u = Math.floor(min / 60), m = min % 60;
  return m ? `${u} u ${m} m` : `${u} uur`;
}
function secTekst(sec) {
  const u = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return u ? `${u}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

/* ==========================================================================
   3. Opslag — IndexedDB
   ========================================================================== */
const DB_NAAM = "futureme", DB_VERSIE = 7;
const WINKELS = {
  taken: "id", projecten: "id", labels: "id", afspraken: "id", checklists: "id",
  gewoontes: "id", gewoontelog: "id", dagboek: "id", tijdlog: "id",
  personen: "id", bijlagen: "id", filters: "id", gebeurtenissen: "id",
  werkdocs: "id", uitgaven: "id", incassos: "id", potjes: "id", instellingen: "sleutel",
  vs_producten: "id", vs_logs: "id", vs_gewicht: "id", vs_sport: "id", vs_sportlog: "id",
  meldingen: "id", mm_mindmaps: "id", mm_clusters: "id",
  /* 47+. Side Hustle */
  sh_hustles: "id", sh_concepten: "id", sh_checks: "id", sh_kolommen: "id", sh_kaarten: "id", sh_sprints: "id", sh_mappen: "id", sh_bestanden: "id", sh_geld: "id", sh_klanten: "id", sh_experimenten: "id", sh_kpis: "id", sh_ideeen: "id", sh_leren: "id"
};
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    let v;
    try { v = indexedDB.open(DB_NAAM, DB_VERSIE); }
    catch (e) { return rej(e); }
    v.onupgradeneeded = e => {
      const d = e.target.result;
      for (const [naam, sleutel] of Object.entries(WINKELS))
        if (!d.objectStoreNames.contains(naam)) d.createObjectStore(naam, { keyPath: sleutel });
    };
    v.onsuccess = () => res(v.result);
    v.onerror = () => rej(v.error);
    v.onblocked = () => rej(new Error("Database geblokkeerd — sluit andere tabbladen van deze app."));
  });
}
function idbAlles(winkel) {
  return new Promise((res, rej) => {
    const r = db.transaction(winkel, "readonly").objectStore(winkel).getAll();
    r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
  });
}
function idbZet(winkel, obj) {
  return new Promise((res, rej) => {
    const t = db.transaction(winkel, "readwrite");
    t.objectStore(winkel).put(obj);
    t.oncomplete = () => res(obj); t.onerror = () => rej(t.error);
  });
}
function idbWis(winkel, sleutel) {
  return new Promise((res, rej) => {
    const t = db.transaction(winkel, "readwrite");
    t.objectStore(winkel).delete(sleutel);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
function idbLeeg(winkel) {
  return new Promise((res, rej) => {
    const t = db.transaction(winkel, "readwrite");
    t.objectStore(winkel).clear();
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

/* Alles in het geheugen; elke wijziging wordt meteen weggeschreven. */
const S = {
  taken: [], projecten: [], labels: [], afspraken: [], checklists: [],
  gewoontes: [], gewoontelog: [], dagboek: [], tijdlog: [],
  personen: [], bijlagen: [], filters: [], gebeurtenissen: [], werkdocs: [],
  uitgaven: [], incassos: [], potjes: [], instellingen: {},
  vs_producten: [], vs_logs: [], vs_gewicht: [], vs_sport: [], vs_sportlog: [],
  meldingen: [], mm_mindmaps: [], mm_clusters: [],
  sh_hustles: [], sh_concepten: [], sh_checks: [], sh_kolommen: [], sh_kaarten: [], sh_sprints: [], sh_mappen: [], sh_bestanden: [], sh_geld: [], sh_klanten: [], sh_experimenten: [], sh_kpis: [], sh_ideeen: [], sh_leren: []
};
const vind = (lijst, id) => S[lijst].find(x => x.id === id);

async function bewaar(winkel, obj) {
  const lijst = S[winkel];
  const i = lijst.findIndex(x => x.id === obj.id);
  if (i >= 0) lijst[i] = obj; else lijst.push(obj);
  try { await idbZet(winkel, obj); } catch (e) { opslagFout(e); }
  return obj;
}
async function verwijder(winkel, id) {
  const i = S[winkel].findIndex(x => x.id === id);
  if (i >= 0) S[winkel].splice(i, 1);
  try { await idbWis(winkel, id); } catch (e) { opslagFout(e); }
}
async function zetInst(sleutel, waarde) {
  S.instellingen[sleutel] = waarde;
  try { await idbZet("instellingen", { sleutel, waarde }); } catch (e) { opslagFout(e); }
}
const inst = (sleutel, standaard) =>
  S.instellingen[sleutel] === undefined ? standaard : S.instellingen[sleutel];

function opslagFout(e) {
  console.error("Opslagfout:", e);
  toast("Opslaan mislukt — maak een back-up", "Back-up", () => ga("backup"), 8000);
}

async function logGebeurtenis(soort, tekst, refId, extra) {
  const g = Object.assign({
    id: uid(), soort, tekst, refId: refId || null,
    ts: new Date().toISOString(), datum: vandaagISO()
  }, extra || {});
  await bewaar("gebeurtenissen", g);
  return g;
}

/* ==========================================================================

   ========================================================================== */
const PWA = { manifest: false, sw: "niet geprobeerd", persist: "onbekend", standalone: false };

function maakIcoonPNG(maat) {
  try {
    const c = document.createElement("canvas");
    c.width = c.height = maat;
    const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, maat, maat);
    g.addColorStop(0, "#4b86ff"); g.addColorStop(1, "#1f47bd");
    x.fillStyle = g; x.fillRect(0, 0, maat, maat);
    x.strokeStyle = "rgba(255,255,255,.95)";
    x.lineCap = "round"; x.lineJoin = "round"; x.lineWidth = maat * 0.085;
    x.beginPath();
    x.moveTo(maat * 0.255, maat * 0.545);
    x.lineTo(maat * 0.425, maat * 0.715);
    x.lineTo(maat * 0.755, maat * 0.305);
    x.stroke();
    x.globalAlpha = 0.55; x.lineWidth = maat * 0.055;
    x.beginPath(); x.moveTo(maat * 0.26, maat * 0.80); x.lineTo(maat * 0.74, maat * 0.80); x.stroke();
    return c.toDataURL("image/png");

}

function startPWA() {

  if (i180) {
    const l = document.createElement("link");
    l.rel = "apple-touch-icon"; l.setAttribute("sizes", "180x180"); l.href = i180;
    document.head.appendChild(l);
    const f = document.createElement("link");
    f.rel = "icon"; f.type = "image/png"; f.href = i192 || i180;
    document.head.appendChild(f);
  }

    const mf = {
      name: "FutureMe", short_name: "FutureMe",
      description: "Persoonlijke taken, herinneringen en logboek — volledig op dit toestel.",
      start_url: location.href.split("#")[0],
      scope: location.href.replace(/[^/]*$/, ""),
      display: "standalone", orientation: "portrait",
      background_color: "#f4f4f7", theme_color: "#f4f4f7", lang: "nl",
      icons: [
        i192 && { src: i192, sizes: "192x192", type: "image/png", purpose: "any" },
        i512 && { src: i512, sizes: "512x512", type: "image/png", purpose: "any" },
        i512 && { src: i512, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ].filter(Boolean)
    };

      const C='futureme-v1';
      self.addEventListener('install',e=>{self.skipWaiting()});
      self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim())});
      self.addEventListener('fetch',e=>{
        if(e.request.method!=='GET')return;
        e.respondWith(
          fetch(e.request).then(r=>{
            const k=r.clone();caches.open(C).then(c=>c.put(e.request,k)).catch(()=>{});
            return r;
          }).catch(()=>caches.match(e.request).then(m=>m||caches.match(self.registration.scope)))
        );
      });`;
    // Liefst een echt sw.js-bestand naast index.html: Safari weigert een blob-URL.
    const blobSW = () => {
      try {
        const swUrl = URL.createObjectURL(new Blob([bron], { type: "text/javascript" }));
        return navigator.serviceWorker.register(swUrl)
          .then(() => { PWA.sw = "actief (inline)"; })
          .catch(() => { PWA.sw = "niet mogelijk (zet sw.js naast index.html)"; });
      } catch (e) { PWA.sw = "niet mogelijk (zet sw.js naast index.html)"; return Promise.resolve(); }
    };
    try {

        .then(() => { PWA.sw = "actief"; })
        .catch(() => blobSW());
    } catch (e) { blobSW(); }

  }
}

async function vraagPersistent() {
  try {
    if (navigator.storage && navigator.storage.persisted) {
      let ok = await navigator.storage.persisted();
      if (!ok && navigator.storage.persist) ok = await navigator.storage.persist();

/* ==========================================================================

function downloadBestand(naam, inhoud, mime) {
  const blob = inhoud instanceof Blob ? inhoud : new Blob([inhoud], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = naam; a.rel = "noopener";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
async function deelOfDownload(naam, tekst, mime) {
  const bestand = new File([tekst], naam, { type: mime });
  try {
    if (navigator.canShare && navigator.canShare({ files: [bestand] })) {

<script>
"use strict";
/* ==========================================================================
   6. Nederlandse taal-parser voor snel vastleggen
   ========================================================================== */
const WEEKDAG_NR = {
  zondag: 0, zon: 0, zo: 0, maandag: 1, maan: 1, ma: 1, dinsdag: 2, din: 2, di: 2,
  woensdag: 3, woe: 3, wo: 3, donderdag: 4, don: 4, do: 4,
  vrijdag: 5, vrij: 5, vr: 5, zaterdag: 6, zat: 6, za: 6
};
const MAAND_NR = {
  januari: 1, jan: 1, februari: 2, feb: 2, maart: 3, mrt: 3, april: 4, apr: 4, mei: 5,
  juni: 6, jun: 6, juli: 7, jul: 7, augustus: 8, aug: 8, september: 9, sept: 9, sep: 9,
  oktober: 10, okt: 10, november: 11, nov: 11, december: 12, dec: 12
};
const TELWOORD = {
  een: 1, één: 1, twee: 2, drie: 3, vier: 4, vijf: 5, zes: 6, zeven: 7, acht: 8,
  negen: 9, tien: 10, elf: 11, twaalf: 12
};
const WD = "zondag|maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zon|maan|din|woe|don|vrij|zat|zo|ma|di|wo|do|vr|za";
const MND = Object.keys(MAAND_NR).sort((a, b) => b.length - a.length).join("|");

/** Volgende voorkomen van een weekdag. meteen=true → vandaag telt mee. */
function volgendeWeekdag(nr, meteen) {
  const v = vandaagISO(), huidig = weekdagVan(v);
  let delta = (nr - huidig + 7) % 7;
  if (delta === 0 && !meteen) delta = 7;
  return plusDagen(v, delta);
}

function parseNL(tekst) {
  const R = {
    titel: "", datum: null, tijd: null, herhaal: null, prioriteit: 4,
    project: null, labels: [], personen: [], duur: null, energie: null, ruw: tekst
  };
  if (!tekst || !tekst.trim()) return R;
  let w = " " + tekst + " ";
  const wis = (i, l) => { w = w.slice(0, i) + " ".repeat(l) + w.slice(i + l); };
  const pak = (re, cb) => {
    const m = w.match(re);
    if (!m) return false;
    if (cb(m) === false) return false;
    wis(m.index, m[0].length);
    return true;
  };
  const pakAlle = (re, cb) => {
    let m, veilig = 0;
    while ((m = w.match(re)) && veilig++ < 20) { if (cb(m) === false) break; wis(m.index, m[0].length); }
  };
  const lc = s => String(s).toLowerCase();

  /* --- prioriteit --- */
  pak(/\s(p[1-4])(?=\s)/i, m => { R.prioriteit = +m[1][1]; });
  if (R.prioriteit === 4) pak(/\s(!{1,3})(?=\s)/, m => { R.prioriteit = 4 - m[1].length; });

  /* --- project, labels, personen --- */
  pak(/\s#([\p{L}\p{N}_-]+)/u, m => { R.project = m[1]; });
  pakAlle(/\s@([\p{L}\p{N}_-]+)/u, m => { R.labels.push(m[1]); });
  pakAlle(/\s\+([\p{L}\p{N}_-]+)/u, m => { R.personen.push(m[1]); });
  pak(/\s\^(laag|midden|hoog)(?=\s)/i, m => { R.energie = lc(m[1]); });

  /* --- herhaling --- */
  const zetHerhaal = h => { R.herhaal = h; };
  const dagenUit = txt => {
    const uit = [];
    const re = new RegExp("\\b(" + WD + ")\\b", "gi");
    let m; while ((m = re.exec(txt))) { const n = WEEKDAG_NR[lc(m[1])]; if (!uit.includes(n)) uit.push(n); }
    return uit.sort();
  };
  pak(/\s(?:elke|iedere|elk)\s+werkdag(?:en)?(?=\s)/i, () => zetHerhaal({ soort: "week", elke: 1, dagen: [1, 2, 3, 4, 5] })) ||
  pak(/\s(?:elk|ieder)\s+weekend(?=\s)/i, () => zetHerhaal({ soort: "week", elke: 1, dagen: [0, 6] })) ||

  pak(/\s(?:elke|iedere|om\s+de)\s+(\d{1,3}|twee|drie|vier|vijf|zes)\s*(dag|dagen|week|weken|maand|maanden|jaar|jaren)(?=\s)/i,
      m => {
        const n = TELWOORD[lc(m[1])] || +m[1] || 1, e = lc(m[2]);

    zetHerhaal({ soort: s.startsWith("dag") || s === "per dag" ? "dag" : s.startsWith("week") || s === "per week" ? "week" : s.startsWith("maand") ? "maand" : "jaar", elke: 1 });

  /* --- deel van de dag (bepaalt standaardtijd) --- */
  let standaardTijd = null;
  const deelDag = t => { if (!standaardTijd) standaardTijd = t; };

  /* --- datum --- */
  const zetDatum = d => { R.datum = d; };
  pak(/\s(vanochtend|vanmorgen)(?=\s)/i, () => { zetDatum(vandaagISO()); deelDag("09:00"); }) ||
  pak(/\s(vanmiddag)(?=\s)/i, () => { zetDatum(vandaagISO()); deelDag("14:00"); }) ||
  pak(/\s(vanavond|vannacht)(?=\s)/i, () => { zetDatum(vandaagISO()); deelDag("20:00"); }) ||
  pak(/\s(vandaag|vd)(?=\s)/i, () => zetDatum(vandaagISO())) ||
  pak(/\smorgenochtend(?=\s)/i, () => { zetDatum(plusDagen(vandaagISO(), 1)); deelDag("09:00"); }) ||
  pak(/\smorgenmiddag(?=\s)/i, () => { zetDatum(plusDagen(vandaagISO(), 1)); deelDag("14:00"); }) ||
  pak(/\smorgenavond(?=\s)/i, () => { zetDatum(plusDagen(vandaagISO(), 1)); deelDag("20:00"); }) ||
  pak(/\sovermorgen(?=\s)/i, () => zetDatum(plusDagen(vandaagISO(), 2))) ||

  pak(new RegExp("\\s(volgende|komende|aanstaande|a\\.s\\.|as)\\s+(" + WD + ")(?=\\s)", "i"), m => {

  pak(/\s(volgende|komende)\s+week(?=\s)/i, () => zetDatum(plusDagen(weekStart(vandaagISO()), 7))) ||

  pak(/\seind(?:e)?\s+van\s+de\s+week(?=\s)/i, () => zetDatum(plusDagen(weekStart(vandaagISO()), 4))) ||

  }) ||
  pak(/\sover\s+(?:een\s+)?half\s+uur(?=\s)/i, () => {
    const d = new Date(); d.setMinutes(d.getMinutes() + 30);

  }) ||
  pak(/\sover\s+(\d{1,2}|een|één|twee|drie|vier)\s*(?:uur|uren|u)(?=\s)/i, m => {
    const n = TELWOORD[lc(m[1])] || +m[1] || 1;

  pak(/\sbegin\s+(?:van\s+)?(?:de\s+)?volgende\s+week(?=\s)/i, () => zetDatum(plusDagen(weekStart(vandaagISO()), 7))) ||
  pak(/\seind(?:e)?\s+(?:van\s+)?(?:de\s+)?volgende\s+week(?=\s)/i, () => zetDatum(plusDagen(weekStart(vandaagISO()), 11))) ||

  pak(/\sover\s+(\d{1,3}|een|één|twee|drie|vier|vijf|zes|zeven|acht|negen|tien)\s*(dag|dagen|week|weken|maand|maanden|jaar)(?=\s)/i, m => {
    const n = TELWOORD[lc(m[1])] || +m[1] || 1, e = lc(m[2]);
    if (e.startsWith("dag")) zetDatum(plusDagen(vandaagISO(), n));
    else if (e.startsWith("we")) zetDatum(plusDagen(vandaagISO(), n * 7));

    if (dag < 1 || dag > 31 || maand < 1 || maand > 12) return false;
    let jaar = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : new Date().getFullYear();
    let iso = `${jaar}-${pad(maand)}-${pad(dag)}`;
    if (!m[3] && iso < vandaagISO()) iso = `${jaar + 1}-${pad(maand)}-${pad(dag)}`;

  }) ||
  pak(new RegExp("\\s(\\d{1,2})\\s+(" + MND + ")\\.?(?:\\s+(\\d{4}))?(?=\\s)", "i"), m => {
    const dag = +m[1], maand = MAAND_NR[lc(m[2])];
    let jaar = m[3] ? +m[3] : new Date().getFullYear();
    let iso = `${jaar}-${pad(maand)}-${pad(dag)}`;

  pak(new RegExp("\\s(" + WD + ")(?=\\s)", "i"), m => zetDatum(volgendeWeekdag(WEEKDAG_NR[lc(m[1])], true)));

  /* --- tijd --- */

  pak(/\s(?:om\s+)?(\d{1,2})\s*u\s*(\d{2})(?=\s)/i, m => zetTijd(m[1], m[2])) ||

    let u = TELWOORD[lc(m[1])] || +m[1]; u = (u - 1 + 24) % 24; if (u === 0) u = 12;

  if (R.tijd && vaagUur && !/ochtend|['’]s\s*morgens|vanochtend|vanmorgen|nacht/i.test(tekst)) {

  /* --- duur --- */
  pak(/\s~?\s*(\d{1,3})\s*(minuten|minuut|min|m)(?=\s)/i, m => { R.duur = +m[1]; }) ||

  /* --- titel opschonen --- */
  R.titel = w.replace(/\s+/g, " ")
    .replace(/^\s*(?:om|op|voor|de|het|een)\s+/i, "")

}

function eersteHerhaalDatum(h) {
  const v = vandaagISO();
  if (h.soort === "week" && h.dagen && h.dagen.length) {
    for (let i = 0; i < 8; i++) { const d = plusDagen(v, i); if (h.dagen.includes(weekdagVan(d))) return d; }
  }
  if (h.soort === "maand" && h.dagVanMaand) {
    const nu = parseISO(v);
    let iso = `${nu.getFullYear()}-${pad(nu.getMonth() + 1)}-${pad(h.dagVanMaand)}`;
    if (iso < v) iso = plusMaanden(iso, 1);
    return iso;
  }
  return v;
}

function volgendeDatum(iso, h) {
  if (!h) return null;
  const basis = (iso && iso >= vandaagISO()) ? iso : vandaagISO();
  const elke = h.elke || 1;
  if (h.soort === "dag") return plusDagen(basis, elke);
  if (h.soort === "week") {
    if (h.dagen && h.dagen.length) {
      for (let i = 1; i <= 21; i++) { const d = plusDagen(basis, i); if (h.dagen.includes(weekdagVan(d))) return d; }
    }
    return plusDagen(basis, 7 * elke);
  }
  if (h.soort === "maand") {
    if (h.dagVanMaand) {
      let d = plusMaanden(basis, elke);
      const dt = parseISO(d);
      const laatste = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
      return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(Math.min(h.dagVanMaand, laatste))}`;
    }
    return plusMaanden(basis, elke);
  }
  if (h.soort === "jaar") return plusMaanden(basis, 12 * elke);
  return null;
}

function herhaalTekst(h) {
  const basis = herhaalTekstKaal(h);
  return basis && h.tot ? `${basis} t/m ${korteDatum(h.tot)}` : basis;
}
/** Korte datum: "22 sep" (of "22 sep 2027" buiten dit jaar). */
function korteDatum(iso) {
  const d = parseISO(iso);
  return `${d.getDate()} ${MAANDKORT[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""}`;
}
function herhaalTekstKaal(h) {
  if (!h) return "";
  const e = h.elke || 1;
  if (h.soort === "week" && h.dagen && h.dagen.length) {
    if (h.dagen.join() === "1,2,3,4,5") return "elke werkdag";
    if (h.dagen.join() === "0,6") return "elk weekend";
    return "elke " + h.dagen.map(d => DAGKORT[d]).join(", ");
  }
  if (h.soort === "maand" && h.dagVanMaand) return `elke ${h.dagVanMaand}e van de maand`;
  const woord = { dag: e === 1 ? "dag" : "dagen", week: e === 1 ? "week" : "weken", maand: e === 1 ? "maand" : "maanden", jaar: e === 1 ? "jaar" : "jaar" }[h.soort] || h.soort;
  return e === 1 ? `elke ${woord}` : `elke ${e} ${woord}`;
}

/** Chips die tonen wat de parser herkende. */
function parserChips(p) {
  const c = [];
  if (p.datum) c.push(`<span class="chip blauw">${ico("komend")}${esc(datumLabel(p.datum))}</span>`);
  if (p.tijd) c.push(`<span class="chip blauw">${ico("klok")}${esc(p.tijd)}</span>`);
  if (p.herhaal) c.push(`<span class="chip paars">${ico("herhaal")}${esc(herhaalTekst(p.herhaal))}</span>`);
  if (p.prioriteit < 4) c.push(`<span class="chip ${p.prioriteit === 1 ? "rood" : p.prioriteit === 2 ? "oranje" : "blauw"}">${ico("vlag")}P${p.prioriteit}</span>`);
  if (p.project) c.push(`<span class="chip groen">${ico("map")}${esc(p.project)}</span>`);
  p.labels.forEach(l => c.push(`<span class="chip">${ico("label")}${esc(l)}</span>`));
  p.personen.forEach(l => c.push(`<span class="chip">${ico("persoon")}${esc(l)}</span>`));
  if (p.duur) c.push(`<span class="chip oranje">${ico("tijd")}${esc(duurTekst(p.duur))}</span>`);
  if (p.energie) c.push(`<span class="chip">${ico("bliksem")}${esc(p.energie)}</span>`);
  return c.join("");
}

/* ==========================================================================
   7. Agenda-export (.ics)
   ========================================================================== */
const icsEsc = s => String(s == null ? "" : s)
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function icsVouw(regel) {
  if (regel.length <= 73) return regel;
  let uit = regel.slice(0, 73), rest = regel.slice(73);
  while (rest.length > 72) { uit += "\r\n " + rest.slice(0, 72); rest = rest.slice(72); }
  return uit + (rest ? "\r\n " + rest : "");
}
const icsStempel = () => new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
const icsDatum = iso => iso.replace(/-/g, "");
const icsDatumTijd = (iso, tijd) => iso.replace(/-/g, "") + "T" + (tijd || "09:00").replace(":", "") + "00";
const ICS_DAG = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

function icsRrule(h, metTijd) {
  const r = icsRruleKaal(h);
  if (!r || !h.tot) return r;
  return r + ";UNTIL=" + icsDatum(h.tot) + (metTijd ? "T235959" : "");
}
function icsRruleKaal(h) {
  if (!h) return null;
  const e = h.elke || 1;
  if (h.soort === "dag") return `FREQ=DAILY${e > 1 ? ";INTERVAL=" + e : ""}`;
  if (h.soort === "week") {
    let r = `FREQ=WEEKLY${e > 1 ? ";INTERVAL=" + e : ""}`;
    if (h.dagen && h.dagen.length) r += ";BYDAY=" + h.dagen.map(d => ICS_DAG[d]).join(",");
    return r;
  }
  if (h.soort === "maand") return `FREQ=MONTHLY${e > 1 ? ";INTERVAL=" + e : ""}${h.dagVanMaand ? ";BYMONTHDAY=" + h.dagVanMaand : ""}`;
  if (h.soort === "jaar") return `FREQ=YEARLY${e > 1 ? ";INTERVAL=" + e : ""}`;
  return null;
}

function icsEvenement(o) {
  // o: {uid, titel, datum, tijd, eindTijd, duurMin, notitie, plek, herhaal, alarm}
  const L = ["BEGIN:VEVENT", "UID:" + (o.uid || uid()) + "@futureme", "DTSTAMP:" + icsStempel()];
  if (o.tijd) {
    L.push("DTSTART:" + icsDatumTijd(o.datum, o.tijd));
    let eind = o.eindTijd;
    if (!eind) {
      const [u, m] = o.tijd.split(":").map(Number);
      const tot = u * 60 + m + (o.duurMin || 30);
      eind = pad(Math.floor(tot / 60) % 24) + ":" + pad(tot % 60);
    }
    L.push("DTEND:" + icsDatumTijd(o.datum, eind));
  } else {
    L.push("DTSTART;VALUE=DATE:" + icsDatum(o.datum));
    L.push("DTEND;VALUE=DATE:" + icsDatum(plusDagen(o.eindDatum || o.datum, 1)));
  }
  L.push("SUMMARY:" + icsEsc(o.titel));
  if (o.notitie) L.push("DESCRIPTION:" + icsEsc(o.notitie));
  if (o.plek) L.push("LOCATION:" + icsEsc(o.plek));
  const rr = icsRrule(o.herhaal, !!o.tijd);
  if (rr) L.push("RRULE:" + rr);
  if (o.alarm !== false) {
    L.push("BEGIN:VALARM", "ACTION:DISPLAY",
      "DESCRIPTION:" + icsEsc(o.titel),
      "TRIGGER:" + (o.tijd ? "-PT" + (o.alarmMin == null ? 10 : o.alarmMin) + "M" : "PT9H"),
      "END:VALARM");
  }
  L.push("END:VEVENT");
  return L;
}

function icsBestand(evenementen) {
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//FutureMe//NL", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  evenementen.forEach(e => L.push(...e));
  L.push("END:VCALENDAR");
  return L.map(icsVouw).join("\r\n") + "\r\n";
}

function taakNaarIcs(t) {
  if (!t.datum) return null;
  return icsEvenement({
    uid: t.id, titel: t.titel, datum: t.datum, tijd: t.tijd,
    duurMin: t.duur || 30, notitie: t.notitie, herhaal: t.herhaal,
    alarmMin: t.tijd ? 10 : null
  });
}
function afspraakNaarIcs(a) {
  const stuk = [];
  if (a.voorbereiding) stuk.push(a.voorbereiding);
  if (a.personen && a.personen.length) stuk.push("Met: " + a.personen.join(", "));
  if (a.deadline) stuk.push("Uiterlijk klaar op: " + a.deadline);
  // Zonder datum gebruiken we de deadline als dag in de agenda.
  const datum = a.datum || a.deadline;
  if (!datum) return null;
  const opDeadline = !a.datum;
  return icsEvenement({
    uid: a.id,
    titel: (opDeadline ? "Deadline: " : "") + a.titel,
    datum, tijd: opDeadline ? "" : a.tijd,
    eindTijd: a.eindTijd, duurMin: 60, plek: a.plek,
    eindDatum: !opDeadline && a.totDatum && a.totDatum !== a.datum ? a.totDatum : null,
    notitie: stuk.join("\n\n"), alarmMin: 15, herhaal: opDeadline ? null : a.herhaal
  });
}

/**
 * Zoektaal: vandaag | morgen | week | achterstallig | geen-datum | af | open |
 *           p1..p4 | #project | @label | +persoon | vrije tekst
 */
function filterTaken(query, bron) {
  const taken = bron || S.taken;
  const q = (query || "").trim().toLowerCase();
  if (!q) return taken.filter(t => !t.af);
  const delen = q.split(/\s+/);
  const v = vandaagISO();
  let toonAf = false, alleenAf = false;
  const tests = [];
  for (const d of delen) {
    if (d === "af" || d === "afgerond" || d === "klaar") { alleenAf = true; toonAf = true; }
    else if (d === "open") tests.push(t => !t.af);
    else if (d === "alles") toonAf = true;
    else if (d === "vandaag") tests.push(t => t.datum && t.datum <= v);
    else if (d === "morgen") tests.push(t => t.datum === plusDagen(v, 1));
    else if (d === "week" || d === "deze-week") tests.push(t => t.datum && t.datum >= v && t.datum <= plusDagen(v, 7));
    else if (d === "achterstallig" || d === "te-laat") tests.push(t => t.datum && t.datum < v);
    else if (d === "geen-datum" || d === "zonder-datum") tests.push(t => !t.datum);
    else if (/^p[1-4]$/.test(d)) tests.push(t => t.prioriteit === +d[1]);
    else if (d[0] === "#") { const nm = d.slice(1); tests.push(t => { const p = vind("projecten", t.projectId); return p && p.naam.toLowerCase().includes(nm); }); }
    else if (d[0] === "@") { const nm = d.slice(1); tests.push(t => (t.labels || []).some(l => l.toLowerCase().includes(nm))); }
    else if (d[0] === "+") { const nm = d.slice(1); tests.push(t => (t.personen || []).some(l => l.toLowerCase().includes(nm))); }
    else tests.push(t => (t.titel + " " + (t.notitie || "") + " " + (t.labels || []).join(" ")).toLowerCase().includes(d));
  }
  return taken.filter(t => {
    if (alleenAf && !t.af) return false;
    if (!toonAf && t.af) return false;
    return tests.every(f => f(t));
  });
}

function taakZichtbaar(t) {
  if (t.af) return false;
  if (t.uitgesteldTot && t.uitgesteldTot > new Date().toISOString()) return false;
  return true;
}
function geblokkeerd(t) {
  return (t.hangtAf || []).some(id => { const a = vind("taken", id); return a && !a.af; });
}
function sorteerTaken(a, b) {
  if (!!a.af !== !!b.af) return a.af ? 1 : -1;
  const ad = a.datum || "9999-99-99", bd = b.datum || "9999-99-99";
  if (ad !== bd) return ad < bd ? -1 : 1;
  const at = a.tijd || "99:99", bt = b.tijd || "99:99";
  if (at !== bt) return at < bt ? -1 : 1;
  if (a.prioriteit !== b.prioriteit) return a.prioriteit - b.prioriteit;
  return (a.volgorde || 0) - (b.volgorde || 0);
}

const KOPPEN = {

function teken() {

    vandaag: vwVandaag, komend: vwKomend, inbox: vwInbox, logboek: vwLogboek, meer: vwMeer,
    projecten: vwProjecten, project: vwProject, kalender: vwKalender, checklists: vwChecklists,

    dagboek: vwDagboek, zoeken: vwZoeken, filters: vwFilters, personen: vwPersonen,
    stats: vwStats, backup: vwBackup, help: vwHelp, tijd: vwTijd,

    gezondheid: (typeof vwGezondheid === "function" ? vwGezondheid : vwStart),
    meldingen: (typeof vwMeldingen === "function" ? vwMeldingen : vwStart),

    sh: (typeof vwSh === "function" ? vwSh : vwStart),
    shdoc: (typeof vwShDoc === "function" ? vwShDoc : vwStart),

  }[V.view] || vwVandaag;
  $("#scherm").innerHTML = fn();
  naTekenen();
}

const VASTLEG_VIEWS = ["vandaag", "komend", "inbox", "project", "zoeken"];
function tekenVastleg() {
  const h = $("#vastleghouder");
  if (!VASTLEG_VIEWS.includes(V.view)) { h.innerHTML = ""; h.dataset.aan = "0"; return; }
  if (h.dataset.aan === "1") return;
  h.dataset.aan = "1";
  const spraak = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  h.innerHTML = `
    <div class="vastleg">
      <div class="vastleg-box">
        <input id="vastlegveld" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="sentences"
               spellcheck="false" placeholder="Bv. morgen 15:00 tandarts #zorg">

        <button class="verstuur" id="vastlegok" aria-label="Toevoegen" disabled>${ico("plus")}</button>

}

/* ==========================================================================
   10. Herbruikbare stukjes
   ========================================================================== */
function projectChip(t) {
  const p = vind("projecten", t.projectId);
  if (!p) return "";
  return `<span class="chip" style="color:${p.kleur};background:color-mix(in srgb,${p.kleur} 14%,transparent)">${ico("map")}${esc(p.naam)}</span>`;
}
function taakMeta(t) {
  const m = [];
  if (t.datum) {
    const laat = isVerleden(t.datum, t.tijd) && !t.af;
    const vd = t.datum === vandaagISO();
    m.push(`<span class="${laat ? "laat" : vd ? "vandaag" : ""}">${ico("komend", "width:12px;height:12px;vertical-align:-2px")} ${esc(datumLabel(t.datum))}${t.tijd ? " " + esc(t.tijd) : ""}</span>`);
  }
  if (t.herhaal) m.push(`<span>${ico("herhaal", "width:12px;height:12px;vertical-align:-2px")} ${esc(herhaalTekst(t.herhaal))}</span>`);
  if (t.duur) m.push(`<span>${ico("tijd", "width:12px;height:12px;vertical-align:-2px")} ${esc(duurTekst(t.duur))}</span>`);
  const sub = t.subtaken || [];
  if (sub.length) m.push(`<span class="subvoortgang">${sub.filter(s => s.af).length}/${sub.length}</span>`);
  if ((t.bijlagen || []).length) m.push(`<span>${ico("camera", "width:12px;height:12px;vertical-align:-2px")} ${t.bijlagen.length}</span>`);
  if (t.uitgesteldTot && t.uitgesteldTot > new Date().toISOString()) m.push(`<span>${ico("snooze", "width:12px;height:12px;vertical-align:-2px")} uitgesteld</span>`);
  if (geblokkeerd(t)) m.push(`<span>${ico("slot", "width:12px;height:12px;vertical-align:-2px")} wacht</span>`);
  const p = vind("projecten", t.projectId);
  if (p) m.push(`<span style="color:${p.kleur}">${esc(p.naam)}</span>`);
  (t.labels || []).forEach(l => m.push(`<span>@${esc(l)}</span>`));
  (t.personen || []).forEach(l => m.push(`<span>+${esc(l)}</span>`));
  return m.length ? `<div class="taak-meta">${m.join("")}</div>` : "";
}
function taakHTML(t, opt) {
  opt = opt || {};
  return `<div class="taak${t.af ? " af" : ""}" data-taak="${t.id}">
    <button class="vink${!t.af && t.prioriteit < 4 ? " p" + t.prioriteit : ""}" data-act="vink" data-id="${t.id}" aria-label="Afvinken">${ico("check")}</button>
    <div class="taak-mid" data-act="open-taak" data-id="${t.id}">
      <div class="taak-titel">${esc(t.titel)}</div>
      ${taakMeta(t)}
      ${t.notitie && opt.notitie !== false ? `<div class="taak-notitie">${esc(t.notitie)}</div>` : ""}
    </div>
    ${opt.sleep ? `<span class="greep" data-greep="${t.id}">${ico("greep")}</span>` : ""}
  </div>`;
}
function takenLijst(lijst, opt) {
  if (!lijst.length) return "";
  return `<div class="card"${opt && opt.sleep ? ' data-sleeplijst="1"' : ""}>${lijst.map(t => taakHTML(t, opt)).join("")}</div>`;
}
function leeg(emoji, titel, regel) {
  return `<div class="leeg"><span class="em">${emoji}</span><p><b>${esc(titel)}</b></p>${regel ? `<p>${regel}</p>` : ""}</div>`;
}
function sectie(titel, telling, actieHTML) {
  return `<div class="sectie"><h2>${esc(titel)}</h2>${telling != null ? `<span class="telling">${telling}</span>` : ""}${actieHTML || ""}</div>`;
}
function takenVanProject(id) { return S.taken.filter(t => t.projectId === id); }
function openTaken() { return S.taken.filter(taakZichtbaar); }

/* ==========================================================================
   11. Views
   ========================================================================== */
function backupBanner() {
  const laatste = inst("laatsteBackup", null);
  const dagen = laatste ? Math.floor((Date.now() - new Date(laatste)) / 86400000) : null;
  const items = S.taken.length + S.afspraken.length + S.dagboek.length;
  if (items < 5) return "";
  if (dagen !== null && dagen < 14) return "";
  if (inst("backupHerinneringUit" + vandaagISO(), false)) return "";
  return `<div class="banner">${ico("let")}<div style="flex:1">
    <b>${laatste ? `Laatste back-up: ${dagen} dagen geleden` : "Nog geen back-up gemaakt"}</b>
    Alle gegevens staan alleen op dit toestel. Verwijder je de app, dan is alles weg.
    <div style="margin-top:9px"><button class="knop klein" data-act="ga" data-view="backup">Nu back-up maken</button></div>
  </div><button class="sluit" data-act="banner-weg">${ico("x")}</button></div>`;
}

function vwVandaag() {
  const v = vandaagISO();
  const zichtbaar = openTaken();
  const laat = zichtbaar.filter(t => t.datum && t.datum < v).sort(sorteerTaken);
  const nu = zichtbaar.filter(t => t.datum === v).sort(sorteerTaken);
  const afVandaag = S.taken.filter(t => t.af && (t.afOp || "").slice(0, 10) === v && werkOk(t));
  const afspraken = S.afspraken.filter(a => a.datum === v && werkOk(a)).sort((a, b) => (a.tijd || "") < (b.tijd || "") ? -1 : 1);
  const gew = gewoontesVoor(v);
  let h = backupBanner();

  if (laat.length) {
    h += sectie("Achterstallig", laat.length, `<button class="actie" data-act="alles-vandaag">Alles naar vandaag</button>`);
    h += takenLijst(laat);
  }
  const deadlines = S.afspraken.filter(a => !a.uitkomst && a.deadline && a.deadline <= v && a.datum !== v && werkOk(a)).sort(afsprSorteer);
  if (afspraken.length || deadlines.length) {
    h += sectie("Afspraken", afspraken.length + deadlines.length, `<button class="actie" data-act="nieuwe-afspraak">Nieuw</button>`);
    h += `<div class="card">${afspraken.concat(deadlines).map(afspraakRij).join("")}</div>`;
  }
  h += sectie("Taken vandaag", nu.length, nu.length ? `<button class="actie" data-act="ga" data-view="kalender">Kalender</button>` : "");
  h += nu.length ? takenLijst(nu, { sleep: true }) :
    `<div class="card">${leeg("🌤️", "Niets gepland vandaag", "Leg iets vast via het veld hierboven, of pak iets uit je inbox.")}</div>`;

  if (gew.length) {
    const afG = gew.filter(g => gewoonteAf(g.id, v)).length;
    h += sectie("Gewoontes", `${afG}/${gew.length}`, `<button class="actie" data-act="ga" data-view="gewoontes">Alles</button>`);
    h += `<div class="card">${gew.map(g => gewoonteRij(g, v, true)).join("")}</div>`;
  }

  h += sectie("Wat past er nu?", null, "");
  h += `<div class="chiprij scroll" style="margin-bottom:6px">
    ${[5, 15, 30, 60, 120].map(m => `<button class="keuze" data-act="planmin" data-min="${m}" aria-pressed="${V.planMin === m}">${ico("bliksem")} ${m} min</button>`).join("")}
  </div>`;
  if (V.planMin) {
    const past = zichtbaar.filter(t => !geblokkeerd(t) && t.duur && t.duur <= V.planMin).sort(sorteerTaken).slice(0, 8);
    h += past.length ? takenLijst(past) : `<div class="card"><div class="leeg"><p>Geen taken met een geschatte duur van ${V.planMin} minuten of minder.</p><p class="klein">Tip: zet bij een taak een geschatte duur, of typ <code>~15m</code> bij het vastleggen.</p></div></div>`;
  }

  if (afVandaag.length) {
    h += sectie("Vandaag afgerond", afVandaag.length, `<button class="actie" data-act="ga" data-view="logboek">Logboek</button>`);
    h += takenLijst(afVandaag.slice(0, 8), { notitie: false });
  }
  const inboxAantal = openTaken().filter(t => !t.projectId).length;
  h += `<div class="chiprij scroll" style="margin-top:18px">
    <button class="keuze" data-act="ga" data-view="inbox">${ico("inbox")} Inbox${inboxAantal ? ` <span class="telbol">${inboxAantal}</span>` : ""}</button>
    <button class="keuze" data-act="ga" data-view="projecten">${ico("map")} Projecten</button>
    <button class="keuze" data-act="ga" data-view="kalender">${ico("komend")} Kalender</button>
    <button class="keuze" data-act="ga" data-view="checklists">${ico("lijst")} Checklists</button>
  </div>`;
  const dbVandaag = S.dagboek.find(d => d.datum === v);
  h += `<div style="margin-top:16px"><button class="knop breed rand" data-act="dagboek-nu">${ico("boek")} ${dbVandaag ? "Dagboek van vandaag bewerken" : "Dagboek van vandaag schrijven"}</button></div>`;
  return h;
}

function vwKomend() {
  const v = vandaagISO();
  let h = "";
  // Per dag tonen we elke keer van een herhaling; in "Later" telt een reeks één keer.
  const zicht = S.taken.filter(t => taakZichtbaar(t) && (typeof werkOk !== "function" || werkOk(t)));
  h += `<div class="chiprij scroll" style="margin-top:8px">` +
    Array.from({ length: 14 }, (_, i) => {
      const d = plusDagen(v, i);
      const n = zicht.filter(t => t.datum === d).length + S.afspraken.filter(a => a.datum === d && werkOk(a)).length;
      return `<button class="keuze" data-act="scroll-dag" data-datum="${d}" style="flex-direction:column;min-height:56px;padding:4px 10px">
        <span style="font-size:10px;opacity:.7">${DAGKORT[weekdagVan(d)]}</span>
        <span style="font-size:16px;font-weight:800">${parseISO(d).getDate()}</span>
        ${n ? `<span style="font-size:9px">${n}</span>` : `<span style="font-size:9px;opacity:.4">–</span>`}
      </button>`;
    }).join("") + `</div>`;

  for (let i = 0; i < 7; i++) {
    const d = plusDagen(v, i);
    const taken = zicht.filter(t => t.datum === d).sort(sorteerTaken);
    const afspr = S.afspraken.filter(a => a.datum === d && werkOk(a)).sort((a, b) => (a.tijd || "") < (b.tijd || "") ? -1 : 1);
    h += `<div class="dagkop" id="dag-${d}">${esc(datumLabel(d))} · ${parseISO(d).getDate()} ${MAANDKORT[parseISO(d).getMonth()]}</div>`;
    if (!taken.length && !afspr.length) h += `<div class="klein" style="padding:2px 2px 8px;color:var(--faint)">Vrij</div>`;
    if (afspr.length) h += `<div class="card">${afspr.map(afspraakRij).join("")}</div>`;
    if (taken.length) h += takenLijst(taken);
  }
  const later = reeksDedup(zicht.filter(t => t.datum && t.datum > plusDagen(v, 6))).sort(sorteerTaken);
  if (later.length) { h += sectie("Later", later.length); h += takenLijst(later.slice(0, 20)); }
  return h;
}

function vwInbox() {
  const lijst = openTaken().filter(t => !t.projectId).sort(sorteerTaken);
  let h = sectie("Inbox", lijst.length, S.projecten.length ? `<button class="actie" data-act="ga" data-view="projecten">Projecten</button>` : "");
  h += lijst.length ? takenLijst(lijst, { sleep: true }) :
    `<div class="card">${leeg("📥", "Inbox is leeg", "Alles is ingedeeld in een project. Netjes.")}</div>`;
  const zonderDatum = openTaken().filter(t => !t.datum && t.projectId).sort(sorteerTaken);
  if (zonderDatum.length) { h += sectie("Wel een project, geen datum", zonderDatum.length); h += takenLijst(zonderDatum.slice(0, 25)); }
  return h;
}

const LOGFILTERS = [["alles", "Alles"], ["taak", "Taken"], ["afspraak", "Afspraken"], ["gewoonte", "Gewoontes"], ["dagboek", "Dagboek"], ["notitie", "Notities"], ["tijd", "Tijd"]];

function kalIncassoAan() {
  return typeof tlAan === "function" ? tlAan("incasso") : inst("tlFilter_incasso", true);
}
function kalIncassosIn(van, tot) {
  if (!kalIncassoAan()) return [];

}
function vwKalender() {
  const sel = V.kalDatum, d = parseISO(sel);
  const eerste = new Date(d.getFullYear(), d.getMonth(), 1);
  const start = plusDagen(dISO(eerste), -((eerste.getDay() + 6) % 7));
  const incassoAan = kalIncassoAan();
  const einde = plusDagen(start, 41);
  const incassoPerDag = {};
  kalIncassosIn(start, einde).forEach(x => (incassoPerDag[x.datum] = incassoPerDag[x.datum] || []).push(x.incasso));
  let h = `<div class="card card-pad">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <button class="icon-btn" data-act="kal-maand" data-n="-1">${ico("pijll")}</button>
      <b style="flex:1;text-align:center;font-size:16px">${MAANDNAMEN[d.getMonth()]} ${d.getFullYear()}</b>
      <button class="icon-btn" data-act="kal-maand" data-n="1">${ico("pijlr")}</button>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button class="kal-tgl" data-act="tl-filter" data-f="incasso" aria-pressed="${incassoAan}">
        <span class="stip"></span>Incasso's ${incassoAan ? "tonen" : "verbergen"}</button>
    </div>
    <div class="kal-kop">${["ma","di","wo","do","vr","za","zo"].map(x => `<span>${x}</span>`).join("")}</div>
    <div class="kal">`;
  for (let i = 0; i < 42; i++) {
    const dag = plusDagen(start, i), dt = parseISO(dag);
    const taken = S.taken.filter(t => t.datum === dag && !t.af && werkOk(t));
    const afspr = S.afspraken.filter(a => a.datum === dag && werkOk(a));
    const incasso = incassoPerDag[dag] || [];
    const punten = [];
    if (taken.some(t => t.prioriteit === 1)) punten.push('<i class="kal-punt p1"></i>');
    if (taken.some(t => t.prioriteit !== 1)) punten.push('<i class="kal-punt"></i>');
    if (afspr.length) punten.push('<i class="kal-punt afspraak"></i>');
    if (incasso.length) punten.push('<i class="kal-punt incasso"></i>');
    h += `<button class="kal-dag${dt.getMonth() !== d.getMonth() ? " buiten" : ""}${dag === vandaagISO() ? " vandaag" : ""}"
      aria-pressed="${dag === sel}" data-act="kal-dag" data-datum="${dag}">
      ${dt.getDate()}<span class="kal-punten">${punten.join("")}</span></button>`;
  }
  h += `</div></div>`;
  const taken = S.taken.filter(t => t.datum === sel && werkOk(t)).sort(sorteerTaken);
  const afspr = S.afspraken.filter(a => a.datum === sel && werkOk(a)).sort((a, b) => (a.tijd || "") < (b.tijd || "") ? -1 : 1);
  const incasso = incassoPerDag[sel] || [];
  h += sectie(langDatumLabel(sel), taken.length + afspr.length + incasso.length,
    `<button class="actie" data-act="nieuw-op-datum" data-datum="${sel}">Toevoegen</button>`);
  if (incasso.length && typeof incassoRij === "function")
    h += `<div class="card">${incasso.map(i => incassoRij(i, sel)).join("")}</div>`;
  if (afspr.length) h += `<div class="card">${afspr.map(afspraakRij).join("")}</div>`;
  h += taken.length ? takenLijst(taken) : (afspr.length || incasso.length ? "" : `<div class="card">${leeg("📅", "Niets gepland")}</div>`);
  return h;
}

const AFSPRAAK_SOORTEN = {
  gesprek: { naam: "Gesprek", icoon: "groep", kleur: "paars" },
  toezegging: { naam: "Toezegging", icoon: "ketting", kleur: "blauw" }
};
const afspraakSoort = a => AFSPRAAK_SOORTEN[a.soort] ? a.soort : "gesprek";
function tijdspan(a) {
  if (!a.tijd) return "";
  return a.eindTijd ? a.tijd + "–" + a.eindTijd : a.tijd;
}
/** Korte omschrijving van wanneer een afspraak speelt. */
function afspraakWanneer(a) {
  const stuk = [];
  if (a.datum) {
    stuk.push(datumLabel(a.datum) + (a.totDatum && a.totDatum !== a.datum ? " t/m " + datumLabel(a.totDatum) : ""));
    if (tijdspan(a)) stuk.push(tijdspan(a));
  }
  if (a.deadline) stuk.push("uiterlijk " + datumLabel(a.deadline));
  if (!stuk.length) stuk.push("geen datum");
  return stuk.join(" · ");
}
const afspraakLaat = a => !!(a.deadline && !a.uitkomst && a.deadline < vandaagISO());
function afspraakRij(a) {
  const soort = afspraakSoort(a);
  const status = a.uitkomst ? "afgerond" : a.notities ? "bezig" : "";
  const laat = afspraakLaat(a);
  const links = a.datum
    ? `<span class="mono" style="display:block;font-size:15px;font-weight:800">${esc(a.tijd || "—")}</span>
       <span style="font-size:10px;color:var(--faint)">${esc(DAGKORT[weekdagVan(a.datum)])} ${parseISO(a.datum).getDate()}/${parseISO(a.datum).getMonth() + 1}</span>`
    : ico(AFSPRAAK_SOORTEN[soort].icoon, "width:21px;height:21px;color:var(--muted)");
  const onder = [(a.personen || []).join(", "), a.plek].filter(Boolean).map(esc).join(" · ");
  return `<button class="rijknop" style="align-items:flex-start" data-act="ga" data-view="afspraak" data-param="${a.id}">
    <span style="width:46px;text-align:center;flex:0 0 auto;padding-top:2px">${links}</span>
    <span class="nm"><span style="font-weight:600;display:block;white-space:normal">${esc(a.titel)}</span>
      ${onder ? `<span class="klein" style="display:block;white-space:normal">${onder}</span>` : ""}
      <span class="chiprij" style="margin-top:5px">
        ${soort === "toezegging" ? `<span class="chip blauw">${ico("ketting")}toezegging</span>` : ""}
        ${a.herhaal ? `<span class="chip paars">${ico("herhaal")}${esc(herhaalTekst(a.herhaal))}</span>` : ""}
        ${a.totDatum && a.totDatum !== a.datum ? `<span class="chip">${ico("komend")}t/m ${esc(datumLabel(a.totDatum))}</span>` : ""}
        ${a.deadline ? `<span class="chip ${laat ? "rood" : "oranje"}">${ico("klok")}uiterlijk ${esc(datumLabel(a.deadline))}</span>` : ""}
        ${status ? `<span class="chip ${status === "afgerond" ? "groen" : "oranje"}">${status}</span>` : ""}
      </span></span>
    <span class="rechts" style="padding-top:2px">${ico("pijlr", "width:16px;height:16px;color:var(--line2)")}</span>
  </button>`;
}
const afsprSorteer = (a, b) => ((a.datum || a.deadline || "9999") + (a.tijd || "")) < ((b.datum || b.deadline || "9999") + (b.tijd || "")) ? -1 : 1;

const AFSPR_FILTERS = [["alles", "Alles"], ["gesprek", "Gesprekken"], ["toezegging", "Toezeggingen"], ["open", "Lopend"], ["geweest", "Afgehandeld"]];
function vwAfspraken() {
  const v = vandaagISO();
  let lijst = reeksDedup(S.afspraken.filter(werkOk));
  const f = V.afsprFilter;
  if (f === "gesprek" || f === "toezegging") lijst = lijst.filter(a => afspraakSoort(a) === f);
  else if (f === "open") lijst = lijst.filter(a => !a.uitkomst);
  else if (f === "geweest") lijst = lijst.filter(a => !!a.uitkomst);

  let h = `<div class="knoprij" style="margin:10px 0">
    <button class="knop primair" data-act="nieuwe-afspraak" data-soort="gesprek">${ico("groep")} Gesprek</button>
    <button class="knop rand" data-act="nieuwe-afspraak" data-soort="toezegging">${ico("ketting")} Toezegging</button>
  </div>
  <div class="chiprij scroll">${AFSPR_FILTERS.map(([k, l]) =>
    `<button class="keuze" data-act="afsprfilter" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join("")}
    ${werkChip()}</div>`;

  if (!lijst.length && !S.afspraken.filter(werkOk).length)
    return h + `<div class="card">${leeg("🤝", "Nog geen afspraken", "Leg hier vast wat je met iemand hebt afgesproken: met wie, waarover, en wanneer het af moet zijn. Een datum is niet verplicht.")}</div>`;

  const laat = lijst.filter(a => afspraakLaat(a)).sort(afsprSorteer);
  const zonderDatum = lijst.filter(a => !a.datum && !afspraakLaat(a) && !a.uitkomst).sort(afsprSorteer);
  const komend = lijst.filter(a => a.datum && (a.totDatum || a.datum) >= v).sort(afsprSorteer);
  const gehad = lijst.filter(a => a.datum && (a.totDatum || a.datum) < v).sort((a, b) => afsprSorteer(b, a));
  const openGehad = gehad.filter(a => !a.uitkomst);

  if (laat.length) { h += sectie("Deadline verstreken", laat.length); h += `<div class="card">${laat.map(afspraakRij).join("")}</div>`; }
  if (komend.length) { h += sectie("Komend", komend.length); h += `<div class="card">${komend.map(afspraakRij).join("")}</div>`; }
  if (zonderDatum.length) {
    h += sectie("Zonder datum", zonderDatum.length, `<span class="telling">lopende afspraken</span>`);
    h += `<div class="card">${zonderDatum.map(afspraakRij).join("")}</div>`;
  }
  if (openGehad.length) {
    h += sectie("Nog afronden", openGehad.length, `<span class="telling">uitkomst ontbreekt</span>`);
    h += `<div class="card">${openGehad.slice(0, 10).map(afspraakRij).join("")}</div>`;
  }
  if (gehad.length) { h += sectie("Geweest", gehad.length); h += `<div class="card">${gehad.slice(0, 40).map(afspraakRij).join("")}</div>`; }
  if (!laat.length && !komend.length && !zonderDatum.length && !gehad.length)
    h += `<div class="card">${leeg("🔍", "Niets in dit filter")}</div>`;
  return h;
}

        : `<span class="chip">${ico("komend")}geen datum</span>`}
      ${tijdspan(a) ? `<span class="chip blauw">${ico("klok")}${esc(tijdspan(a))}</span>` : ""}
      ${a.deadline ? `<span class="chip ${afspraakLaat(a) ? "rood" : "oranje"}">${ico("klok")}uiterlijk ${esc(datumLabel(a.deadline))}</span>` : ""}
      ${a.plek ? `<span class="chip">${ico("plek")}${esc(a.plek)}</span>` : ""}
      ${(a.personen || []).map(p => `<button class="chip paars" data-act="persoon-open" data-naam="${esc(p)}">${ico("persoon")}${esc(p)}</button>`).join("")}
    </div>
    <div class="knoprij">
      <button class="knop klein rand" data-act="bewerk-afspraak" data-id="${a.id}">${ico("pen")} Bewerken</button>
      <button class="knop klein rand" data-act="ics-afspraak" data-id="${a.id}">${ico("komend")} Naar Agenda</button>
      ${a.uitkomst ? "" : `<button class="knop klein rand" data-act="afspraak-taak" data-id="${a.id}">${ico("plus")} Als taak</button>`}
    </div></div>`;
  h += blok(soort === "toezegging" ? "Wat is er precies afgesproken?" : "Voorbereiding", "voorbereiding",
    soort === "toezegging" ? "De afspraak in je eigen woorden." : "Wat wil ik bespreken? Welke vragen heb ik?");
  h += blok(soort === "toezegging" ? "Tussenstand" : "Notities tijdens", "notities", "Wat is er gebeurd sindsdien?");
  h += blok("Uitkomst", "uitkomst", "Wat is er besloten? Is het nagekomen?");
  h += sectie("Vervolgacties", gekoppeld.length, `<button class="actie" data-act="afspraak-actie" data-id="${a.id}">Toevoegen</button>`);
  if (gekoppeld.length) h += takenLijst(gekoppeld);
  const voorstel = voorstelActies(a).filter(v => !gekoppeld.some(t => t.titel.toLowerCase() === v.toLowerCase()));
  if (voorstel.length) {
    h += `<div class="klein" style="margin:8px 2px">Voorgesteld op basis van je notities — tik om als taak toe te voegen:</div>
      <div class="chiprij">${voorstel.map(v =>
      `<button class="chip groot blauw" data-act="voorstel-taak" data-id="${a.id}" data-titel="${esc(v)}">${ico("plus")}${esc(v)}</button>`).join("")}</div>`;
  }
  h += `<div class="hr"></div>
    <button class="knop breed gevaar" data-act="afspraak-verwijder" data-id="${a.id}">${ico("prullenbak")} Afspraak verwijderen</button>`;
  return h;
}
/** Haalt zinnen met actiewoorden uit de notities en stelt ze voor als taak. */
function voorstelActies(a) {
  const tekst = [a.notities, a.uitkomst].filter(Boolean).join("\n");
  if (!tekst) return [];
  const woorden = /(afspraak|actie|todo|to-?do|ik ga|ik zal|ik stuur|mail|bel |bellen|opvolgen|nakijken|uitzoeken|regelen|checken|sturen|maken|plannen|terugkoppel|volgende stap)/i;
  return tekst.split(/\n|(?<=[.!?])\s+/)
    .map(z => z.replace(/^[-*•\s]+/, "").trim())
    .filter(z => z.length > 6 && z.length < 110 && woorden.test(z))
    .slice(0, 6);
}

function gewoontesVoor(datum) {
  const wd = weekdagVan(datum);
  return S.gewoontes.filter(g => !g.archief && (!g.dagen || !g.dagen.length || g.dagen.includes(wd)));
}
const gewoonteAf = (id, datum) => S.gewoontelog.some(l => l.id === id + "|" + datum);
function streakVan(g) {
  let n = 0, d = vandaagISO();
  if (!gewoonteAf(g.id, d)) d = plusDagen(d, -1);
  for (let i = 0; i < 400; i++) {
    const wd = weekdagVan(d);
    if (g.dagen && g.dagen.length && !g.dagen.includes(wd)) { d = plusDagen(d, -1); continue; }
    if (gewoonteAf(g.id, d)) { n++; d = plusDagen(d, -1); } else break;
  }
  return n;
}
function gewoonteRij(g, datum, compact) {
  const af = gewoonteAf(g.id, datum), s = streakVan(g);
  const week = Array.from({ length: 7 }, (_, i) => {
    const d = plusDagen(weekStart(vandaagISO()), i);
    const hoort = !g.dagen || !g.dagen.length || g.dagen.includes(weekdagVan(d));
    return `<span class="gew-bol${gewoonteAf(g.id, d) ? " af" : ""}${d === vandaagISO() ? " vandaag" : ""}${hoort ? "" : " nvt"}">${DAGKORT[weekdagVan(d)][0].toUpperCase()}</span>`;
  }).join("");
  return `<div class="gew">
    <button class="vink${af ? " gedaan" : ""}" data-act="gew-vink" data-id="${g.id}" data-datum="${datum}" aria-label="Afvinken">${ico("check")}</button>
    <div style="flex:1;min-width:0" ${compact ? "" : `data-act="bewerk-gewoonte" data-id="${g.id}"`}>
      <div style="font-size:15px">${esc(g.naam)}</div>
      ${s ? `<div class="streak">${ico("vuur", "width:12px;height:12px;vertical-align:-2px")} ${s} dagen op rij</div>` : `<div class="klein">nog geen reeks</div>`}
    </div>
    <div class="gew-week">${week}</div></div>`;
}
function vwGewoontes() {
  const v = vandaagISO();
  const actief = S.gewoontes.filter(g => !g.archief);
  let h = `<button class="knop breed primair" style="margin:10px 0" data-act="nieuwe-gewoonte">${ico("plus")} Nieuwe gewoonte</button>`;
  if (!actief.length) return h + `<div class="card">${leeg("🔥", "Nog geen gewoontes", "Bijvoorbeeld: elke dag 10 minuten lezen, of 3× per week sporten.")}</div>`;
  const vandaagLijst = gewoontesVoor(v);
  h += sectie("Vandaag", `${vandaagLijst.filter(g => gewoonteAf(g.id, v)).length}/${vandaagLijst.length}`);
  h += `<div class="card">${vandaagLijst.map(g => gewoonteRij(g, v)).join("")}</div>`;
  const rest = actief.filter(g => !vandaagLijst.includes(g));
  if (rest.length) { h += sectie("Niet vandaag gepland", rest.length); h += `<div class="card">${rest.map(g => gewoonteRij(g, v)).join("")}</div>`; }
  const dagen30 = Array.from({ length: 30 }, (_, i) => plusDagen(v, -29 + i));
  const score = dagen30.map(d => { const l = gewoontesVoor(d); return l.length ? l.filter(g => gewoonteAf(g.id, d)).length / l.length : 0; });
  h += sectie("Laatste 30 dagen");
  h += `<div class="card card-pad"><div style="display:flex;gap:2px;align-items:flex-end;height:60px">` +
    score.map((s, i) => `<div style="flex:1;background:${s > 0 ? "var(--green)" : "var(--line)"};opacity:${s > 0 ? 0.35 + s * 0.65 : 1};height:${Math.max(8, s * 100)}%;border-radius:3px" title="${dagen30[i]}"></div>`).join("") +
    `</div><div class="klein" style="display:flex;justify-content:space-between;margin-top:6px"><span>30 dagen geleden</span><span>vandaag</span></div></div>`;
  return h;
}

const STEMMINGEN = ["😖", "🙁", "😐", "🙂", "😄"];
function vwDagboek() {
  const v = vandaagISO();
  const vandaag = S.dagboek.find(d => d.datum === v);
  let h = `<div class="card card-pad">
    <div class="labeltekst">Hoe was vandaag?</div>
    <div class="keuzerij" style="justify-content:space-between">
      ${STEMMINGEN.map((e, i) => `<button class="keuze" data-act="stemming" data-n="${i + 1}" aria-pressed="${vandaag && vandaag.stemming === i + 1}"
        style="font-size:24px;min-width:52px;justify-content:center">${e}</button>`).join("")}
    </div>
    <div style="margin-top:12px"><button class="knop breed ${vandaag ? "rand" : "primair"}" data-act="dagboek-nu">
      ${ico("pen")} ${vandaag ? "Notitie van vandaag bewerken" : "Schrijf over vandaag"}</button></div>
  </div>`;
  const lijst = S.dagboek.slice().sort((a, b) => a.datum < b.datum ? 1 : -1);
  if (!lijst.length) return h + `<div class="card">${leeg("📓", "Nog geen dagboeknotities")}</div>`;
  h += sectie("Eerder", lijst.length);
  h += `<div class="card">` + lijst.slice(0, 60).map(d => `
    <button class="rijknop" style="align-items:flex-start" data-act="dagboek-open" data-datum="${d.datum}">
      <span style="font-size:22px;flex:0 0 auto">${d.stemming ? STEMMINGEN[d.stemming - 1] : "📝"}</span>
      <span class="nm"><b>${esc(datumLabel(d.datum, true))}</b>
        <span class="klein" style="display:block;white-space:normal">${esc((d.tekst || "").slice(0, 120))}${(d.tekst || "").length > 120 ? "…" : ""}</span></span>
    </button>`).join("") + `</div>`;
  return h;
}

function vwZoeken() {
  let h = `<div class="zoekbalk">${ico("zoek")}
    <input type="search" id="zoekveld" placeholder="Zoek in taken, notities, afspraken…" value="${esc(V.zoek)}" enterkeyhint="search">
    ${V.zoek ? `<button data-act="zoek-wis" style="min-width:34px;min-height:34px">${ico("x", "width:16px;height:16px")}</button>` : ""}</div>
  <div class="chiprij scroll">
    ${["vandaag", "week", "achterstallig", "geen-datum", "p1", "af"].map(f =>
      `<button class="keuze" data-act="zoek-plak" data-f="${f}">${f}</button>`).join("")}
  </div>`;
  if (!V.zoek.trim()) {
    h += `<div class="klein" style="margin-top:14px">
      <p><b>Zoektips</b></p>
      <p><code>p1 week</code> — prioriteit 1 met een datum binnen 7 dagen<br>
      <code>#werk geen-datum</code> — project werk zonder datum<br>
      <code>@bellen achterstallig</code> — label bellen dat te laat is<br>
      <code>tandarts af</code> — afgeronde taken met 'tandarts'</p></div>`;
    if (S.filters.length) { h += sectie("Opgeslagen", S.filters.length); h += filterLijstHTML(); }
    return h;
  }
  const taken = filterTaken(V.zoek).sort(sorteerTaken);
  const q = V.zoek.toLowerCase();
  const afspr = S.afspraken.filter(werkOk).filter(a => (a.titel + " " + (a.notities || "") + " " + (a.uitkomst || "") + " " + (a.voorbereiding || "") + " " + (a.personen || []).join(" ")).toLowerCase().includes(q));
  const dagb = S.dagboek.filter(d => (d.tekst || "").toLowerCase().includes(q));
  const cl = S.checklists.filter(c => (c.naam + " " + c.items.map(i => i.tekst).join(" ")).toLowerCase().includes(q));
  h += `<div class="knoprij" style="margin:10px 0"><button class="knop klein rand" data-act="filter-opslaan">${ico("bliksem")} Bewaar als slimme lijst</button></div>`;
  h += sectie("Taken", taken.length);
  h += taken.length ? takenLijst(taken.slice(0, 60)) : `<div class="card">${leeg("🔍", "Geen taken gevonden")}</div>`;
  if (afspr.length) { h += sectie("Afspraken", afspr.length); h += `<div class="card">${afspr.slice(0, 20).map(afspraakRij).join("")}</div>`; }
  if (dagb.length) {
    h += sectie("Dagboek", dagb.length);
    h += `<div class="card">${dagb.slice(0, 15).map(d => `<button class="rijknop" data-act="dagboek-open" data-datum="${d.datum}">
      <span class="nm"><b>${esc(datumLabel(d.datum, true))}</b><span class="klein" style="display:block">${esc((d.tekst || "").slice(0, 90))}…</span></span></button>`).join("")}</div>`;
  }
  if (cl.length) { h += sectie("Checklists", cl.length); h += `<div class="card">${cl.map(checklistRij).join("")}</div>`; }
  return h;
}
function filterLijstHTML() {
  return `<div class="card">` + S.filters.map(f => `<div class="rijknop" style="gap:6px">
    <button style="flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-height:38px" data-act="filter-open" data-id="${f.id}">
      ${ico("bliksem", "width:18px;height:18px;color:var(--accent)")}
      <span class="nm">${esc(f.naam)}<span class="klein" style="display:block"><code>${esc(f.query)}</code></span></span>
    </button>
    <span class="rechts">${filterTaken(f.query).length}</span>
    <button class="icon-btn" style="min-width:40px;min-height:40px;color:${f.vast ? "var(--amber)" : "var(--line2)"}"
      data-act="filter-vast" data-id="${f.id}" aria-label="Op startscherm zetten">${ico("ster")}</button>
  </div>`).join("") + `</div>`;
}
function vwFilters() {
  let h = `<div class="klein" style="margin:10px 2px">Sla een zoekopdracht op zodat je hem met één tik weer opent.</div>`;
  h += S.filters.length ? filterLijstHTML() : `<div class="card">${leeg("⚡", "Nog geen slimme lijsten", "Zoek iets en tik daarna op ‘Bewaar als slimme lijst’.")}</div>`;
  h += `<button class="knop breed rand" style="margin-top:12px" data-act="ga" data-view="zoeken">${ico("zoek")} Naar zoeken</button>`;
  if (S.filters.length) h += `<div class="klein" style="margin-top:14px;text-align:center">Tik op de ster om een lijst op je startscherm te zetten. Houd een lijst lang ingedrukt om hem te verwijderen.</div>`;
  return h;
}

function vwPersonen() {
  const namen = {};
  reeksDedup(S.afspraken).forEach(a => (a.personen || []).forEach(p => { namen[p] = namen[p] || { naam: p, afspraken: 0, taken: 0 }; namen[p].afspraken++; }));
  reeksDedup(S.taken).forEach(t => (t.personen || []).forEach(p => { namen[p] = namen[p] || { naam: p, afspraken: 0, taken: 0 }; namen[p].taken++; }));
  S.personen.forEach(p => { namen[p.naam] = namen[p.naam] || { naam: p.naam, afspraken: 0, taken: 0 }; namen[p.naam].notitie = p.notitie; namen[p.naam].id = p.id; });
  const lijst = Object.values(namen).sort((a, b) => (b.afspraken + b.taken) - (a.afspraken + a.taken));
  let h = `<button class="knop breed rand" style="margin:10px 0" data-act="nieuwe-persoon">${ico("plus")} Persoon toevoegen</button>`;
  if (!lijst.length) return h + `<div class="card">${leeg("👥", "Nog geen personen", "Typ <code>+naam</code> bij het vastleggen, of voeg iemand toe aan een afspraak.")}</div>`;
  h += `<div class="card">` + lijst.map(p => `<button class="rijknop" data-act="persoon-open" data-naam="${esc(p.naam)}">
    ${ico("persoon", "width:20px;height:20px;color:var(--muted)")}
    <span class="nm">${esc(p.naam)}${p.notitie ? `<span class="klein" style="display:block">${esc(p.notitie)}</span>` : ""}</span>
    <span class="rechts">${p.afspraken} afspr · ${p.taken} taken</span></button>`).join("") + `</div>`;
  return h;
}

function vwStats() {
  const v = vandaagISO(), start = weekStart(v);
  const dagen = Array.from({ length: 7 }, (_, i) => plusDagen(start, i));
  const perDag = dagen.map(d => S.taken.filter(t => t.af && (t.afOp || "").slice(0, 10) === d).length);
  const max = Math.max(1, ...perDag);
  const afWeek = perDag.reduce((a, b) => a + b, 0);
  const vorigeStart = plusDagen(start, -7);
  const afVorige = S.taken.filter(t => t.af && (t.afOp || "") >= vorigeStart && (t.afOp || "").slice(0, 10) < start).length;
  const afsprWeek = S.afspraken.filter(a => a.datum >= start && a.datum <= plusDagen(start, 6)).length;
  const tijdWeek = S.tijdlog.filter(l => l.datum >= start).reduce((a, b) => a + b.seconden, 0);
  const dbWeek = S.dagboek.filter(d => d.datum >= start);
  const stemming = dbWeek.filter(d => d.stemming).reduce((a, b) => a + b.stemming, 0) / (dbWeek.filter(d => d.stemming).length || 1);
  const open = openTaken().length, laat = openTaken().filter(t => t.datum && t.datum < v).length;

  let h = `<div class="stats">
    <div class="stat"><div class="getal">${afWeek}</div><div class="lab">afgerond deze week</div></div>
    <div class="stat"><div class="getal">${afVorige ? (afWeek >= afVorige ? "+" : "") + (afWeek - afVorige) : "—"}</div><div class="lab">t.o.v. vorige week</div></div>
    <div class="stat"><div class="getal">${open}</div><div class="lab">nog open${laat ? ` · ${laat} te laat` : ""}</div></div>
    <div class="stat"><div class="getal">${secTekst(tijdWeek).split(":")[0]}<span style="font-size:14px">u</span></div><div class="lab">geregistreerde tijd</div></div>
  </div>`;
  h += sectie("Afgerond per dag");
  h += `<div class="card card-pad"><div class="grafiek">` + perDag.map((n, i) => `
    <div class="kolom"><span class="waarde">${n || ""}</span>
      <div class="staaf" style="height:${Math.round(n / max * 100)}%;${dagen[i] === v ? "" : "opacity:.6"}"></div>
      <span class="dag">${DAGKORT[weekdagVan(dagen[i])]}</span></div>`).join("") + `</div></div>`;

  const perProject = {};
  S.taken.filter(t => t.af && (t.afOp || "") >= start).forEach(t => {
    const p = vind("projecten", t.projectId); const nm = p ? p.naam : "Zonder project";
    perProject[nm] = (perProject[nm] || 0) + 1;
  });
  const pp = Object.entries(perProject).sort((a, b) => b[1] - a[1]);
  if (pp.length) {
    h += sectie("Per project");
    h += `<div class="card card-pad">` + pp.map(([nm, n]) => `
      <div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(nm)}</span><b>${n}</b></div>
      <div class="balk" style="margin-top:4px"><i style="width:${Math.round(n / pp[0][1] * 100)}%;background:var(--accent)"></i></div></div>`).join("") + `</div>`;
  }
  h += sectie("Gewoontes & stemming");
  h += `<div class="card card-pad">
    ${S.gewoontes.filter(g => !g.archief).map(g => {
      const n = dagen.filter(d => gewoonteAf(g.id, d)).length;
      const doel = dagen.filter(d => !g.dagen || !g.dagen.length || g.dagen.includes(weekdagVan(d))).length;
      return `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(g.naam)}</span><b>${n}/${doel}</b></div>
        <div class="balk" style="margin-top:4px"><i style="width:${doel ? Math.round(n / doel * 100) : 0}%"></i></div></div>`;
    }).join("") || `<div class="klein">Nog geen gewoontes.</div>`}
    <div class="hr"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:28px">${dbWeek.length ? STEMMINGEN[Math.round(stemming) - 1] || "😐" : "—"}</span>
      <div class="klein">Gemiddelde stemming deze week over ${dbWeek.filter(d => d.stemming).length} dag(en).<br>
      ${afsprWeek} afspraak(en) deze week.</div></div>
  </div>`;
  h += `<div class="knoprij" style="margin-top:14px">
    <button class="knop rand" data-act="terugblik-log">${ico("boek")} Terugblik in logboek zetten</button></div>`;
  return h;
}

function vwTijd() {
  const v = vandaagISO(), start = weekStart(v);
  const week = S.tijdlog.filter(l => l.datum >= start);
  const perTaak = {};
  week.forEach(l => { perTaak[l.taakId || "los"] = (perTaak[l.taakId || "los"] || 0) + l.seconden; });
  const rijen = Object.entries(perTaak).sort((a, b) => b[1] - a[1]);
  let h = `<button class="knop breed primair" style="margin:10px 0" data-act="timer-start-los">${ico("play")} Focustimer starten</button>`;
  h += `<div class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="stat"><div class="getal">${secTekst(week.reduce((a, b) => a + b.seconden, 0))}</div><div class="lab">deze week</div></div>
    <div class="stat"><div class="getal">${secTekst(S.tijdlog.filter(l => l.datum === v).reduce((a, b) => a + b.seconden, 0))}</div><div class="lab">vandaag</div></div>
  </div>`;
  h += sectie("Per taak deze week", rijen.length);
  if (!rijen.length) return h + `<div class="card">${leeg("⏱️", "Nog geen tijd geregistreerd", "Start een timer vanuit een taak of hierboven.")}</div>`;
  h += `<div class="card">` + rijen.map(([id, sec]) => {
    const t = vind("taken", id);
    return `<div class="rijknop" ${t ? `data-act="open-taak" data-id="${t.id}"` : ""}>
      <span class="nm">${esc(t ? t.titel : "Losse focussessie")}</span>
      <span class="rechts mono">${secTekst(sec)}</span></div>`;
  }).join("") + `</div>`;
  return h;
}

<script>
"use strict";
/* ==========================================================================
   12. Back-up & uitleg

function vwBackup() {
  const laatste = inst("laatsteBackup", null);

    <div class="klein"><p><b>Laatste back-up:</b> ${laatste ? esc(langDatumLabel(laatste.slice(0, 10))) + " om " + esc(laatste.slice(11, 16)) : "nog nooit"}</p>
    <p><b>Opgeslagen:</b> ${tel} onderdelen, waarvan ${S.bijlagen.length} bijlage(n)</p>
    <p><b>Opslag vastzetten:</b> <span id="persiststatus">${esc(PWA.persist)}</span></p>
    <p id="ruimte"></p></div>

let bladOpslaan = null;
function bladOpen(titel, inhoud, voet, opslaanFn) {
  $("#bladtitel").textContent = titel;
  // Vervang de inhoud door een verse node, zodat oude luisteraars verdwijnen.
  const oud = $("#bladinhoud");
  const vers = oud.cloneNode(false);
  oud.replaceWith(vers);
  vers.innerHTML = inhoud;
  const v = $("#bladvoet");
  v.innerHTML = voet || "";
  v.classList.toggle("verborgen", !voet);
  bladOpslaan = opslaanFn || null;
  $("#overlay").classList.add("open");
  $("#blad").classList.add("open");
  $("#bladinhoud").scrollTop = 0;
}
function bladSluit() {
  $("#blad").classList.remove("open");
  $("#overlay").classList.remove("open");
  bladOpslaan = null;
  setTimeout(() => { if (!$("#blad").classList.contains("open")) $("#bladinhoud").innerHTML = ""; }, 300);
}
function bladVraag(titel, waarde, plaats, klaar, meerregelig) {
  bladOpen(titel,
    meerregelig
      ? `<div class="veld"><textarea class="invoer" id="vraagveld" placeholder="${esc(plaats || "")}" style="min-height:140px">${esc(waarde || "")}</textarea></div>`
      : `<div class="veld"><input class="invoer" id="vraagveld" type="text" value="${esc(waarde || "")}" placeholder="${esc(plaats || "")}" enterkeyhint="done"></div>`,
    `<button class="knop breed primair" id="vraagok">Opslaan</button>`);
  setTimeout(() => { const v = $("#vraagveld"); if (v) { v.focus(); v.select && v.select(); } }, 250);
  $("#vraagok").onclick = () => { const w = $("#vraagveld").value.trim(); bladSluit(); klaar(w); };
  const veld = $("#vraagveld");
  if (!meerregelig) veld.onkeydown = e => { if (e.key === "Enter") $("#vraagok").click(); };
}
function bevestig(titel, tekst, knop, klaar) {
  bladOpen(titel, `<p class="klein" style="font-size:15px;margin:10px 2px 18px">${tekst}</p>`,
